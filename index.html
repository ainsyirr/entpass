neural loss. The left Schirmer test is reduced by 60% and the left stapedial reflex is absent.\nWhere is the lesion most likely to be?","o":["Geniculate ganglion","Labyrinthine segment","Tympanic segment","Facial motor nucleus in the pons","Cerebellopontine angle"],"a":4,"e":"Reduced lacrimation places the lesion at or above the geniculate ganglion, and sensorineural hearing loss with tinnitus shows that VIII is involved too; proximal to the geniculate ganglion, VII and VIII lie together only in the **internal acoustic meatus / cerebellopontine angle**. Hearing loss preceding slow facial weakness is the typical pattern of a CPA mass such as a vestibular schwannoma, which needs **gadolinium MRI**. A nuclear lesion in the pons would not reduce tear production, because lacrimal fibres arise from a separate nucleus.","w":["Wrong - a geniculate lesion reduces tears but does not explain sensorineural loss and tinnitus.","Wrong - an isolated labyrinthine segment lesion would not usually cause progressive SNHL preceding the palsy.","Wrong - a tympanic segment lesion spares the GSPN, so Schirmer would be normal.","Wrong - a pontine nuclear lesion spares lacrimation and taste and usually gives other brainstem signs.","Correct - lacrimal, stapedial and VIII involvement together localise to the CPA (category E)."],"r":"Slides p17-18"},{"t":"LOC","stem":"A 42-year-old woman is reviewed in the ENT clinic 10 days after onset of a right lower motor neurone facial palsy. At rest the face looks symmetrical. On effort there is no forehead movement, the right eye does not close completely even with maximum effort, and the mouth moves but is clearly asymmetrical.\nWhat is her House-Brackmann grade?","o":["Grade II","Grade III","Grade IV","Grade V","Grade VI"],"a":2,"e":"The hinge between House-Brackmann **III and IV is eye closure**: grade III still achieves complete closure with effort and keeps some forehead movement, whereas grade IV has **incomplete eye closure** and no forehead movement, with normal symmetry at rest. Grade V has only barely perceptible movement and asymmetry at rest; grade VI is total paralysis. Incomplete closure also means she needs active eye protection.","w":["Wrong - grade II is slight weakness with complete eye closure on minimal effort.","Wrong - grade III keeps complete eye closure with effort and some forehead movement.","Correct - incomplete eye closure, no forehead movement and asymmetric mouth with symmetry at rest is grade IV.","Wrong - grade V has only barely perceptible movement and asymmetry at rest.","Wrong - grade VI is total paralysis with no movement at all."],"r":"Lecturer pearl"},{"t":"LOC","stem":"A 70-year-old man has a complete left lower motor neurone facial palsy. When asked to close his eyes, the left lid stays open and the left eyeball does not roll upwards, so the cornea remains in view.\nWhat is the main clinical significance of this finding?","o":["The lesion is upper motor neurone and will spare the forehead","The cornea stays exposed, giving a high risk of keratitis","The lesion must lie proximal to the geniculate ganglion","More than 90% of facial nerve fibres have already degenerated","Lacrimal secretion has failed, so the Schirmer test will be low"],"a":1,"e":"**Bell's phenomenon** is the normal upward and outward roll of the eye on attempted closure (oculomotor nerve to superior rectus); in an LMN palsy it becomes visible because the lid fails to close. When it is **absent**, the cornea is not tucked under the upper lid, so **exposure keratitis** is much more likely and eye protection must be aggressive (lubricants, night ointment and taping, early ophthalmology review). It neither localises the lesion nor measures degeneration.","w":["Wrong - Bell's phenomenon is seen with LMN palsy; its absence does not make the lesion UMN.","Correct - without the protective upward roll the cornea stays exposed, so keratitis risk is high.","Wrong - lesion level is judged with Schirmer, stapedial reflex and taste tests, not Bell's phenomenon.","Wrong - degeneration is quantified by ENoG, not by eye movement on closure.","Wrong - Bell's phenomenon depends on the oculomotor nerve and says nothing about tear secretion."],"r":"Slides p15, p27"},{"t":"LOC","stem":"A 32-year-old woman presents to the ENT clinic with weakness of both sides of her face developing over 10 days. She has had a low-grade fever for a month and painful red eyes. Both parotid glands are diffusely swollen and non-tender. Chest X-ray shows bilateral hilar lymphadenopathy.\nWhat is the most likely diagnosis?","o":["Guillain-Barré syndrome","Bilateral Bell's palsy","Mumps parotitis","Heerfordt syndrome","Lyme neuroborreliosis"],"a":3,"e":"**Bilateral** facial palsy is never simply Bell's palsy until systemic causes are excluded. Uveitis, parotid enlargement, fever and facial palsy form **Heerfordt syndrome (uveoparotid fever)**, a form of sarcoidosis, and bilateral hilar lymphadenopathy supports it. Check serum ACE and calcium and consider biopsy for non-caseating granulomas; other bilateral causes to remember are Guillain-Barré syndrome, Lyme disease, leukaemia and Möbius syndrome.","w":["Wrong - GBS causes bilateral palsy but with ascending weakness and areflexia, not uveitis or parotid swelling.","Wrong - Bell's palsy is rarely bilateral and does not explain fever, uveitis, parotid swelling or hilar nodes.","Wrong - mumps causes tender parotitis but facial palsy and uveitis with hilar nodes are not features.","Correct - uveitis, parotid swelling, fever and facial palsy with hilar nodes is sarcoid uveoparotid fever.","Wrong - Lyme disease can cause bilateral palsy but needs tick exposure and is not linked with parotid enlargement or hilar nodes."],"r":"Lecturer pearl"},{"t":"LOC","stem":"A 41-year-old man has a complete right lower motor neurone facial palsy. MRI shows a small facial nerve schwannoma confined to the mastoid segment, below the origin of the nerve to stapedius and above the origin of the chorda tympani.\nWhich additional finding would you expect?","o":["Reduced right Schirmer test","Absent right stapedial reflex","Hyperacusis in the right ear","Sensorineural hearing loss on the right","Reduced right submandibular flow"],"a":4,"e":"Topodiagnosis is **cumulative from below upwards**. A lesion between the nerve to stapedius and the chorda tympani spares the GSPN (tears normal) and the stapedius (reflex present, no hyperacusis) but interrupts the **chorda tympani**, so taste on the anterior two-thirds and **submandibular salivary flow** fall. Sensorineural loss would need the inner ear or VIII to be involved.","w":["Wrong - the GSPN leaves at the geniculate ganglion, well above this lesion, so tears are normal.","Wrong - the nerve to stapedius arises above the lesion, so the reflex is preserved.","Wrong - hyperacusis needs stapedius paralysis, which requires a lesion above the nerve to stapedius.","Wrong - the cochlea and VIII are not involved by a mastoid segment lesion.","Correct - the chorda tympani arises below the lesion, so its secretomotor and taste fibres are lost."],"r":"Slides p16, p62-63"},{"t":"LOC","stem":"A 72-year-old woman is reviewed on the stroke ward. When asked to show her teeth, the right corner of her mouth barely moves, but when her grandson tells a joke she smiles symmetrically. Forehead wrinkling and eye closure are normal on both sides.\nWhich pathway is most likely to be damaged?","o":["Left corticobulbar fibres to the facial nucleus","Right facial nerve within the temporal bone","Extrapyramidal emotional pathway via the left thalamus","Right facial motor nucleus in the pons","Right marginal mandibular branch of the facial nerve"],"a":0,"e":"Voluntary facial movement is carried from the motor cortex in **corticobulbar fibres**, whereas emotional (mimetic) smiling is driven by separate extrapyramidal and limbic pathways. A cortical or capsular stroke therefore weakens **voluntary** lower-face movement but spares spontaneous smiling and the forehead (bilateral supply), a classic UMN pattern. The reverse dissociation, a weak emotional smile with normal voluntary movement, points to a thalamic or extrapyramidal lesion.","w":["Correct - a contralateral corticobulbar lesion weakens voluntary lower-face movement and spares emotional smiling.","Wrong - an intratemporal LMN lesion would affect forehead, eye closure and emotional smiling too.","Wrong - an emotional pathway lesion causes the opposite dissociation, a weak spontaneous smile.","Wrong - a nuclear lesion is LMN and paralyses all movements of that side, including the forehead.","Wrong - a marginal mandibular lesion weakens the lower lip for both voluntary and emotional movement."],"r":"Lecturer pearl"},{"t":"BELL","stem":"A 35-year-old teacher attends a Klinik Kesihatan 24 hours after waking with complete right-sided facial weakness involving the forehead. She had a mild right postauricular ache the day before. Otoscopy, parotid and neck examination are normal, there are no vesicles and other cranial nerves are intact. Her capillary glucose is normal.\nWhat is the most appropriate management?","o":["Oral aciclovir for 7 days with eye lubricants","Prednisolone 50 mg daily for 10 days plus eye care","Urgent MRI brain before any treatment is started","Eye care alone and review if not improving in 3 weeks","Referral for urgent surgical decompression of the nerve"],"a":1,"e":"This is a typical idiopathic acute LMN palsy with no red flags, seen within 72 hours. **Oral prednisolone started within 72 hours** (e.g. 50 mg daily for 10 days, or 60 mg for 5 days then taper) increases full recovery and is the mainstay, with eye care to protect the cornea. Antiviral monotherapy is not recommended and routine imaging is not needed when the picture is typical. Note: slide p28 lists surgical decompression as a treatment; it is controversial and reserved for complete palsy with more than 90% degeneration on ENoG within 14 days.","w":["Wrong - antiviral therapy alone is not recommended; it gives no proven benefit without a steroid.","Correct - prednisolone within 72 hours plus eye care is the evidence-based first-line treatment.","Wrong - imaging is for red flags or atypical features; delaying steroids loses the 72-hour window.","Wrong - withholding steroids from an eligible patient reduces her chance of full recovery.","Wrong - decompression is controversial and only considered after ENoG shows more than 90% degeneration."],"r":"Slide p28"},{"t":"BELL","stem":"A 48-year-old man presents to the ED 36 hours after the onset of a left lower motor neurone facial palsy, House-Brackmann V. Examination finds no other abnormality. The medical officer drafts a management plan.\nWhich part of the plan should be avoided?","o":["Prednisolone started at this ED visit","Adding valaciclovir to prednisolone because the palsy is severe","Lubricant drops by day with ointment and lid taping at night","Valaciclovir alone, withholding steroids to avoid side effects","Referral if there is no recovery at all by 3 months"],"a":3,"e":"Steroids are the evidence-based core of treatment and **antiviral therapy alone** has not been shown to help, so replacing the steroid with an antiviral is the error. Guidelines (AAO-HNS 2013) allow an antiviral to be **added** to prednisolone in severe palsy (HB V-VI), for a small possible benefit. Eye protection, and re-evaluation for another diagnosis if there is no recovery by 3-4 months, are both recommended.","w":["Wrong - starting prednisolone within 72 hours is the recommended core of treatment.","Wrong - adding an antiviral to a steroid is an accepted option in severe palsy.","Wrong - this is the standard eye-protection regimen for incomplete closure.","Correct - antiviral monotherapy is not recommended and withholding steroids lowers recovery rates.","Wrong - failure to recover by 3-4 months is a red flag that warrants referral and imaging."],"r":"Lecturer pearl"},{"t":"BELL","stem":"A 50-year-old woman was diagnosed with Bell's palsy 6 weeks ago and given prednisolone. She now says her left face had been twitching for months before any weakness, and the weakness has steadily worsened over 5 weeks rather than starting suddenly. There is no recovery.\nWhat is the most appropriate next step?","o":["A second course of oral prednisolone","Electroneurography to quantify degeneration","Gadolinium-enhanced MRI along the facial nerve","Facial physiotherapy and review in 3 months","Adding oral valaciclovir for a further 7 days"],"a":2,"e":"Bell's palsy starts suddenly, peaks within about 72 hours and usually begins to recover within 3 weeks. **Gradual progression beyond 3 weeks, twitching before weakness**, no recovery by 3-4 months or a recurrent ipsilateral palsy are red flags for a **tumour** (facial schwannoma, parotid malignancy) until proven otherwise. Gadolinium MRI from the brainstem to the parotid is needed; repeating steroids or degeneration tests only delays the diagnosis.","w":["Wrong - more steroid treats a diagnosis that the history has already made unlikely.","Wrong - ENoG measures degeneration but cannot identify the cause of a progressive palsy.","Correct - progressive palsy with prior twitching needs gadolinium MRI to exclude a tumour.","Wrong - waiting 3 months risks missing a treatable neoplasm.","Wrong - antivirals have no role here and do not address the suspected tumour."],"r":"Lecturer pearl"},{"t":"BELL","stem":"A 31-year-old woman with a left lower motor neurone facial palsy of sudden onset is reviewed in the ENT clinic. She asks how likely full recovery is, and you consider the factors known to affect prognosis.\nWhich finding would most favour complete recovery?","o":["Complete paralysis (HB VI) at presentation","Onset during the third trimester of pregnancy","Poorly controlled type 2 diabetes mellitus","Return of some voluntary movement by day 14","Age over 60 years at the time of onset"],"a":3,"e":"About 85-90% of patients recover fully overall. Prognosis is best when the palsy is **incomplete** and when **clinical recovery begins within 3 weeks** of onset, because early return of movement shows that most fibres had only neurapraxia. Complete palsy, older age, diabetes and pregnancy (especially the third trimester) are linked to poorer recovery.","w":["Wrong - complete paralysis carries a worse prognosis than an incomplete palsy.","Wrong - pregnancy, especially the third trimester, is a risk factor with poorer outcomes.","Wrong - diabetes (microangiopathy) is a risk factor and is linked to poorer recovery.","Correct - recovery that starts within 3 weeks predicts full recovery.","Wrong - increasing age is associated with incomplete recovery."],"r":"Slide p23"},{"t":"BELL","stem":"A 40-year-old man presents to the ED 1 day after the sudden onset of right facial weakness. You are deciding whether this is an idiopathic palsy or something else.\nWhich finding most strongly suggests an alternative diagnosis?","o":["Weakness of the right forehead as well as the mouth","Pain behind the right ear starting a day before the weakness","Discomfort with loud sounds in the right ear","Altered taste on the right front of the tongue","A firm 2 cm lump palpable in the right parotid region"],"a":4,"e":"Forehead involvement, retroauricular pain, hyperacusis and altered taste are all **expected** in idiopathic (Bell's) palsy, because the whole intratemporal nerve, including the stapedius and chorda tympani fibres, is affected. A **parotid mass with facial weakness** is a malignant parotid tumour until proven otherwise and needs imaging and FNAC. Bell's palsy is a diagnosis of exclusion, so always examine the ear, parotid and neck.","w":["Wrong - forehead weakness simply confirms an LMN palsy, which is what Bell's palsy is.","Wrong - postauricular pain before or with onset is common in Bell's palsy.","Wrong - hyperacusis from stapedius paralysis is a recognised feature of Bell's palsy.","Wrong - altered taste from chorda tympani involvement is common in Bell's palsy.","Correct - a parotid mass makes malignancy the working diagnosis, not Bell's palsy."],"r":"Slides p26, p28"},{"t":"BELL","stem":"A 60-year-old man has a right House-Brackmann V facial palsy of 3 days' duration. He cannot close the right eye, his eye barely rolls upwards on attempted closure and he complains of a gritty, watering eye. Fluorescein staining of the cornea is negative.\nWhich eye-protection plan is most appropriate?","o":["Lubricant drops by day, ointment and lid taping at night","Topical steroid drops four times daily until closure returns","Immediate gold-weight implantation into the upper eyelid","Antibiotic drops only if a discharge develops","Firm eye pad applied over the open eye during the day"],"a":0,"e":"Incomplete closure with a poor Bell's phenomenon leaves the cornea exposed, and the watering is reflex tearing from dryness, not adequate protection. **Lubricant drops by day, ointment with lid taping at night** and sunglasses outdoors are first-line, with ophthalmology review if pain, redness or staining develop. Gold-weight or tarsorrhaphy is reserved for prolonged non-recovery, and a pad over an open eye can abrade the cornea.","w":["Correct - day lubricants plus night ointment and taping is the first-line corneal protection.","Wrong - topical steroids do not protect the cornea and risk infection.","Wrong - gold-weight loading is for persistent palsy, not the first days of a likely recoverable one.","Wrong - waiting for discharge allows exposure keratitis to develop.","Wrong - a pad over an open eye can rub and abrade the cornea."],"r":"Slide p28"},{"t":"BELL","stem":"A 38-year-old man has a complete right lower motor neurone facial palsy that began suddenly 10 days ago, with no recovery despite prednisolone from day 1. ENoG shows 95% degeneration compared with the normal side, and needle EMG shows no voluntary motor unit potentials. After counselling, he opts for surgical decompression.\nWhich surgical approach reaches the segment most relevant to his condition?","o":["Transmastoid approach","Middle cranial fossa approach","Translabyrinthine approach","Transparotid approach via the main trunk","Endaural approach to the tympanic segment"],"a":1,"e":"The presumed site of compression in Bell's palsy is the **labyrinthine segment and meatal foramen**, which the transmastoid route cannot reach without sacrificing the inner ear; the **middle cranial fossa** approach exposes it while preserving hearing. Decompression is controversial and offered only for complete palsy with **more than 90% degeneration on ENoG within 14 days** and no voluntary EMG activity. Note: slide p28 suggests daily nerve excitability testing and lists decompression as routine treatment; ENoG (day 3/4 to 21) is the preferred test and steroids remain the mainstay.","w":["Wrong - the transmastoid route exposes the tympanic and mastoid segments, not the labyrinthine segment.","Correct - the middle cranial fossa route reaches the labyrinthine segment and meatal foramen with hearing preserved.","Wrong - translabyrinthine surgery destroys hearing and is used only when hearing is already lost.","Wrong - a parotid approach exposes the extratemporal nerve, distal to the site of compression.","Wrong - a transcanal approach reaches only the tympanic segment in the middle ear."],"r":"Slides p28, p58, p66"},{"t":"MRS","stem":"A 28-year-old woman attends the ENT clinic with her second episode of right lower motor neurone facial palsy in 3 years. She describes recurrent painless swelling of the upper lip lasting days to weeks. Her tongue has deep furrows. She takes no regular medication.\nWhich investigation is most helpful in confirming the diagnosis?","o":["Biopsy of the swollen lip for histology","Serum C1-esterase inhibitor level","Gadolinium MRI of the internal acoustic meatus","Electroneurography of the facial nerve","VZV PCR of a swab from the tongue"],"a":0,"e":"Recurrent orofacial oedema, recurrent LMN facial palsy and a fissured tongue (lingua plicata) is **Melkersson-Rosenthal syndrome**. It is a clinical diagnosis, but **lip biopsy showing non-caseating granulomas** supports it and helps exclude infection (e.g. tuberculosis), sarcoidosis and orofacial Crohn's disease. Hereditary angioedema causes recurrent swelling but not facial palsy or a fissured tongue.","w":["Correct - lip biopsy shows non-caseating granulomas and excludes infective causes.","Wrong - C1-esterase inhibitor deficiency explains swelling but not facial palsy or a fissured tongue.","Wrong - MRI is for progressive or atypical palsy and does not confirm this syndrome.","Wrong - ENoG measures nerve degeneration but does not establish the cause.","Wrong - VZV PCR is for suspected zoster; there are no vesicles here."],"r":"Slides p30-31"},{"t":"MRS","stem":"A 33-year-old woman has had persistent painless swelling of the upper lip for a year. She has never had facial weakness and her tongue is normal. Lip biopsy shows non-caseating granulomas; chest X-ray and serum ACE are normal and she has no bowel symptoms.\nWhat is the best description of her condition?","o":["Hereditary angioedema","Heerfordt syndrome","Lip tuberculosis (lupus vulgaris)","Cheilitis granulomatosa","ACE inhibitor-induced angioedema"],"a":3,"e":"Most patients with Melkersson-Rosenthal syndrome have only one or two features; only **8-25%** show the full triad, and features may appear years apart. Granulomatous lip swelling alone is the **monosymptomatic** form, called **cheilitis granulomatosa**, so she needs follow-up for a later facial palsy. Treatment is symptomatic (e.g. intralesional steroid) and recurrences are common.","w":["Wrong - hereditary angioedema gives episodic non-granulomatous swelling that resolves in days.","Wrong - Heerfordt syndrome (sarcoid) needs uveitis, parotid swelling and usually hilar nodes or raised ACE.","Wrong - tuberculosis gives caseating granulomas and usually other evidence of TB.","Correct - isolated granulomatous lip swelling is the monosymptomatic form of Melkersson-Rosenthal syndrome.","Wrong - drug angioedema is episodic, non-granulomatous and needs an ACE inhibitor history."],"r":"Slide p30"},{"t":"RHS","stem":"A 67-year-old man presents to the ED with 3 days of severe burning pain in the right ear. Today he has complete right facial weakness including the forehead, vertigo and tinnitus. There are crusted vesicles in the right concha and external auditory canal.\nWhat is the most appropriate initial treatment?","o":["Oral prednisolone alone with eye care","Valaciclovir plus prednisolone with eye care","Topical aciclovir cream to the ear and analgesia","IV ceftriaxone with urgent myringotomy","Oral valaciclovir alone, with steroids withheld"],"a":1,"e":"Otalgia, vesicles in the concha/EAC and an LMN facial palsy with VIII symptoms is **herpes zoster oticus (Ramsay Hunt)** from VZV reactivation. Start an **oral antiviral (aciclovir or valaciclovir) plus prednisolone** as early as possible, ideally within 72 hours, with analgesia (including neuropathic agents) and eye care. Recovery is worse than in Bell's palsy, so steroid or antiviral monotherapy undertreats it.","w":["Wrong - steroid alone omits the antiviral that targets active VZV replication.","Correct - combined antiviral and steroid, started early, gives the best chance of recovery.","Wrong - topical antiviral does not reach the geniculate ganglion or the nerve.","Wrong - this is a viral infection, not acute otitis media; the drum is not the problem.","Wrong - antiviral alone leaves nerve oedema untreated; the steroid is part of standard care."],"r":"Slides p32-34"},{"t":"RHS","stem":"A 72-year-old woman is admitted with right otalgia, vesicles in the right concha and a right lower motor neurone facial palsy. On day 2 she develops a hoarse, breathy voice and coughs when drinking water. Her gag reflex is reduced on the right.\nWhich investigation is most appropriate next?","o":["Pure-tone audiometry","Electroneurography of the right facial nerve","Contrast CT of the neck","Barium swallow","Flexible nasolaryngoscopy"],"a":4,"e":"Hoarseness, a breathy voice and coughing on swallowing with a reduced gag mean the zoster has spread to **IX and X**, a recognised extension of Ramsay Hunt syndrome. **Flexible nasolaryngoscopy** shows vocal cord palsy and pooling of secretions and guides a swallow assessment to prevent aspiration. Audiometry is for VIII symptoms (hearing loss, tinnitus) and does not assess the larynx.","w":["Wrong - audiometry assesses VIII involvement, not the larynx or swallow.","Wrong - ENoG grades facial nerve degeneration and does not explain the new symptoms.","Wrong - CT is not needed first; the problem is a cranial neuropathy, not a neck mass.","Wrong - barium swallow risks aspiration and does not show vocal cord movement.","Correct - laryngoscopy confirms vocal cord palsy and pooling from CN X involvement."],"r":"Slide p34"},{"t":"RHS","stem":"A 62-year-old man presents with severe right otalgia followed 2 days later by a right lower motor neurone facial palsy. He also reports right-sided tinnitus. Careful examination of the pinna, ear canal and oral cavity shows no rash or vesicles.\nWhich test would best confirm the suspected cause?","o":["HSV-1 IgM serology","Tzanck smear of the ear canal skin","VZV PCR of saliva or ear canal swab","Gadolinium MRI of the internal acoustic meatus","Electroneurography at day 3"],"a":2,"e":"Severe otalgia with an LMN palsy and VIII symptoms but no rash suggests **zoster sine herpete**, a Ramsay Hunt variant often misdiagnosed as Bell's palsy. **VZV PCR** (or rising VZV antibody titres) confirms it in atypical cases and justifies antiviral therapy with steroids. A Tzanck smear needs vesicles and cannot distinguish HSV from VZV.","w":["Wrong - HSV serology is non-specific and does not identify VZV reactivation.","Wrong - a Tzanck smear needs vesicles and cannot separate HSV from VZV.","Correct - VZV PCR confirms zoster when the typical rash is absent.","Wrong - MRI may show nerve enhancement but does not identify the virus.","Wrong - ENoG measures degeneration, not cause, and day 3 is only the start of its useful window."],"r":"Slide p34"},{"t":"RHS","stem":"A 70-year-old woman has vesicles in the left concha and on the left side of the anterior tongue, with left otalgia and a complete left lower motor neurone facial palsy. She had chickenpox as a child.\nIn which structure has the virus most likely reactivated?","o":["Trigeminal (Gasserian) ganglion in Meckel's cave","Spiral ganglion within the cochlear modiolus","Geniculate ganglion at the first genu","Pterygopalatine ganglion in its fossa","Dorsal root ganglion of the C2 nerve"],"a":2,"e":"VZV lies latent in sensory ganglia and in Ramsay Hunt syndrome reactivates in the **geniculate ganglion**, the sensory ganglion of VII. Its sensory fibres supply part of the concha and EAC, and taste fibres from the anterior two-thirds of the tongue pass through it, which explains where the vesicles appear. Inflammation then spreads to the motor fibres in the Fallopian canal and sometimes to VIII, which is why the prognosis is worse than in Bell's palsy.","w":["Wrong - trigeminal zoster causes a dermatomal facial rash (e.g. ophthalmic), not concha vesicles with VII palsy.","Wrong - the spiral ganglion is a cochlear neurone ganglion and does not explain the rash or palsy.","Correct - the geniculate ganglion supplies the concha and anterior tongue taste fibres, matching the rash.","Wrong - the pterygopalatine ganglion is parasympathetic, not a site of VZV latency.","Wrong - C2 zoster affects the occipital scalp and neck, not the concha with a facial palsy."],"r":"Lecturer pearl"},{"t":"OM","stem":"A 6-year-old boy is brought to the ENT clinic with 2 days of right otalgia and fever (38.9 °C). This morning his mother noticed his mouth pulled across to the left when he smiled. Otoscopy shows a red, bulging right tympanic membrane with no perforation. He cannot wrinkle the right forehead and the right eye closes only incompletely (House-Brackmann IV). There is no mastoid tenderness or post-auricular swelling.\nWhat is the most appropriate management?","o":["Oral amoxicillin, analgesia and review in 72 hours, as most palsies settle with the otitis","Oral prednisolone and valaciclovir within 72 hours, managed along Bell's palsy lines","IV antibiotics and systemic steroids plus myringotomy with grommet, with eye protection","Urgent cortical mastoidectomy with decompression of the mastoid segment of the nerve","HRCT now, then ENoG on day 3 with decompression only if degeneration exceeds 90%"],"a":2,"e":"Facial palsy in **acute otitis media** usually arises where the nerve is exposed through a dehiscent tympanic segment, so the nerve sits in an inflamed, pus-filled middle ear. Treatment is **drainage (myringotomy ± grommet, pus for culture) plus IV antibiotics and steroids**, with eye care; prognosis is good. Mastoidectomy is reserved for coexisting mastoiditis, and an obvious ear cause means this is not Bell's palsy.","w":["Wrong - oral antibiotics alone leave the pus under pressure against the nerve; a palsy is a complication that needs drainage and IV treatment.","Wrong - this is the Bell's palsy regimen; Bell's is a diagnosis of exclusion and here the cause is the infected middle ear.","Correct - IV antibiotics, steroids and myringotomy ± grommet decompress the middle ear and treat the infection; protect the eye that will not close.","Wrong - mastoidectomy is added only if there is mastoiditis (tenderness, swelling, coalescence on CT), which is absent here.","Wrong - the ENoG pathway applies to Bell's palsy and trauma; in AOM the priority is to treat and drain the infection now."],"r":"Slide p37"},{"t":"OM","stem":"A 4-year-old girl at a district hospital develops a left lower motor neurone facial palsy on day 1 of an acute middle-ear infection, before any mastoid signs appear. Her parents ask how an ear infection can affect the face so quickly.\nWhich anatomical feature best explains the early facial nerve involvement?","o":["Congenital dehiscence of the bony canal over the tympanic segment, above the oval window","Narrowness of the labyrinthine segment and meatal foramen, with no arterial arcade","Superficial course of the mastoid segment at the stylomastoid foramen in a young child's skull","Open fissures of Santorini in the cartilaginous canal, carrying infection to the nerve","Close relation of the meatal segment to the cochlear nerve inside the internal meatus"],"a":0,"e":"The **tympanic (horizontal) segment** runs above the oval window and below the lateral semicircular canal and is the **commonest site of bony dehiscence**, so middle-ear inflammation reaches the nerve directly; oedema inside the Fallopian canal then causes neuropraxia. The narrow labyrinthine segment explains Bell's palsy, not otitis media, and the fissures of Santorini are the spread route of necrotising otitis externa.","w":["Correct - a dehiscent tympanic segment lies bare in the middle ear, so inflammation and oedema involve the nerve early.","Wrong - the narrow labyrinthine segment is the site of compression in Bell's palsy, not the route by which middle-ear pus reaches the nerve.","Wrong - the superficial stylomastoid course in infants explains forceps injury at birth, not otitis media in a 4-year-old.","Wrong - fissures of Santorini let necrotising otitis externa spread from the ear canal to the skull base.","Wrong - the meatal segment lies in the internal acoustic meatus, far from the middle-ear cleft."],"r":"Slides p8, p36"},{"t":"OM","stem":"A 45-year-old man attends the ENT clinic with years of scanty, foul-smelling left ear discharge. Over the last 10 days his left face has become weak. Examination shows an attic retraction pocket filled with white keratin debris, granulations in the posterosuperior quadrant and a left lower motor neurone facial palsy (House-Brackmann III). There is no fever or neck stiffness.\nWhat is the most appropriate management?","o":["Aural toilet and topical quinolone drops, then review the facial nerve function in 4 weeks","Oral prednisolone 1 mg/kg for 10 days with eye care, operating only if no recovery","Myringotomy and grommet insertion with IV antibiotics and systemic corticosteroids","ENoG from day 3, proceeding to mastoid surgery only if degeneration exceeds 90%","HRCT, then urgent mastoid exploration with removal of disease and nerve decompression"],"a":4,"e":"Facial palsy in **chronic otitis media with cholesteatoma** means the Fallopian canal is being eroded; it does not recover with medical treatment and is an indication for **urgent surgery** (mastoidectomy, removal of cholesteatoma, decompression of the involved segment) after HRCT to map the disease. Myringotomy is the answer for AOM, and waiting for ENoG criteria belongs to Bell's palsy and trauma, not an active erosive process.","w":["Wrong - drops treat the discharge but not the cholesteatoma eroding the canal; delay risks permanent palsy.","Wrong - steroids may reduce oedema briefly, but the cause is erosion by disease that must be removed.","Wrong - myringotomy drains acute middle-ear pus; it does nothing for an attic cholesteatoma.","Wrong - ENoG thresholds guide surgery in Bell's palsy and trauma; here the palsy itself is the surgical indication.","Correct - HRCT maps the disease, then urgent mastoid exploration removes the cholesteatoma and decompresses the nerve."],"r":"Slides p38-39"},{"t":"OM","stem":"During an urgent canal wall-down mastoidectomy for cholesteatoma in a patient with a 1-week facial palsy, the consultant finds the bony canal of the tympanic segment eroded. The cholesteatoma matrix peels off easily, but vascular granulation tissue is seen penetrating the nerve sheath. The nerve is in continuity.\nWhat is the correct way to deal with the granulation tissue?","o":["Excise it from the sheath with sharp microdissection so no inflamed tissue remains","Leave the penetrating granulations and decompress the exposed canal either side","Resect the involved segment and bridge the gap with a great auricular cable graft","Coagulate the granulations with bipolar diathermy to control bleeding, then close","Abandon the procedure and rely on IV antibiotics and steroids to settle the nerve"],"a":1,"e":"**Granulations that penetrate the nerve are not removed**: stripping them injures fibres of a nerve that is still in continuity and able to recover. The canal is decompressed so the oedematous nerve has room. Grafting is only for a segment already destroyed (often delayed), and diathermy near the nerve risks thermal injury.","w":["Wrong - dissecting granulations out of the sheath tears nerve fibres and can convert a recoverable palsy into a permanent one.","Correct - leave granulations that invade the nerve and decompress the canal; the nerve in continuity can recover.","Wrong - resection and grafting are for a destroyed segment, not for a nerve in continuity.","Wrong - thermal injury is a recognised cause of iatrogenic palsy; avoid diathermy on the nerve.","Wrong - the cholesteatoma must still be cleared; medical treatment does not remove the cause."],"r":"Slides p39, p71"},{"t":"MOE","stem":"A 74-year-old man with poorly controlled type 2 diabetes (HbA1c 10.8%) is referred from Klinik Kesihatan with 6 weeks of right ear pain that keeps him awake at night, scanty discharge and no improvement on two courses of ear drops. Examination shows granulation tissue on the floor of the right ear canal at the bony-cartilaginous junction and a right lower motor neurone facial palsy. The ear swab grows Pseudomonas aeruginosa.\nWhich antimicrobial plan is most appropriate?","o":["Topical ciprofloxacin drops with aural toilet for 2 weeks, as the infection is superficial","Oral amoxicillin-clavulanate for 2 weeks with steroid-antibiotic drops for the canal","IV flucloxacillin for 2 weeks, switching to oral cloxacillin once the pain has settled","IV then oral ciprofloxacin for about 6-8 weeks in total, with strict glucose control","IV aciclovir for 7 days with oral prednisolone, since the facial palsy may be viral"],"a":3,"e":"Facial palsy with granulations at the bony-cartilaginous junction in an elderly diabetic means **skull-base osteomyelitis** from necrotising otitis externa. Pseudomonas needs **prolonged antipseudomonal therapy** (ciprofloxacin IV, then oral: about 2 weeks IV plus 6 weeks oral on the slide), aural toilet and strict diabetic control. Topical treatment has already failed, and co-amoxiclav and flucloxacillin do not cover Pseudomonas.","w":["Wrong - topical treatment has already failed; once bone and the facial nerve are involved, systemic therapy is needed.","Wrong - co-amoxiclav has no useful antipseudomonal activity, and 2 weeks is far too short for osteomyelitis.","Wrong - flucloxacillin targets Staphylococcus aureus, not Pseudomonas aeruginosa.","Correct - prolonged ciprofloxacin (IV, then oral, about 6-8 weeks) plus diabetic control treats Pseudomonas skull-base osteomyelitis.","Wrong - a palsy with granulations in a diabetic is infective osteomyelitis; there are no vesicles to suggest zoster."],"r":"Slide p43"},{"t":"MOE","stem":"A 69-year-old diabetic woman on IV ciprofloxacin for skull-base osteomyelitis from the right ear still has a friable, bleeding mass of granulation tissue in the ear canal after 3 weeks, and her ear pain is no better. She has a right lower motor neurone facial palsy.\nWhich investigation is most important now to exclude a must-not-miss alternative diagnosis?","o":["Repeat ear swab culture and sensitivity to look for ciprofloxacin resistance","Gallium-67 scan to judge whether the osteomyelitis is resolving on treatment","Biopsy of the ear canal granulation tissue for histopathological examination","Serial ESR and CRP to track the inflammatory response to the antibiotics","Contrast MRI of the skull base to map soft-tissue and intracranial extension"],"a":2,"e":"**Squamous cell carcinoma of the ear canal** can mimic necrotising otitis externa exactly: chronic pain, discharge, granulations and cranial nerve palsy. Granulations that persist or bleed despite treatment must be **biopsied**. The other tests monitor infection or map its extent but cannot exclude malignancy.","w":["Wrong - resistance is worth checking, but culture cannot exclude a carcinoma hiding under the granulations.","Wrong - gallium-67 monitors infection activity; it does not distinguish infection from tumour.","Correct - tissue biopsy is the only way to exclude carcinoma mimicking necrotising otitis externa.","Wrong - inflammatory markers help follow treatment but are non-specific and are raised in both conditions.","Wrong - MRI shows soft-tissue extent, but tumour and infection look alike; histology is needed."],"r":"Slide p43"},{"t":"MOE","stem":"A 70-year-old diabetic man has severe nocturnal right ear pain, an oedematous ear canal with purulent discharge, and a positive Tc-99m bone scan. The house officer says the diagnosis of necrotising otitis externa is confirmed because his ESR is 95 mm/h.\nAccording to the original Cohen and Friedman (1987) criteria, which further finding is an obligatory (major) criterion?","o":["Granulation tissue in the external auditory canal","Pseudomonas aeruginosa grown from the ear swab","Facial or other cranial nerve involvement","Erythrocyte sedimentation rate above 50 mm/h","Diabetes mellitus or another debilitating illness"],"a":0,"e":"Cohen and Friedman's **major criteria (all required)** are pain, oedema, exudate, **granulation tissue**, microabscess at surgery, and a positive Tc-99m scan or failure of local treatment for at least 1 week. Pseudomonas, diabetes, cranial nerve involvement, positive radiograph, debility and old age are only **minor**. Note: the slide lists a high ESR as a criterion; it is not part of the original criteria, though ESR and CRP are useful for monitoring.","w":["Correct - granulation tissue is one of the obligatory major criteria.","Wrong - Pseudomonas on culture is a minor criterion; the diagnosis does not depend on it.","Wrong - cranial nerve involvement is a minor criterion, even though it signals skull-base disease.","Wrong - ESR is not an original Cohen criterion (the slide is wrong here); it is used to monitor response.","Wrong - diabetes and debility are minor criteria (risk factors), not obligatory findings."],"r":"Slide p42"},{"t":"MOE","stem":"A 66-year-old diabetic man has completed 6 weeks of ciprofloxacin for necrotising otitis externa with a facial palsy. His pain has gone and the ear canal has healed. His Tc-99m bone scan at diagnosis was strongly positive. The team must decide whether antibiotics can be stopped.\nWhich imaging test is best for showing that the osteomyelitis has resolved?","o":["Repeat Tc-99m bone scan, comparing uptake with the scan at diagnosis","HRCT of the temporal bone, looking for re-ossification of eroded bone","Plain mastoid radiographs, looking for return of air-cell clarity","MRI of the skull base, looking for resolution of marrow signal change","Gallium-67 scan, as uptake returns to normal once infection settles"],"a":4,"e":"**Tc-99m** reflects osteoblastic activity and stays positive for months or years after cure, so it is good for **diagnosis** but useless for follow-up. **Gallium-67** binds to leucocytes in active inflammation, so it normalises as the infection resolves and is used to **monitor** treatment. CT bone changes and MRI signal lag far behind clinical cure.","w":["Wrong - Tc-99m stays positive long after cure because bone remodelling continues.","Wrong - CT shows bone erosion well, but re-ossification lags months behind control of infection.","Wrong - plain films are insensitive in both directions and are not used to time antibiotics.","Wrong - marrow signal change on MRI persists after cure, so it overestimates ongoing disease.","Correct - gallium-67 uptake falls as active infection resolves, making it the monitoring scan."],"r":"Lecturer pearl"},{"t":"TUM","stem":"A 52-year-old woman is referred from Klinik Kesihatan with right facial weakness that has crept on over 8 months. For several months before the weakness, the right side of her face twitched. She now has a right lower motor neurone palsy (House-Brackmann III), normal otoscopy, no parotid mass and a mild right sensorineural hearing loss.\nWhat is the most appropriate next investigation?","o":["Electroneurography to measure the percentage of degenerated nerve fibres","Gadolinium MRI of the internal meatus, temporal bone and parotid","Fasting blood glucose, HbA1c and ESR to look for a metabolic cause","Serum ACE, calcium and chest radiograph to look for sarcoidosis","Schirmer test and stapedial reflex for topodiagnostic localisation"],"a":1,"e":"**Slowly progressive palsy**, **twitching before weakness**, hearing loss or recurrent ipsilateral palsy are red flags: this is a **tumour until proven otherwise** (facial or vestibular schwannoma, parotid or temporal bone malignancy), not Bell's palsy. **Gadolinium MRI** shows the lesion along the whole course, with HRCT added for bony canal changes. Electrophysiology and topodiagnosis grade or localise the lesion but do not identify its cause.","w":["Wrong - ENoG measures degeneration in acute complete palsy; it says nothing about the cause of a slow palsy.","Correct - gadolinium MRI of the whole course (CPA, internal meatus, temporal bone, parotid) is needed to find a tumour.","Wrong - diabetes is a risk factor for Bell's palsy, but a palsy evolving over 8 months is not Bell's.","Wrong - sarcoidosis causes facial palsy (often bilateral), but twitching and slow progression point to a tumour first.","Wrong - topodiagnostic tests suggest the level of the lesion but cannot show what it is."],"r":"Slide p45"},{"t":"TUM","stem":"A 38-year-old man has mild right facial weakness (House-Brackmann II) and normal hearing. Gadolinium MRI shows an 8 mm enhancing fusiform lesion of the facial nerve at the geniculate ganglion, unchanged on a repeat scan 6 months later.\nWhat is the most appropriate management?","o":["Total resection through a middle fossa approach with immediate sural nerve graft","Translabyrinthine resection of the tumour with hypoglossal-facial anastomosis","Stereotactic radiosurgery now to prevent any further loss of facial function","Observation with serial MRI and facial nerve grading, treating if it grows","High-dose oral prednisolone for 10 days, then repeat MRI to assess regression"],"a":3,"e":"Facial schwannomas grow slowly, and resecting one means sacrificing the nerve; a graft gives at best about **House-Brackmann III**, worse than this patient's grade II. So a small tumour with good function is managed by **wait-and-scan** (serial MRI). Resection with grafting is for growing tumours or poor function, and radiosurgery for growth in poor surgical candidates; translabyrinthine surgery would sacrifice normal hearing.","w":["Wrong - resection with grafting would leave him worse (about HB III) than his current grade II.","Wrong - translabyrinthine surgery destroys hearing, and hypoglossal-facial transfer is for an unavailable proximal stump.","Wrong - radiosurgery is kept for growing or symptomatic tumours in elderly or unfit patients, not a stable small tumour.","Correct - a small, stable schwannoma with good facial function is observed with serial MRI.","Wrong - steroids do not shrink a schwannoma; this is a structural benign tumour, not oedema."],"r":"Slide p46"},{"t":"TUM","stem":"A 58-year-old man has had a firm right preauricular lump for 5 months. Over the last month he has developed aching pain, numbness over the right temple and weakness of the right lower face. FNAC is reported as a salivary gland neoplasm, type to be confirmed, and MRI shows thickening of the facial nerve extending towards the stylomastoid foramen.\nWhich tumour type is most associated with this pattern of spread?","o":["Pleomorphic adenoma","Warthin's tumour","Adenoid cystic carcinoma","Acinic cell carcinoma","Low-grade mucoepidermoid carcinoma"],"a":2,"e":"A parotid lump with facial weakness, pain or numbness is **malignant until proven otherwise**; benign tumours almost never paralyse the nerve. **Adenoid cystic carcinoma** is notorious for **perineural spread** along VII and V (auriculotemporal), with skip lesions and late recurrence. Mucoepidermoid carcinoma is the commonest parotid malignancy, but perineural spread is the hallmark of adenoid cystic.","w":["Wrong - the commonest parotid tumour, but benign; facial palsy is very rare and should make you doubt the diagnosis.","Wrong - benign, often bilateral, in older male smokers; it does not invade nerves.","Correct - adenoid cystic carcinoma characteristically tracks along nerves, causing pain, numbness and palsy.","Wrong - a usually low-grade malignancy; perineural spread is not its typical feature.","Wrong - mucoepidermoid is the commonest malignancy, but low-grade tumours rarely spread along the nerve."],"r":"Slide p47"},{"t":"TUM","stem":"A 67-year-old man with 30 years of left chronic ear discharge now has bloody otorrhoea, deep ear pain and a friable mass filling the left ear canal. There is a left lower motor neurone facial palsy. Biopsy confirms squamous cell carcinoma, and HRCT shows erosion of the canal floor with middle-ear involvement.\nUnder the modified Pittsburgh staging, how does the facial palsy affect the T stage?","o":["No effect, as the T stage depends only on the extent of bone erosion","Upstages it to T2, as nerve involvement counts as limited spread","Upstages it to T3, the stage that covers middle-ear and nerve disease","Makes it T4, whatever the extent of bone erosion seen on HRCT","Counts as distant spread, so it is staged M1 and treated palliatively"],"a":3,"e":"In the **modified Pittsburgh** system any **facial nerve paresis makes the tumour T4**, as do erosion of the cochlea, petrous apex, medial middle-ear wall, carotid canal, jugular foramen or dura, or more than 0.5 cm of soft-tissue spread. T4 disease needs extended (subtotal) temporal bone resection with parotidectomy and neck management plus postoperative radiotherapy, and has a poor prognosis. Facial palsy is a local, not a metastatic, feature.","w":["Wrong - facial nerve paresis is itself a T4 criterion, independent of bone erosion.","Wrong - T2 is limited bony erosion of the canal (not full thickness) or soft tissue under 0.5 cm.","Wrong - middle-ear or mastoid erosion alone is T3; adding facial paresis moves it to T4.","Correct - facial nerve paresis is a T4 criterion in the modified Pittsburgh staging.","Wrong - nerve involvement is local extension; M1 means distant metastasis such as lung or bone."],"r":"Lecturer pearl"},{"t":"TRA","stem":"A 24-year-old motorcyclist is seen in the ED after a blow to the right side of the head. GCS is 15. There is bleeding from the right ear, a step in the posterosuperior canal wall and a torn tympanic membrane. Facial movement was symmetrical on arrival, but on day 2 he develops right facial weakness: the eye closes fully with effort and forehead movement is reduced (House-Brackmann III).\nWhat is the most appropriate management of the facial weakness?","o":["Transmastoid exploration and decompression of the nerve within 24 hours","Middle fossa decompression of the labyrinthine segment and geniculate","Hypoglossal-facial anastomosis once his other injuries have been stabilised","Exploration and end-to-end repair, which works best within 72 hours","Systemic steroids, eye care and serial facial assessment, expecting recovery"],"a":4,"e":"**Delayed, incomplete** palsy after a lateral blow (longitudinal fracture pattern) is due to oedema or haematoma around an intact nerve and has an **excellent prognosis** with steroids, eye care and observation. Surgery is considered for **immediate, complete** palsy with more than 90% degeneration on ENoG or a bony fragment in the canal. Repair or nerve transfer presumes a transected nerve, which delayed onset effectively rules out.","w":["Wrong - early exploration is for immediate complete palsy, not delayed incomplete weakness.","Wrong - this approach is for injury to the labyrinthine segment with immediate complete palsy and severe degeneration.","Wrong - hypoglossal-facial transfer is a reanimation option when the proximal nerve is unusable, not for a recovering nerve.","Wrong - a nerve that worked on arrival was not divided; there is nothing to repair.","Correct - delayed incomplete post-traumatic palsy is treated conservatively and usually recovers fully."],"r":"Slides p53-54"},{"t":"TRA","stem":"A 40-year-old man falls backwards from scaffolding and strikes his occiput. In the ED he has a complete left facial palsy that has been present since he regained awareness, severe vertigo with vomiting and spontaneous nystagmus. Weber lateralises to the right and Rinne is positive on both sides. The left drum is intact with blood behind it.\nWhich fracture pattern best explains these findings?","o":["Transverse fracture running across the labyrinth","Longitudinal fracture through the tegmen and ossicles","Isolated fracture of the tympanic plate of the ear canal","Fracture of the squamous temporal bone above the canal","Fracture of the mastoid tip, sparing the middle ear"],"a":0,"e":"Occipital or frontal blows cause **transverse fractures** that cross the petrous pyramid through the vestibule and cochlea: **profound SNHL** (Weber away from the injured ear, Rinne positive), intense vertigo and nystagmus, and **immediate, often permanent** facial palsy (about 50%). Longitudinal fractures follow a lateral blow, tear the drum and disrupt the ossicles (conductive loss) and cause delayed, usually temporary palsy in about 20%. Note: slide p52 reverses the incidence; **longitudinal fractures are the commoner type (about 70-90%)** and transverse about 10-30%.","w":["Correct - an occipital blow, SNHL, intense vertigo and immediate palsy are the transverse (otic capsule-violating) pattern.","Wrong - longitudinal fractures follow lateral blows, tear the drum and give conductive loss with delayed palsy.","Wrong - a tympanic plate fracture affects the ear canal only and spares the labyrinth and nerve.","Wrong - a squamous fracture lies above the ear and does not reach the labyrinth or Fallopian canal.","Wrong - a mastoid tip fracture would not explain a dead ear, intense vertigo and nystagmus."],"r":"Slides p52-54"},{"t":"TRA","stem":"A 30-year-old woman is admitted after a high-speed road traffic accident. The ambulance crew documented a complete right facial palsy at the scene, and it is still complete (House-Brackmann VI) on day 1. She has right haemotympanum and is otherwise stable.\nWhat is the best next step for the facial nerve?","o":["Prednisolone and eye care, reviewing the face monthly for 3 months","HRCT temporal bones, then ENoG from day 3 to assess degeneration","Needle EMG today to look for the fibrillation potentials of denervation","Gadolinium MRI of the brain and internal meatus as the first imaging","Minimal nerve excitability test today, repeated weekly for a month"],"a":1,"e":"**Immediate complete** post-traumatic palsy suggests transection or bony impingement, so define the fracture with **HRCT** and quantify degeneration with **ENoG** (meaningful from about day 3, once Wallerian degeneration reaches the stimulation site). More than 90% degeneration within 14 days, or a fragment impinging on the canal, is an indication for exploration and decompression or repair. EMG fibrillation and NET changes appear too late to help on day 1.","w":["Wrong - conservative care suits delayed incomplete palsy; for immediate complete palsy it risks missing the window for repair.","Correct - HRCT shows the fracture and the nerve's relation to it; ENoG from day 3 identifies those needing surgery.","Wrong - fibrillation potentials take 10-21 days to appear, so EMG on day 1 cannot show denervation.","Wrong - HRCT, not MRI, is the first imaging for fracture lines through the Fallopian canal.","Wrong - degeneration cannot be detected for 48-72 hours, so a day-1 NET would look falsely normal."],"r":"Slides p54, p58, p64"},{"t":"TRA","stem":"A 19-year-old rugby player is struck on the left temporoparietal region. He has blood in the left ear canal, a tear of the left tympanic membrane and a mild left facial weakness that began 2 days after the injury. Vestibular examination is normal.\nWhich tuning fork finding is most expected?","o":["Left Rinne negative; Weber lateralises to the left","Left Rinne positive; Weber lateralises to the right","Left Rinne negative; Weber lateralises to the right","Rinne positive on both sides; Weber central","Rinne negative on both sides; Weber central"],"a":0,"e":"A lateral blow produces a **longitudinal (otic capsule-sparing)** fracture along the canal roof and middle ear, tearing the drum, filling the middle ear with blood and disrupting the ossicles: **conductive loss**, so Rinne is negative and Weber goes to the injured ear. The otic capsule is spared, so vertigo is mild and SNHL uncommon. Rinne negative with Weber to the opposite side is a false-negative Rinne from a dead ear, typical of a transverse fracture.","w":["Correct - conductive loss in the injured ear: Rinne negative and Weber lateralising to that ear.","Wrong - this is the sensorineural pattern of a transverse, otic capsule-violating fracture.","Wrong - this is a false-negative Rinne from a dead left ear, which would go with a transverse fracture.","Wrong - this is normal hearing, unlikely with a torn drum and blood in the middle ear.","Wrong - bilateral conductive loss would need injury to both ears."],"r":"Slides p53-54"},{"t":"INV","stem":"A 35-year-old man is on day 5 of a complete right Bell's palsy treated with prednisolone. A minimal nerve excitability test is performed over the stylomastoid foramen: the threshold for a visible twitch is 3.0 mA on the normal left side and 7.5 mA on the right.\nWhat is the correct interpretation?","o":["Conduction block only, as both sides still respond to the stimulus","Degeneration, as the difference between the sides is over 3.5 mA","A normal result, as a difference is only significant above 10 mA","Uninterpretable, as the test is only valid 3 weeks after onset","Reinnervation, as the threshold on the right is falling to normal"],"a":1,"e":"In the minimal NET the threshold current for a twitch is compared side to side. In pure **conduction block (neurapraxia)** the distal nerve conducts normally, so thresholds are equal; a **difference greater than 3.5 mA** indicates **degeneration** and a poorer prognosis. Degeneration cannot be detected before 48-72 hours, so the test is useful from day 3, not only after 3 weeks.","w":["Wrong - a response is still present, but a 4.5 mA difference means fibres are degenerating, not just blocked.","Correct - a side-to-side difference above 3.5 mA is the threshold for degeneration.","Wrong - the cut-off is 3.5 mA, not 10 mA.","Wrong - NET becomes informative after 48-72 hours; by 3 weeks it has little to add.","Wrong - a single raised threshold shows loss of excitable fibres; reinnervation is shown by polyphasic EMG potentials."],"r":"Slide p55"},{"t":"INV","stem":"A 27-year-old man has a deep laceration in front of the right ear from broken glass and complete paralysis of the right face. A nerve excitability test done 6 hours after the injury, stimulating the branches distal to the wound, shows equal thresholds on both sides.\nWhat is the best explanation for this result?","o":["The nerve is in conduction block only and will recover in a few weeks","The stimulating current has spread across to the opposite facial nerve","The current is stimulating the facial muscles directly, not the nerve","The main trunk is intact, so surgical exploration is not required","Distal segments conduct until Wallerian degeneration, after 48-72 h"],"a":4,"e":"After transection the distal nerve keeps conducting until **Wallerian degeneration** reaches it, about **48-72 hours** later, so electrical tests distal to the lesion look normal at first. A normal early test does not exclude division; a clinically complete palsy after a penetrating wound in the nerve's path needs **exploration**, ideally with repair **within 72 hours** while the distal branches can still be stimulated to identify them.","w":["Wrong - an equal threshold this early cannot distinguish neurapraxia from transection.","Wrong - the test is done unilaterally at standard currents; crossover to the other side does not occur.","Wrong - nerve thresholds are far lower than direct muscle thresholds; the twitch is from intact distal nerve.","Wrong - a normal early test is falsely reassuring; the wound and complete palsy demand exploration.","Correct - the distal stump conducts normally until Wallerian degeneration sets in after 48-72 hours."],"r":"Slides p55, p67"},{"t":"INV","stem":"A 42-year-old woman has a complete left Bell's palsy (House-Brackmann VI) that began 9 days ago, despite prednisolone started within 48 hours. ENoG shows 95% degeneration compared with the right side, and needle EMG shows no voluntary motor unit potentials. She is keen on any intervention that might help.\nWhat is the most appropriate option to discuss?","o":["Transmastoid decompression of the tympanic and mastoid segments only","Hypoglossal-facial anastomosis now, as the nerve will not recover","Middle fossa decompression of the labyrinthine segment and meatal foramen","Repeat ENoG in 3 months and decompress if there is still no recovery","Change to aciclovir alone, since the steroids have clearly failed"],"a":2,"e":"**More than 90% degeneration on ENoG within 14 days** with no voluntary EMG activity predicts poor recovery, and this is the only group in whom decompression is considered. The Bell's lesion is at the **meatal foramen and labyrinthine segment** (narrowest part of the canal), so the **middle cranial fossa** approach is needed; transmastoid decompression misses it. Note: the slides list decompression as Bell's treatment without qualification; it is controversial, rarely done and only useful within 14 days, while steroids remain the mainstay.","w":["Wrong - transmastoid decompression does not reach the meatal foramen, where the Bell's nerve is compressed.","Wrong - the nerve is in continuity and may still recover partially; reanimation is for a nerve that cannot recover.","Correct - with over 90% degeneration within 14 days, middle fossa decompression of the labyrinthine segment can be discussed.","Wrong - decompression only has a chance of benefit within about 14 days; at 3 months the window has passed.","Wrong - antiviral therapy alone is not recommended, and changing drugs does not address the degeneration."],"r":"Slides p28, p58"},{"t":"INV","stem":"A 50-year-old man has had a complete right facial palsy for 5 days after a temporal bone fracture. The house officer requests needle EMG today to show whether the nerve has degenerated.\nWhat is the main limitation of EMG at this stage?","o":["Fibrillation potentials of denervation take 10-21 days to appear","EMG cannot be performed when there is no voluntary facial movement","Needle insertion into paralysed muscle is unsafe in the first fortnight","EMG shows only reinnervation (polyphasic potentials), not degeneration","EMG gives a percentage of degenerated fibres but no prognostic value"],"a":0,"e":"Denervated muscle shows **fibrillation potentials only 10-21 days after injury**, once degeneration reaches the motor end-plates, so EMG is most useful **from about 2-3 weeks onwards**; between day 3 and day 21 **ENoG** is the test of choice. Early on, the useful EMG finding is voluntary motor unit potentials, which mean some fibres are intact and the prognosis is good. Note: the slide says EMG is most helpful within 2-3 weeks of onset; more precisely, it becomes useful from 2-3 weeks.","w":["Correct - fibrillation potentials appear only after 10-21 days, so a day-5 EMG cannot show denervation.","Wrong - EMG records spontaneous activity and can be done without voluntary movement, as the slide notes.","Wrong - needle EMG is safe at any stage; the problem is timing, not safety.","Wrong - EMG shows both fibrillation (denervation) and polyphasic (reinnervation) potentials.","Wrong - the percentage of degenerated fibres comes from ENoG, not EMG."],"r":"Slide p57"},{"t":"INV","stem":"A 45-year-old woman has a right lower motor neurone facial palsy. Schirmer test at 5 minutes: 18 mm on the right and 20 mm on the left. Stapedial reflex recorded from the right ear is absent. Electrogustometry threshold is raised on the right anterior tongue, and right submandibular flow is reduced by 60%.\nWhere is the lesion most likely to be?","o":["Cerebellopontine angle, involving VII and VIII together","Labyrinthine segment, proximal to the geniculate ganglion","Between the geniculate ganglion and the nerve to stapedius","Between the nerve to stapedius and the chorda tympani","Stylomastoid foramen, distal to the chorda tympani"],"a":2,"e":"Work from proximal to distal. A **normal Schirmer** (here a 10% difference; abnormal is a 25% or greater reduction) means the **GSPN is intact**, so the lesion is distal to the geniculate ganglion. An **absent stapedial reflex** puts it proximal to the nerve to stapedius, and reduced taste and submandibular flow agree. So the lesion is in the **tympanic segment**, between the geniculate ganglion and the nerve to stapedius.","w":["Wrong - a CPA lesion would reduce tearing too and usually brings VIII signs.","Wrong - a lesion above the geniculate ganglion would reduce lacrimation on the Schirmer test.","Correct - normal tearing but lost stapedial reflex, taste and salivation place the lesion between the geniculate ganglion and the nerve to stapedius.","Wrong - a lesion below the nerve to stapedius would leave the stapedial reflex intact.","Wrong - a stylomastoid lesion spares taste, salivation and the stapedial reflex."],"r":"Slides p16-17, p59-63"},{"t":"SURG","stem":"A 28-year-old man has an immediate complete left facial palsy after a head injury. On day 6, ENoG shows 96% degeneration. HRCT shows a fracture line through the region of the geniculate ganglion and labyrinthine segment, sparing the otic capsule, and audiometry shows normal cochlear function.\nWhich surgical approach is most appropriate to decompress the injured segment?","o":["Transmastoid approach alone, decompressing the tympanic and mastoid segments","Translabyrinthine approach, exposing the whole intratemporal course","Retrosigmoid approach to the cerebellopontine angle and internal meatus","Middle cranial fossa approach, combined with transmastoid if needed","Transcanal approach after raising a tympanomeatal flap"],"a":3,"e":"The **middle cranial fossa** approach reaches the labyrinthine segment, geniculate ganglion and meatal segment from above **while preserving hearing**, and in trauma it is often combined with a transmastoid approach for the distal segments. Transmastoid alone reaches only the tympanic and mastoid segments. **Translabyrinthine** exposure gives the whole intratemporal course but destroys hearing, so it is used only when cochleovestibular function is already lost.","w":["Wrong - transmastoid access stops at the tympanic segment and cannot reach the labyrinthine segment safely.","Wrong - this sacrifices the labyrinth and hearing, so it is only for an ear that is already dead.","Wrong - the retrosigmoid route is for CPA and meatal lesions, not the geniculate region.","Correct - the middle fossa route exposes the labyrinthine segment and geniculate ganglion with hearing preserved.","Wrong - a transcanal route gives only limited access to the tympanic segment in the middle ear."],"r":"Slide p66"},{"t":"SURG","stem":"A 35-year-old woman wakes after a modified radical mastoidectomy, done under general anaesthesia with lidocaine-adrenaline infiltration, and has a complete right facial palsy. The operation note does not record the nerve being seen or injured, and the canal is tightly packed.\nWhat is the best initial management?","o":["Return to theatre at once for exploration, without any period of observation","Start prednisolone and observe, arranging ENoG at 3 weeks if no recovery","Arrange HRCT, then ENoG on day 3 to decide whether to explore the nerve","Plan a hypoglossal-facial anastomosis once the mastoid cavity has healed","Wait a few hours and loosen the pack; re-explore if the palsy stays complete"],"a":4,"e":"**Immediate post-operative palsy** may be due to local anaesthetic reaching a dehiscent nerve or to tight packing, so **wait a few hours** and **loosen the pack**. If the palsy is still complete and the nerve's integrity is uncertain, **re-explore promptly** (ideally by a senior surgeon) to decompress or repair it. Palsy of **delayed onset** after ear surgery is due to oedema and is treated with steroids and observation.","w":["Wrong - a few hours' wait excludes the commonest benign cause, local anaesthetic, before a second anaesthetic.","Wrong - steroids and observation suit delayed-onset palsy; immediate complete palsy may mean a divided nerve.","Wrong - waiting for day-3 ENoG wastes the best window for repair of a possibly divided nerve.","Wrong - reanimation is for a nerve that cannot be repaired; first find out whether it is intact.","Correct - allow local anaesthetic to wear off and relieve the packing, then re-explore if the palsy persists."],"r":"Lecturer pearl"},{"t":"SURG","stem":"A newborn delivered by forceps has a bruise over the left mastoid and preauricular area. On crying, the left side of the face does not move and the left eye stays open, and the rooting response is weak on the left. There are no dysmorphic features, and eye abduction is normal on both sides.\nWhat is the most appropriate management?","o":["Early surgical exploration and neuroplasty of the compressed facial nerve","Eye lubricant and protection with observation for spontaneous recovery","Oral prednisolone 1 mg/kg daily for 10 days to reduce nerve oedema","ENoG on day 3, with decompression if degeneration exceeds 90 percent","MRI brain for Möbius syndrome and referral for genetic counselling"],"a":1,"e":"In the newborn the **mastoid process is undeveloped**, so the nerve emerges superficially and is compressed by the forceps blade; it is almost always in continuity and **about 90% recover spontaneously**. Management is **eye protection** (lubricant or ointment) and observation, with electrophysiology and surgery only if there is no recovery at all. Note: the slide lists neuroplasty as management; surgery is rarely needed. Forceps bruising and normal abduction argue against Möbius syndrome (bilateral VI and VII), which does not recover.","w":["Wrong - the slide lists neuroplasty, but traumatic neonatal palsy usually recovers without surgery.","Correct - protect the open eye and observe; most forceps palsies recover fully.","Wrong - steroids are not part of the standard management of birth-related facial palsy.","Wrong - the adult ENoG pathway is not used here; nearly all these nerves are in continuity and recover.","Wrong - Möbius is bilateral with VI palsy and no birth trauma; this unilateral palsy follows forceps injury."],"r":"Slide p73"}]}];
const APP_VERSION = '2026.11.07-0743';

/* ---------- storage (localStorage with in-memory fallback) ---------- */
const MEM = {};
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? (k in MEM ? MEM[k] : d) : JSON.parse(v);}catch(e){ return k in MEM ? MEM[k] : d; } },
  set(k, v){ MEM[k] = v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const KEY='entpass.v1', KEYD='entpass.customDecks';
let S = Object.assign({cards:{}, mcq:{}, hist:[], theme:null, cur:'all', done:{}}, LS.get(KEY, {}));
if (!S.done) S.done = {};
function save(){ LS.set(KEY, S); }

/* ---------- decks ---------- */
let DECKS = [], CARDS = [], MCQ = [], BYID = {};
function customDecks(){ return LS.get(KEYD, []); }
function setCustomDecks(a){ LS.set(KEYD, a); }
function buildIndex(){
  const map = new Map();
  BUILTIN.forEach(d => map.set(d.id, Object.assign({builtin:true}, d)));
  customDecks().forEach(d => map.set(d.id, Object.assign({builtin:false}, d)));
  DECKS = [...map.values()];
  CARDS = []; MCQ = []; BYID = {};
  DECKS.forEach(d => {
    d.topics = d.topics || {};
    (d.cards||[]).forEach((c,i) => { c.id = d.id+':c'+(i+1); c.deck = d.id; c.t = c.t || 'GEN'; if(!d.topics[c.t]) d.topics[c.t] = c.t; CARDS.push(c); BYID[c.id]=c; });
    (d.mcq||[]).forEach((q,i) => { q.id = d.id+':q'+(i+1); q.deck = d.id; q.t = q.t || 'GEN'; if(!d.topics[q.t]) d.topics[q.t] = q.t; MCQ.push(q); BYID[q.id]=q; });
  });
  if (S.cur !== 'all' && !DECKS.find(d => d.id === S.cur)) S.cur = 'all';
}
const deckOf = id => DECKS.find(d => d.id === id);
const curDecks = () => S.cur === 'all' ? DECKS : DECKS.filter(d => d.id === S.cur);
const curIds = () => new Set(curDecks().map(d => d.id));
const tKey = (deck, t) => deck + '/' + t;
const tName = key => { const [d, t] = key.split('/'); const dk = deckOf(d); return (dk && dk.topics[t]) || t; };
function topicsOf(decks){ const out=[]; decks.forEach(d => Object.keys(d.topics).forEach(t => out.push(tKey(d.id,t)))); return out; }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
function fmtStem(s){
  s = String(s||''); const i = s.lastIndexOf('\n');
  if (i < 0) return fmt(s);
  return fmt(s.slice(0,i)) + '<span class="ql">' + fmt(s.slice(i+1)) + '</span>';
}
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pct = (a,b) => b ? Math.round(100*a/b) : 0;
const cst = id => S.cards[id] || {b:0, s:false, n:0};
const mst = id => S.mcq[id] || {r:0, w:0, l:null};
const L = 'ABCDE';
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2200); }
const starsOf = k => { const n = Math.min(3, (S.done||{})[k] || 0); return `<span class="tstar" title="Finished ${(S.done||{})[k]||0} time(s)">${'★'.repeat(n)}<span class="off">${'☆'.repeat(3-n)}</span></span>`; };
const prov = x => x && x.r ? `<span class="prov">📌 ${esc(x.r)}</span>` : '';
function barCls(p){ return p<50?'red':p<75?'amb':'grn'; }
function deckLabel(){ if (S.cur==='all') return '📚 All decks'; const d=deckOf(S.cur); return d ? (d.emoji||'📘')+' '+(d.short||d.title) : 'All decks'; }

/* ---------- navigation ---------- */
let VIEW = 'home';
let cardSel = {topics:null, mode:'due', shuffle:true, n:20};
let mcqSel = {topics:null, pool:'all', n:10, mode:'study'};
let SESSION = null, QUIZ = null, TIMER = null;
function go(v){ VIEW = v; if (v!=='quiz' && TIMER){ clearInterval(TIMER); TIMER=null; } render(); window.scrollTo(0,0); }
function render(){
  $('#deckPill').textContent = deckLabel() + ' ▾';
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === ({session:'cards',browse:'cards',quiz:'mcq',result:'mcq'}[VIEW] || VIEW)));
  const f = {home:vHome, cards:vCards, session:vSession, browse:vBrowse, mcq:vMcq, quiz:vQuiz, result:vResult, prog:vProg, decks:vDecks}[VIEW] || vHome;
  $('#app').innerHTML = f();
  if (VIEW === 'session') bindSwipe();
}

/* ---------- deck picker ---------- */
function openDeckPicker(){
  const m = document.createElement('div'); m.className='modal'; m.onclick = e => { if (e.target===m) m.remove(); };
  m.innerHTML = '<div class="sheet"><h2>Choose deck</h2>' +
    deckBtn('all','📚','All decks', CARDS.length+' cards · '+MCQ.length+' MCQ') +
    DECKS.map(d => deckBtn(d.id, d.emoji||'📘', d.title, (d.cards||[]).length+' cards · '+(d.mcq||[]).length+' MCQ')).join('') +
    '<button class="btn sec" onclick="this.closest(\'.modal\').remove();go(\'decks\')">➕ Add / manage decks</button></div>';
  document.body.appendChild(m);
}
function deckBtn(id, em, title, sub){
  return `<button class="deck ${S.cur===id?'cur':''}" onclick="pickDeck('${id}')"><span class="em">${esc(em)}</span><span style="flex:1"><span class="t">${esc(title)}</span><br><span class="s">${esc(sub)}</span></span></button>`;
}
function pickDeck(id){ S.cur = id; save(); cardSel.topics=null; mcqSel.topics=null; document.querySelectorAll('.modal').forEach(m=>m.remove()); render(); }

/* ---------- stats ---------- */
function deckStats(ids){
  const cs = CARDS.filter(c => ids.has(c.deck)), qs = MCQ.filter(q => ids.has(q.deck));
  let mast=0, seen=0, star=0; cs.forEach(c => { const s=cst(c.id); if (s.b>=2) mast++; if (s.n>0) seen++; if (s.s) star++; });
  let r=0, w=0, att=0; qs.forEach(q => { const s=mst(q.id); r+=s.r; w+=s.w; if (s.r+s.w>0) att++; });
  return {cards:cs.length, mast, seen, star, mcq:qs.length, att, acc: pct(r, r+w), tries:r+w};
}

/* ---------- HOME ---------- */
function vHome(){
  const ids = curIds(), st = deckStats(ids);
  const hist = S.hist.filter(h => S.cur==='all' || h.deck===S.cur);
  const best = hist.filter(h=>h.mode==='exam').reduce((m,h)=>Math.max(m,pct(h.score,h.total)),0);
  const due = CARDS.filter(c => ids.has(c.deck) && cst(c.id).b < 2).length;
  const wrong = MCQ.filter(q => ids.has(q.deck) && mst(q.id).l === false).length;
  return installBox() + `
  <div class="hero"><b>${S.cur==='all'?'Ready to ace ENT?':esc(deckOf(S.cur).title)}</b><br>
   <span style="opacity:.9;font-size:14px">${st.cards} flashcards · ${st.mcq} clinical MCQs${S.cur==='all'?' · '+DECKS.length+' decks':''}</span></div>
  <div class="tiles">
    <div class="tile"><div class="v">${pct(st.mast,st.cards)}%</div><div class="l">cards mastered (${st.mast}/${st.cards})</div></div>
    <div class="tile"><div class="v">${st.seen}</div><div class="l">cards seen</div></div>
    <div class="tile"><div class="v">${st.tries?st.acc+'%':'–'}</div><div class="l">MCQ accuracy (${st.att}/${st.mcq} tried)</div></div>
    <div class="tile"><div class="v">${best?best+'%':'–'}</div><div class="l">best mock exam</div></div>
  </div>
  <div class="grid2" style="margin-bottom:10px">
    <button class="btn" onclick="quickCards()">🗂️ Study ${Math.min(20,due)||''} cards</button>
    <button class="btn" onclick="quickQuiz(10,'study')">✅ Quick 10 MCQ</button>
    <button class="btn sec" onclick="openLearn()">📘 Learn a topic</button>
    <button class="btn sec" onclick="quickWrong()" ${wrong?'':'disabled'}>🔁 Redo ${wrong} wrong MCQ</button>

function openLearn(){
  const m = document.createElement('div'); m.className='modal'; m.onclick = e => { if (e.target===m) m.remove(); };
  m.innerHTML = '<div class="sheet"><h2>📘 Learn a topic</h2><p class="muted small">Go through every card of one topic in teaching order, then test yourself on that topic\'s MCQs.</p>' +
    curDecks().map(d => `<h3>${esc(d.emoji||'')} ${esc(d.title)}</h3>` + Object.keys(d.topics).map(t => {
      const cs = CARDS.filter(c=>c.deck===d.id&&c.t===t), qs = MCQ.filter(q=>q.deck===d.id&&q.t===t), mm = cs.filter(c=>cst(c.id).b>=2).length;
      return `<button class="lt" onclick="learnTopic('${d.id}','${t}')"><span style="flex:1;min-width:0"><b>${esc(d.topics[t])}</b>${starsOf(tKey(d.id,t))}<br><span class="small muted">${cs.length} cards · ${qs.length} MCQ · ${pct(mm,cs.length)}% mastered</span><span class="bar"><i style="width:${pct(mm,cs.length)}%"></i></span></span><span>▶</span></button>`; }).join('')).join('') + '</div>';

}
function learnTopic(deck, t){
  document.querySelectorAll('.modal').forEach(m=>m.remove());
  const pool = CARDS.filter(c=>c.deck===deck&&c.t===t);
  if (!pool.length){ toast('No cards in this topic'); return; }
  SESSION = {q: pool.map(c=>c.id), i:0, flip:false, again:0, got:0, total:pool.length, topic:tKey(deck,t), seen:{}};
  go('session');
}
function topicQuiz(k){
  const ids = MCQ.filter(q=>tKey(q.deck,q.t)===k).map(q=>q.id);
  mcqSel.mode = 'study'; startQuiz(shuffle(ids));
}
function quickCards(){ cardSel = {topics:null, mode:'due', shuffle:true, n:20}; startCards(); }
function quickQuiz(n, mode){ mcqSel = {topics:null, pool:'all', n, mode}; startQuiz(); }
function quickWrong(){ mcqSel = {topics:null, pool:'wrong', n:999, mode:'study'}; startQuiz(); }

/* ---------- FLASHCARDS setup ---------- */
function selTopics(sel){ const all = topicsOf(curDecks()); return sel && sel.length ? sel.filter(t=>all.includes(t)) : all; }
function vCards(){
  const decks = curDecks(), all = topicsOf(decks), on = new Set(selTopics(cardSel.topics));
  const pool = cardPool();

  <h3>Topics <button class="chip" style="float:right;margin-top:-6px" onclick="cardSel.topics=null;render()">all</button></h3>
