<style>
:root{
  --bg:#edf7f8; --card:#ffffff; --ink:#0b2a2e; --muted:#557276; --line:#d1e6e9;
  --p:#00838f; --p2:#0097a7; --p3:#4dd0e1; --pl:#e0f5f7; --pd:#005662;
  --ok:#1b9e5a; --okl:#e3f6ec; --bad:#d64545; --badl:#fdecec; --warn:#e8a317; --star:#f5b301;
  --shadow:0 4px 18px rgba(0,131,143,.12); --r:16px;
}
[data-theme=dark]{
  --bg:#05191c; --card:#0c272b; --ink:#e2f3f5; --muted:#8db2b7; --line:#1a3f44;
  --p:#26c6da; --p2:#4dd0e1; --p3:#80deea; --pl:#103a40; --pd:#b2ebf2;
  --ok:#3ccf86; --okl:#11372a; --bad:#ff7070; --badl:#3d1a1f; --shadow:0 4px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--pd),var(--p) 55%,var(--p2));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 12px rgba(0,86,98,.3)}
[data-theme=dark] header{background:linear-gradient(135deg,#00363d,#005662 60%,#00838f)}
header h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.2px;flex:0 0 auto}
header .pill{flex:1;min-width:0;background:rgba(255,255,255,.18);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;color:#fff}
header .ib{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:18px;flex:0 0 auto}
main{max-width:720px;margin:0 auto;padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;font-size:11.5px;color:var(--muted);gap:1px}
nav button .i{font-size:21px;line-height:1.1}
nav button.on{color:var(--p);font-weight:700}
h2{font-size:20px;margin:6px 0 10px}
h3{font-size:16px;margin:16px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-size:12.5px}
.box{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero b{font-size:18px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.tile .v{font-size:24px;font-weight:800;color:var(--p)}
.tile .l{font-size:12.5px;color:var(--muted)}
.btn{display:block;width:100%;padding:13px 14px;border-radius:14px;background:var(--p);color:#fff;font-weight:700;text-align:center;box-shadow:0 3px 10px rgba(0,131,143,.25)}
.btn.sec{background:var(--pl);color:var(--p);box-shadow:none}
.btn.ghost{background:transparent;color:var(--p);border:1.5px solid var(--p);box-shadow:none}
.btn.bad{background:var(--bad)}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px}
.row>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.deck{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:13px;margin-bottom:10px;width:100%;text-align:left;border:2px solid transparent}
.deck.cur{border-color:var(--p)}
.deck .em{font-size:28px;width:46px;height:46px;border-radius:12px;background:var(--pl);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.deck .t{font-weight:700}
.deck .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.bar{height:7px;background:var(--pl);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p3));border-radius:9px}
.bar.red i{background:var(--bad)} .bar.amb i{background:var(--warn)} .bar.grn i{background:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:7px 11px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-size:13.5px}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.chip small{opacity:.75}
.seg{display:flex;background:var(--pl);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;padding:8px 6px;border-radius:10px;font-size:13.5px;color:var(--p);min-width:60px}
.seg button.on{background:var(--card);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.muted{color:var(--muted)} .small{font-size:13px}
.tip{background:var(--pl);border-left:4px solid var(--p);border-radius:12px;padding:11px 13px;font-size:14px;margin-bottom:12px}
.prog{height:6px;background:var(--pl);border-radius:6px;overflow:hidden;margin:4px 0 12px}
.prog i{display:block;height:100%;background:var(--p)}
/* flip card */
.scene{perspective:1400px;margin-bottom:12px}
.flip{display:grid;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;cursor:pointer;min-height:300px}
.flip.on{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;border-top:5px solid var(--p)}
.face.back{transform:rotateY(180deg);border-top-color:var(--ok)}
.face .tp{font-size:12px;color:var(--p);font-weight:700;text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between;gap:8px}
.face .q{font-size:20px;font-weight:700;margin:auto 0;padding:18px 0;text-align:center}
.face .a{font-size:16.5px;margin:12px 0;flex:1}
.face .hook{background:var(--pl);border-radius:12px;padding:9px 11px;font-size:14px;margin-top:6px}
.face .src{font-size:11.5px;color:var(--muted);margin-top:10px}
.face .hint{font-size:12.5px;color:var(--muted);text-align:center}
.pips{display:inline-flex;gap:3px}.pips i{width:8px;height:8px;border-radius:50%;background:var(--line)}.pips i.f{background:var(--ok)}
.act{display:grid;grid-template-columns:1fr 64px 1fr;gap:10px}
.act .btn{padding:14px 6px}
.starb{border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:24px;color:var(--muted)}
.starb.on{color:var(--star)}
/* mcq */
.stem{font-size:16px;margin-bottom:12px}
.stem .ql{display:block;font-weight:800;margin-top:10px;color:var(--p)}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:9px;font-size:15.5px}
.opt .k{flex:0 0 28px;height:28px;border-radius:50%;background:var(--pl);color:var(--p);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt.sel{border-color:var(--p);background:var(--pl)}
.opt.sel .k{background:var(--p);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okl)} .opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badl)} .opt.wrong .k{background:var(--bad);color:#fff}
.opt .why{display:block;font-size:13.5px;color:var(--muted);margin-top:4px}
.verdict{border-radius:14px;padding:12px 14px;margin:6px 0 12px;font-size:15px}
.verdict.ok{background:var(--okl);border-left:5px solid var(--ok)} .verdict.bad{background:var(--badl);border-left:5px solid var(--bad)}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.dots button{width:32px;height:32px;border-radius:9px;background:var(--card);border:1.5px solid var(--line);font-size:12.5px}
.dots button.a{background:var(--pl);border-color:var(--p3)} .dots button.c{border-color:var(--p);border-width:2.5px;font-weight:800}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--p)}
.score{font-size:46px;font-weight:900;color:var(--p);text-align:center;line-height:1.1}
details{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-bottom:9px;overflow:hidden}
summary{padding:12px 14px;cursor:pointer;list-style:none;font-size:15px}
summary::-webkit-details-marker{display:none}
details .in{padding:0 14px 14px;font-size:15px}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:7px;background:var(--pl);color:var(--p);font-weight:700;margin-right:5px}
.tag.g{background:var(--okl);color:var(--ok)} .tag.r{background:var(--badl);color:var(--bad)}
.trow{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.modal{position:fixed;inset:0;background:rgba(2,28,32,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;border-radius:22px 22px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90%;text-align:center}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
label.lb{font-size:13px;color:var(--muted);display:block;margin:10px 0 4px}
code{background:var(--pl);padding:1px 5px;border-radius:5px;font-size:13px}
@media (min-width:900px){
  main{max-width:860px;padding:22px}
  nav{justify-content:center} nav button{max-width:150px}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .face .q{font-size:22px} .flip{min-height:340px}
}
.prov{display:inline-block;font-size:11.5px;color:var(--p);background:var(--pl);border-radius:7px;padding:2px 7px;margin-top:6px;overflow-wrap:anywhere}
.face .src{overflow-wrap:anywhere}
details.grp{box-shadow:none;background:transparent;margin-bottom:6px}
details.grp>summary{padding:8px 4px;font-weight:700;font-size:14.5px}
details.grp>.chips{padding:0 2px 8px}
.lt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:7px;box-shadow:var(--shadow)}
.tstar{color:var(--star);font-size:15px;letter-spacing:1px;white-space:nowrap;margin-left:4px}.tstar .off{color:var(--line)}
[data-theme=dark] .tstar .off{color:#3a5a54}
pre{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;max-height:220px;overflow:auto}
</style>

<script>
"use strict";
const BUILTIN = [{"id":"fnp","title":"Facial Nerve Palsy","short":"Facial n.","emoji":"😐","source":"Facial Nerve Palsy (2).pdf","topics":{"ANAT":"Anatomy: course, segments, branches & functions","LOC":"Examination: UMN vs LMN, lesion localisation & House-Brackmann grading","BELL":"Bell's palsy","MRS":"Melkersson-Rosenthal syndrome","RHS":"Ramsay Hunt syndrome (herpes zoster oticus)","OM":"Otitis media (AOM & COM / cholesteatoma)","MOE":"Malignant (necrotising) otitis externa","TUM":"Neoplasms: facial neuroma, parotid & temporal bone cancer","TRA":"Temporal bone fractures","INV":"Electrophysiology & topodiagnostic tests","SURG":"Surgery, iatrogenic & neonatal facial palsy"},"cards":[{"t":"ANAT","q":"What are the three divisions of the facial nerve's course, and where does each begin and end?","a":"• **Intracranial**: motor nucleus in the **lower pons** → internal acoustic meatus (IAM)\n• **Intratemporal**: IAM → **stylomastoid foramen** (within the bony Fallopian canal)\n• **Extracranial**: stylomastoid foramen → terminal branches in the face","m":"Brain → bone → face: the level of the lesion points to the cause (stroke/CPA tumour, ear disease/fracture, parotid).","r":"Slide p5"},{"t":"ANAT","q":"Describe the intracranial course of the facial nerve. What is the facial colliculus?","a":"• Motor fibres arise from the **facial motor nucleus** in the pontine tegmentum (lower pons)\n• They run dorsally and **loop around the abducens (VI) nucleus**, raising the **facial colliculus** in the floor of the 4th ventricle\n• Joined by the **nervus intermedius** (taste, secretomotor and sensory fibres)\n• Exit the brainstem at the **pontomedullary junction** → cerebellopontine angle → IAM with VIII","m":"Colliculus = VII hugging VI: a small pontine lesion here gives ipsilateral VI + LMN VII palsy.","r":"Slide p6"},{"t":"ANAT","q":"What are the functional components of the facial nerve, with their nuclei and targets?","a":"• **SVE (motor)** – facial motor nucleus → muscles of facial expression, **posterior belly of digastric**, **stylohyoid**, stapedius\n• **GVE (parasympathetic)** – lacrimal / superior salivatory nucleus → **lacrimal**, nasal and palatal glands (via GSPN) and **submandibular + sublingual** glands (via chorda tympani)\n• **SVA (taste)** – nucleus of tractus solitarius ← **anterior ⅔ of tongue** (except circumvallate papillae = IX)\n• **GSA (sensory)** – spinal trigeminal nucleus ← skin of the concha and around the ear\n• The **parotid** is supplied by **IX** (otic ganglion), not VII","m":"Face, Ear, Taste, Tears (and spit): the jobs of VII.","r":"Slide p7"},{"t":"ANAT","q":"Name the four intratemporal segments of the facial nerve with their approximate lengths.","a":"• **Meatal** (8-10 mm) – within the internal acoustic meatus\n• **Labyrinthine** (~4 mm) – fundus of IAM → **geniculate ganglion**, where the nerve turns posteriorly (first genu)\n• **Tympanic / horizontal** (~11 mm) – geniculate ganglion → just above the pyramidal eminence\n• **Mastoid / vertical** (~13 mm) – pyramid (second genu) → **stylomastoid foramen**","m":"M-L-T-M, about 9-4-11-13 mm: the shortest (labyrinthine) is also the narrowest and most vulnerable.","r":"Slides p8-10"},{"t":"ANAT","q":"Why is the labyrinthine segment the classic site of compression in Bell's palsy?","a":"• It is the **narrowest** part of the Fallopian canal – the **meatal foramen** is only ~**0.68 mm** wide\n• The nerve nearly fills the canal here, so slight oedema causes compression\n• It is a **vascular watershed** without a good anastomotic arterial arcade → easily ischaemic\n• Oedema → venous congestion → ischaemia → more oedema (vicious cycle)\n• Hence decompression for Bell's targets this segment via the **middle cranial fossa**","m":"A tight collar on a swollen neck: the tightest point strangles first.","r":"Lecturer pearl"},{"t":"ANAT","q":"What are the relations of the tympanic segment, and why does it matter surgically?","a":"• Runs on the medial wall of the middle ear **above the oval window** (stapes) and **below the lateral semicircular canal**\n• Commonest site of **natural bony dehiscence** → nerve exposed to middle-ear infection (AOM palsy) and cholesteatoma\n• Commonest site of **iatrogenic injury** in middle-ear and mastoid surgery\n• The lateral SCC is the surgeon's landmark for finding it","m":"A sandwich: lateral SCC on top, oval window below, the nerve is the filling.","r":"Slide p8"},{"t":"ANAT","q":"Describe the mastoid segment of the facial nerve and the branches it gives off.","a":"• Turns downward at the **second genu** (near the pyramid) and descends vertically to the **stylomastoid foramen** (~13 mm)\n• **Nerve to stapedius** arises at its upper end, near the pyramid\n• **Chorda tympani** arises from the **middle of the vertical segment**, crosses medial to the tympanic membrane and joins the lingual nerve\n• At risk when drilling the posterior canal wall / facial recess in mastoidectomy","m":"Vertical drop: stapedius at the top, chorda in the middle, foramen at the bottom.","r":"Slides p8-12"},{"t":"ANAT","q":"List the intratemporal branches of the facial nerve in order from proximal to distal.","a":"• **Greater (superficial) petrosal nerve** – from the geniculate ganglion → secretomotor to **lacrimal**, nasal and palatal glands\n• **Nerve to stapedius** – damps loud sound\n• **Chorda tympani** – taste to the anterior ⅔ of the tongue + secretomotor to **submandibular and sublingual** glands\n• A small **sensory communicating branch** to the concha, posterior EAC and outer tympanic membrane","m":"Tears → Ears → Taste: GSPN, stapedius, chorda – the basis of topodiagnosis.","r":"Slide p12"},{"t":"ANAT","q":"Which branches does the facial nerve give between the stylomastoid foramen and the parotid gland?","a":"• **Posterior auricular nerve** – auricular muscles and **occipital belly of occipitofrontalis**\n• **Nerve to the posterior belly of digastric**\n• **Nerve to stylohyoid**\n• The trunk then enters the **parotid** and divides at the pes anserinus","m":"Behind the ear first, then the two neck muscles: digastric and stylohyoid.","r":"Slide p12"},{"t":"ANAT","q":"How does the facial nerve divide within the parotid, and what are its five terminal branches?","a":"• Divides into an upper **temporofacial** and a lower **cervicofacial** division\n• Temporofacial: **temporal**, **zygomatic**\n• Cervicofacial: **buccal**, **marginal mandibular**, **cervical**\n• The nerve plane separates the superficial and deep lobes – the dissection plane of a superficial parotidectomy","m":"Two Zebras Buggered My Cat – Temporal, Zygomatic, Buccal, Marginal mandibular, Cervical (top to bottom).","r":"Slide p11"},{"t":"ANAT","q":"Which skin area does the facial nerve supply, and why is this clinically useful?","a":"• General sensory fibres to the **concha**, retroauricular groove, **posterior EAC** and outer surface of the tympanic membrane\n• Explains why **Ramsay Hunt vesicles** appear in the concha / EAC (VZV in the geniculate ganglion)\n• Reduced sensation of the posterior meatal wall (**Hitselberger sign**) can be an early sign of a CPA tumour such as vestibular schwannoma","m":"The Ramsay Hunt rash maps the sensory territory of VII.","r":"Slides p7-12"},{"t":"ANAT","q":"How do you test each terminal branch of the facial nerve at the bedside?","a":"• **Temporal** – raise the eyebrows (frontalis)\n• **Zygomatic** – screw the eyes shut tightly (orbicularis oculi)\n• **Buccal** – puff out the cheeks, show the teeth (buccinator, orbicularis oris)\n• **Marginal mandibular** – pout / evert the lower lip\n• **Cervical** – grimace and tense the neck (platysma)","m":"Top to bottom: Brows, Eyes, Cheeks, Lips, Neck.","r":"Lecturer pearl"},{"t":"LOC","q":"Why does an upper motor neuron (UMN) facial palsy spare the forehead?","a":"• The part of the facial nucleus supplying the **upper face** receives **bilateral** corticobulbar input\n• The part supplying the **lower face** receives mainly **contralateral** input\n• So a unilateral cortical / internal capsule lesion (stroke, tumour) weakens only the **contralateral lower face**\n• An LMN lesion (nucleus or nerve) paralyses the **whole ipsilateral half**, forehead included","m":"The forehead has two bosses: lose one and the other still runs it.","r":"Lecturer pearl"},{"t":"LOC","q":"Apart from forehead sparing, which features help distinguish UMN from LMN facial palsy?","a":"• UMN: **contralateral** lower face; emotional smiling often preserved despite a weak voluntary smile (**emotional-voluntary dissociation**); usually with hemiparesis or dysphasia\n• UMN: eye closure, taste, tears and stapedial reflex are **normal**\n• LMN: **ipsilateral** whole face, incomplete eye closure, visible **Bell's phenomenon**, ± hyperacusis, taste loss, dry eye","m":"The stroke patient smiles at a joke but not on command.","r":"Lecturer pearl"},{"t":"LOC","q":"What is Bell's phenomenon and what does its presence or absence tell you?","a":"• On attempted eye closure the eyeball **rolls upward and outward**, visible because the lids fail to close\n• A normal protective reflex unmasked by **LMN** orbicularis oculi weakness (needs an intact III)\n• **Present** – the cornea is partly protected under the upper lid\n• **Absent** (a minority of people) – much higher risk of **exposure keratitis** → aggressive eye care, early lid surgery","m":"The eye rolls up to hide behind a lid that will not shut.","r":"Slide p27"},{"t":"LOC","q":"Lesion at the stylomastoid foramen (level A): what are the features?","a":"• Loss of **all muscles of facial expression** on that side (LMN, forehead included)\n• Mouth **deviates to the normal side**; dribbling; cannot close the mouth or eye\n• **Food collects in the vestibule** of the mouth (buccinator paralysis)\n• Flattened expression lines and nasolabial fold\n• **Taste, salivation, tears and stapedial reflex are all normal** – those branches left earlier","m":"Level A = motor only: every other branch already got off the train.","r":"Slide p16"},{"t":"LOC","q":"Lesion above the origin of the chorda tympani (level B): what is added to level A?","a":"• All features of level A, plus\n• **Loss of taste** on the anterior ⅔ of the tongue\n• **Reduced submandibular salivation**\n• Tear production and stapedial reflex remain **normal**\n• Tests: **taste / electrogustometry** and **submandibular salivary flow**","m":"B = bland: taste and spit are lost.","r":"Slide p16"},{"t":"LOC","q":"Lesion above the nerve to stapedius (level C): what is added to level B?","a":"• All features of level B, plus\n• **Hyperacusis** – loud sounds are uncomfortable because the stapedius no longer damps the ossicles\n• **Absent stapedial (acoustic) reflex** on the affected side\n• Lacrimation is still **normal**","m":"C = clatter: noise intolerance.","r":"Slide p17"},{"t":"LOC","q":"Lesion at or above the geniculate ganglion (level D): what is added, and which test proves it?","a":"• All features of level C (i.e. A + B + C), plus\n• **Reduced lacrimation** – the greater petrosal nerve leaves at the geniculate ganglion\n• Proven by an abnormal **Schirmer test** on the affected side\n• Classic causes: Ramsay Hunt, facial schwannoma (geniculate), Bell's (labyrinthine segment), temporal bone fracture\n• The signs are cumulative: each higher level adds one branch to everything below it","m":"D = dry eye: the GSPN has been cut off.","r":"Slide p17"},{"t":"LOC","q":"Lesion at the cerebellopontine angle (level E): how does it present?","a":"• All features of level D: motor, taste, salivation, stapedius and tears may all be affected\n• Plus **VIII involvement** – unilateral **SNHL**, tinnitus, imbalance\n• Large lesions add **V** (reduced corneal reflex) and cerebellar signs\n• Classic causes: **vestibular schwannoma**, meningioma; facial weakness is usually **late and mild** because VII tolerates slow stretching","m":"E = Eighth too: CPA = VII + VIII ± V.","r":"Slide p18"},{"t":"LOC","q":"An LMN facial palsy has loss of taste and hyperacusis but a normal Schirmer test. Where is the lesion?","a":"• Normal tears → lesion is **distal to the geniculate ganglion** (GSPN spared)\n• Hyperacusis / absent stapedial reflex → lesion **proximal to the nerve to stapedius**\n• So the lesion lies between them: the **tympanic segment** (or very top of the mastoid segment)\n• Typical causes: cholesteatoma, AOM with a dehiscent canal, iatrogenic injury","m":"The lesion sits between the last branch that works and the first branch that fails.","r":"Slides p16-17"},{"t":"LOC","q":"Why do patients with LMN facial palsy often have a watery eye even though tear secretion may be reduced?","a":"• **Epiphora** is due to failed **drainage**, not overproduction\n• Orbicularis oculi paralysis → the **lower lid sags** (paralytic ectropion) and the punctum falls away from the globe\n• The blink-driven **lacrimal pump** fails, so tears spill over the cheek\n• Exposure also causes reflex tearing; a **Schirmer test** is needed to judge true secretion","m":"A leaking gutter, not an overflowing tap.","r":"Slide p26"},{"t":"LOC","q":"Outline the House-Brackmann (HB) grading of facial nerve function.","a":"• **I** Normal\n• **II** Mild – slight weakness on close inspection; **complete eye closure with minimal effort**\n• **III** Moderate – obvious but not disfiguring asymmetry; slight-moderate forehead movement; **complete eye closure with effort**\n• **IV** Moderately severe – disfiguring asymmetry; **no forehead movement; incomplete eye closure**\n• **V** Severe – barely perceptible movement\n• **VI** Total paralysis – no movement","m":"Normal, Mild, Moderate, Moderately severe, Severe, Total – severity climbs with the number.","r":"Lecturer pearl"},{"t":"LOC","q":"Which single finding separates House-Brackmann grade III from grade IV, and why does it matter?","a":"• **Eye closure**: grade III closes completely (with effort); grade IV **cannot close completely**\n• Grade IV also has **no forehead movement**\n• Incomplete closure = risk of **exposure keratitis** → intensive eye protection\n• HB III is also the usual best result after nerve grafting or hypoglossal-facial transfer\n• Sunnybrook is an alternative, more detailed regional scale","m":"Three can shut its eye; four cannot.","r":"Lecturer pearl"},{"t":"LOC","q":"Name important causes of bilateral LMN facial palsy.","a":"• **Guillain-Barré syndrome** (commonest acute bilateral cause)\n• **Lyme disease** (Borrelia)\n• **Sarcoidosis** – **Heerfordt syndrome**: uveitis, parotid swelling, fever, facial palsy\n• **Leukaemia / lymphoma**, basal meningitis, HIV\n• **Möbius syndrome** (congenital VI + VII), bilateral temporal bone fractures\n• Bilateral palsy is **not** labelled Bell's without investigation","m":"Bilateral = Big causes: GBS, Lyme, Sarcoid, Leukaemia, Möbius.","r":"Lecturer pearl"},{"t":"LOC","q":"How can a brainstem stroke cause a lower motor neuron pattern of facial palsy?","a":"• A **pontine** lesion damages the facial **nucleus or its fascicle** – that is the lower motor neuron itself\n• So the **forehead is involved** despite a central cause\n• Clues: an **ipsilateral VI palsy** (the fascicle loops around the VI nucleus) ± **contralateral hemiparesis** (Millard-Gubler syndrome)\n• Lesson: forehead involvement means LMN, not necessarily peripheral – look for other brainstem signs","m":"VII + VI on one side, weak limbs on the other = pons.","r":"Lecturer pearl"},{"t":"BELL","q":"How are the causes of facial nerve paralysis classified?","a":"• **Idiopathic**: Bell's palsy, Melkersson-Rosenthal syndrome\n• **Infective**: Ramsay Hunt syndrome, acute and chronic otitis media, malignant otitis externa\n• **Neoplastic**: facial nerve schwannoma, parotid malignancy, temporal bone carcinoma\n• **Traumatic**: temporal bone fracture; iatrogenic (ear, mastoid, parotid surgery); birth (forceps)","m":"I-I-N-T: Idiopathic, Infection, Neoplasm, Trauma.","r":"Slide p22"},{"t":"BELL","q":"Define Bell's palsy. How common is it?","a":"• **Idiopathic, acute-onset, unilateral LMN** (peripheral) facial palsy, developing over **< 72 hours**\n• The **commonest** cause of facial palsy: **60-75%** of cases\n• Both sexes affected equally\n• Always a **diagnosis of exclusion**","m":"Bell's = a bolt from the blue: sudden, one-sided, no other cause found.","r":"Slide p23"},{"t":"BELL","q":"What are the risk factors for Bell's palsy?","a":"• **Increasing age**\n• **Diabetes** (microangiopathy of the vasa nervorum)\n• **Pregnancy** – especially the **third trimester** and first postpartum week (fluid retention); also pre-eclampsia\n• **Positive family history** in 6-8% (narrow Fallopian canal)\n• Recent viral upper respiratory infection","m":"3 Ps: Pregnancy, Pancreas (diabetes), Pensioners.","r":"Slide p23"},{"t":"BELL","q":"Which aetiological theories have been proposed for Bell's palsy?","a":"• **Viral** – reactivation of **herpes simplex (HSV-1)** is most favoured; also VZV, EBV\n• **Vascular ischaemia** – primary (cold, emotional stress) or secondary: capillary leak → exudation and oedema → compression of the nerve's microcirculation\n• **Hereditary** – congenitally **narrow Fallopian canal**\n• **Autoimmune** – T-lymphocyte changes","m":"The virus lights the fire; the narrow canal traps the swelling.","r":"Slide p25"},{"t":"BELL","q":"Explain the pathophysiology of Bell's palsy step by step.","a":"• Latent **HSV-1** in the **geniculate ganglion** reactivates\n• Inflammation → **oedema** of the nerve inside its rigid bony canal\n• Worst at the **labyrinthine segment / meatal foramen** (narrowest, ~0.68 mm)\n• Compression → venous congestion → **ischaemia** → more oedema\n• Most have conduction block only (neurapraxia); severe cases develop **axonal degeneration** → slow, incomplete recovery with synkinesis","m":"Swelling in a bony tunnel: the nerve is strangled where the tunnel is tightest.","r":"Lecturer pearl"},{"t":"BELL","q":"What are the clinical features of Bell's palsy?","a":"• **Sudden** unilateral facial asymmetry, often preceded by **postauricular pain / otalgia**\n• Loss of forehead wrinkles, **inability to close the eye**, visible **Bell's phenomenon**\n• Flattened nasolabial fold, **saliva dribbling** from the angle of the mouth\n• **Epiphora**, **hyperacusis** (stapedius paralysis), **altered taste** (chorda tympani)\n• Palsy may be **complete or incomplete**; recurs in **3-10%**","m":"The whole half-face, forehead included, overnight.","r":"Slide p26"},{"t":"BELL","q":"What is the prognosis of Bell's palsy, and which features predict a good outcome?","a":"• **85-90%** recover fully, most within weeks to 3 months\n• Good: **incomplete palsy** at presentation; recovery beginning **within 3 weeks**; younger age; steroids within 72 h\n• Poor: **complete palsy**, age > 60, diabetes, hypertension, pregnancy, severe pain, **> 90% degeneration on ENoG**\n• Sequelae of poor recovery: **synkinesis**, contracture, **crocodile tears**","m":"Partial and recovering by 3 weeks = a good outcome.","r":"Slide p23"},{"t":"BELL","q":"Bell's palsy is a diagnosis of exclusion. What must the history and examination look for?","a":"• History: speed of onset (sudden vs **gradual**), previous episodes, ear pain or discharge, vesicles, trauma, recent surgery, hearing loss, vertigo\n• Examine and grade the **whole facial nerve** (House-Brackmann)\n• **Otoscopy**: vesicles, AOM, cholesteatoma, granulations, mass\n• **Parotid and neck** palpation: mass, nodes\n• **Other cranial nerves** and limbs: stroke, CPA lesion, GBS","m":"Look in the ear, feel the parotid, test the other nerves – then call it Bell's.","r":"Slide p28"},{"t":"BELL","q":"Which investigations are needed for a typical Bell's palsy?","a":"• **None routinely** – no routine bloods or imaging for a typical acute unilateral palsy (AAO-HNS 2013)\n• Targeted only: **blood glucose** (known or suspected diabetes, before steroids); Lyme serology if exposed\n• **Electrodiagnosis (ENoG)** only for **complete** palsy, between day 3 and 14-21, if decompression is being considered\n• Note: slide lists routine FBC/ESR/smear and a **nerve excitability test done daily**; correct is that these are not routine, and serial NET is a historical test largely replaced by ENoG","m":"Typical Bell's: diagnose clinically, treat fast, scan only if atypical.","r":"Slide p28"},{"t":"BELL","q":"Which red flags should make you doubt Bell's palsy and arrange imaging (gadolinium MRI / HRCT)?","a":"• **Gradual** progression over **> 3 weeks**, or **twitching before weakness**\n• **No recovery by 3-4 months**\n• **Recurrent ipsilateral** palsy\n• **Other cranial nerve** deficits, hearing loss, vertigo\n• **Parotid or neck mass**, ear discharge, cholesteatoma, **vesicles**, severe pain\n• Bilateral palsy; previous skin cancer of the face or scalp (perineural spread)","m":"Slow, twitchy, recurrent or not recovering = tumour until proven otherwise.","r":"Lecturer pearl"},{"t":"BELL","q":"What is the first-line drug treatment for Bell's palsy, and when must it be started?","a":"• **Oral prednisolone** started **within 72 hours** of onset (age 16 and over)\n• Regimens: **50 mg once daily for 10 days**, or **60 mg daily for 5 days then taper** by 10 mg/day\n• Increases complete recovery and reduces synkinesis\n• Check glucose and BP in diabetics; in pregnancy discuss with obstetrics","m":"72 hours to start steroids – the window shuts on day 3.","r":"Slide p28"},{"t":"BELL","q":"What is the role of antiviral drugs in Bell's palsy?","a":"• **Antiviral alone is not recommended** – no proven benefit over placebo\n• May be **added to prednisolone** within 72 h in **severe / complete** palsy (small possible benefit)\n• Typical regimen: **valaciclovir 1 g three times daily for 7 days** (or aciclovir)\n• If vesicles or severe pain suggest Ramsay Hunt syndrome, antivirals become **essential**","m":"The steroid is the engine; the antiviral is an optional passenger.","r":"Slide p28"},{"t":"BELL","q":"How do you protect the eye in a patient with facial palsy and incomplete eye closure?","a":"• **Lubricant eye drops** (artificial tears) frequently by day\n• **Lubricating ointment** and **taping the lid shut** (or a moisture chamber) at night\n• **Sunglasses** / wrap-around glasses outdoors\n• Urgent **ophthalmology** review if eye pain, redness or blurred vision (exposure keratitis)\n• Persistent lagophthalmos: **gold or platinum upper-lid weight**, or tarsorrhaphy","m":"Drops by day, ointment and tape by night.","r":"Slide p28"},{"t":"BELL","q":"When, if ever, is surgical decompression offered for Bell's palsy?","a":"• Rarely – it is **controversial**; steroids are the mainstay\n• Considered only for **complete palsy** with **> 90% degeneration on ENoG within 14 days** of onset and **no voluntary motor units on EMG**\n• Approach: **middle cranial fossa** to decompress the **labyrinthine segment and meatal foramen** (hearing preserved)\n• Facial physiotherapy / retraining supports recovery\n• Note: slide lists decompression as a standard surgical option; correct is that it is exceptional and must be done early","m":"90% within 14 days via the middle fossa: 90-14-MCF.","r":"Slide p28"},{"t":"MRS","q":"What is Melkersson-Rosenthal syndrome and who does it affect?","a":"• Rare neuro-mucocutaneous disorder of **unknown** cause\n• **Classic triad**: recurrent/persistent **orofacial oedema**, recurrent **LMN facial palsy**, **fissured tongue** (lingua plicata)\n• Prevalence ~**0.08%**; **female : male 2 : 1**; usually **25-40 years**","m":"Swollen lip, slack face, furrowed tongue.","r":"Slides p29-30"},{"t":"MRS","q":"How often is the full Melkersson-Rosenthal triad seen, and what is cheilitis granulomatosa?","a":"• Only **8-25%** have the **complete triad**; most have 1-2 features\n• Features may appear together or **years apart**\n• The palsy is typically **recurrent** and may **alternate sides** – think MRS in recurrent palsy with lip swelling\n• **Cheilitis granulomatosa** (Miescher) = the **monosymptomatic** form: granulomatous lip swelling alone","m":"Recurrent palsy plus a puffy lip – ask to see the tongue.","r":"Slide p30"},{"t":"MRS","q":"How is Melkersson-Rosenthal syndrome diagnosed?","a":"• Essentially a **clinical** diagnosis\n• **Lip biopsy** supports it: **non-caseating granulomas** with lymphoedema\n• Exclude mimics with similar histology: **Crohn's disease** (orofacial granulomatosis), **sarcoidosis**, TB and other infections","m":"Granulomas in the lip: think Crohn's and sarcoid before calling it MRS.","r":"Slide p31"},{"t":"MRS","q":"How is Melkersson-Rosenthal syndrome managed?","a":"• No definitive cure; symptoms may **remit spontaneously** and **flare** again\n• Swelling: **intralesional or systemic corticosteroids**, antibiotics, antihistamines, NSAIDs, immunosuppressants (methotrexate), **TNF-α inhibitors**\n• Palsy episodes are treated like Bell's; **facial nerve decompression** is considered for frequent recurrences\n• **Multidisciplinary**: dermatology, gastroenterology, immunology, ophthalmology","m":"No cure – treat each flare and involve the team.","r":"Slide p31"},{"t":"RHS","q":"What is Ramsay Hunt syndrome and who is affected?","a":"• **Herpes zoster oticus**: reactivation of latent **varicella-zoster virus (VZV)**\n• **Herpetic vesicles** of the concha, EAC or pinna + **ipsilateral LMN facial palsy**\n• About 5 per 100,000; men and women equally\n• Anyone who has had chickenpox; mainly **adults over 60** and the immunocompromised","m":"Shingles of the ear: chickenpox's late revenge.","r":"Slide p32"},{"t":"RHS","q":"Explain the pathophysiology of Ramsay Hunt syndrome.","a":"• VZV lies latent in the **geniculate ganglion** after chickenpox\n• Reactivation (age, immunosuppression) → inflammation and oedema along the nerve\n• Sensory fibres → vesicles in the **concha / EAC / pinna**, sometimes **palate and anterior tongue**\n• Inflammation spreads more widely than in Bell's → **VIII** (sometimes IX, X) involvement\n• More axonal degeneration → **worse prognosis than Bell's**","m":"Same ganglion as Bell's, nastier virus.","r":"Lecturer pearl"},{"t":"RHS","q":"What is the classic clinical presentation of Ramsay Hunt syndrome?","a":"• Severe **otalgia** – often precedes the rash\n• **Vesicular rash** in the concha / EAC / pinna\n• **Ipsilateral LMN facial palsy**, often complete\n• The rash may appear **after** the palsy or never (**zoster sine herpete**) – re-examine the ear\n• Diagnosis is **clinical**","m":"Pain, Pox, Palsy.","r":"Slide p33"},{"t":"RHS","q":"Which other cranial nerves can be involved in Ramsay Hunt syndrome, and how do they present?","a":"• **VIII**: **tinnitus**, **SNHL**, **vertigo** (commonest association)\n• **IX**: **dysphagia**, reduced gag reflex\n• **X**: **hoarseness**, vocal cord palsy\n• Several nerves involved = polyneuritis cranialis, a worse prognosis","m":"Hunt spreads to the neighbours: 8 (ear), 9 (swallow), 10 (voice).","r":"Slide p34"},{"t":"RHS","q":"Which investigations are useful in Ramsay Hunt syndrome?","a":"• **VZV PCR** of vesicle fluid – confirms VZV in atypical cases\n• **Pure-tone audiometry** – documents VIII involvement (SNHL)\n• **Laryngoscopy** – if hoarse or dysphagic (X palsy)\n• ENoG for complete palsy; MRI only if atypical","m":"Swab, hear, scope.","r":"Slide p34"},{"t":"RHS","q":"How is Ramsay Hunt syndrome treated?","a":"• **Antiviral** started early (ideally < 72 h): **aciclovir 800 mg five times daily** for 7-10 days or **valaciclovir 1 g three times daily** for 7 days\n• **Plus oral prednisolone** (e.g. 1 mg/kg/day for 5 days, then taper)\n• **Analgesia** – paracetamol / NSAID; neuropathic agents for post-herpetic pain\n• **Eye care** – artificial tears, ointment, taping\n• Short-term vestibular sedatives for vertigo","m":"Unlike Bell's, the antiviral is compulsory here.","r":"Slide p34"},{"t":"RHS","q":"How does Ramsay Hunt syndrome compare with Bell's palsy, and how can it be prevented?","a":"• RHS is **more painful**, more often **complete**, and may involve **VIII**\n• Recovery is **poorer**: complete recovery in only ~**70-75%** even when treated within 72 h (far less if delayed), versus **85-90%** in Bell's\n• More synkinesis and residual weakness\n• Prevention: **recombinant zoster vaccine (Shingrix)** for adults 50 and over and the immunocompromised","m":"Hunt hurts more and heals less.","r":"Lecturer pearl"},{"t":"OM","q":"How common is facial palsy as a complication of acute otitis media?","a":"• A **rare intratemporal complication** of AOM, causing **ipsilateral LMN** facial weakness\n• Pre-antibiotic era: **0.5-0.7%** of AOM cases\n• Antibiotic era: about **0.005%**\n• Mostly **children**; usually recovers well with prompt treatment","m":"Antibiotics made it a hundred times rarer – rare, but you must recognise it.","r":"Slide p35"},{"t":"OM","q":"By what mechanisms does acute otitis media cause facial palsy?","a":"• **Facial canal dehiscence** (usually tympanic segment) → nerve directly exposed to middle-ear pus\n• **Intrafallopian oedema** → raised pressure in the canal → vascular compression → **neurapraxia**\n• Altered middle-ear environment: raised pressure + osteitis\n• **Retrograde spread** of infection along the chorda tympani","m":"A bare nerve in a pus-filled box.","r":"Slide p36"},{"t":"OM","q":"How does facial palsy with acute otitis media present, and how is it investigated?","a":"• Otalgia, fever, reduced hearing, ± otorrhoea; **bulging, inflamed TM**\n• **Ipsilateral LMN** palsy – grade with House-Brackmann\n• **Ear swab C&S** if otorrhoea (or fluid from myringotomy)\n• **HRCT temporal bone** – exclude **coalescent mastoiditis**, cholesteatoma, abscess","m":"Child + red bulging drum + new facial droop = complicated AOM.","r":"Slide p37"},{"t":"OM","q":"How is facial palsy complicating acute otitis media managed?","a":"• Admit: **IV broad-spectrum antibiotics** + **systemic corticosteroids**\n• **Myringotomy ± grommet** – drains the middle ear and provides a culture\n• **Cortical mastoidectomy** if mastoiditis or no improvement\n• **Eye protection** if incomplete closure; facial physiotherapy\n• Nerve decompression is rarely needed – most recover fully","m":"Drain the drum, drip the drugs.","r":"Slide p37"},{"t":"OM","q":"How does chronic otitis media cause facial palsy?","a":"• COM: chronic inflammation of the middle ear and mastoid with **TM perforation and otorrhoea > 3 months**\n• Palsy is usually due to **cholesteatoma** or **penetrating granulation tissue**\n• Erosion of the **Fallopian canal** → nerve exposure, compression, inflammatory oedema\n• Presents with persistent foul otorrhoea, hearing loss, otalgia + **gradual** ipsilateral LMN palsy","m":"Cholesteatoma is a slow bone-eater; the nerve is a late casualty.","r":"Slide p38"},{"t":"OM","q":"Which investigations are needed for facial palsy in chronic otitis media?","a":"• **Ear swab C&S**\n• **HRCT temporal bone** – extent of cholesteatoma, canal erosion, other complications (lateral SCC fistula, tegmen erosion)\n• **Pure-tone audiometry** – baseline hearing before surgery\n• MRI (diffusion-weighted) if intracranial complication or recurrent cholesteatoma is suspected","m":"Bug, bone, baseline hearing.","r":"Slide p39"},{"t":"OM","q":"What is the management of facial palsy in chronic otitis media with cholesteatoma?","a":"• A **surgical urgency** – not managed conservatively\n• **Urgent mastoidectomy with middle-ear exploration**: remove cholesteatoma from the nerve\n• **Facial nerve decompression** where the canal is involved\n• Do **not** strip granulations that penetrate the nerve sheath\n• **Delayed nerve grafting** if a segment is destroyed\n• Supportive: aural toilet, topical ± systemic antibiotics, eye care","m":"AOM palsy = drain; cholesteatoma palsy = operate.","r":"Slide p39"},{"t":"OM","q":"Contrast facial palsy due to acute otitis media with facial palsy due to cholesteatoma.","a":"• **AOM**: usually a **child**, **acute** onset, intact bulging drum, nerve **oedema through a dehiscence**\n• AOM treatment: antibiotics + steroids + **myringotomy**; prognosis **good**\n• **Cholesteatoma**: older child or adult, **gradual** onset, foul discharge, attic retraction or perforation, **bone erosion**\n• Cholesteatoma treatment: **urgent mastoid exploration**; prognosis more **guarded**","m":"Acute = inflammation (reversible); chronic = erosion (structural).","r":"Lecturer pearl"},{"t":"MOE","q":"What is malignant (necrotising) otitis externa and who gets it?","a":"• A **rare invasive infection** of the external ear canal that spreads to cause **skull base osteomyelitis**\n• 'Malignant' describes its relentless course and mortality – it is **not** a cancer\n• Organism: **Pseudomonas aeruginosa** (commonest)\n• At risk: **elderly diabetics**, the immunocompromised (HIV, chemotherapy, renal failure)","m":"Old + diabetic + painful ear that will not settle = MOE until proven otherwise.","r":"Slide p40"},{"t":"MOE","q":"How does infection spread in malignant otitis externa to reach the facial nerve?","a":"• Starts as otitis externa in the canal\n• Spreads through the **fissures of Santorini** (cartilaginous EAC) and the **foramen of Huschke** (bony EAC, if persistent)\n• Invades bone → **osteomyelitis of the temporal bone and skull base**\n• Reaches the facial nerve at the **stylomastoid foramen**","m":"Santorini's cracks let the bug out of the canal.","r":"Slide p40"},{"t":"MOE","q":"What are the symptoms and the classic examination sign of malignant otitis externa?","a":"• Severe **nocturnal otalgia**, pain out of proportion; pain on **chewing**\n• Otorrhoea **not responding to topical treatment**; ± hearing loss\n• Classic sign: **granulation tissue** on the **floor of the EAC at the bony-cartilaginous junction**\n• **Facial nerve palsy** ± other cranial nerve palsies","m":"Granulation on the floor of an old diabetic's canal = MOE.","r":"Slide p42"},{"t":"MOE","q":"Which cranial nerves are involved in malignant otitis externa, and in what order?","a":"• **VII** is the commonest, at the **stylomastoid foramen**\n• Then **IX, X, XI** at the **jugular foramen**, then **XII** (hypoglossal canal)\n• Spread to the petrous apex may involve **V and VI**\n• Any cranial nerve palsy = established **skull base osteomyelitis**","m":"7 first, then the jugular trio 9-10-11, then 12.","r":"Lecturer pearl"},{"t":"MOE","q":"What are the Cohen and Friedman (1987) diagnostic criteria for malignant otitis externa?","a":"• **Major (all required)**: pain, oedema, exudate/discharge, granulation tissue, microabscess (at surgery), **positive Tc-99m bone scan or failure of local treatment for ≥ 1 week**\n• **Minor**: Pseudomonas on culture, positive bone radiograph, diabetes, cranial nerve involvement, debilitating condition, old age\n• Note: slide lists **high ESR** as a criterion; it is **not** a Cohen criterion – ESR/CRP are used to **monitor** treatment","m":"Slide mnemonic for major, A-G: Abscess, Bone scan, exCruciating pain, Discharge, oEdema, Failed treatment, Granulation.","r":"Slide p42"},{"t":"MOE","q":"Which investigations are done for suspected malignant otitis externa?","a":"• Bloods: **FBC, ESR, CRP** (baseline and for monitoring), **glucose / HbA1c**\n• **Ear swab culture** and sensitivity – before antibiotics\n• **Biopsy of granulations** – to **exclude carcinoma** of the canal\n• **HRCT temporal bone** – bone erosion\n• **Bone scan** – early osteomyelitis","m":"Always biopsy the granulation: SCC can look exactly like MOE.","r":"Slide p43"},{"t":"MOE","q":"What does each imaging modality add in malignant otitis externa?","a":"• **HRCT**: bone erosion – but needs substantial demineralisation, so may be normal early\n• **MRI**: soft-tissue and marrow spread, intracranial extension\n• **Tc-99m bone scan**: sensitive for **diagnosis**, but stays positive for months (osteoblastic activity) – not useful for follow-up\n• **Gallium-67** scan: returns to normal as infection settles → **monitors resolution** and helps decide when to stop antibiotics","m":"Technetium tells you it is there; Gallium tells you it has gone.","r":"Lecturer pearl"},{"t":"MOE","q":"How is malignant otitis externa managed?","a":"• **Admit** for analgesia and monitoring\n• **Antipseudomonal antibiotics**: **ciprofloxacin** IV for ~2 weeks then oral for ~6 weeks (6-8 weeks in total), guided by culture\n• Resistant organisms: IV ceftazidime or piperacillin-tazobactam\n• **Strict diabetic control**\n• **Aural toilet** + topical antibiotic drops\n• Surgery only for biopsy, removal of sequestrum or drainage of abscess","m":"Cipro, sugar control, clean canal – for weeks, not days.","r":"Slide p43"},{"t":"TUM","q":"What is a facial nerve schwannoma and where does it usually arise?","a":"• A rare **benign** tumour of the **Schwann cells** of the nerve sheath\n• The **commonest intrinsic tumour** of the facial nerve; can occur anywhere along its course\n• Most are **intratemporal** – classically around the **geniculate ganglion**, often spanning several segments","m":"The Schwann cell is the nerve's insulation: the tumour grows from its own coat.","r":"Slide p44"},{"t":"TUM","q":"How does a facial nerve schwannoma present, and what clue separates it from Bell's palsy?","a":"• **Slowly progressive** facial weakness (weeks to months) or **recurrent ipsilateral** palsy\n• **Facial twitching / hemifacial spasm** from irritation of the nerve\n• **Hearing loss** (conductive if in the middle ear, sensorineural if in the IAM), tinnitus\n• Clue: Bell's is sudden and recovers; tumour palsy is **gradual and does not recover**","m":"Twitching before weakness = tumour until proven otherwise.","r":"Slide p45"},{"t":"TUM","q":"Which investigations are used for a suspected facial nerve schwannoma?","a":"• **House-Brackmann** grading – baseline function\n• **Gadolinium-enhanced MRI** – tumour size, extent and location (investigation of choice)\n• **HRCT temporal bone** – expansion or erosion of the Fallopian canal\n• **Audiometry** – hearing status (guides the approach)\n• **EMG** – degree of nerve damage","m":"MRI shows the tumour; CT shows the bone it has chewed.","r":"Slide p45"},{"t":"TUM","q":"How is a facial nerve schwannoma managed?","a":"• **Wait-and-scan** (serial MRI): small tumour with **good facial function** (HB I-II)\n• **Bony decompression or debulking** (shaving tumour off the nerve): preserves fibres in symptomatic patients with good function\n• **Total resection + nerve graft**: growing tumour, brainstem compression, or **severe pre-existing palsy**\n• **Stereotactic radiosurgery**: small symptomatic tumours, the elderly, poor surgical candidates","m":"A graft gives at best HB III – do not resect a nerve that is working better than that.","r":"Slide p46"},{"t":"TUM","q":"Which malignant tumours occur in the parotid gland?","a":"• **Epithelial**: **mucoepidermoid carcinoma** (commonest parotid malignancy), **adenoid cystic carcinoma** (cylindroma), **acinic cell carcinoma**, adenocarcinoma, squamous cell carcinoma, undifferentiated carcinoma\n• **Non-epithelial**: lymphoma, sarcoma\n• **Adenoid cystic** carcinoma is notorious for **perineural spread** along VII → palsy and skip lesions","m":"Mucoepidermoid is the most common; adenoid cystic creeps along nerves.","r":"Slide p47"},{"t":"TUM","q":"A patient has a parotid lump and an ipsilateral facial palsy. What does this suggest, and how do you assess it?","a":"• **Malignancy** until proven otherwise – benign parotid tumours almost never cause palsy\n• Other malignant clues: rapid growth, pain, fixity, skin involvement, **trismus**, neck nodes\n• Examine the **neck**, **oral cavity / oropharynx** (deep lobe extension) and **ear**\n• **FNAC** (± ultrasound-guided core biopsy)\n• **MRI** (extent, perineural spread) ± **CT** of head and neck","m":"Lump + palsy = cancer.","r":"Slides p47-48"},{"t":"TUM","q":"How is the facial nerve handled during surgery for parotid malignancy?","a":"• Treatment: **total parotidectomy** ± neck dissection → **postoperative radiotherapy** if indicated\n• The nerve is **preserved** if it can be freed from tumour; sacrificed only if **directly involved** or already paralysed\n• **Accidental** transection → **immediate microsurgical repair**\n• **Intentional resection** → **cable graft (great auricular nerve)** or **hypoglossal-facial anastomosis**\n• Skin / soft-tissue defects → flap reconstruction (cervicofacial, pectoralis major, trapezius)","m":"Cut by accident – repair it now; cut on purpose – graft it now.","r":"Slide p48"},{"t":"TUM","q":"What is Frey's syndrome?","a":"• **Gustatory sweating**: sweating and flushing of the preauricular skin while eating, after parotidectomy\n• Cause: **aberrant regeneration** of cut parasympathetic secretomotor fibres (**auriculotemporal nerve**) into the **sweat glands** of the skin flap\n• Diagnosis: **Minor's starch-iodine test**\n• Treatment: antiperspirant, **botulinum toxin**; prevention: thick skin flap, SMAS or fat interposition","m":"Salivary wiring plugged into sweat glands: you eat, your cheek sweats.","r":"Slide p48"},{"t":"TUM","q":"What are the key features of temporal bone carcinoma, and what does facial palsy mean for staging?","a":"• Aetiology: **long-standing chronic otitis media** / cholesteatoma, sun exposure, metastasis\n• Primary: **SCC** (commonest), BCC, adenocarcinoma, rhabdomyosarcoma; secondary: lung, breast, prostate, lymphoma\n• Red flags: **bloody otorrhoea**, severe pain, canal mass or granulation, **facial palsy**\n• Ix: **biopsy (HPE)**, HRCT, MRI\n• Modified Pittsburgh staging: **facial nerve paresis = T4**\n• Rx: lateral / subtotal / total temporal bone resection ± radiotherapy; palliation","m":"An old discharging ear that now bleeds, hurts and droops = carcinoma.","r":"Slides p49-50"},{"t":"TRA","q":"What are the causes and clinical signs of a temporal bone fracture?","a":"• Causes: **motor vehicle accidents** (commonest), falls, assault, severe blunt head trauma\n• **Battle's sign** – postauricular (mastoid) ecchymosis, appears after 1-2 days\n• **Haemotympanum**, bleeding from the ear, TM tear\n• **Hearing loss**, vertigo\n• **Facial nerve palsy**, **CSF otorrhoea**","m":"Bruise behind the ear, blood behind the drum, fluid from the ear.","r":"Slide p52"},{"t":"TRA","q":"What are the types of temporal bone fracture and their relative frequency?","a":"• **Longitudinal**: ~**70-90%** (commonest)\n• **Transverse**: ~**10-30%**\n• **Mixed / oblique**: a combination\n• Note: slide states transverse 80% and longitudinal 20% – this is **reversed**; longitudinal fractures are by far the commonest\n• Modern scheme: **otic capsule-sparing vs otic capsule-violating**","m":"Longitudinal: the most fractures, the fewest palsies.","r":"Slide p52"},{"t":"TRA","q":"Describe a longitudinal temporal bone fracture: mechanism and features.","a":"• Blow to the **temporal or parietal** region (from the side)\n• Runs parallel to the petrous axis through the **EAC roof, middle ear and tegmen**; usually spares the otic capsule\n• Injures **TM, ossicles, tegmen** → **TM perforation, bleeding from the ear, CSF otorrhoea**, haemotympanum\n• **Conductive hearing loss** (ossicular disruption, blood)\n• Facial palsy in ~**20%** – usually **delayed and temporary**","m":"Longitudinal = Lateral blow, Leaking drum, conductive Loss.","r":"Slides p53-54"},{"t":"TRA","q":"Describe a transverse temporal bone fracture: mechanism and features.","a":"• Blow to the **frontal or occipital** region (front-to-back)\n• Crosses the petrous pyramid through the **otic capsule / IAM** → labyrinth and VII injured\n• **Sensorineural hearing loss** (often total), **severe vertigo** with nystagmus, nausea and vomiting\n• TM usually **intact** with haemotympanum; CSF may drain down the Eustachian tube → **CSF rhinorrhoea**\n• Facial palsy in ~**50%** – **immediate, severe, often permanent**","m":"Transverse = Total deafness, Turning (vertigo), Tragic immediate palsy.","r":"Slides p53-54"},{"t":"TRA","q":"Why does the timing of facial palsy after a temporal bone fracture matter so much?","a":"• **Delayed onset** (hours to days) = nerve in continuity, with **oedema or haematoma** → excellent prognosis\n• **Immediate complete** palsy = likely **transection, bone spicule or crush** → poor prognosis without surgery\n• Ask whether the face was moving on arrival in ED (notes, GCS assessment, photos)\n• Commonest site of injury: the **perigeniculate / labyrinthine** region","m":"Late = swollen (wait); immediate = cut (explore).","r":"Slide p54"},{"t":"TRA","q":"What is the otic capsule-sparing vs otic capsule-violating classification, and why is it preferred?","a":"• Based on whether the fracture crosses the **otic capsule** (cochlea / labyrinth)\n• **Sparing** (most): conductive loss, fewer complications\n• **Violating**: much higher risk of **facial palsy** (~2-5×), **CSF leak** (~4-8×) and **SNHL**\n• Predicts complications better than longitudinal / transverse, because most fractures are oblique or mixed on CT","m":"Did it crack the shell of the inner ear? That predicts the damage.","r":"Lecturer pearl"},{"t":"TRA","q":"How do you manage facial palsy after a temporal bone fracture?","a":"• **Incomplete or delayed** palsy: **steroids**, eye care, observation – good recovery\n• **Immediate complete** palsy: **HRCT temporal bone** (fracture line, spicule) + **ENoG** from day 3\n• **> 90% degeneration within 14 days** (or a transected nerve) → **surgical exploration / decompression**\n• Approach by segment and hearing: **transmastoid** ± **middle cranial fossa** if hearing is present; **translabyrinthine** if the ear is dead\n• Transected nerve → end-to-end repair or cable graft","m":"Immediate + complete + > 90% = explore.","r":"Lecturer pearl"},{"t":"INV","q":"Why can electrical tests not distinguish neurapraxia from nerve transection in the first 3 days?","a":"• After an axon is cut, the distal segment still conducts until **Wallerian degeneration** occurs\n• This takes **48-72 hours**\n• So stimulation distal to the lesion (at the stylomastoid foramen) gives a **normal response** in the first 3 days, whatever the injury\n• Hence ENoG / NET are done **from day 3**, and repeated to track degeneration","m":"A cut wire's tail stays live for 3 days.","r":"Slide p55"},{"t":"INV","q":"Describe the minimal nerve excitability test (NET) and its cut-off.","a":"• An older test to separate **conduction block** from **degeneration**\n• Electrode over the **stylomastoid foramen** or a peripheral branch; current increased until a **just-visible twitch** – normal side first, then the paralysed side\n• Conduction block: **no difference** between sides\n• Degeneration: threshold rises; a **difference > 3.5 mA = degeneration**\n• Limitations: subjective, and blind to degeneration for the first 48-72 h","m":"3.5 mA: three and a half and it is going bad.","r":"Slide p55"},{"t":"INV","q":"How does the maximal stimulation test (MST) differ from the nerve excitability test?","a":"• Uses the current giving **maximal facial movement** rather than the threshold current\n• Response compared with the normal side: **equal, decreased or absent**\n• **Reduced or absent** response = degeneration → predicts **incomplete recovery**\n• Like the NET it is subjective and meaningful only after 72 h","m":"NET asks when it twitches; MST asks how hard it can move.","r":"Slide p56"},{"t":"INV","q":"What is electroneurography (ENoG), and when is it performed?","a":"• Objective test: **supramaximal bipolar stimulation** at the stylomastoid foramen; **compound muscle action potentials** recorded from facial muscles\n• Paralysed-side amplitude compared with the normal side → **percentage of degenerated fibres**\n• Used in **complete** palsy; most useful from **day 3-4 to day 21**\n• After ~3 weeks, desynchronised regenerating fibres make it unreliable → use EMG","m":"ENoG = % dead fibres; window day 3 to 21.","r":"Slide p58"},{"t":"INV","q":"How do you interpret ENoG results in Bell's palsy or trauma?","a":"• **< 90% degeneration** within the first 14 days → **good prognosis** – continue medical treatment\n• **> 90% degeneration within 14 days** → **poor prognosis** – consider **surgical decompression** (if EMG shows no voluntary motor units)\n• Rapid progression to > 90% is more ominous than slow progression","m":"Ninety in fourteen: the decompression trigger.","r":"Slide p58"},{"t":"INV","q":"What does EMG show in facial palsy, and when is it most useful?","a":"• Needle electrodes in facial muscles record spontaneous and voluntary activity\n• **Fibrillation potentials** = denervation – appear only **10-21 days** after injury\n• **Polyphasic potentials** = **reinnervation**\n• Early **voluntary motor-unit potentials** = some intact fibres = good prognosis, even if ENoG is poor\n• Most useful **from ~2-3 weeks onwards** and for planning reanimation (nerve substitution vs muscle transfer)\n• Note: slide says EMG is most helpful **within** 2-3 weeks; correct is **after** 2-3 weeks – ENoG is the test of choice from day 3 to 21","m":"Fibrillation = the muscle crying for its lost nerve; polyphasic = the nerve coming home.","r":"Slide p57"},{"t":"INV","q":"Describe Schirmer's test and its interpretation in facial palsy.","a":"• Tests the **greater superficial petrosal nerve** (lacrimal secretomotor supply)\n• A 5 mm filter-paper strip in the **lower conjunctival sac** of both eyes for **5 minutes**; compare the wetted lengths\n• Abnormal: **≥ 25% reduction** vs the normal side, or a combined wetting of **< 25 mm**\n• Abnormal result → lesion **at or proximal to the geniculate ganglion**","m":"Schirmer = tears = geniculate.","r":"Slide p60"},{"t":"INV","q":"How is the stapedial reflex used to localise a facial nerve lesion?","a":"• Tests the **nerve to stapedius** (efferent limb of the acoustic reflex)\n• A **loud sound** is delivered via impedance audiometry; stapedius contraction stiffens the ossicular chain → change in compliance\n• **Absent or > 50% reduced** reflex → lesion **proximal to the nerve to stapedius**\n• Patients may report **hyperacusis**; return of the reflex is an early sign of recovery","m":"No reflex, no damper: the lesion is above the stapedius branch.","r":"Slide p61"},{"t":"INV","q":"How are the chorda tympani tests (taste testing and submandibular salivary flow) performed and interpreted?","a":"• **Electrogustometry / taste testing**: weak electric current or sweet, sour, salty, bitter solutions on the **anterior ⅔ of each side** of the tongue; compare thresholds\n• **Submandibular salivary flow**: cannulate both **Wharton's ducts**, stimulate with **6% citric acid**, compare flow over 5 minutes\n• Abnormal: reduced taste, or **≥ 25% reduction** in flow\n• Either → lesion **proximal to the chorda tympani**","m":"Chorda = taste + spit: both tests probe the same branch.","r":"Slides p62-63"},{"t":"SURG","q":"What is facial nerve decompression, and what is assessed before surgery?","a":"• Surgical opening of the **bony Fallopian canal** (± nerve sheath) to relieve pressure on the nerve\n• Pre-op: **ENoG** (% degeneration), **EMG** (absent voluntary motor units), **HRCT** (fracture, middle-ear disease), **MRI** (tumour), **audiometry** (hearing decides the approach)\n• Risks: **hearing loss**, vertigo, tinnitus, **CSF leak**, infection, bleeding, further nerve injury\n• Done with micro-drills, the operating microscope and **intra-operative nerve monitoring**","m":"Unroof the tunnel before the swollen nerve dies.","r":"Slides p64-65"},{"t":"SURG","q":"Compare the three surgical approaches to the intratemporal facial nerve.","a":"• **Transmastoid**: **tympanic and mastoid** segments; hearing preserved – trauma or disease clearly distal to the geniculate\n• **Middle cranial fossa**: **labyrinthine segment, geniculate ganglion, IAM**; hearing preserved – Bell's decompression; combined with transmastoid in trauma\n• **Translabyrinthine**: the **entire intratemporal course**, but destroys the inner ear – only when hearing is **already lost**","m":"Hearing alive and lesion high → middle fossa; lesion low → mastoid; ear dead → through the labyrinth.","r":"Slide p66"},{"t":"SURG","q":"What are the requirements for an end-to-end facial nerve anastomosis?","a":"• Direct microsurgical **neurorrhaphy** of the proximal and distal stumps\n• For a **small gap** that can be closed **without tension**\n• Especially suited to the **extratemporal** nerve (facial lacerations, parotid surgery)\n• **Early repair (< 72 h)** preferred – the distal stump can still be **electrically stimulated** to identify branches before Wallerian degeneration\n• Gives the best results of all repair methods","m":"Tension-free and within 3 days – before the distal stump goes quiet.","r":"Slide p67"},{"t":"SURG","q":"When is a cable nerve graft used, and which donor nerves are taken?","a":"• When the gap is too large for tension-free end-to-end repair – a graft is preferred to extensive rerouting\n• **Great auricular nerve**: in the same operative field (neck / parotid), ~**7-10 cm**\n• **Sural nerve**: for **longer grafts** (up to ~30-40 cm, e.g. cross-facial grafts)\n• Expected best outcome ~**HB III**, with recovery over 6-12 months","m":"Short gap → great auricular next door; long gap → sural from the leg.","r":"Lecturer pearl"},{"t":"SURG","q":"What is a hypoglossal-facial anastomosis, and what are its pros and cons?","a":"• The hypoglossal nerve is joined to the distal facial nerve to reinnervate the face\n• Indication: **proximal facial stump unavailable** (e.g. after CPA tumour surgery) but **distal nerve and facial muscles intact and viable**\n• Pros: restores **tone**, some movement, better **eye protection**\n• Cons: **ipsilateral tongue atrophy / weakness**, **mass movement / hypertonia**, synkinesis\n• Long-standing palsy with muscle atrophy: **temporalis or free gracilis transfer**, static slings, **gold weight**","m":"Borrow the tongue's nerve to wake the face – the tongue pays.","r":"Slide p69"},{"t":"SURG","q":"How do you prevent and manage facial nerve injury during ear or mastoid surgery?","a":"• At-risk procedures: **mastoidectomy**, tympanoplasty, stapedectomy\n• Prevention: know the anatomy, **magnification**, drill **along, never across** the nerve, avoid thermal injury, gentle handling, **do not remove granulations that penetrate the nerve**\n• **Immediate** post-op palsy: wait a few hours for **local anaesthetic** to wear off and **loosen the packing**; if still complete → **re-explore** (decompress, re-anastomose or cable graft)\n• **Delayed-onset** palsy: oedema → **steroids**, conservative","m":"Immediate = injured (explore); delayed = swollen (steroids) – the same rule as trauma.","r":"Slide p71"},{"t":"SURG","q":"Which facial nerve branch is most often weak after parotid surgery, and what are the rates of palsy?","a":"• **Marginal mandibular branch** – superficial, few cross-connections, vulnerable in lower-pole surgery\n• Causes: stretching / retraction, thermal or mechanical irritation, post-op swelling, tumour position, malignant involvement\n• **Temporary** palsy **10-40%** (mild: 3 weeks-3 months; moderate: 3-6 months, sometimes up to 12)\n• **Permanent** palsy **1-7%**\n• Protection: **intra-operative nerve monitoring**, microsurgical dissection, landmark identification, gentle tissue handling","m":"The marginal branch lives on the margin: thin, alone and low.","r":"Slide p72"},{"t":"SURG","q":"How should a neonatal facial palsy after forceps delivery be managed?","a":"• Cause: forceps blade pressure over the **stylomastoid foramen** – the **mastoid is undeveloped** at birth, so the nerve is superficial → haemorrhage and oedema\n• Signs: facial **asymmetry on crying**, the affected **eye stays open**, **absent rooting reflex** on that side\n• Management: **observation** – about **90% recover spontaneously**; **lubricating eye ointment / drops** and lid taping\n• Note: slide lists **neuroplasty** and antiseptic ointment; correct is observation with eye lubrication – surgery is rarely needed\n• Distinguish **developmental** palsy (e.g. **Möbius**: bilateral VI + VII), which does **not** recover","m":"Forceps palsy: bruised, not broken – watch and protect the eye.","r":"Slide p73"}],"mcq":[{"t":"ANAT","stem":"A 34-year-old woman attends the ENT clinic 2 days after waking with complete left-sided facial weakness involving the forehead. Otoscopy is normal and there are no vesicles. You explain that swelling of the nerve inside its bony canal is thought to compress it at one particular point.\nAt which part of the facial nerve is this compression most likely to occur?","o":["Meatal segment within the internal acoustic meatus","Tympanic segment just above the oval window","Labyrinthine segment at the meatal foramen","Mastoid segment just above the stylomastoid foramen","Extratemporal trunk entering the parotid gland"],"a":2,"e":"The **labyrinthine segment** (about 4 mm) is the narrowest part of the Fallopian canal, with the meatal foramen only about 0.68 mm wide, and it lacks a good anastomotic arterial arcade. Oedema from viral (HSV-1) inflammation therefore compresses the nerve and its microcirculation here first. This is why decompression for severe Bell's palsy targets the labyrinthine segment via the **middle cranial fossa**, not the mastoid.","w":["Wrong - the meatal segment lies in the wide internal acoustic meatus, where there is room to swell.","Wrong - the tympanic segment is the commonest site of bony dehiscence, not of entrapment by oedema.","Correct - the labyrinthine segment and meatal foramen form the narrowest, least well-perfused part of the canal.","Wrong - the mastoid segment is wider; it is the segment reached by transmastoid surgery for trauma or otitis.","Wrong - the extratemporal trunk is not enclosed in bone, so oedema cannot compress it there."],"r":"Slides p8, p25"},{"t":"ANAT","stem":"A 45-year-old man has a canal wall-down mastoidectomy for cholesteatoma at a state hospital. The operation note records that disease was drilled off the medial wall of the middle ear, just above the oval window and below the lateral semicircular canal. He wakes with a complete right lower motor neurone facial palsy that persists after the local anaesthetic has worn off.\nWhich segment of the facial nerve is most likely to have been injured?","o":["Tympanic (horizontal) segment","Labyrinthine segment","Mastoid (vertical) segment","Meatal (internal auditory canal) segment","Geniculate ganglion at the first genu"],"a":0,"e":"The **tympanic segment** (about 11 mm) runs from the geniculate ganglion to the pyramid, **above the oval window and below the lateral semicircular canal**. It is the commonest site of natural dehiscence of the Fallopian canal, so it is the segment most often injured in middle-ear and mastoid surgery and most exposed in acute otitis media. The lateral canal and oval window are the surgeon's landmarks for finding it.","w":["Correct - the tympanic segment lies exactly between the oval window and the lateral semicircular canal.","Wrong - the labyrinthine segment lies medially, between the fundus of the meatus and the geniculate ganglion, away from the middle ear.","Wrong - the mastoid segment descends from the pyramid to the stylomastoid foramen, below the area described.","Wrong - the meatal segment lies inside the internal acoustic meatus and is not reached in mastoid surgery.","Wrong - the geniculate ganglion is at the first genu, anterior to and above the area described."],"r":"Slide p8"},{"t":"ANAT","stem":"A 52-year-old woman is reviewed 6 weeks after middle cranial fossa surgery. Facial movement is normal and taste is intact, but her right eye feels dry. Schirmer test shows 6 mm of wetting on the right and 22 mm on the left after 5 minutes.\nInjury to which branch best explains these findings?","o":["Chorda tympani nerve","Nerve to stapedius","Posterior auricular nerve","Zygomatic branch of the facial nerve","Greater superficial petrosal nerve"],"a":4,"e":"The **greater superficial petrosal nerve** leaves the geniculate ganglion carrying secretomotor fibres to the lacrimal gland via the pterygopalatine ganglion, and runs on the floor of the middle cranial fossa, where it can be stretched. An isolated low Schirmer with normal movement and taste points to the GSPN alone; the zygomatic branch is motor and would cause incomplete closure, not reduced tear production. Note: slide p7 says the lacrimatory nucleus supplies the 'lacrimal and salivary' glands; correctly it supplies the lacrimal, nasal and palatal glands, and the superior salivatory nucleus supplies the submandibular and sublingual glands.","w":["Wrong - chorda tympani injury reduces taste and submandibular flow, and her taste is normal.","Wrong - the nerve to stapedius causes hyperacusis and an absent stapedial reflex, not a dry eye.","Wrong - the posterior auricular nerve supplies the auricular muscles and occipitalis only.","Wrong - the zygomatic branch is motor to orbicularis oculi; her movement is normal and tear volume would not fall.","Correct - the GSPN arises at the geniculate ganglion and carries secretomotor fibres to the lacrimal gland."],"r":"Slides p7, p12, p60"},{"t":"ANAT","stem":"A 38-year-old woman has a stapedotomy for otosclerosis. At follow-up she complains of a metallic taste and reduced taste on the right front of the tongue. Facial movement, tear production and taste over the circumvallate papillae are normal.\nThe injured taste fibres terminate centrally in which nucleus?","o":["Superior salivatory nucleus","Nucleus of the tractus solitarius","Spinal nucleus of the trigeminal nerve","Motor nucleus of the facial nerve","Inferior salivatory nucleus"],"a":1,"e":"Taste from the anterior two-thirds of the tongue is **special visceral afferent**, carried in the **chorda tympani** (which crosses the middle ear and is easily stretched in stapes surgery) to the geniculate ganglion and on to the **nucleus of the tractus solitarius**. The circumvallate papillae are supplied by IX, so taste there is preserved. The superior salivatory nucleus sends efferent secretomotor fibres along the same chorda tympani, which is the usual point of confusion.","w":["Wrong - the superior salivatory nucleus is efferent (GVE) to the submandibular and sublingual glands, not the taste relay.","Correct - SVA taste fibres of VII end in the nucleus of the tractus solitarius.","Wrong - the spinal trigeminal nucleus receives general sensation from the concha and ear canal carried by VII.","Wrong - the motor nucleus (SVE) in the lower pons supplies the muscles of facial expression, which are normal.","Wrong - the inferior salivatory nucleus belongs to IX and supplies the parotid gland."],"r":"Slides p7, p12"},{"t":"ANAT","stem":"A 63-year-old hypertensive man presents to the ED with sudden double vision. He cannot look to the right with either eye, and has complete right facial weakness including the forehead. MRI shows a small haemorrhage in the dorsal pons at the floor of the fourth ventricle.\nWhich anatomical relationship best explains this combination?","o":["VII and VIII run together in the internal acoustic meatus","Nervus intermedius joins the motor root at the geniculate ganglion","VI and VII both exit the brainstem at the pontomedullary junction","Facial motor fibres loop dorsally around the abducens nucleus","Upper facial motor neurones receive bilateral cortical input"],"a":3,"e":"In the pons, facial motor fibres run dorsally and **loop around the abducens nucleus**, raising the **facial colliculus** in the floor of the fourth ventricle. A lesion here gives a lower motor neurone facial palsy (forehead involved) plus an ipsilateral **horizontal gaze palsy**, because the abducens nucleus drives both eyes for lateral gaze. A lesion of the VI nerve fascicle alone would cause only failure of abduction of one eye.","w":["Wrong - the shared meatus explains VII plus VIII (hearing, balance) loss in CPA lesions, not a gaze palsy.","Wrong - the nervus intermedius joins the motor root at the brainstem and CPA, and has no link with eye movement.","Wrong - a ventral exit-zone lesion would give a VI nerve palsy with VII, not a dorsal pontine conjugate gaze palsy.","Correct - the facial colliculus is formed by VII fibres looping round the abducens nucleus, so both are hit together.","Wrong - bilateral cortical input explains forehead sparing in UMN lesions; here the forehead is involved."],"r":"Slide p6"},{"t":"LOC","stem":"A 68-year-old man is brought to the ED 2 hours after the sudden onset of drooping of the left side of his mouth and clumsiness of the left hand. He can wrinkle his forehead and close both eyes tightly and symmetrically. Taste and hearing are normal.\nWhere is the lesion most likely to be?","o":["Right internal capsule (corticobulbar fibres)","Left facial motor nucleus in the caudal pons","Left cerebellopontine angle near the meatus","Left geniculate ganglion in the temporal bone","Left stylomastoid foramen below the ear"],"a":0,"e":"Weakness of the lower face with a spared forehead and normal eye closure is an **upper motor neurone** pattern. The part of the facial motor nucleus supplying the upper face receives corticobulbar fibres from **both** hemispheres, so a unilateral cortical or capsular lesion weakens only the **contralateral lower face**. Hand weakness on the same side as the facial droop confirms a right hemispheric stroke: activate the stroke pathway rather than treating as Bell's palsy.","w":["Correct - a contralateral corticobulbar lesion weakens the lower face only, with ipsilateral arm signs.","Wrong - a nuclear (LMN) lesion paralyses the whole half of the face, including the forehead.","Wrong - a CPA lesion causes an LMN palsy with forehead involvement and usually hearing loss.","Wrong - a geniculate lesion causes a full LMN palsy plus reduced lacrimation and taste.","Wrong - a stylomastoid lesion paralyses all facial muscles on that side, forehead included."],"r":"Lecturer pearl"},{"t":"LOC","stem":"A 30-year-old man is seen in the ENT clinic 5 days after onset of right-sided facial weakness involving the forehead. He finds loud sounds uncomfortable in the right ear. Schirmer test shows 20 mm on the right and 22 mm on the left. The right stapedial reflex is absent and electrogustometry shows a raised threshold on the right anterior tongue.\nWhere is the lesion most likely to be?","o":["Meatal segment in the internal acoustic meatus","Mastoid segment below the chorda tympani origin","Mastoid segment between stapedius and chorda branches","Tympanic segment distal to the geniculate ganglion","Labyrinthine segment proximal to the geniculate"],"a":3,"e":"Work down the branches: normal tears mean the GSPN (at the geniculate ganglion) is spared, while hyperacusis and an absent stapedial reflex place the lesion **above the nerve to stapedius**, and reduced taste agrees. The lesion therefore lies between the geniculate ganglion and the nerve to stapedius, i.e. the **tympanic segment**. The tear difference here (20 vs 22 mm) is well under the 25% threshold, so Schirmer is normal.","w":["Wrong - a meatal lesion is proximal to the geniculate ganglion, so lacrimation would be reduced (and VIII often affected).","Wrong - below the chorda tympani only motor loss occurs; taste and the stapedial reflex would be normal.","Wrong - between these branches taste is lost but the stapedial reflex is preserved.","Correct - geniculate ganglion spared (normal tears) but the nerve to stapedius and chorda fibres are affected.","Wrong - a labyrinthine lesion is above the GSPN, so the Schirmer test would be reduced."],"r":"Slides p16-17, p60-62"},{"t":"LOC","stem":"A 55-year-old woman is referred from a Klinik Kesihatan with 2 years of progressive left-sided hearing loss and tinnitus, and 3 months of slowly increasing left facial weakness. Pure-tone audiometry shows a left sensori
