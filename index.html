<style>
:root{
  --bg:#edf7f8; --card:#ffffff; --ink:#0b2a2e; --muted:#557276; --line:#d1e6e9;
  --p:#00838f; --p2:#0097a7; --p3:#4dd0e1; --pl:#e0f5f7; --pd:#005662;
  --ok:#1b9e5a; --okl:#e3f6ec; --bad:#d64545; --badl:#fdecec; --warn:#e8a317; --star:#f5b301;
  --shadow:0 4px 18px rgba(0,131,143,.12); --r:16px;
}
[data-theme=dark]{
  --bg:#05191c; --card:#0c272b; --ink:#e2f3f5; --muted:#8db2b7; --line:#1a3f44;
  --p:#26c6da; --p2:#4dd0e1; --p3:#80deea; --pl:#103a40; --pd:#b2ebf2;
  --ok:#3ccf86; --okl:#11372a; --bad:#ff7070; --badl:#3d1a1f; --shadow:0 4px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--pd),var(--p) 55%,var(--p2));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 12px rgba(0,86,98,.3)}
[data-theme=dark] header{background:linear-gradient(135deg,#00363d,#005662 60%,#00838f)}
header h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.2px;flex:0 0 auto}
header .pill{flex:1;min-width:0;background:rgba(255,255,255,.18);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;color:#fff}
header .ib{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:18px;flex:0 0 auto}
main{max-width:720px;margin:0 auto;padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;font-size:11.5px;color:var(--muted);gap:1px}
nav button .i{font-size:21px;line-height:1.1}
nav button.on{color:var(--p);font-weight:700}
h2{font-size:20px;margin:6px 0 10px}
h3{font-size:16px;margin:16px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-size:12.5px}
.box{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero b{font-size:18px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.tile .v{font-size:24px;font-weight:800;color:var(--p)}
.tile .l{font-size:12.5px;color:var(--muted)}
.btn{display:block;width:100%;padding:13px 14px;border-radius:14px;background:var(--p);color:#fff;font-weight:700;text-align:center;box-shadow:0 3px 10px rgba(0,131,143,.25)}
.btn.sec{background:var(--pl);color:var(--p);box-shadow:none}
.btn.ghost{background:transparent;color:var(--p);border:1.5px solid var(--p);box-shadow:none}
.btn.bad{background:var(--bad)}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px}
.row>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.deck{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:13px;margin-bottom:10px;width:100%;text-align:left;border:2px solid transparent}
.deck.cur{border-color:var(--p)}
.deck .em{font-size:28px;width:46px;height:46px;border-radius:12px;background:var(--pl);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.deck .t{font-weight:700}
.deck .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.bar{height:7px;background:var(--pl);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p3));border-radius:9px}
.bar.red i{background:var(--bad)} .bar.amb i{background:var(--warn)} .bar.grn i{background:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:7px 11px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-size:13.5px}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.chip small{opacity:.75}
.seg{display:flex;background:var(--pl);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;padding:8px 6px;border-radius:10px;font-size:13.5px;color:var(--p);min-width:60px}
.seg button.on{background:var(--card);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.muted{color:var(--muted)} .small{font-size:13px}
.tip{background:var(--pl);border-left:4px solid var(--p);border-radius:12px;padding:11px 13px;font-size:14px;margin-bottom:12px}
.prog{height:6px;background:var(--pl);border-radius:6px;overflow:hidden;margin:4px 0 12px}
.prog i{display:block;height:100%;background:var(--p)}
/* flip card */
.scene{perspective:1400px;margin-bottom:12px}
.flip{display:grid;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;cursor:pointer;min-height:300px}
.flip.on{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;border-top:5px solid var(--p)}
.face.back{transform:rotateY(180deg);border-top-color:var(--ok)}
.face .tp{font-size:12px;color:var(--p);font-weight:700;text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between;gap:8px}
.face .q{font-size:20px;font-weight:700;margin:auto 0;padding:18px 0;text-align:center}
.face .a{font-size:16.5px;margin:12px 0;flex:1}
.face .hook{background:var(--pl);border-radius:12px;padding:9px 11px;font-size:14px;margin-top:6px}
.face .src{font-size:11.5px;color:var(--muted);margin-top:10px}
.face .hint{font-size:12.5px;color:var(--muted);text-align:center}
.pips{display:inline-flex;gap:3px}.pips i{width:8px;height:8px;border-radius:50%;background:var(--line)}.pips i.f{background:var(--ok)}
.act{display:grid;grid-template-columns:1fr 64px 1fr;gap:10px}
.act .btn{padding:14px 6px}
.starb{border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:24px;color:var(--muted)}
.starb.on{color:var(--star)}
/* mcq */
.stem{font-size:16px;margin-bottom:12px}
.stem .ql{display:block;font-weight:800;margin-top:10px;color:var(--p)}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:9px;font-size:15.5px}
.opt .k{flex:0 0 28px;height:28px;border-radius:50%;background:var(--pl);color:var(--p);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt.sel{border-color:var(--p);background:var(--pl)}
.opt.sel .k{background:var(--p);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okl)} .opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badl)} .opt.wrong .k{background:var(--bad);color:#fff}
.opt .why{display:block;font-size:13.5px;color:var(--muted);margin-top:4px}
.verdict{border-radius:14px;padding:12px 14px;margin:6px 0 12px;font-size:15px}
.verdict.ok{background:var(--okl);border-left:5px solid var(--ok)} .verdict.bad{background:var(--badl);border-left:5px solid var(--bad)}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.dots button{width:32px;height:32px;border-radius:9px;background:var(--card);border:1.5px solid var(--line);font-size:12.5px}
.dots button.a{background:var(--pl);border-color:var(--p3)} .dots button.c{border-color:var(--p);border-width:2.5px;font-weight:800}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--p)}
.score{font-size:46px;font-weight:900;color:var(--p);text-align:center;line-height:1.1}
details{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-bottom:9px;overflow:hidden}
summary{padding:12px 14px;cursor:pointer;list-style:none;font-size:15px}
summary::-webkit-details-marker{display:none}
details .in{padding:0 14px 14px;font-size:15px}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:7px;background:var(--pl);color:var(--p);font-weight:700;margin-right:5px}
.tag.g{background:var(--okl);color:var(--ok)} .tag.r{background:var(--badl);color:var(--bad)}
.trow{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.modal{position:fixed;inset:0;background:rgba(2,28,32,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;border-radius:22px 22px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90%;text-align:center}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
label.lb{font-size:13px;color:var(--muted);display:block;margin:10px 0 4px}
code{background:var(--pl);padding:1px 5px;border-radius:5px;font-size:13px}
@media (min-width:900px){
  main{max-width:860px;padding:22px}
  nav{justify-content:center} nav button{max-width:150px}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .face .q{font-size:22px} .flip{min-height:340px}
}
.prov{display:inline-block;font-size:11.5px;color:var(--p);background:var(--pl);border-radius:7px;padding:2px 7px;margin-top:6px;overflow-wrap:anywhere}
.face .src{overflow-wrap:anywhere}
details.grp{box-shadow:none;background:transparent;margin-bottom:6px}
details.grp>summary{padding:8px 4px;font-weight:700;font-size:14.5px}
details.grp>.chips{padding:0 2px 8px}
.lt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:7px;box-shadow:var(--shadow)}
.tstar{color:var(--star);font-size:15px;letter-spacing:1px;white-space:nowrap;margin-left:4px}.tstar .off{color:var(--line)}
[data-theme=dark] .tstar .off{color:#3a5a54}
pre{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;max-height:220px;overflow:auto}
</style>

<script>
"use strict";
const BUILTIN = [{"id":"ear","title":"Common Ear Diseases & Audiology","short":"Ear & Audio","emoji":"👂","source":"Common Ear disease And Audiology new.pdf","topics":{"PINNA":"Pinna: perichondritis, haematoma & preauricular sinus","EAC":"Ear canal: wax, furunculosis, otitis externa & otomycosis","MOE":"Malignant (necrotising) otitis externa","OME":"Otitis media with effusion (glue ear)","AOM":"Acute otitis media","COM":"Chronic otitis media: types, complications & management","CHOL":"Cholesteatoma & mastoidectomy","VERT":"Vertigo: vestibular system, BPPV, Ménière's & labyrinthitis","PTA":"Pure tone audiometry & hearing loss","TYMP":"Tympanometry"},"cards":[{"t":"PINNA","q":"What is the pinna made of, and why does that structure explain its typical diseases?","a":"• Framework of **elastic cartilage** covered by **perichondrium**, with skin tightly adherent on the anterior (lateral) surface\n• Cartilage has **no blood supply of its own** – it is nourished by diffusion from the perichondrium\n• The **lobule has no cartilage** (fibro-fatty tissue only)\n• So: blood or pus that lifts the perichondrium starves the cartilage → necrosis and deformity; perichondritis characteristically **spares the lobule**","m":"Perichondrium = the cartilage's lunchbox: strip it off and the cartilage starves.","r":"Lecturer pearl"},{"t":"PINNA","q":"How are diseases of the pinna classified in this lecture?","a":"• **Infection** – perichondritis, pinna abscess\n• **Trauma** – seroma, haematoma\n• **Congenital** – e.g. preauricular sinus (also microtia, accessory tags, bat ears)","m":"Pinna problems = I-T-C: Infection, Trauma, Congenital.","r":"Slides p4-8"},{"t":"PINNA","q":"Perichondritis of the pinna: how does it present, what is the usual organism, and how is it treated?","a":"• Hot, red, very tender, swollen pinna; **lobule spared** (no cartilage)\n• Often follows **high (cartilage) ear piercing**, trauma, surgery or infected haematoma\n• Commonest organism: **Pseudomonas aeruginosa** (also Staph aureus)\n• Treatment: **systemic antibiotic** – choose anti-pseudomonal cover, e.g. oral **ciprofloxacin**; admit for IV if severe\n• Drain any collection early – untreated it destroys cartilage","m":"Pierced cartilage + Pseudomonas → Perichondritis → give Cipro. Lobule spared = no cartilage to infect.","r":"Slide p5"},{"t":"PINNA","q":"How do you manage a pinna abscess?","a":"• **Incision and drainage** of the pus\n• **Systemic antibiotic** (anti-staphylococcal and anti-pseudomonal cover)\n• Pressure dressing afterwards so the perichondrium re-adheres to the cartilage\n• Antibiotics alone are not enough once pus has lifted the perichondrium","m":"Where there is pus, let it out.","r":"Slide p5"},{"t":"PINNA","q":"Why does an untreated pinna haematoma lead to a cauliflower ear?","a":"• Blunt trauma (rugby, boxing, wrestling) shears blood vessels → blood collects **between perichondrium and cartilage**\n• The cartilage loses its perichondrial blood supply → **avascular necrosis**\n• The clot organises and fibroses, and new irregular cartilage forms → crumpled **cauliflower ear**\n• The haematoma may also become infected → perichondritis\n• Hence it is an **urgent** problem – drain early","m":"Blood under the lid starves the cartilage: drain early or it turns into cauliflower.","r":"Lecturer pearl"},{"t":"PINNA","q":"How is a pinna haematoma or seroma managed?","a":"• **Aspirate** the collection (wide-bore needle) and apply **compression**\n• **Recurrent** collection → **incision and drainage** with a **button (bolster) stitch** through the pinna to keep the perichondrium pressed to the cartilage\n• **Oral antibiotic** cover\n• Review in 24-48 h for reaccumulation","m":"Drain, then Squash: the bolster stops it refilling.","r":"Slide p6"},{"t":"PINNA","q":"What is a preauricular sinus, where is its opening, and does it need treatment?","a":"• Congenital blind-ending tract from **incomplete fusion of the six hillocks of His** (1st and 2nd branchial arches)\n• Pit at the **anterior margin of the ascending limb of the helix**, just in front of the ear; may be bilateral or familial\n• Lined by squamous epithelium – may discharge keratin\n• **Asymptomatic sinus: no treatment needed**","m":"A pit in front of the helix = a fusion fault of the hillocks.","r":"Slides p7-8"},{"t":"PINNA","q":"How do you manage an infected preauricular sinus, an acute abscess, and recurrent infection?","a":"• **Infection** → antibiotic\n• **Preauricular abscess** → **incision and drainage** + antibiotic (do not attempt excision in the acute phase)\n• **Recurrent infection** → **excision of the whole sinus tract** once quiet, following its branches down to the **temporalis fascia**\n• Incomplete excision is the main cause of recurrence","m":"Hot: drain it. Cold and recurrent: cut it all out, down to the fascia.","r":"Slide p8"},{"t":"EAC","q":"Describe the external auditory canal and explain why furuncles occur only in its outer part.","a":"• About **2.5 cm** long, S-shaped\n• **Outer 1/3 cartilaginous**: thick skin with **hair follicles, sebaceous and ceruminous glands**\n• **Inner 2/3 bony**: thin skin, no hair or glands, directly on periosteum (very painful when touched)\n• Furuncle = infected **hair follicle** → can only arise in the **outer cartilaginous third**\n• Wax is made in the outer third – wax deep in the bony canal suggests cotton-bud pushing","m":"No hair, no furuncle: boils live only in the hairy outer third.","r":"Lecturer pearl"},{"t":"EAC","q":"How is impacted ear wax managed?","a":"• Wax is normal and self-cleaning – remove only if symptomatic (blockage, deafness) or the TM must be seen\n• **Softening drops** first: olive oil or **sodium bicarbonate** drops for several days\n• Then **ear irrigation (syringing)** with water at body temperature (avoids caloric vertigo)\n• Or **microsuction** under the microscope, or instrumentation (Jobson Horne probe/wax hook)\n• Advise against cotton buds – they push wax deeper","m":"Soften, then Shift: drops first, then water or suction.","r":"Lecturer pearl"},{"t":"EAC","q":"When is ear syringing (irrigation) contraindicated?","a":"• Known or suspected **TM perforation** or history of discharge (risk of middle ear infection)\n• **Previous ear surgery** (e.g. mastoid cavity) or **grommet** in place\n• **Only-hearing ear**\n• **Acute otitis externa** or a painful, inflamed canal\n• Hard foreign body (vegetable seeds swell), cleft palate history\n• Use **microsuction** instead in these patients","m":"Never syringe a Hole, an Operated ear, the Only ear, or an Inflamed canal.","r":"Lecturer pearl"},{"t":"EAC","q":"What is furunculosis of the ear canal, and what organism causes it?","a":"• Inflammation/infection of a **hair follicle** in the **outer cartilaginous EAC** → **localised abscess**\n• Organism: **Staphylococcus aureus**\n• Main symptom: **severe pain**, worse on jaw movement and on pulling the pinna\n• Localised tender swelling; the rest of the canal and TM are normal","m":"A boil in the ear = a Staph boil like anywhere else on hairy skin.","r":"Slide p11"},{"t":"EAC","q":"How is ear canal furunculosis treated?","a":"• **Analgesia**\n• **Oral and/or topical antibiotic** (anti-staphylococcal, e.g. cloxacillin)\n• Glycerine-ichthammol wick may be used to reduce swelling\n• **Fluctuant** furuncle → **incision and drainage**\n• Recurrent furuncles → check **blood glucose** (diabetes)","m":"Recurrent boils? Check the sugar.","r":"Slide p11"},{"t":"EAC","q":"Define otitis externa.","a":"• A.k.a. **swimmer's ear**\n• A **generalised (diffuse)** inflammation of the skin of the external auditory canal, characterised by:\n• **Oedema**\n• **Erythema**\n• **Itchy discomfort**\n• **Ear discharge**\n• Contrast: furunculosis is **localised** to one hair follicle","m":"Furuncle = one spot; otitis externa = the whole canal.","r":"Slide p12"},{"t":"EAC","q":"What are the typical history and examination findings in diffuse otitis externa?","a":"• History: **pain and discharge at the same time**, itch, ± fever, **swimming or ear digging**\n• Exam: **tenderness on tragal palpation** (or pulling the pinna)\n• **Generalised oedematous, erythematous canal** with pus and debris ± granulation tissue\n• **TM intact** (if visible) – helps separate it from discharging otitis media","m":"Tragus tender, TM intact = the problem is outside the drum.","r":"Slide p13"},{"t":"EAC","q":"What are the risk factors for otitis externa?","a":"• **Dermatological**: eczema, **seborrhoeic dermatitis**\n• **Allergic**: atopy, non-atopic allergy, sensitivity to topical medicines (e.g. drops)\n• **Physiological**: humid environment, immunosuppression\n• **Traumatic**: skin maceration (water), ear probing (cotton buds), laceration, radiotherapy\n• **Anatomical**: narrow canal (hereditary, iatrogenic, **exostosis**)","m":"DAPTA: Dermatological, Allergic, Physiological, Traumatic, Anatomical.","r":"Slide p14"},{"t":"EAC","q":"Which organisms cause bacterial otitis externa?","a":"• **Pseudomonas species – 50-65%** (commonest)\n• Other Gram-negative organisms – 25-35%\n• **Staphylococcus aureus** – 15-30%\n• Streptococci – 9-15%\n• Hence topical drops should cover **Pseudomonas** (e.g. ciprofloxacin or ofloxacin)","m":"Swimming pool water loves Pseudomonas.","r":"Slide p15"},{"t":"EAC","q":"How is otitis externa treated, and when is an ear wick needed?","a":"• **Ear toilet (aural mopping/microsuction)** – drops cannot work on a canal full of debris\n• **Topical antibiotic ± steroid drops** (quinolone preferred; avoid aminoglycoside drops if the TM is not seen or is perforated)\n• **Ear wick** when the canal is too swollen for drops to enter – drops are placed on the wick, which swells and carries them in; change in 48-72 h\n• Analgesia; keep the ear **dry**\n• **Severe** (cellulitis, fever, diabetic): add **systemic antibiotic**\n• **Ear care** advice to prevent recurrence","m":"Clean it, Drop it, Wick it if it's shut, keep it Dry.","r":"Slide p16"},{"t":"EAC","q":"Otomycosis: organisms, clinical features and treatment?","a":"• Fungal otitis externa, often after prolonged antibiotic drops or in humid climates\n• **Aspergillus niger** – black-grey spores on white hyphae (wet newspaper look); **Candida albicans** – white creamy debris\n• Features: **intense itch**, pain, **ear blockage**, discharge\n• Treatment: thorough **ear toilet** + **antifungal** drops/cream (e.g. clotrimazole)\n• **Stop antibiotic drops** – they encourage fungal overgrowth","m":"Black spores = Aspergillus niger; itch more than pain = think fungus.","r":"Slide p17"},{"t":"EAC","q":"What ear care advice should you give patients with ear infection?","a":"• **Water precautions**: ear plug or cotton wool soaked in oil when bathing, avoid swimming, avoid washing inside the ear during ablution\n• **Do not dig** the ear with cotton buds or metal objects\n• Avoid **prolonged use of headphones/ear buds**, and keep them clean\n• Use ear drops correctly: lie with the ear up for a few minutes, press the tragus to pump drops in, complete the course","m":"Dry, Don't dig, Disinfect earphones, Drops done properly.","r":"Slide p64"},{"t":"MOE","q":"What is malignant (necrotising) otitis externa, and who gets it?","a":"• Bacterial infection of the soft tissue of the external ear that **spreads to periosteum and bone of the skull base** (skull base osteomyelitis)\n• 'Malignant' because of its aggressive course – **not a cancer**\n• Typically **elderly diabetics** or the immunocompromised (HIV, chemotherapy)\n• Organism: almost always **Pseudomonas aeruginosa**\n• Spreads from the canal floor through the **fissures of Santorini** and the bony-cartilaginous junction (see also deck fnp)","m":"Old + Diabetic + Painful ear that will not settle = MOE until proven otherwise.","r":"Slide p18"},{"t":"MOE","q":"What clinical features should make you suspect malignant otitis externa rather than simple otitis externa?","a":"• **Excruciating, deep, nocturnal** otalgia out of proportion to the signs\n• Persistent discharge despite more than a week of topical treatment\n• **Granulation tissue on the floor of the canal** at the **bony-cartilaginous junction**\n• **Cranial nerve palsy** – facial (VII) first (stylomastoid foramen), then IX, X, XI (jugular foramen) and XII\n• Often little fever; ESR/CRP raised","m":"Granulation on the floor + night pain + facial palsy in a diabetic = skull base osteomyelitis.","r":"Slide p19"},{"t":"MOE","q":"What are the Cohen & Friedman (1987) criteria for malignant otitis externa?","a":"• **Major (all required)**: **pain**, **oedema**, **exudate**, **granulations**, **microabscess** (at operation), **positive Tc-99m bone scan** or **failure of local treatment ≥ 1 week**\n• **Minor**: **Pseudomonas** on culture, positive bone radiograph, **diabetes**, **cranial nerve involvement**, debilitating condition, **old age**\n• Note: slide lists 'ESR (high)' as a minor criterion – ESR is **not** part of the original criteria; ESR/CRP are used to **monitor** treatment","m":"Majors = what you see and scan (pain, swelling, pus, granulation, abscess, scan/failure); minors = who the patient is.","r":"Slide p19"},{"t":"MOE","q":"What investigations are done in suspected malignant otitis externa?","a":"• Bloods: **FBC, ESR, CRP**, blood glucose/HbA1c\n• **Swab C&S** – Pseudomonas and its sensitivities\n• **Biopsy of the granulation tissue** – to exclude **squamous cell carcinoma** of the canal\n• **HRCT temporal bone** (bone erosion) ± MRI (soft-tissue and marrow spread, intracranial extent) especially if complications\n• Nuclear scan (Tc-99m for diagnosis – see next card)","m":"Bloods, Bug, Biopsy, Bone imaging.","r":"Slide p20"},{"t":"MOE","q":"Technetium-99m vs gallium-67 scan in malignant otitis externa – what is each used for?","a":"• **Tc-99m bone scan** shows osteoblastic activity → very sensitive for **diagnosis**, but stays **positive for months** even after cure\n• **Gallium-67** (or indium-labelled WBC) scan shows active inflammation → used to **monitor response** and decide **when to stop antibiotics**\n• Note: slide says the bone scan is for diagnosis and to evaluate response – correct is **Tc-99m to diagnose, gallium to monitor**","m":"Technetium = Tells you it's there; Gallium = Gone yet?","r":"Slides p20-21"},{"t":"MOE","q":"How is malignant otitis externa treated?","a":"• **Admit** – pain control, close monitoring\n• **Systemic anti-pseudomonal antibiotic**: **ciprofloxacin**, typically **IV ~2 weeks then oral** – total about **6-8 weeks** (guided by culture)\n• **Strict blood sugar control**\n• **Regular ear toilet** + topical antibiotic drops\n• **Monitor** symptoms, ESR/CRP and **gallium scan**\n• Surgery only for biopsy/debridement of sequestrum or abscess","m":"Admit, Antibiotic for weeks, Aural toilet, Assess sugar, Assess response.","r":"Slide p21"},{"t":"OME","q":"Define otitis media with effusion (glue ear).","a":"• Accumulation of **non-purulent (serous or mucoid) fluid** in the middle ear cleft\n• **Without signs or symptoms of acute inflammation** (no fever, no acute pain, TM not inflamed)\n• Commonest cause of **hearing loss in children**","m":"Fluid without fire.","r":"Slide p23"},{"t":"OME","q":"Why are otitis media with effusion and acute otitis media commoner in children?","a":"• Child's **Eustachian tube is shorter, wider and more horizontal** → nasopharyngeal secretions and organisms reach the middle ear easily, and drainage is poor\n• Tube opening muscle (tensor veli palatini) is less efficient\n• **Adenoids** are large and harbour bacteria/obstruct the tube\n• Frequent URTIs and immature immunity","m":"Short, Wide, Flat tube = an open door to the middle ear.","r":"Lecturer pearl"},{"t":"OME","q":"What are the risk factors for otitis media with effusion?","a":"• **Eustachian tube dysfunction**\n• **Allergy** / allergic rhinitis\n• **Unresolved acute otitis media**\n• **Nasal or nasopharyngeal obstruction** – allergic rhinitis, **adenoid hypertrophy**, nasopharyngeal mass\n• **Craniofacial anomalies** – **cleft lip/palate**, **Down syndrome**\n• Others: passive smoking, day-care attendance, bottle feeding","m":"Anything that blocks or weakens the tube: Tube, Allergy, Adenoid, Cleft, Down.","r":"Slide p23"},{"t":"OME","q":"An adult presents with unilateral otitis media with effusion. What must you exclude, and how?","a":"• **Nasopharyngeal carcinoma (NPC)** – tumour in the fossa of Rosenmüller blocks the Eustachian tube\n• Very high-yield in Malaysia (high incidence, especially in Chinese and Bidayuh populations)\n• Ask about epistaxis, nasal blockage, neck lump, cranial nerve symptoms\n• **Nasoendoscopy of the postnasal space** ± biopsy; EBV serology; examine the neck\n• Never just insert a grommet without looking at the nasopharynx","m":"Adult + one glue ear = look behind the nose (NPC).","r":"Lecturer pearl"},{"t":"OME","q":"What are the clinical features of otitis media with effusion in children?","a":"• **Reduced hearing** – often noticed by parents or teachers ('not listening', TV volume up)\n• Ear blockage, mild otalgia\n• **Speech and language delay**\n• **Poor performance at school**, behavioural problems\n• Often bilateral and painless – may be picked up on screening","m":"Quiet child, quiet ears: a hearing problem until proven otherwise.","r":"Slide p24"},{"t":"OME","q":"What does the tympanic membrane look like in otitis media with effusion?","a":"• **Dull, yellowish/amber, opaque** TM\n• **Diffuse (lost) cone of light**\n• **Air-fluid level** or **air bubbles** behind the drum\n• Usually **retracted** with reduced mobility on pneumatic otoscopy; occasionally bulging\n• Often associated with **adenoid hypertrophy**","m":"Amber drum with a fluid line = glue.","r":"Slide p25"},{"t":"OME","q":"What do tuning fork tests, PTA and tympanometry show in otitis media with effusion?","a":"• Tuning forks: **Rinne negative**, **Weber to the affected ear** → conductive loss\n• PTA: **conductive hearing loss** (air-bone gap), typically 20-40 dB\n• Tympanometry: **type B (flat)** with **normal ear canal volume**\n• Normal ECV distinguishes effusion from perforation (high ECV) or wax (low ECV)","m":"Flat line, Normal volume = fluid behind an intact drum.","r":"Slide p26"},{"t":"OME","q":"What is the initial (non-surgical) management of otitis media with effusion?","a":"• **Active observation for 3 months** – most effusions resolve spontaneously\n• Repeat hearing test at the end of the period; advise on classroom seating and speaking clearly\n• Patients with **allergic symptoms**: treat the allergy – **intranasal steroid**, antihistamine\n• Antibiotics, decongestants and antihistamines do **not** clear the effusion itself\n• Hearing aid is an alternative to surgery","m":"Watch and wait 3 months – glue usually dissolves.","r":"Slide p27"},{"t":"OME","q":"When is grommet insertion indicated in otitis media with effusion, and where is it placed?","a":"• Indication: **persistent OME after 3 months** with **CHL > 25 dB** (bilateral, or with speech/educational impact)\n• **Myringotomy and grommet (ventilation tube)** in the **anteroinferior quadrant** – away from the ossicles and chorda tympani and least likely to injure the stapes or round window\n• Grommet **ventilates** the middle ear, bypassing the faulty Eustachian tube; extrudes in 6-12 months\n• **+ Adenoidectomy** if adenoid hypertrophy (also lowers recurrence)","m":"3 months, 25 dB, Anteroinferior: the grommet rule.","r":"Slide p27"},{"t":"AOM","q":"What is otitis media, and how are acute and chronic otitis media separated by time?","a":"• **Otitis media** = generic term for **all types of inflammation of the middle ear**\n• **Acute**: ear symptoms present **< 3 weeks**\n• **Chronic**: ear symptoms present **> 3 months**\n• (Between these, some texts use 'subacute')","m":"Acute = under 3 weeks; Chronic = over 3 months.","r":"Slides p28-29"},{"t":"AOM","q":"Who typically gets acute otitis media, and which organisms cause it?","a":"• Peak in **children 6 months-2 years**, usually after a **viral URTI**\n• Commonest bacteria: **Streptococcus pneumoniae**, **non-typeable Haemophilus influenzae**, **Moraxella catarrhalis** (also Group A Strep)\n• Route: up the **Eustachian tube** from the nasopharynx\n• Risk factors: day care, passive smoking, bottle feeding lying flat, adenoids, cleft palate","m":"The 'big three': Pneumococcus, Haemophilus, Moraxella – same bugs as sinusitis.","r":"Lecturer pearl"},{"t":"AOM","q":"What are the four stages of acute otitis media?","a":"• 1. Stage of **tubal occlusion**\n• 2. Stage of **pre-suppuration**\n• 3. Stage of **suppuration**\n• 4. Stage of **resolution**\n• (If untreated or virulent, it may progress to complications instead of resolution)","m":"Tube blocks → Pink drum → Pus (bulge) → Pops (perforation).","r":"Slide p30"},{"t":"AOM","q":"Compare the stage of tubal occlusion with the stage of pre-suppuration in AOM.","a":"• **Tubal occlusion**: Eustachian tube blocked by **oedema of the nasopharynx** → air absorbed → **TM retracted**; reduced hearing and otalgia\n• **Pre-suppuration**: prolonged occlusion → **invasion by pyogenic organisms** → inflammatory exudate in the middle ear → **congested, hyperaemic TM** (cartwheel vessels); otalgia, reduced hearing, tinnitus","m":"Stage 1 the drum is sucked In; stage 2 it turns Red.","r":"Slides p31-32"},{"t":"AOM","q":"What happens in the stage of suppuration of AOM, and what are its features?","a":"• **Pus forms in the middle ear** under pressure\n• **Bulging TM** (red/yellow, loss of landmarks)\n• **Otalgia at its worst** (increasing intensity), reduced hearing\n• **Fever**, irritability, unwell child\n• This is the stage at which **myringotomy** may be needed to relieve pain","m":"Bulge = worst pain, highest fever.","r":"Slide p33"},{"t":"AOM","q":"What happens in the stage of resolution of AOM?","a":"• **TM ruptures** → pus released → inflammatory process starts to resolve\n• **Pain reduces** suddenly, followed by **ear discharge** (often blood-stained then mucopurulent)\n• Exam: **TM perforation** (small, usually central) with an inflamed TM\n• Most perforations heal spontaneously within weeks","m":"Pop = relief: the pain stops when the drum bursts.","r":"Slide p34"},{"t":"AOM","q":"What are the symptoms and signs of acute otitis media, especially in children?","a":"• Otalgia (young children **rub or pull the ear**), ear fullness, reduced hearing\n• **Fever**, **irritability**, poor feeding, unwell child\n• ± Ear discharge\n• TM: **inflamed, bulging with pus behind an intact drum**, or **perforated with pus discharge**","m":"Fever + ear-tugging + bulging red drum = AOM.","r":"Slide p35"},{"t":"AOM","q":"What is the medical treatment of acute otitis media?","a":"• **Analgesia** (paracetamol/ibuprofen) – the mainstay\n• **Oral amoxicillin** first line (5-7 days; longer if < 2 years or severe); amoxicillin-clavulanate if failure; or **watchful waiting** 48-72 h in selected older, well children\n• **Topical antibiotic drops** (non-ototoxic **quinolone**) only if the TM is **perforated/discharging**\n• Treat associated URTI symptomatically\n• Note: slide lists antihistamine for URTI – **antihistamines and decongestants have no proven benefit in AOM**","m":"Pain relief + Amoxicillin; drops only if the drum has a hole.","r":"Slide p36"},{"t":"AOM","q":"When is myringotomy indicated in AOM, and which features mean complicated disease needing urgent referral?","a":"• **Myringotomy**: **severe pain with a bulging TM** (releases pus, relieves pain, gives a culture specimen); failed medical treatment\n• Refer urgently if: **postauricular swelling/tenderness** (mastoiditis), **facial palsy**, vertigo, severe headache, neck stiffness, drowsiness (intracranial spread)\n• Persistent discharge > 3 weeks or effusion > 3 months → review for COM/OME","m":"Bulging + agony = let it out; swelling behind the ear or a weak face = refer today.","r":"Slide p36"},{"t":"COM","q":"Define chronic otitis media.","a":"• **Chronic inflammation of the middle ear and mastoid mucosa**\n• In which the **tympanic membrane is not intact (perforation)**\n• With **discharge (otorrhoea) for > 3 months** when active\n• May be **active** (discharging) or **inactive** (dry perforation)","m":"COM = Chronic hole + On-and-off discharge for More than 3 months.","r":"Slide p37"},{"t":"COM","q":"What are the features of tubotympanic (safe) chronic otitis media?","a":"• Discharge: **profuse, mucoid, odourless**\n• Perforation: **central** (rim of TM all round)\n• Granulation tissue: **uncommon**\n• Cholesteatoma: **absent**\n• Complications: **rare**\n• Disease of the mucosa of the anteroinferior middle ear cleft (tubotympanum)","m":"Safe = Central, Copious, no smell.","r":"Slide p38"},{"t":"COM","q":"What are the features of atticoantral (unsafe) chronic otitis media?","a":"• Discharge: **scanty, purulent, foul-smelling** (anaerobes + keratin)\n• Perforation: **marginal** or **attic (pars flaccida)**\n• Granulation tissue and aural polyps: **common**\n• Cholesteatoma: **frequent**\n• Complications: **common** – because bone is eroded\n• 'Unsafe' = squamous disease of the attic, antrum and mastoid","m":"Unsafe = Scanty, Smelly, at the Side (marginal) or attic.","r":"Slide p38"},{"t":"COM","q":"How are the complications of chronic otitis media classified?","a":"• **Extracranial – intratemporal**: acute mastoiditis/mastoid abscess, labyrinthitis, petrositis, facial nerve palsy\n• **Extracranial – extratemporal**: postauricular, **Bezold**, **Citelli**, **Luc**, zygomatic and retromastoid abscesses\n• **Intracranial**: meningitis, extradural abscess, subdural abscess, otogenic brain abscess, **lateral sinus thrombophlebitis**, otitic hydrocephalus","m":"Think concentric rings: inside the temporal bone → outside it in the neck/face → inside the skull.","r":"Slide p39"},{"t":"COM","q":"What are the signs of acute mastoiditis with mastoid abscess?","a":"• **Pinna pushed forwards and downwards** (outwards)\n• **Swelling over the mastoid** – tender, fluctuant, erythematous; postauricular sulcus obliterated\n• **Sagging of the posterosuperior meatal wall** on otoscopy (periosteum of the antrum pushed down)\n• Plus fever, worsening otalgia and discharge","m":"Sag of the posterosuperior wall = pus in the antrum next door.","r":"Slide p40"},{"t":"COM","q":"What is Gradenigo's syndrome?","a":"• Complication of **petrositis** (infection of the petrous apex air cells)\n• Triad: **persistent otorrhoea**, **pain in the CN V distribution** (retro-orbital/deep facial pain – Gasserian ganglion), **lateral rectus palsy (CN VI)** → diplopia\n• CN VI is hit as it runs through **Dorello's canal** over the petrous apex","m":"Gradenigo: Gunk (otorrhoea), Grimace (V pain), Gaze palsy (VI).","r":"Slide p41"},{"t":"COM","q":"Facial nerve palsy in chronic otitis media: why does it happen and how is it managed?","a":"• Cholesteatoma or granulation erodes the bony **Fallopian canal** (tympanic segment) and inflames the nerve\n• Facial palsy in COM is an **indication for urgent surgery** (mastoid exploration and decompression) – not 'Bell's palsy'\n• Medical: **systemic steroid**, IV antibiotic, **facial physiotherapy**, **eye care – eye padding and artificial tears**\n• See deck fnp for nerve tests and grading","m":"A weak face with a smelly ear = cholesteatoma until proven otherwise.","r":"Slides p42, p46"},{"t":"COM","q":"Where do Bezold, Citelli, Luc and zygomatic abscesses point?","a":"• **Bezold**: pus breaks through the **mastoid tip** medially → **deep to sternocleidomastoid** (neck swelling)\n• **Citelli**: through the medial mastoid → **digastric triangle**\n• **Luc**: from the antrum via the **roof of the EAC** → **deep to temporalis**, no postauricular swelling\n• **Zygomatic**: via zygomatic air cells → swelling **in front of/above the ear**\n• **Postauricular** abscess is the commonest","m":"Bezold = Below (neck, under SCM); Luc = Lateral roof of canal under temporalis.","r":"Slides p39, p43"},{"t":"COM","q":"Which features in a patient with chronic otitis media suggest intracranial spread?","a":"• **Persistent headache**, high or swinging fever, vomiting\n• **Neck stiffness**, photophobia (meningitis)\n• **Drowsiness**, confusion, seizures, focal signs (brain abscess – temporal lobe or cerebellum)\n• Papilloedema, sixth nerve palsy (raised ICP, otitic hydrocephalus)\n• Action: admit, IV antibiotics, **urgent CT/MRI brain** with HRCT temporal bone, neurosurgical input","m":"Smelly ear + headache = CT the head, not paracetamol.","r":"Slide p39"},{"t":"COM","q":"What are the features of lateral (sigmoid) sinus thrombophlebitis as a complication of otitis media?","a":"• Infected thrombus in the sigmoid/lateral sinus adjacent to the mastoid\n• **'Picket-fence' fever** with rigors (septic emboli)\n• **Griesinger sign**: oedema and tenderness over the mastoid emissary vein (posterior mastoid)\n• Tobey-Ayer test (CSF pressure), papilloedema, possible otitic hydrocephalus\n• Diagnosis: **CT/MR venography** ('empty delta' sign); Rx: IV antibiotics + mastoidectomy ± anticoagulation","m":"Picket-fence fever = a fence of spikes from an infected venous sinus.","r":"Lecturer pearl"},{"t":"COM","q":"How is chronic otitis media categorised for management, and how is inactive (dry) COM managed?","a":"• Categories: **inactive**, **active without complication**, **active with complication**\n• **Inactive (dry perforation)**:\n• **Audiometry** (baseline hearing)\n• **Keep the ear dry** (water precautions)\n• After about **6 months dry**, offer **myringoplasty** (graft – usually temporalis fascia – to close the perforation)","m":"Dry for 6 months → patch the hole.","r":"Slide p44"},{"t":"COM","q":"How is active chronic otitis media without complication managed?","a":"• **Ear toilet/mopping** (microsuction) – the key step\n• **Topical** antibiotic drops – **better than oral** (very high local concentration): **ofloxacin ear drops**\n• **Keep the ear dry**\n• **Pus swab C&S only for unresolved cases**\n• Observe for complications and follow up","m":"Clean, Drop, Dry – then Follow.","r":"Slide p45"},{"t":"COM","q":"In active chronic otitis media, when are systemic antibiotics added, and why prefer quinolone drops?","a":"• Systemic antibiotics: **paediatric** patients, **granulation tissue**, or **not resolving with topical antibiotic alone**\n• **Quinolone drops (ofloxacin, ciprofloxacin)** are **not ototoxic** and cover Pseudomonas\n• **Aminoglycoside drops** (gentamicin, neomycin) risk **cochlear/vestibular toxicity** through a perforation – avoid when the TM is not intact if possible","m":"Hole in the drum? Pick a Quinolone, not an aminoglycoside.","r":"Slide p45"},{"t":"COM","q":"How is active chronic otitis media with complication managed?","a":"• Investigations: **pus swab**, **HRCT temporal bone ± brain** imaging, **audiometry**\n• Medical: **admit**, **systemic (IV) antibiotic**, topical drops, ear toilet\n• Facial palsy: systemic steroid, facial physiotherapy, eye padding, artificial tears\n• Surgical: **cortical mastoidectomy** (drain mastoid); canal wall down/modified radical if cholesteatoma\n• Drain abscesses; neurosurgery for intracranial collections","m":"Complication = Admit, IV, Image, Operate.","r":"Slide p46"},{"t":"CHOL","q":"What is a cholesteatoma, and why is it destructive?","a":"• **'Skin in the wrong place'**\n• Epidermal cyst of the middle ear and/or temporal bone with a **keratinising squamous epithelial lining**, containing **keratin and desquamated epithelium**\n• Natural history: **progressive growth with bone erosion** by **pressure** and **osteoclast activation** (enzymes from the inflamed matrix)\n• Erodes ossicles, scutum, lateral SCC, facial canal, tegmen, sigmoid plate → complications","m":"A skin bag that keeps filling with dead skin and eats bone.","r":"Slide p47"},{"t":"CHOL","q":"How are cholesteatomas classified?","a":"• **Congenital** – arises behind an **intact TM** from embryonic epithelial rests\n• **Acquired**:\n• a) **Primary acquired** – from a **retraction pocket**, no preceding infection or perforation\n• b) **Secondary acquired** – from a **perforation** after previous infection","m":"Congenital = behind intact drum; Primary = Pocket; Secondary = perforation.","r":"Slide p48"},{"t":"CHOL","q":"What are the Levenson criteria for congenital cholesteatoma?","a":"• **White mass medial to a normal TM**\n• **Normal pars tensa and pars flaccida**\n• **No history of otorrhoea or perforation**\n• **No prior otological procedure**\n• Classically a pearly white mass in the **anterosuperior quadrant** in a child","m":"White pearl behind a perfect drum, in an ear that has never been sick or operated on.","r":"Slide p49"},{"t":"CHOL","q":"What is primary acquired cholesteatoma, and which theories explain it?","a":"• Arises from a **retraction pocket** (usually **pars flaccida/attic**) due to Eustachian tube dysfunction and negative pressure\n• **Infection has not given rise** to it (no previous perforation)\n• Theories: **invagination/retraction pocket (Wittmaack)** and **basal cell hyperplasia (Ruedi)** – keratinocytes of the pars flaccida proliferate into the attic\n• Note: slide groups Ruedi under secondary acquired; most texts (Dhingra) place **basal cell hyperplasia under PRIMARY acquired**","m":"Primary = Pocket: Wittmaack sucks it in, Ruedi grows it in.","r":"Slides p50-51"},{"t":"CHOL","q":"What is secondary acquired cholesteatoma, and which theories explain it?","a":"• Arises through a **perforation** of the TM (usually **marginal** posterosuperior)\n• **Previous ear infection** is present\n• Theories: **epithelial invasion/migration (Habermann)** – canal/TM skin grows in through the perforation edge\n• **Squamous metaplasia** of middle ear mucosa after chronic infection (**Sadé**)\n• (Basal cell hyperplasia – Ruedi – is usually grouped with primary acquired)","m":"Secondary = skin migrates through a hole (Habermann) or mucosa Switches to skin (Sadé).","r":"Slide p51"},{"t":"CHOL","q":"What is the Sadé classification of pars tensa retraction?","a":"• **Grade 1** – slight retraction of the TM\n• **Grade 2** – severe retraction, TM **touching the incus or stapes**\n• **Grade 3** – **atelectasis**: TM touching the **promontory** (but not stuck)\n• **Grade 4** – **adhesive otitis**: TM **adherent to the promontory**\n• Deep, non-self-cleaning pockets can collect keratin → cholesteatoma","m":"Sadé for Tensa: slight → ossicles → promontory touch → promontory stuck.","r":"Slide p52"},{"t":"CHOL","q":"What is the Tos classification of pars flaccida (attic) retraction?","a":"• **Grade 1** – retracted pars flaccida **not in contact** with the neck of malleus\n• **Grade 2** – **in contact with the neck of malleus**\n• **Grade 3** – as grade 2 plus **limited erosion of the outer attic wall (scutum)**\n• **Grade 4** – as grade 3 plus **severe erosion** of the outer attic wall/scutum\n• Erosion of the scutum marks the shift towards cholesteatoma","m":"Tos for the Top (attic): 1 free, 2 touching malleus, 3 nibbling the scutum, 4 eating it.","r":"Slide p53"},{"t":"CHOL","q":"What are the symptoms and otoscopic signs of cholesteatoma?","a":"• Symptoms: **scanty, foul-smelling otorrhoea**, bleeding, **hearing loss**, otalgia, tinnitus, **vertigo** (fistula)\n• Signs: **attic retraction/perforation** or **marginal perforation**\n• **Pearly white cholesteatoma flakes** with a fishy odour\n• **Granulation tissue**, **attic polyp**\n• Scanty, purulent, foul discharge","m":"Smelly, scanty, and white flakes in the attic.","r":"Slide p54"},{"t":"CHOL","q":"Why must the attic always be examined even when a central perforation is seen?","a":"• An **attic cholesteatoma sac** can coexist with a pars tensa (central) perforation\n• Seeing a 'safe' central perforation can falsely reassure – the attic disease is easily missed behind a crust or polyp\n• Clear crusts at the **pars flaccida** with microsuction under the microscope\n• Large attic cholesteatomas may expose the **head of malleus** or extend into the mesotympanum","m":"Never stop at the first hole – always look upstairs (attic).","r":"Slides p55-56"},{"t":"CHOL","q":"Which investigations are done for cholesteatoma, and what are the other indications for HRCT temporal bone?","a":"• **HRCT temporal bone** – extent of disease and nearby anatomy (surgical roadmap)\n• **Swab C&S**; **HPE of granulation tissue** to exclude malignancy; audiometry\n• Other HRCT indications: **suspected complications**, **revision surgery**, **TM not visualised**/indeterminate exam, **children** (exclude petrous apex lesion), **only or better-hearing ear**","m":"Scan when it's Complicated, Revised, Can't be seen, a Child, or the Crucial (only) ear.","r":"Slide p57"},{"t":"CHOL","q":"What are the HRCT hallmarks of cholesteatoma, and what is the earliest sign?","a":"• **Soft-tissue mass** with homogeneous opacity and **sharp, defined borders**, especially in the **attic and non-dependent** areas (fluid lies dependent)\n• **Bone erosion** of the **scutum**, incus and malleus, or mastoid air cells\n• **Blunting of the scutum** is often the **earliest sign**\n• Also look at lateral SCC (fistula), tegmen, facial canal, sigmoid plate","m":"Blunt scutum = the first bite of cholesteatoma.","r":"Slide p58"},{"t":"CHOL","q":"What is the role of medical versus surgical treatment in cholesteatoma?","a":"• Medical (holding measures only): **regular microsuction clearance** and follow-up, **topical ear drops**, **strict dry-ear precautions** – for the unfit, or to quieten the ear before surgery\n• **Surgery is the mainstay: mastoidectomy**\n• Presence of cholesteatoma **mandates surgery** – there is **no medical alternative** that removes the disease\n• Aims: safe dry ear first, hearing second","m":"Drops dry it, only a drill removes it.","r":"Slides p59-60"},{"t":"CHOL","q":"Canal wall-up versus canal wall-down mastoidectomy – what is the difference and which operations are in each group?","a":"• **Canal wall-up**: **preserves the posterior wall of the EAC** – atticotomy, attico-antrostomy, **cortical (Schwartze) mastoidectomy**, **combined approach tympanoplasty**\n• Normal-looking canal, no cavity care, but higher **residual/recurrent** disease → second-look surgery\n• **Canal wall-down**: posterior canal wall removed – **radical** and **modified radical mastoidectomy**\n• Best exposure and lower recurrence, but leaves an open **mastoid cavity** needing lifelong care","m":"Wall Up = looks normal, may hide disease; Wall Down = open cavity, nowhere to hide.","r":"Slide p61"},{"t":"CHOL","q":"Radical versus modified radical mastoidectomy – what is the key difference?","a":"• **Radical**: eradicates disease from middle ear and mastoid **without reconstructing hearing** – posterior meatal wall removed; middle ear, attic, antrum and mastoid made **one cavity**; TM remnants, ossicles (**except stapes footplate**) and mucosa removed; **Eustachian tube obliterated** with muscle/cartilage\n• **Modified radical**: same cavity but **hearing mechanism preserved** as much as possible – TM remnants and ossicles (especially **handle of malleus and stapes**)\n• Further modification: TM grafting and ossicular reconstruction = **mastoidectomy with tympanoplasty**","m":"Radical = clear everything, sacrifice hearing; Modified = clear disease, keep what hears.","r":"Slides p62-63"},{"t":"VERT","q":"What is vertigo, and what must you distinguish it from in a 'dizzy' patient?","a":"• Vertigo is a **symptom, not a disease**\n• **True vertigo** = an **illusion of movement**, usually spinning (self or surroundings)\n• Distinguish from **light-headedness**, **presyncope** (about to faint – cardiovascular, postural hypotension) and **imbalance/unsteadiness while walking**\n• Then decide: **peripheral** (labyrinth/vestibular nerve) or **central** (brainstem/cerebellum) cause","m":"Spinning = vestibular; swooning = circulation; staggering = gait/neurology.","r":"Slide p66"},{"t":"VERT","q":"What do the semicircular canals, utricle and saccule each detect?","a":"• **Semicircular canals** (3, at right angles; crista ampullaris) → **angular (rotational) acceleration**\n• **Otolith organs** (maculae with otoconia) → **linear acceleration** and gravity:\n• **Utricle** → **horizontal** linear movement (**forward-backward**)\n• **Saccule** → **vertical** linear movement (**up-down**, e.g. a lift)","m":"Canals = Turning; Utricle = forward in a car; Saccule = up in a lift.","r":"Slides p67-68"},{"t":"VERT","q":"What are the vestibulo-ocular and vestibulospinal reflexes?","a":"• **VOR (vestibulo-ocular reflex)**: keeps the **eyes stable on a target during head movement** – eyes move equal and opposite to the head\n• **VSR (vestibulospinal reflex)**: maintains **balance and posture** via antigravity muscles\n• An acute unilateral vestibular loss upsets the VOR → **nystagmus** and oscillopsia; upsets the VSR → falling to the side of the lesion","m":"VOR steadies the camera (eyes); VSR steadies the tripod (body).","r":"Slide p69"},{"t":"VERT","q":"List the main peripheral and central causes of vertigo.","a":"• **Peripheral** (vestibular end-organ and nerve): **BPPV**, **Ménière's disease**, **labyrinthitis**, vestibular neuritis/vestibulopathy\n• **Central** (brain/brainstem/cerebellum): **stroke** (posterior circulation), **tumour (acoustic neuroma** – vestibular schwannoma at the CP angle), **multiple sclerosis**, **vestibular migraine**","m":"Peripheral = BMLV; Central = Stroke, Schwannoma, Sclerosis, migraine.","r":"Slide p70"},{"t":"VERT","q":"How does nystagmus help distinguish peripheral from central vertigo?","a":"• **Peripheral**: **unidirectional** in all gaze positions, **horizontal-torsional (rotatory)**, **suppressed by visual fixation**, **fatigable**, appears after a **latency (lag)** on positional testing\n• **Central**: **changes direction** with gaze position, may be **pure vertical** (down/upbeat) or pure torsional, **not suppressed by fixation**, non-fatigable, no latency","m":"Peripheral nystagmus is polite: one direction, tires out, hides when you stare. Central nystagmus is rude.","r":"Slide p71"},{"t":"VERT","q":"Apart from nystagmus, which features separate peripheral from central vertigo?","a":"• **Imbalance**: peripheral mild-moderate and **episodic**; central **severe, mostly constant** (may be unable to stand)\n• **Neurological symptoms**: peripheral **rare**; central **frequent** (diplopia, dysarthria, ataxia, weakness)\n• **Hearing loss**: peripheral **frequent**; central **rare**\n• **Nausea/vomiting**: peripheral **severe**; central variable\n• **Recovery by central compensation**: peripheral **rapid**; central **slow**","m":"Peripheral = sick and deaf but walks; Central = can't walk, has neuro signs.","r":"Slide p71"},{"t":"VERT","q":"What is BPPV and what causes it?","a":"• **Benign paroxysmal positional vertigo** – the **most common** cause of peripheral vertigo\n• **Otoconia dislodged from the utricle** float into a semicircular canal (canalolithiasis) and make the cupula respond to gravity\n• **Posterior semicircular canal in ~80%** (most dependent canal)\n• Brief vertigo lasting **seconds (usually < 1 min)**, triggered by **head position** – rolling in bed, looking up, bending\n• No hearing loss, no tinnitus","m":"Loose stones from the utricle roll down the posterior canal when you roll over in bed.","r":"Slide p72"},{"t":"VERT","q":"How is the Dix-Hallpike test performed and what is a positive result for posterior canal BPPV?","a":"• Patient sits; head turned **45°** to the test side; lie back quickly with the head **hanging ~20-30° below horizontal**\n• Positive: after a **latency of a few seconds** → vertigo with **torsional, upbeating, geotropic nystagmus** (towards the lower ear)\n• Lasts **< 1 minute**; **reverses** on sitting up; **fatigues on repetition**\n• The **dependent (lower) ear** is the affected one","m":"Latent, Limited, Lessens (fatigues), Lower ear affected.","r":"Lecturer pearl"},{"t":"VERT","q":"What is the Epley manoeuvre and what advice follows it?","a":"• **Canalith repositioning manoeuvre** for posterior canal BPPV\n• Starts from the positive Dix-Hallpike position, then a series of head turns (90° to the other side, roll onto the side with the nose down, then sit up), holding each ~30-60 s\n• Moves otoconia out of the posterior canal back into the **utricle**\n• Success ~80% after 1-2 manoeuvres; may repeat; Brandt-Daroff exercises at home\n• Vestibular sedatives are not needed and delay compensation","m":"Hallpike finds the stones; Epley puts them back.","r":"Lecturer pearl"},{"t":"VERT","q":"What is Ménière's disease and how does it present?","a":"• **Idiopathic endolymphatic hydrops** (excess endolymph distending the membranous labyrinth)\n• Triad: **episodic vertigo**, **fluctuating hearing loss with aural fullness**, **tinnitus**\n• Hearing loss is **sensorineural**, typically **low-frequency** early, worsening progressively\n• Associated **nausea and vomiting**\n• Attacks last **20 minutes to 12 hours** (slide: minutes to hours) – much longer than BPPV seconds","m":"Ménière's = a waterlogged inner ear: Vertigo + Fullness + Tinnitus + Low-tone loss.","r":"Slide p75"},{"t":"VERT","q":"What is the medical management of Ménière's disease?","a":"• **Acute attack**: vestibular sedatives/antiemetics – **prochlorperazine**, **promethazine** – short term only (they delay compensation)\n• **Prophylaxis**: **betahistine** (Betaserc)\n• **Lifestyle**: **low-salt diet**, stop smoking and alcohol, limit caffeine\n• **Vestibular rehabilitation**\n• **Intratympanic steroid** (hearing-sparing) or **intratympanic gentamicin** (chemical labyrinthectomy – risks hearing) if attacks persist","m":"Acute: sedate; Long-term: Betahistine + low Salt; Resistant: drip into the drum.","r":"Slide p76"},{"t":"VERT","q":"What surgical options exist for Ménière's disease, and when are they used?","a":"• Only **if medical treatment fails** to control vertigo\n• **Endolymphatic sac decompression** – conservative, hearing preserved\n• **Vestibular neurectomy** – cuts the vestibular nerve, preserves hearing, controls vertigo\n• **Labyrinthectomy** – destructive, only when hearing in that ear is already **non-serviceable**\n• Choice depends on **hearing level** and the other ear","m":"Save hearing → sac or nerve cut; hearing already gone → destroy the labyrinth.","r":"Slide p76"},{"t":"VERT","q":"How is labyrinthitis classified, and how do serous and suppurative labyrinthitis differ?","a":"• **Infective**: suppurative (bacterial), serous (viral), circumscribed (focal), syphilitic, fungal\n• **Non-infective (sterile)**: autoimmune, labyrinthitis ossificans, toxic/drug-induced\n• **Serous (viral)**: inflammation without pus → vertigo with partial, often **recoverable** hearing loss\n• **Suppurative (bacterial)**: pus in the labyrinth (from otitis media or meningitis) → severe vertigo and **total, permanent hearing loss** (dead ear)","m":"Serous = may Spare hearing; Suppurative = Sacrifices it.","r":"Slide p77"},{"t":"VERT","q":"What is circumscribed labyrinthitis and how is it detected?","a":"• **Focal inflammation of the bony labyrinth** – usually from **cholesteatoma eroding the lateral semicircular canal** (labyrinthine fistula)\n• Brief vertigo on pressure changes: pressing the tragus, nose blowing, cleaning the ear\n• **Positive fistula test**: pressure on the tragus/pneumatic speculum → vertigo and nystagmus\n• Hearing usually preserved at first; HRCT confirms; needs **surgery** (remove matrix over the fistula carefully)","m":"Press the tragus, the eyes jump = a hole in the lateral canal.","r":"Slide p77"},{"t":"PTA","q":"What is pure tone audiometry and what is it used for?","a":"• **Subjective** test of a person's ability to hear pure tones of various frequencies, using an **audiometer** in a soundproof booth\n• Determines:\n• **Hearing threshold level** (quietest tone heard 50% of the time)\n• **Type** of hearing loss\n• **Severity** of hearing loss\n• Needs a cooperative patient (usually from ~4-5 years)","m":"PTA answers 3 questions: How quiet? What type? How bad?","r":"Slide p79"},{"t":"PTA","q":"Air conduction versus bone conduction on PTA – what does each tell you?","a":"• **Air conduction (headphones)**: tests the whole pathway (outer + middle + inner ear) → **threshold level** and **severity** of hearing loss\n• **Bone conduction (vibrator on mastoid)**: bypasses outer and middle ear → reflects **cochlear function** → determines the **type** of loss\n• Types: **conductive**, **sensorineural**, **mixed**","m":"Air = How bad; Bone = What type (the cochlea's own reserve).","r":"Slide p81"},{"t":"PTA","q":"What is plotted on a pure tone audiogram, and what are the standard symbols?","a":"• A graph of **pure-tone thresholds**: **frequency (pitch)** on the x-axis, **125-8000 Hz**; **intensity (loudness)** on the y-axis, **-10 to 120 dB HL** (worse hearing plotted lower)\n• Symbols: right AC **O** (red), left AC **X** (blue); right BC **<**, left BC **>**\n• Masking used to stop the better ear hearing the test tone (bracket symbols for masked BC)\n• Normal hearing: thresholds within **0-20 dB HL**","m":"Red Round Right; blue X for the Left.","r":"Slides p82, p84"},{"t":"PTA","q":"How is the severity of hearing loss graded (British Society of Audiology)?","a":"• **Mild**: **20-40 dB HL**\n• **Moderate**: **41-70 dB HL**\n• **Severe**: **71-95 dB HL**\n• **Profound**: **> 95 dB HL**\n• (Grade on the average of thresholds at 0.25, 0.5, 1, 2 and 4 kHz)","m":"20-40-70-95: each step is roughly a doubling of difficulty.","r":"Slide p83"},{"t":"PTA","q":"What does conductive hearing loss look like on PTA, and what are its common causes?","a":"• **BC within normal range**; **AC abnormal** → an **air-bone gap** (more than about **10 dB**)\n• Cochlea is normal – sound is blocked in the outer or middle ear\n• Causes: **wax**, **foreign body**, **middle ear effusion**, **haemotympanum**, **chronic otitis media**, otosclerosis\n• Note: slides give the gap as '≥ 10 dB' (p85) and '> 10 dB' (p91) – read it as a gap of more than about 10 dB with normal BC","m":"Bone normal, Air down = a blockage before the cochlea.","r":"Slides p85-86"},{"t":"PTA","q":"What does sensorineural hearing loss look like on PTA, and what are its causes and classic patterns?","a":"• **BC and AC both abnormal**, **no air-bone gap** (BC = AC)\n• Lesion in the **cochlea or VIII nerve**; outer/middle ear clear\n• Causes: congenital, **presbycusis**, **sudden SNHL**, **noise-induced**, **drug-induced** (aminoglycosides, cisplatin), autoimmune\n• Patterns: **noise-induced = notch at 4 kHz**; **presbycusis = bilateral high-frequency sloping loss**; Ménière's = low-frequency loss\n• **Unilateral/asymmetric SNHL** → MRI internal acoustic meatus (acoustic neuroma)","m":"Noise Notches at 4 k; age Slopes down at the high end.","r":"Slides p87-88"},{"t":"PTA","q":"What is mixed hearing loss, and which condition typically causes it?","a":"• **Both conductive and sensorineural** components\n• **AC and BC both abnormal**, **with an air-bone gap** (AC worse than BC)\n• Typical cause: **chronic otitis media ± cholesteatoma** (conductive from perforation/ossicular erosion + sensorineural from toxins entering through the round window or labyrinthine fistula)\n• Also advanced otosclerosis","m":"Mixed = everything is down, but Air is down further.","r":"Slides p89-91"},{"t":"PTA","q":"How do the 512 Hz tuning fork tests separate conductive from sensorineural hearing loss, and which hearing loss is an emergency?","a":"• **Rinne negative** (BC > AC) + **Weber lateralises to the affected ear** → **conductive** loss in that ear\n• **Rinne positive** (AC > BC) + **Weber lateralises to the better ear** → **sensorineural** loss in the other ear\n• Normal: Rinne positive, Weber central\n• **Sudden SNHL** (≥ 30 dB over 3 frequencies within 72 h) → **urgent ENT referral** for PTA and **steroids** (oral or intratympanic) as early as possible","m":"Weber goes to the Worse ear in conductive loss, and Away from it in sensorineural loss.","r":"Lecturer pearl"},{"t":"TYMP","q":"What does tympanometry measure, and how is a tympanogram read?","a":"• Measures how the **acoustic immittance (compliance)** of the middle ear changes as **air pressure in the ear canal is varied**\n• Objective – no response needed from the patient\n• Tympanogram: **compliance (ml)** on the y-axis vs **canal pressure (daPa)** on the x-axis (about -300 to +200)\n• Read both the **shape** (type) and the numbers: **peak pressure**, **static compliance (SC)**, **ear canal volume (ECV)**","m":"The drum moves best when pressure on both sides is equal – the peak tells you the middle ear pressure.","r":"Slides p92-94"},{"t":"TYMP","q":"What is a type A tympanogram and what are the normal values?","a":"• **Normal** middle ear pressure and TM compliance – normal middle ear function\n• **Peak pressure: +50 to -100 daPa**\n• **Static compliance: 0.3-1.7 ml**\n• **Ear canal volume: 0.3-2.0 cm³** (smaller in children)\n• Note: a type A does **not** exclude sensorineural loss","m":"A = All right.","r":"Slide p95"},{"t":"TYMP","q":"Type As versus type Ad tympanogram – what is the difference and the typical causes?","a":"• Both have a **normal peak pressure (~0 daPa)** and normal ECV\n• **As (shallow/stiff)**: **unusually low compliance** → stiff middle ear system – **otosclerosis** (stapes fixation), **tympanosclerosis**\n• **Ad (deep)**: **markedly increased compliance** → flaccid/hypermobile system – **ossicular discontinuity**, thin scarred (atrophic) TM","m":"As = Stiff/Shallow (Stapes fixed); Ad = Deep/Disrupted ossicles.","r":"Slides p96-97"},{"t":"TYMP","q":"A flat (type B) tympanogram – how do you use the ear canal volume to interpret it?","a":"• Type B = **no peak**: the TM does not move at any pressure\n• **Normal ECV** → **middle ear effusion** (OME)\n• **Low ECV** → **impacted wax** or probe against the canal wall\n• **High ECV** → **TM perforation** or a **patent grommet** (probe measures canal + middle ear + mastoid)\n• Note: slide headlines type B as 'normal ECV' – the ECV varies with the cause and is the key to interpretation","m":"Flat line? Check the Volume: Normal = fluid, Low = wax, High = hole.","r":"Slide p98"},{"t":"TYMP","q":"What is a type C tympanogram and what does it indicate?","a":"• **Peak at abnormally negative pressure** (below about -100 daPa) with **normal SC and ECV**\n• The drum moves best when canal pressure is negative → middle ear pressure is **below atmospheric**\n• Indicates **Eustachian tube dysfunction**, with or without early middle ear fluid\n• Seen with URTI, allergic rhinitis, adenoids, early or resolving OME; may progress to type B","m":"C = Collapsing (negative) pressure from a blocked tube.","r":"Slide p99"},{"t":"TYMP","q":"Combine PTA and tympanometry: what diagnosis fits each pattern of conductive hearing loss?","a":"• CHL + **type B, normal ECV** → **otitis media with effusion**\n• CHL + **type B, high ECV** → **TM perforation** (e.g. COM)\n• CHL + **type As**, intact normal TM → **otosclerosis**\n• CHL + **type Ad**, intact TM (e.g. after head injury) → **ossicular discontinuity**\n• Mild CHL + **type C** → **Eustachian tube dysfunction**","m":"PTA says how much and what type; the tympanogram says where in the middle ear.","r":"Slides p95-99"}],"mcq":[{"t":"PINNA","stem":"A 19-year-old university rugby player attends the ENT clinic the morning after a match. The left pinna is painful, with a smooth, tense, fluctuant purple swelling filling the scaphoid fossa and concha and obscuring the normal contours. There is no fever and the skin is intact.\nWhat is the most appropriate management?","o":["Oral flucloxacillin, cold compress and review in one week","Observation, as the swelling will resorb within a fortnight","Needle aspiration, then a firm compression bolster dressing","Warm compress, an oral NSAID and strapping of the ear","Elective excision of the deformed cartilage once settled"],"a":2,"e":"This is an **auricular haematoma**: blood collects between perichondrium and cartilage and strips the cartilage of its blood supply. It must be evacuated early (aspirate; incise and drain with a button stitch if it recurs) and the space closed with **compression**, with oral antibiotic cover (slide p6). Left alone, the cartilage necroses and fibroses into a **cauliflower ear**.","w":["Wrong - antibiotics and cold compress do not evacuate the blood; the cartilage will still lose its supply.","Wrong - a tense subperichondrial haematoma does not resorb safely; it organises into a cauliflower ear.","Correct - evacuate early and compress the space so the perichondrium re-adheres to the cartilage.","Wrong - heat and strapping without drainage leave the collection in place.","Wrong - this treats the end result (cauliflower ear) instead of preventing it."],"r":"Slide p6"},{"t":"PINNA","stem":"A 22-year-old woman presents to the ED 5 days after a high helical (upper cartilage) piercing at a shopping-mall kiosk. The upper pinna is red, hot, swollen and exquisitely tender, but the lobule looks normal. There is no fluctuation. Temperature 37.9 °C.\nWhich organism should the empirical antibiotic primarily cover?","o":["Pseudomonas aeruginosa","Streptococcus pneumoniae","Haemophilus influenzae","Aspergillus niger","Moraxella catarrhalis"],"a":0,"e":"Sparing of the **lobule** (which contains no cartilage) localises the infection to the perichondrium: **perichondritis**. After cartilage piercing the classic pathogen is **Pseudomonas aeruginosa**, so give a systemic anti-pseudomonal antibiotic such as oral **ciprofloxacin** (slide p5: systemic antibiotic) and drain any abscess. Undertreated, it destroys cartilage and deforms the ear.","w":["Correct - Pseudomonas is the typical organism in perichondritis after high cartilage piercing; cover it with ciprofloxacin.","Wrong - a middle ear and chest pathogen, not the typical cause of pinna perichondritis.","Wrong - a cause of AOM and sinusitis, not perichondritis after piercing.","Wrong - a fungus of the canal (otomycosis), not of cartilage.","Wrong - an AOM organism; it does not cause perichondritis."],"r":"Lecturer pearl"},{"t":"PINNA","stem":"An 8-year-old boy is brought to the Klinik Kesihatan with a 3-day painful swelling just in front of the right ear, at the anterior margin of the ascending helix. It is red and fluctuant. His mother says a tiny pit has been there since birth and has discharged cheesy material twice before.\nWhat is the best next step?","o":["Reassure, as the pit is congenital and needs no treatment","Complete excision of the sinus tract during this admission","Topical antibiotic ointment into the pit and early review","Incision and drainage with a course of systemic antibiotics","Injection of a sclerosant into the tract under anaesthesia"],"a":3,"e":"An asymptomatic **preauricular sinus** needs no treatment, but an acute **preauricular abscess** is treated with **I&D and antibiotics** first (slide p8). Excision of the whole tract (followed down to the temporalis fascia) is for **recurrent** infection and is done once inflammation has settled, because dissecting through inflamed tissue leaves remnants that cause recurrence. This boy will need elective excision later.","w":["Wrong - reassurance fits an uninfected pit, not a fluctuant abscess.","Wrong - excising through acute inflammation risks incomplete removal and recurrence; excise once quiet.","Wrong - topical treatment does not drain pus from a fluctuant abscess.","Correct - drain the abscess and give antibiotics now; plan tract excision when settled.","Wrong - sclerotherapy is not a treatment for a preauricular sinus."],"r":"Slide p8"},{"t":"EAC","stem":"A 60-year-old retired teacher at the ENT clinic has had a blocked left ear for 2 weeks. He had a left mastoid operation 10 years ago. Otoscopy shows hard impacted wax filling the canal; the drum cannot be seen. He has already used olive oil drops for a week.\nWhich is the most appropriate method of wax removal?","o":["Ear syringing with water warmed to body temperature","Microsuction under the operating microscope","Hydrogen peroxide drops followed by irrigation","Self-cleaning with cotton buds after a hot shower","Electronic pulsed irrigator set at low pressure"],"a":1,"e":"Irrigation (syringing) is **contraindicated** after previous ear surgery, with a known or suspected **perforation**, a **grommet**, an **only-hearing ear** or acute otitis externa, because water can enter the middle ear or mastoid cavity and cause infection, vertigo or trauma. After softening drops (olive oil, sodium bicarbonate), **microsuction** under direct vision is the safe option. Cotton buds push wax deeper and are never advised (slide p64).","w":["Wrong - syringing is contraindicated after mastoid surgery or when the drum cannot be confirmed intact.","Correct - microsuction under vision avoids forcing water into a possible cavity or perforation.","Wrong - this still ends in irrigation, which is contraindicated here.","Wrong - cotton buds impact wax and injure the canal skin.","Wrong - an irrigator at any pressure is still irrigation, contraindicated after ear surgery."],"r":"Lecturer pearl"},{"t":"EAC","stem":"A 35-year-old man in Kota Bharu has 3 days of severe right earache, worse when he chews. Pulling the pinna is very painful. Otoscopy with a small speculum shows a single red, dome-shaped swelling on the posterior wall of the outer part of the canal; the deeper canal and drum are normal. Hearing is normal.\nWhich organism is most likely responsible?","o":["Pseudomonas aeruginosa","Aspergillus niger","Candida albicans","Proteus mirabilis","Staphylococcus aureus"],"a":4,"e":"A localised tender swelling in the outer canal is a **furuncle**, an infected hair follicle. It can arise only in the **outer cartilaginous third**, where hair and ceruminous glands are found, and the organism is **Staphylococcus aureus** (slide p11). Treat with analgesia and oral/topical anti-staphylococcal antibiotic, with I&D if fluctuant. Pseudomonas is the main cause of **diffuse** otitis externa involving the whole canal.","w":["Wrong - Pseudomonas causes diffuse otitis externa, not a single localised follicular abscess.","Wrong - Aspergillus causes otomycosis (itch, blockage, black spores), not a furuncle.","Wrong - Candida causes white fungal debris, not a tender follicular abscess.","Wrong - a Gram-negative organism of diffuse otitis externa, not of furuncles.","Correct - a furuncle is a Staph aureus infection of a hair follicle in the outer canal."],"r":"Slide p11"},{"t":"EAC","stem":"A 26-year-old swimming instructor has 4 days of left ear pain, itch and discharge. Pressing the tragus is very painful. The whole canal is red and so swollen with debris that only a slit remains; the drum cannot be seen. She is afebrile, not diabetic, with no neck nodes or cellulitis.\nAfter aural toilet, what is the best next step?","o":["Start oral amoxicillin and review in two weeks","Syringe the canal to clear debris and see the drum","Insert an ear wick and soak it with quinolone drops","Prescribe gentamicin drops to instil into the canal","Book urgent CT of the temporal bone for bone disease"],"a":2,"e":"Diffuse **otitis externa** (Pseudomonas in 50-65%) is treated **topically**: ear toilet, antibiotic drops and keeping the ear dry; systemic antibiotics are added only in severe cases (slide p16). When the canal is too oedematous for drops to penetrate, an **ear wick** carries them along the whole canal. Because the drum cannot be seen, use a **quinolone** and avoid potentially ototoxic aminoglycoside drops.","w":["Wrong - oral antibiotics are for severe or spreading disease; amoxicillin also misses Pseudomonas.","Wrong - syringing an acutely inflamed canal is painful and contraindicated in acute otitis externa.","Correct - after toilet, a wick lets topical quinolone reach a canal too swollen for drops alone.","Wrong - aminoglycosides are avoided when the drum is not seen, as a perforation risks ototoxicity.","Wrong - a young, non-diabetic patient without red flags does not need imaging."],"r":"Slide p16"},{"t":"EAC","stem":"A 40-year-old woman has had an itchy, blocked right ear for a month. She has used ciprofloxacin ear drops from a pharmacy for 3 weeks without improvement. Otoscopy shows moist grey-white debris studded with black dots, like wet newspaper, filling the canal. Once cleaned, the drum is intact.\nWhat is the most appropriate treatment?","o":["Ear toilet, then topical clotrimazole 1% for two weeks","A further three-week course of ciprofloxacin ear drops","Oral flucloxacillin plus hydrocortisone-neomycin drops","Syringing three times a week with no topical medicine","Oral co-amoxiclav and a steroid-only drop for the itch"],"a":0,"e":"Itch and blockage with black spores (**Aspergillus niger**) or white debris (**Candida**) is **otomycosis**, often triggered by prolonged antibiotic drops that suppress the normal canal flora. Treat with meticulous **ear toilet** plus a topical **antifungal** such as clotrimazole and keep the ear dry (slide p17). More antibiotic or steroid drops feed the fungus; oral antifungals are reserved for immunocompromised or invasive cases.","w":["Correct - remove the fungal mass, then apply a topical antifungal.","Wrong - prolonged antibiotic drops are the likely cause of the fungal overgrowth.","Wrong - antibacterial and steroid drops do not treat fungus and encourage it.","Wrong - repeated syringing keeps the canal moist and leaves the fungus untreated.","Wrong - systemic antibiotics and steroid drops promote fungal growth."],"r":"Slide p17"},{"t":"EAC","stem":"A 30-year-old office worker has had three episodes of diffuse otitis externa this year; the latest has just resolved with drops. He showers twice a day, swims weekly, cleans his ears after every shower and wears in-ear earbuds for several hours a day at work.\nWhich advice will best reduce recurrence?","o":["Dry the canals with a cotton bud after every shower and swim","Wear the in-ear earbuds while showering to keep water out","Irrigate the canals weekly with warm tap water at home","Plug the ears with oil-soaked cotton when bathing; avoid swimming","Use his antibiotic ear drops twice weekly as prevention"],"a":3,"e":"Recurrent otitis externa is driven by **moisture** and **trauma** to the thin canal skin, which strips the protective wax layer. **Ear care advice** (slide p64): water precautions with an ear plug or **oil-soaked cotton wool** when bathing, avoid swimming, avoid washing inside the canal during ablution, no cotton buds or metal objects, limit prolonged earbud use and keep earbuds clean. Prophylactic antibiotic drops promote resistance and otomycosis.","w":["Wrong - cotton buds traumatise the canal skin and remove protective wax.","Wrong - earbuds are not waterproof and their prolonged use is itself a risk factor.","Wrong - regular irrigation adds moisture and removes protective wax.","Correct - keeping water out (oil-soaked cotton or plug) and avoiding swimming protects the canal skin.","Wrong - prophylactic antibiotic drops encourage resistance and fungal infection."],"r":"Slide p64"},{"t":"MOE","stem":"A 74-year-old man with poorly controlled type 2 diabetes (HbA1c 11%) has 6 weeks of right otalgia that keeps him awake at night and a scanty discharge despite two courses of antibiotic ear drops. Otoscopy shows granulation tissue on the floor of the canal at the bony-cartilaginous junction; the drum is intact. Cranial nerves are normal. ESR is 85 mm/h.\nWhat is the most appropriate management?","o":["Oral co-amoxiclav and steroid ear drops, review in 2 weeks","Admit for IV ciprofloxacin, glucose control and biopsy","Cauterise the granulation in clinic and continue the drops","Urgent radical mastoidectomy to clear the infected bone","Or
