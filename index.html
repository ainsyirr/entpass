al fluconazole for 4 weeks with clotrimazole ear drops"],"a":1,"e":"An elderly diabetic with **nocturnal pain**, failure of topical treatment and **granulation on the canal floor** has **malignant (necrotising) otitis externa** until proven otherwise: a Pseudomonas osteomyelitis spreading to the skull base. Admit for pain and sugar control, give systemic anti-pseudomonal **ciprofloxacin** (IV for about 2 weeks, then oral, roughly 6-8 weeks in total), regular ear toilet, and **biopsy the granulation** to exclude carcinoma (slides p20-21). Antibiotics, not surgery, are the mainstay.","w":["Wrong - outpatient co-amoxiclav does not cover Pseudomonas and steroid drops worsen infection.","Correct - admit, IV anti-pseudomonal therapy, tight sugar control, ear toilet and biopsy to exclude carcinoma.","Wrong - cautery leaves the underlying osteomyelitis untreated and misses a possible carcinoma.","Wrong - surgery is limited to biopsy or debridement; radical mastoidectomy is not the treatment.","Wrong - fungal skull-base infection is rare; Pseudomonas is the usual organism."],"r":"Slides p20-21"},{"t":"MOE","stem":"A 70-year-old woman with diabetes is in week 5 of ciprofloxacin for a skull-base osteomyelitis that began in the left ear canal. Her night pain has gone, the canal is healing and her CRP has normalised. A technetium-99m bone scan at diagnosis was strongly positive. The team must decide whether antibiotics can be stopped.\nWhich investigation best guides that decision?","o":["Repeat technetium-99m bone scan","Plain radiograph of both mastoids","Repeat ear swab for culture","High-resolution CT of temporal bone","Gallium-67 citrate scintigraphy"],"a":4,"e":"**Technetium-99m** reflects osteoblastic activity: it is sensitive for **diagnosis** but stays positive for months after infection is controlled, so it cannot show cure. **Gallium-67** (or an indium-labelled white cell scan) reflects active inflammation and normalises as infection settles, so with ESR/CRP and symptoms it is used to **monitor** response and decide when to stop. Note: slide p20 says the bone scan is for diagnosis and to evaluate response; correct is Tc-99m for diagnosis and gallium for monitoring (as slide p21 says).","w":["Wrong - Tc-99m stays positive long after cure because bone remodelling continues.","Wrong - plain films are insensitive and do not reflect current infection activity.","Wrong - a healed canal may grow nothing, which says nothing about bone infection.","Wrong - CT shows bone erosion but changes lag and do not normalise with cure.","Correct - gallium uptake falls as inflammation resolves, so it guides when to stop antibiotics."],"r":"Slides p20-21"},{"t":"MOE","stem":"A 68-year-old man with diabetes has severe right ear pain, canal oedema, purulent exudate and granulation tissue on the canal floor. He has used ciprofloxacin drops for only 4 days. Applying the Cohen and Friedman (1987) criteria, the team notes that one major criterion is still missing.\nWhich finding would complete the major criteria?","o":["Pseudomonas aeruginosa grown on ear swab","Raised ESR of 90 mm/h on admission bloods","Ipsilateral lower motor neurone facial palsy","Positive technetium-99m bone scan","Advanced age with poorly controlled diabetes"],"a":3,"e":"The Cohen and Friedman **major** criteria (all required) are pain, oedema, exudate, granulation tissue, microabscess at operation, and a **positive Tc-99m bone scan or failure of local treatment for at least 1 week**. Pseudomonas, cranial nerve involvement, diabetes, old age or debility and a positive bone radiograph are **minor** criteria that support but do not make the diagnosis. Note: slide p19 lists a high ESR as a criterion; it is not in the original criteria - ESR/CRP are used to monitor treatment.","w":["Wrong - Pseudomonas on culture is a minor criterion.","Wrong - ESR is not part of the original Cohen criteria; it is used for monitoring.","Wrong - cranial nerve involvement is a minor criterion.","Correct - with only 4 days of drops, a positive Tc-99m scan supplies the remaining major criterion.","Wrong - diabetes and old age are minor criteria."],"r":"Slide p19"},{"t":"OME","stem":"A 48-year-old Chinese man from Sibu has had 2 months of left ear blockage and muffled hearing. He has no otalgia, discharge or recent cold. Otoscopy shows a dull, retracted left drum with an air-fluid level; the right ear is normal. Tuning forks: Rinne negative on the left, Weber lateralises to the left.\nWhat is the most important next step?","o":["Endoscopic examination of the postnasal space","Left myringotomy with grommet insertion today","Two-week course of oral co-amoxiclav","Intranasal steroid spray and review in 3 months","MRI of the internal acoustic meatus"],"a":0,"e":"A **unilateral middle ear effusion in an adult**, especially of southern Chinese ethnicity in Malaysia, is **nasopharyngeal carcinoma** until proven otherwise: a tumour in the fossa of Rosenmüller blocks the Eustachian tube orifice (slide p23 lists nasopharyngeal mass). The next step is **nasoendoscopy** of the postnasal space with biopsy of any lesion, plus neck examination and EBV serology, before any grommet. Sprays or antibiotics only delay diagnosis of a curable cancer.","w":["Correct - look at the nasopharynx first to exclude nasopharyngeal carcinoma.","Wrong - a grommet relieves the symptom but misses the cause; scope the nasopharynx first.","Wrong - antibiotics do not clear effusion and delay the essential examination.","Wrong - watchful waiting is for children; an adult with unilateral effusion needs the postnasal space examined.","Wrong - MRI IAM investigates asymmetric sensorineural loss; this is conductive."],"r":"Lecturer pearl"},{"t":"OME","stem":"A 5-year-old girl is referred because her kindergarten teacher thinks she ignores instructions and her speech lags behind her peers. She has had no ear pain or fever. Both drums are dull and yellowish with a diffuse light reflex and visible air bubbles; they are neither red nor perforated.\nWhich tympanometry result is most likely?","o":["Type A, peak 0 daPa, ECV 0.9 ml","Type B, flat trace, ECV 4.5 ml","Type B, flat trace, ECV 0.8 ml","Type B, flat trace, ECV 0.1 ml","Type Ad, peak 0 daPa, ECV 0.9 ml"],"a":2,"e":"Fluid in the middle ear stops the drum moving at any pressure, giving a flat **Type B** trace; the **ear canal volume is normal** because the probe is measuring a normal canal against an intact drum (slide p26). A flat trace with a **high ECV** means a perforation or patent grommet, and a **low ECV** means wax or the probe against the canal wall. PTA will show a conductive loss.","w":["Wrong - Type A means normal middle ear pressure and compliance, not a fluid-filled ear.","Wrong - a high ECV with a flat trace indicates a perforation or patent grommet; these drums are intact.","Correct - effusion behind an intact drum gives a flat trace with a normal canal volume.","Wrong - a very low ECV suggests occluding wax or the probe against the canal wall.","Wrong - Type Ad (hypermobile) suggests ossicular discontinuity or a flaccid drum."],"r":"Slide p26"},{"t":"OME","stem":"A 4-year-old boy is reviewed in the ENT clinic 3 weeks after an episode of acute otitis media. He is well, with no pain. Both drums are dull with fluid levels. Tympanograms are Type B with normal ECV bilaterally and play audiometry shows a mild conductive loss of about 20 dB. His speech and behaviour are normal and he has no cleft palate or Down syndrome.\nWhat is the most appropriate management?","o":["Bilateral myringotomy and grommet insertion now","Active observation with repeat tests at 3 months","Three weeks of oral amoxicillin to clear the fluid","Adenoidectomy alone on the next available list","Oral antihistamine and decongestant for a month"],"a":1,"e":"Most effusions, especially after AOM, clear spontaneously within 3 months, so the first step is **active observation** with repeat otoscopy, tympanometry and hearing tests (slide p27). Surgery is for **persistent OME beyond 3 months with a conductive loss over 25 dB**, or earlier when speech, development or structural risks (cleft palate, Down syndrome) demand it. Antibiotics, antihistamines and decongestants do not speed resolution; medical treatment (antihistamine, intranasal steroid) is only for children with allergic symptoms.","w":["Wrong - grommets are for effusion persisting beyond 3 months with a loss over 25 dB.","Correct - most post-AOM effusions resolve within 3 months; observe actively and retest.","Wrong - antibiotics do not resolve OME and add side effects and resistance.","Wrong - there is no persistent effusion or adenoid symptom to justify surgery yet.","Wrong - no allergic symptoms; decongestants and antihistamines do not clear OME."],"r":"Slide p27"},{"t":"OME","stem":"A 6-year-old boy has had bilateral middle ear effusions for 5 months despite watchful waiting. He snores loudly, breathes through his mouth and has a hyponasal voice. PTA shows a bilateral 35 dB conductive loss and both tympanograms are Type B with normal ECV. A lateral soft-tissue neck X-ray shows a large adenoid shadow.\nWhich procedure is most appropriate?","o":["Bilateral myringotomy and grommets alone","Adenotonsillectomy without any ear surgery","Bilateral myringotomy with aspiration alone","Bilateral myringoplasty and adenoidectomy","Bilateral grommets with an adenoidectomy"],"a":4,"e":"Persistent OME **beyond 3 months with a conductive loss over 25 dB** is an indication for myringotomy and **grommet** (ventilation tube) insertion; because **adenoid hypertrophy** is obstructing the Eustachian tube orifices, **adenoidectomy** is added (slide p27). The grommet takes over ventilation of the middle ear; a myringotomy alone heals within days and the fluid returns. Myringoplasty repairs a perforation and has no role here.","w":["Wrong - grommets alone leave the obstructing adenoid, so recurrence after extrusion is more likely.","Wrong - removing the adenoid without ventilating the ears leaves the current hearing loss untreated.","Wrong - a myringotomy closes within days, so the effusion re-accumulates.","Wrong - myringoplasty closes a perforation; these drums are intact.","Correct - ventilate the ears with grommets and remove the adenoid that blocks the Eustachian tubes."],"r":"Slide p27"},{"t":"OME","stem":"In theatre, a registrar is about to insert a grommet in a 5-year-old with a middle ear effusion persisting for 4 months and a 30 dB conductive loss. Under the microscope the whole drum is visible after a little wax is removed. The consultant asks where the radial myringotomy should be made.\nWhich site is preferred?","o":["Anteroinferior quadrant of the pars tensa","Posterosuperior quadrant of the pars tensa","Pars flaccida, just above the lateral process","Anterosuperior quadrant of the pars tensa","Directly over the umbo and handle of malleus"],"a":0,"e":"The **anteroinferior quadrant** is used (slide p27) because it lies away from the incus, stapes, chorda tympani and round window niche, which sit posteriorly, and it is easy to see. Grommets placed here also tend to stay in longer. The **pars flaccida** is the attic region, where retraction pockets and cholesteatoma arise, and the malleus handle is attached to the drum and must not be incised.","w":["Correct - the safest and most visible site, clear of the ossicles and chorda tympani.","Wrong - the incus, stapes and chorda tympani lie behind this quadrant.","Wrong - the attic is not used for ventilation tubes and lies over the malleus neck and ossicular heads.","Wrong - the malleus handle and anterior malleal fold lie close by; this is not the standard site.","Wrong - the malleus is attached here; incising over it risks ossicular injury."],"r":"Slide p27"},{"t":"AOM","stem":"A 2-year-old boy is brought to the ED at night after 2 days of a runny nose. He is crying inconsolably, pulling his right ear and has a temperature of 39.2 °C. The right drum is red, thickened and bulging with loss of landmarks; there is no discharge or perforation.\nWhich stage of the disease is this?","o":["Stage of tubal occlusion","Stage of pre-suppuration","Stage of suppuration","Stage of resolution","Stage of complication"],"a":2,"e":"Pus forming under pressure in the middle ear pushes the drum outwards (**bulging**), so pain and fever are at their worst: the **stage of suppuration** (slide p33). **Tubal occlusion** gives a retracted drum; **pre-suppuration** gives a congested, hyperaemic drum without bulging; **resolution** follows rupture of the drum, when discharge appears and pain eases. This is the stage at which myringotomy relieves pain.","w":["Wrong - tubal occlusion causes a retracted drum with mild symptoms.","Wrong - pre-suppuration shows a congested, hyperaemic drum but no bulging pus.","Correct - pus under pressure bulges the drum and pain and fever peak.","Wrong - resolution follows perforation, with discharge and easing pain.","Wrong - nothing here suggests mastoiditis or intracranial spread."],"r":"Slides p30-33"},{"t":"AOM","stem":"A 4-year-old girl had severe left earache and fever overnight. This morning the pain suddenly eased and her pillow was stained with blood-tinged pus. The canal contains mucopurulent discharge; after mopping, a small perforation is seen in the pars tensa. She has started oral amoxicillin.\nWhich ear drop is most appropriate to add?","o":["Gentamicin-hydrocortisone ear drops","Ofloxacin 0.3% ear drops twice daily","Neomycin-polymyxin B-dexamethasone drops","Clotrimazole 1% ear solution","Chlorhexidine in alcohol ear drops"],"a":1,"e":"Sudden relief of pain with discharge marks the **stage of resolution**: the drum has ruptured and released the pus. Continue analgesia and oral amoxicillin; with a perforation, topical drops should be a **non-ototoxic quinolone** such as **ofloxacin** (slide p36). Aminoglycoside drops (gentamicin, neomycin) risk cochlear damage through a perforation, and alcohol solutions sting and are ototoxic.","w":["Wrong - gentamicin is an aminoglycoside, ototoxic through a perforation.","Correct - a quinolone covers the pathogens without ototoxicity through the perforation.","Wrong - neomycin is an aminoglycoside and potentially ototoxic.","Wrong - an antifungal is for otomycosis, not bacterial AOM.","Wrong - alcohol and chlorhexidine are ototoxic and painful on middle ear mucosa."],"r":"Slides p34-36"},{"t":"AOM","stem":"A 3-year-old girl presents to a Klinik Kesihatan with 2 days of right earache, fever of 38.8 °C and a cold. The right drum is red and bulging with no discharge. She has no drug allergies and is otherwise well. The medical officer writes a prescription.\nWhich regimen is most appropriate?","o":["Oral chlorphenamine and pseudoephedrine with paracetamol","Ciprofloxacin ear drops plus an oral decongestant","Oral azithromycin with an oral antihistamine syrup","Oral amoxicillin for 5-7 days with regular paracetamol","Oral prednisolone with ibuprofen for pain and fever"],"a":3,"e":"**Amoxicillin** is the first-line antibiotic for AOM (Streptococcus pneumoniae, Haemophilus influenzae, Moraxella), with regular **analgesia**; watchful waiting is an option in selected older children with mild illness. Antihistamines and decongestants do not shorten AOM or prevent complications and cause side effects in young children. Note: slide p36 lists an antihistamine for AOM with URTI; this has no proven benefit. Ear drops are for a perforated, discharging ear, and macrolides are for penicillin allergy.","w":["Wrong - antihistamines and decongestants have no proven benefit in AOM and no antibiotic is given.","Wrong - drops cannot pass an intact drum; they are for a perforated ear.","Wrong - macrolides are second line, for penicillin allergy; the antihistamine adds nothing.","Correct - amoxicillin plus analgesia is first-line treatment for AOM.","Wrong - systemic steroids have no role in uncomplicated AOM."],"r":"Slide p36"},{"t":"AOM","stem":"A 6-year-old boy has had severe right earache for 3 days despite 48 hours of oral amoxicillin and regular paracetamol. He is distressed and febrile. The right drum is red and markedly bulging with no perforation. There is no postauricular swelling, facial weakness or neck stiffness.\nWhich procedure gives the quickest relief of his pain?","o":["Myringotomy of the bulging drum","Cortical (Schwartze) mastoidectomy","Adenoidectomy under anaesthesia","Myringoplasty with temporalis graft","Aural toilet and ear wick insertion"],"a":0,"e":"**Myringotomy** releases pus under pressure through an incision in the drum, giving immediate relief of pain and a sample for culture; it is indicated for **severe pain with a bulging drum** or failure of antibiotics (slide p36). Without signs of mastoiditis or intracranial spread, mastoidectomy is not needed, though the antibiotic may be changed to co-amoxiclav. Myringoplasty repairs perforations and an ear wick is used in otitis externa.","w":["Correct - draining the pus decompresses the middle ear and relieves pain at once.","Wrong - mastoidectomy is for complications such as mastoid abscess; none are present.","Wrong - adenoidectomy may reduce recurrent episodes but does not relieve this acute pain.","Wrong - myringoplasty repairs a chronic perforation; the drum here is intact.","Wrong - an ear wick is for a swollen canal in otitis externa, not pus behind the drum."],"r":"Slide p36"},{"t":"COM","stem":"A 32-year-old woman has had intermittent left ear discharge for 2 years, worse after colds and when water enters the ear. The discharge is copious, mucoid and does not smell. Otoscopy shows a large kidney-shaped hole in the pars tensa with a rim of drum all round; the attic is intact and there is no keratin.\nWhat is the most likely diagnosis?","o":["Atticoantral (squamous) chronic otitis media","Acute otitis media in the stage of resolution","Otomycosis with a secondary drum perforation","Chronic otitis externa with granular myringitis","Tubotympanic (mucosal) chronic otitis media"],"a":4,"e":"Profuse, mucoid, odourless discharge from a **central perforation** (rim present all round) is **tubotympanic or 'safe' COM** (slide p38): disease is confined to the mucosa, cholesteatoma is absent and complications are rare. The discharge is mucoid and profuse because it comes from the goblet cells of the middle ear mucosa. Symptoms for longer than 3 months exclude AOM (under 3 weeks).","w":["Wrong - atticoantral disease gives a marginal or attic perforation with scanty, foul discharge.","Wrong - AOM lasts under 3 weeks; this has been present for 2 years.","Wrong - otomycosis causes itch and fungal debris, not a mucoid discharge through a central perforation.","Wrong - otitis externa produces canal and drum surface inflammation, not a mucoid middle ear discharge.","Correct - central perforation with profuse, odourless mucoid discharge is the safe mucosal type."],"r":"Slide p38"},{"t":"COM","stem":"A 40-year-old farmer has had right ear discharge on and off for 18 months with reduced hearing. He is referred from a Klinik Kesihatan, where only pus in the canal could be seen. In the ENT clinic the ear is mopped and examined under the microscope.\nWhich finding would most indicate disease with a high risk of complications?","o":["Central perforation with mucoid discharge","Attic perforation with scanty, foul discharge","Dry central perforation with tympanosclerosis","Retracted intact drum with an air-fluid level","Diffuse canal oedema with tragal tenderness"],"a":1,"e":"**Atticoantral (unsafe) COM** involves the attic and antrum: the perforation is **marginal or in the pars flaccida**, and the discharge is **scanty but foul** from bone destruction and anaerobes (slide p38). **Cholesteatoma** and granulation are common and erode bone, so complications (labyrinthine fistula, facial palsy, intracranial sepsis) are frequent. A central perforation with profuse mucoid discharge suggests safe tubotympanic disease.","w":["Wrong - central perforation with mucoid discharge is the safe tubotympanic pattern.","Correct - attic or marginal perforation with scanty, foul discharge signals unsafe disease and likely cholesteatoma.","Wrong - an inactive dry perforation carries a low risk of complications.","Wrong - this describes middle ear effusion behind an intact drum.","Wrong - these are signs of otitis externa, not of middle ear disease."],"r":"Slide p38"},{"t":"COM","stem":"A 9-year-old boy with long-standing left ear discharge has 5 days of fever and worsening pain. The left pinna is pushed forwards and downwards. Behind it there is a tender, fluctuant, red swelling that obliterates the retroauricular groove. Otoscopy shows pus and sagging of the posterosuperior canal wall.\nWhat is the most likely diagnosis?","o":["Postauricular reactive lymphadenitis","Furunculosis of the posterior canal wall","Acute mastoiditis with mastoid abscess","Bezold abscess deep to sternomastoid","Perichondritis of the pinna and concha"],"a":2,"e":"Pus breaking through the mastoid cortex lifts the periosteum behind the ear, pushing the **pinna forwards and downwards** and obliterating the retroauricular groove; **sagging of the posterosuperior meatal wall** (the bone over the antrum) is the key otoscopic sign (slide p40). Lymphadenitis and furunculosis can also push the pinna forwards, but the groove is preserved and the meatal wall does not sag. Manage with admission, IV antibiotics, HRCT and **cortical mastoidectomy**.","w":["Wrong - lymphadenitis leaves the retroauricular groove intact and the meatal wall normal.","Wrong - a furuncle is a localised canal swelling; it does not cause sagging of the bony posterosuperior wall.","Correct - pinna displaced forwards and downwards plus posterosuperior meatal sagging is a mastoid abscess.","Wrong - a Bezold abscess lies in the neck below the mastoid tip, not behind the pinna.","Wrong - perichondritis inflames the pinna itself and does not affect the canal wall."],"r":"Slide p40"},{"t":"COM","stem":"A 50-year-old man with untreated foul-smelling right ear discharge for years presents with fever and a painful, firm swelling in the upper right neck. The swelling lies deep to the sternocleidomastoid below the mastoid tip, and he holds his head tilted to the right. The pinna is in a normal position with no swelling above or in front of the ear.\nWhich abscess is this?","o":["Bezold abscess","Citelli abscess","Luc abscess","Zygomatic abscess","Postauricular abscess"],"a":0,"e":"When pus breaks through the **medial side of the mastoid tip** it tracks along the sternocleidomastoid to form a **Bezold abscess**, deep to the muscle in the upper neck (slides p39-43). A **Citelli** abscess follows the posterior belly of digastric into the digastric triangle; a **Luc** abscess passes through the roof of the canal to lie deep to temporalis; a **zygomatic** abscess lies above and in front of the ear. Treat with IV antibiotics, drainage and mastoidectomy.","w":["Correct - pus from the mastoid tip tracking deep to the sternocleidomastoid is a Bezold abscess.","Wrong - a Citelli abscess lies in the digastric triangle along the posterior belly of digastric.","Wrong - a Luc abscess lies deep to temporalis, above the ear, via the canal roof.","Wrong - a zygomatic abscess lies in front of and above the pinna.","Wrong - a postauricular abscess lies behind the pinna and pushes it forwards and downwards."],"r":"Slides p39-43"},{"t":"COM","stem":"A 35-year-old woman with chronic left ear discharge develops deep pain behind the left eye and double vision on looking to the left. Examination shows foul pus in the left canal and failure of abduction of the left eye; other cranial nerves are normal and she is alert without neck stiffness.\nWhere has the infection most likely spread?","o":["Sigmoid (lateral) venous sinus","Lateral semicircular canal","Mastoid tip with a neck collection","Petrous apex of the temporal bone","Cavernous sinus via ophthalmic veins"],"a":3,"e":"Persistent **otorrhoea**, **retro-orbital (trigeminal) pain** and **lateral rectus (VI) palsy** form **Gradenigo syndrome**, from petrositis (slide p41). The abducens nerve crosses the petrous apex in Dorello's canal and the trigeminal ganglion lies on its anterior surface, so both are irritated. Confirm with CT/MRI and treat with IV antibiotics and mastoid surgery.","w":["Wrong - sigmoid sinus thrombophlebitis causes picket-fence fever, not an isolated VI palsy.","Wrong - a labyrinthine fistula causes vertigo and hearing loss, not diplopia.","Wrong - a neck collection (Bezold) does not involve cranial nerves V and VI.","Correct - petrous apex infection irritates the VI nerve and trigeminal ganglion: Gradenigo syndrome.","Wrong - cavernous sinus thrombosis gives proptosis, chemosis and multiple ocular nerve palsies."],"r":"Slide p41"},{"t":"COM","stem":"A 16-year-old with foul-smelling left ear discharge for years is admitted with headache and high spiking fevers with rigors twice daily, the temperature falling to normal in between. There is tender oedema over the posterior part of the left mastoid. He is alert, with no neck stiffness or focal neurological signs. Blood cultures are pending.\nWhich complication is most likely?","o":["Otogenic temporal lobe abscess","Lateral sinus thrombophlebitis","Extradural abscess over the tegmen","Otitic bacterial meningitis","Subdural empyema over the convexity"],"a":1,"e":"**Picket-fence fever** with rigors (septic emboli shed from an infected thrombus) and oedema over the mastoid emissary vein (**Griesinger sign**) indicate **lateral (sigmoid) sinus thrombophlebitis**, an intracranial complication of COM (slide p39). Meningitis gives neck stiffness and photophobia, and a brain abscess or empyema gives focal signs and raised pressure. Confirm with contrast CT or MR venography; treat with IV antibiotics and mastoidectomy with exposure of the sinus.","w":["Wrong - a temporal lobe abscess gives raised pressure and focal signs such as dysphasia.","Correct - picket-fence fever plus Griesinger sign points to an infected sigmoid sinus thrombus.","Wrong - an extradural abscess is often silent or causes local headache, not swinging rigors.","Wrong - meningitis gives neck stiffness and photophobia, absent here.","Wrong - a subdural empyema causes rapid deterioration with seizures and focal deficits."],"r":"Lecturer pearl"},{"t":"COM","stem":"A 28-year-old man has a central perforation of the right drum that has stayed dry for 8 months with water precautions. There is no keratin or attic retraction. PTA shows a 25 dB conductive loss on the right with normal bone conduction. He wants to be able to swim again.\nWhat is the most appropriate management?","o":["Cortical (Schwartze) mastoidectomy","Modified radical mastoidectomy","Myringoplasty with a fascia graft","Myringotomy and grommet insertion","Bone-anchored hearing aid fitting"],"a":2,"e":"This is **inactive mucosal COM**: a dry perforation. Keep the ear dry, record hearing with an audiogram and, once the ear has been **dry for about 6 months**, offer **myringoplasty** (repair of the drum, usually with a temporalis fascia graft) to restore hearing and allow water exposure (slide p44). Mastoidectomy is for complicated active disease or cholesteatoma, and a grommet treats effusion behind an intact drum.","w":["Wrong - cortical mastoidectomy is for active disease with complications such as mastoiditis.","Wrong - a canal wall down operation is for cholesteatoma, not a dry mucosal perforation.","Correct - a dry perforation for over 6 months is ready for myringoplasty.","Wrong - a grommet ventilates an intact drum; this drum already has a hole.","Wrong - repairing the drum can restore hearing; an implant is not the first option."],"r":"Slide p44"},{"t":"COM","stem":"A 45-year-old woman has had right ear discharge for 4 months. The discharge is mucopurulent; after mopping there is a central perforation with inflamed but non-granular mucosa and no keratin. She has no vertigo, facial weakness, headache or fever. This is her first treatment.\nWhat is the best initial management?","o":["Pus swab, withholding treatment until culture returns","Oral amoxicillin for 2 weeks without any ear drops","Urgent HRCT temporal bone and cortical mastoidectomy","Gentamicin ear drops with weekly ear syringing","Aural toilet, ofloxacin drops and keeping the ear dry"],"a":4,"e":"**Active COM without complication** is treated in clinic: **aural toilet** so drops reach the mucosa, **topical ofloxacin** (better than oral antibiotics because it reaches high local concentrations and is not ototoxic) and strict **dry-ear precautions** (slide p45). A swab is reserved for cases that fail to resolve, and systemic antibiotics are added for children, granulation tissue or failed topical treatment. HRCT and mastoidectomy are for complicated disease.","w":["Wrong - a swab is for unresolved cases; treatment should not be delayed.","Wrong - topical drops after ear toilet work better than oral antibiotics.","Wrong - imaging and surgery are for complications, which are absent here.","Wrong - gentamicin is ototoxic through a perforation and syringing a perforated ear is contraindicated.","Correct - clean, give topical quinolone and keep dry; observe for complications."],"r":"Slide p45"},{"t":"CHOL","stem":"A 6-year-old boy is referred from Klinik Kesihatan after a school hearing screen. Otoscopy of the right ear shows a smooth pearly-white mass behind the anterosuperior quadrant of an intact, mobile tympanic membrane; the pars tensa and pars flaccida look normal. His mother recalls two episodes of acute otitis media treated with oral amoxicillin, never with ear discharge.\nWhich additional history would make a congenital origin untenable under the Levenson criteria?","o":["Myringotomy and grommet insertion in that ear at age 3","A third episode of acute otitis media treated last year","A 25 dB conductive hearing loss on that side on PTA","Mass seen in the anterosuperior rather than posterior quadrant","A family history of cholesteatoma in his father"],"a":0,"e":"**Levenson criteria** for congenital cholesteatoma: white mass medial to a **normal TM**, normal pars tensa and pars flaccida, **no history of otorrhoea or perforation**, and **no previous otological procedure**. A grommet is an otological procedure that breaches the drum and could implant squamous epithelium, so the lesion can no longer be called congenital. Previous AOM without otorrhoea is NOT an exclusion, because most children have had AOM.","w":["Correct - a previous otological procedure (which also perforates the drum) excludes a congenital cholesteatoma under Levenson.","Wrong - AOM episodes without otorrhoea or perforation do not exclude it; almost every child has had AOM.","Wrong - a conductive loss is an expected effect of a middle ear mass, not an exclusion criterion.","Wrong - the anterosuperior quadrant is actually the classic site of congenital cholesteatoma.","Wrong - family history is not part of the Levenson criteria."],"r":"Slide p49"},{"t":"CHOL","stem":"A 38-year-old man attends ENT clinic with a blocked left ear. Microscopy shows a retraction pocket of the pars flaccida draped onto the neck of the malleus, and the outer attic wall shows a small area of limited bony erosion. The base of the pocket is visible and dry, with no keratin.\nWhich grade best describes this retraction?","o":["Tos grade 2","Tos grade 3","Tos grade 4","Sadé grade 3","Sadé grade 2"],"a":1,"e":"**Tos** grades the **pars flaccida**: 1 not touching the malleus neck, 2 touching the malleus neck, 3 as grade 2 plus **limited erosion of the scutum** (outer attic wall), 4 as grade 3 plus severe erosion. **Sadé** grades the **pars tensa** (1 slight retraction, 2 onto incus/stapes, 3 atelectasis onto promontory, 4 adhesive otitis). Any scutal erosion lifts a contact pocket from grade 2 to at least grade 3.","w":["Wrong - grade 2 is contact with the malleus neck without any scutal erosion.","Correct - contact with the malleus neck plus limited scutum erosion is Tos grade 3.","Wrong - grade 4 needs severe erosion of the outer attic wall.","Wrong - Sadé grades describe the pars tensa (grade 3 = atelectasis onto the promontory), not attic pockets.","Wrong - Sadé grade 2 is a pars tensa retraction onto the incus or stapes."],"r":"Slides p52-53"},{"t":"CHOL","stem":"A 45-year-old woman has 2 years of scanty, foul-smelling right otorrhoea. Microscopy shows a pars flaccida perforation with white keratin flakes. PTA shows a 35 dB conductive loss. HRCT temporal bone is requested to plan surgery.\nWhich CT finding is typically the earliest bony sign of this disease?","o":["Erosion of the lateral semicircular canal bony capsule","Dehiscence of the tegmen tympani over the attic","Blunting of the scutum at the lateral attic wall","Opacification with sclerosis of the mastoid air cells","Erosion of the bony facial canal at the second genu"],"a":2,"e":"An attic (pars flaccida) cholesteatoma presses first against the **scutum**, the sharp bony spur of the lateral attic wall, so **blunting of the scutum is often the earliest CT sign**. The other HRCT hallmark is a well-defined homogeneous soft-tissue mass in the attic or non-dependent areas. Labyrinthine fistula, tegmen dehiscence and facial canal erosion are later complications to look for on the scan, not early signs.","w":["Wrong - a lateral canal fistula is a later complication (circumscribed labyrinthitis).","Wrong - tegmen erosion is a later finding that warns of intracranial spread.","Correct - scutal blunting is the classic earliest bony sign of attic cholesteatoma.","Wrong - a sclerotic, opacified mastoid reflects long-standing chronic otitis media, not an early erosive sign.","Wrong - facial canal erosion is a later finding that risks facial palsy."],"r":"Slides p57-58"},{"t":"CHOL","stem":"A 30-year-old man is referred for myringoplasty with a note: 'dry central perforation, safe ear'. Under the microscope there is a dry central perforation of the right pars tensa. A small brown crust sits over the pars flaccida, and on direct questioning he admits occasional scanty, smelly discharge.\nWhat is the best next step?","o":["List for myringoplasty after 6 months of a dry ear","Topical ofloxacin drops for 2 weeks, then review","Repeat PTA and tympanometry before listing","Microsuction of the crust to inspect the attic","Ear swab for culture and sensitivity first"],"a":3,"e":"An attic cholesteatoma can coexist with a central perforation, so **always examine the attic even when a central perforation is seen**. A crust over the pars flaccida often hides an attic perforation or retraction pocket full of keratin, and scanty foul discharge is an unsafe-ear feature. If cholesteatoma is found, the plan changes from myringoplasty to mastoid surgery with HRCT.","w":["Wrong - listing for myringoplasty risks closing the drum over an undiagnosed attic cholesteatoma.","Wrong - drops do not answer the key question of what lies under the attic crust.","Wrong - hearing tests are needed later but will not exclude cholesteatoma.","Correct - clear the crust under the microscope and inspect the pars flaccida for a cholesteatoma sac.","Wrong - a swab is for unresolved active discharge and does not examine the attic."],"r":"Slides p54-55"},{"t":"CHOL","stem":"A 42-year-old teacher has extensive cholesteatoma filling the attic and antrum of her left ear. Bone conduction is normal and at surgery the stapes is intact and mobile. The surgeon decides the posterior canal wall must be taken down for safe clearance, but wants to keep her chance of useful hearing.\nWhich procedure is most appropriate?","o":["Radical mastoidectomy","Cortical (Schwartz) mastoidectomy","Combined approach tympanoplasty","Atticotomy alone","Modified radical mastoidectomy"],"a":4,"e":"Both radical and **modified radical mastoidectomy (MRM)** are **canal wall down**: the posterior meatal wall is removed and the middle ear, attic, antrum and mastoid become one cavity. Radical mastoidectomy removes the TM remnants and ossicles (except the stapes footplate) and obliterates the Eustachian tube, so no hearing mechanism is left. MRM **preserves the TM remnant and ossicular remnants (handle of malleus, stapes)** and can be combined with tympanoplasty to rebuild hearing.","w":["Wrong - radical mastoidectomy clears disease but removes the hearing mechanism and blocks the Eustachian tube.","Wrong - cortical mastoidectomy is canal wall up and is used for acute mastoiditis, not extensive cholesteatoma.","Wrong - combined approach tympanoplasty keeps the posterior canal wall (canal wall up).","Wrong - atticotomy alone is a limited canal wall up procedure for small attic disease.","Correct - MRM takes down the canal wall but preserves the drum remnant and ossicles for hearing."],"r":"Slides p61-63"},{"t":"CHOL","stem":"A 34-year-old man with no past ear infections or perforation develops a keratin-filled sac in the attic. Histology of the excised pars flaccida shows the basal layer of its squamous epithelium proliferating and breaking through the basement membrane into the subepithelial connective tissue.\nWhich theory of cholesteatoma formation does this histology support?","o":["Basal cell hyperplasia with papillary ingrowth (Ruedi)","Invagination of a retraction pocket (Wittmaack)","Epithelial migration through a perforation (Habermann)","Squamous metaplasia of middle ear mucosa (Sadé)","Embryonic epidermoid cell rest (Michaels)"],"a":0,"e":"**Ruedi's basal cell hyperplasia** theory: basal cells of the pars flaccida proliferate and push papillary cones through the basement membrane, and these become cholesteatoma behind an intact drum. With **Wittmaack's invagination** theory, standard texts (Dhingra) class it as **primary acquired** (no prior perforation or infection). Habermann's migration and Sadé's metaplasia need a perforation or infected mucosa, so they explain **secondary acquired** disease. Note: slide p51 lists Ruedi under secondary acquired; most texts place it under primary acquired.","w":["Correct - basal layer proliferation through the basement membrane is Ruedi's theory (primary acquired).","Wrong - Wittmaack explains a deepening retraction pocket, not basal layer invasion on histology.","Wrong - Habermann requires a perforation for canal skin to migrate in; he has never had one.","Wrong - Sadé's metaplasia follows chronic infection of middle ear mucosa, which he has not had.","Wrong - an embryonic cell rest explains congenital cholesteatoma, not a pars flaccida lesion in an adult."],"r":"Slides p50-51"},{"t":"CHOL","stem":"A 50-year-old man with long-standing foul-smelling left otorrhoea complains of brief spinning when he presses on his left tragus or blows his nose. Microscopy shows an attic perforation filled with keratin. Pressing the tragus to raise canal pressure produces vertigo and nystagmus.\nWhich structure has most likely been eroded?","o":["Posterior semicircular canal","Lateral semicircular canal","Superior semicircular canal","Cochlear promontory","Stapes footplate at oval window"],"a":1,"e":"A **positive fistula test** means pressure in the canal is being transmitted to the labyrinth through eroded bone (**circumscribed labyrinthitis**, slide p77). The **lateral (horizontal) semicircular canal** bulges into the medial wall of the aditus and antrum, directly in the path of attic-antral cholesteatoma, so it is the commonest fistula site. Confirm with HRCT and plan surgery; the matrix over a fistula is handled carefully to protect hearing.","w":["Wrong - the posterior canal lies deep in the petrous bone, away from the antrum, and is rarely eroded.","Correct - the lateral canal prominence faces the aditus and antrum and is the commonest fistula site.","Wrong - superior canal dehiscence is usually a non-infective thinning of the middle fossa floor.","Wrong - promontory erosion is uncommon and would threaten the cochlea rather than the canal.","Wrong - the footplate is a rare fistula site compared with the lateral canal."],"r":"Lecturer pearl"},{"t":"VERT","stem":"A 72-year-old man attends Klinik Kesihatan with 'dizziness' for 3 weeks. He feels light-headed and his vision greys out within seconds of getting up from a chair; there is no spinning, no hearing loss and no tinnitus. Amlodipine and a thiazide were started last month. Ear and neurological examinations are normal.\nWhat is the most appropriate next step?","o":["Dix-Hallpike test on both sides","Pure tone audiometry and tympanometry","Lying and standing blood pressure","Oral betahistine and review in 2 weeks","MRI internal acoustic meatus"],"a":2,"e":"Vertigo is a symptom, so first decide whether it is **true vertigo** (an illusion of rotation) or **light-headedness/presyncope** or imbalance. Greying out on standing with no spinning, after new antihypertensives, points to **postural hypotension**, so measure lying and standing BP. Vestibular tests and betahistine are for true rotatory vertigo.","w":["Wrong - Dix-Hallpike tests for BPPV, which causes spinning on lying down or rolling over, not presyncope on standing.","Wrong - audiometry is for hearing symptoms or true vertigo; he has neither.","Correct - presyncope on standing after new antihypertensives calls for a postural BP check.","Wrong - betahistine is for Ménière's-type vertigo and would not help postural hypotension.","Wrong - imaging of the IAM is for asymmetrical hearing loss or unilateral tinnitus."],"r":"Slide p66"},{"t":"VERT","stem":"A 48-year-old lift technician had a head injury 2 months ago. He now reports an exaggerated sinking or rising sensation whenever the lift starts moving up or down, but no spinning when turning his head and no hearing loss. Dix-Hallpike testing is negative.\nDysfunction of which vestibular end-organ best explains his symptom?","o":["Utricle","Lateral semicircular canal","Posterior semicircular canal","Saccule","Superior semicircular canal"],"a":3,"e":"The **semicircular canals** detect **angular** (rotational) acceleration; the **otolith organs** detect **linear** acceleration and gravity. The **utricle** senses horizontal linear movement (forwards and backwards); the **saccule** senses **vertical linear movement** (up and down, as in a lift). The trap is the utricle: it is the source of BPPV otoconia, but it senses horizontal, not vertical, movement.","w":["Wrong - the utricle senses horizontal linear (forward-backward) acceleration.","Wrong - the lateral canal senses rotation in the horizontal plane, such as turning the head.","Wrong - the posterior canal senses rotation and is the canal involved in BPPV.","Correct - the saccule senses vertical linear acceleration, such as a lift starting up or down.","Wrong - the superior canal senses rotation (nodding), not linear movement."],"r":"Slide p68"},{"t":"VERT","stem":"A 66-year-old man with diabetes and hypertension presents to ED with sudden vertigo and vomiting for 6 hours. He cannot stand without support. There is vertical downbeating nystagmus that is unchanged with visual fixation, hearing is normal, and there is mild left finger-nose ataxia.\nWhat is the most appropriate next step?","o":["Epley manoeuvre and discharge home","IV prochlorperazine then discharge with betahistine","Vestibular rehabilitation exercises","Urgent pure tone audiometry next morning","Urgent brain imaging via the stroke pathway"],"a":4,"e":"Central features: **severe, constant imbalance**, **neurological signs**, and **vertical or direction-changing nystagmus not suppressed by visual fixation**, with slow recovery. Peripheral vertigo gives unidirectional horizontal-torsional nystagmus that is suppressed by fixation, fatigable, with latency, often with hearing loss. In a vascular-risk patient this is a posterior circulation (cerebellar) stroke until proven otherwise: the must-not-miss diagnosis.","w":["Wrong - Epley treats BPPV; this nystagmus is constant and vertical, not positional.","Wrong - sedating and discharging a likely cerebellar stroke is a dangerous miss.","Wrong - rehabilitation is for compensated peripheral loss, not an acute central event.","Wrong - hearing is normal and audiometry does not address the stroke risk.","Correct - central signs with vascular risk factors need urgent brain imaging for posterior circulation stroke."],"r":"Slides p70-71"},{"t":"VERT","stem":"A 58-year-old woman has 2 weeks of brief spinning attacks when she rolls onto her right side in bed or looks up to a high shelf; each lasts under a minute. Hearing is normal. On right Dix-Hallpike testing, after a 5-second latency, there is upbeating torsional nystagmus with the upper pole beating towards the right (lower) ear, lasting 20 seconds and weaker on repetition.\nWhat is the best management?","o":["Epley manoeuvre for the right posterior canal","Barbecue (Lempert) roll for the lateral canal","Epley manoeuvre for the left posterior canal","Betahistine 16 mg three times daily for 3 months","Urgent MRI brain with diffusion-weighted imaging"],"a":0,"e":"This is posterior canal **BPPV**: otoconia dislodged from the **utricle** into the **posterior semicircular canal** (about 80% of cases). A positive Dix-Hallpike shows **latency of a few seconds, upbeating torsional geotropic nystagmus lasting under a minute, which fatigues**; the undermost ear is the affected one. Treat with canalith repositioning (**Epley**) starting on the affected side; drugs do not help. Note: slide p72 says attacks last seconds to minutes; classic BPPV attacks last under a minute.","w":["Correct - a positive right Dix-Hallpike means right posterior canal BPPV, treated by a right-sided Epley.","Wrong - the barbecue roll is for lateral canal BPPV, which gives horizontal nystagmus on supine roll testing.","Wrong - the undermost (right) ear during the positive test is the affected side.","Wrong - betahistine has no role in BPPV; repositioning is curative in most patients.","Wrong - latency, fatigability and torsional geotropic nystagmus are classic peripheral BPPV, not central."],"r":"Slides p72-74"},{"t":"VERT","stem":"A 44-year-old woman has had four attacks over 6 months of spinning vertigo lasting 2-3 hours, with vomiting, a roaring left tinnitus and left ear fullness. Between attacks she is well. PTA during a recent attack showed left thresholds of 45 dB HL at 250 and 500 Hz and 20 dB HL from 2 to 8 kHz, with no air-bone gap; this improved a month later.\nWhat is the underlying pathology?","o":["Otoconia displaced into the posterior canal","Distension of the endolymphatic compartment","Viral inflammation of the vestibular nerve","Schwannoma of the vestibular nerve in the IAM","Ischaemia in the anterior inferior cerebellar artery"],"a":1,"e":"Episodic vertigo lasting **20 minutes to hours** with **fluctuating low-frequency SNHL, tinnitus and aural fullness** is **Ménière's disease**, caused by idiopathic **endolymphatic hydrops** (distension of the endolymphatic space). BPPV lasts seconds, vestibular neuritis is a single attack lasting days without hearing loss, and a schwannoma causes progressive rather than fluctuating loss.","w":["Wrong - BPPV attacks are positional, last seconds and spare hearing.","Correct - endolymphatic hydrops causes the triad with fluctuating low-frequency SNHL.","Wrong - vestibular neuritis is a single prolonged attack over days, with normal hearing.","Wrong - a vestibular schwannoma causes progressive asymmetrical loss, not discrete reversible attacks.","Wrong - an AICA stroke is a single sudden event with neurological signs, not recurrent reversible attacks."],"r":"Slide p75"},{"t":"VERT","stem":"A 55-year-old man with a 4-year history of definite left-sided Ménière's disease still has two disabling attacks a month despite a low-salt diet, reduced caffeine and regular betahistine. His left ear now has a flat 75 dB HL sensorineural loss; the right ear is normal.\nWhat is the most appropriate next treatment?","o":["Daily prochlorperazine taken long term","Repeated Epley manoeuvres every month","Intratympanic gentamicin to the left ear","Endolymphatic sac surgery on the right","Vestibular rehabilitation as sole therapy"],"a":2,"e":"**Vestibular sedatives** (prochlorperazine, promethazine) are for **acute attacks only**, because long-term use delays central compensation. **Intratympanic gentamicin** is a chemical labyrinthectomy: it controls vertigo in most patients but can worsen hearing, so it suits an ear whose hearing is already poor. Surgery (endolymphatic sac decompression, vestibular neurectomy) is for failed medical treatment and is done on the affected side. Note: slide p76 lists betahistine (Betaserc) with the sedatives; it is a histamine analogue, not a vestibular sedative.","w":["Wrong - long-term vestibular sedatives impair central compensation; use them only during attacks.","Wrong - Epley repositions otoconia in BPPV and has no role in hydrops.","Correct - with hearing already poor in the left ear, ablative intratympanic gentamicin is the logical next step.","Wrong - surgery would be done on the affected left ear, never the normal right ear.","Wrong - rehabilitation helps chronic imbalance but does not stop recurrent hydrops attacks."],"r":"Slide p76"},{"t":"VERT","stem":"A 35-year-old man with long-standing foul-smelling right otorrhoea presents to ED with 2 days of fever, severe constant vertigo and vomiting. PTA shows no response in the right ear at maximum output on both air and bone conduction. Horizontal nystagmus beats towards the left ear.\nWhat is the most likely diagnosis?","o":["Serous (viral) labyrinthitis","Circumscribed labyrinthitis from a canal fistula","Vestibular neuritis","Suppurative labyrinthitis","Benign paroxysmal positional vertigo"],"a":3,"e":"**Suppurative labyrinthitis**: bacteria invade the labyrinth (from COM/cholesteatoma or meningitis), destroying it, so there is a **total, permanent SNHL (dead ear)**, severe vertigo and nystagmus beating towards the healthy ear. Serous labyrinthitis (toxins or virus) gives partial, recoverable hearing loss; a circumscribed fistula gives brief pressure-induced vertigo with hearing preserved. Admit for IV antibiotics and mastoid surgery, and watch for meningitis.","w":["Wrong - serous labyrinthitis gives partial, often recoverable hearing loss, not a dead ear.","Wrong - a circumscribed fistula causes brief pressure-induced vertigo with hearing largely preserved.","Wrong - vestibular neuritis spares hearing and is not linked to chronic otorrhoea.","Correct - a dead ear with severe vertigo and fever in unsafe COM means bacterial invasion of the labyrinth.","Wrong - BPPV is brief, positional and never causes a dead ear."],"r":"Slide p77"},{"t":"VERT","stem":"A 52-year-old woman has 1 year of left-sided tinnitus and gradually worsening left hearing, with mild unsteadiness but no spinning attacks. Otoscopy is normal. PTA: right ear normal; left ear AC and BC equal at 15 dB HL at 250-500 Hz, 35 dB HL at 2 kHz and 45 dB HL at 4-8 kHz. Tympanometry is type A in both ears.\nWhat is the most appropriate investigation?","o":["HRCT temporal bone with fine bone cuts","Repeat PTA in 12 months to watch for progression","Dix-Hallpike test on the left side","Carotid and vertebral artery Doppler","Gadolinium MRI of internal acoustic meatus"],"a":4,"e":"**Asymmetrical SNHL or unilateral tinnitus** must be investigated to exclude a **vestibular schwannoma** (acoustic neuroma); the test of choice is **MRI of the internal acoustic meatus** (gadolinium-enhanced or high-resolution T2). HRCT shows bone, not a small nerve-sheath tumour. Note: slide p70 lists acoustic neuroma under central causes; it arises from the vestibular nerve in the IAM/cerebellopontine angle (retrocochlear) and gives central signs only when large.","w":["Wrong - HRCT is for bony middle ear disease such as cholesteatoma and misses small intracanalicular tumours.","Wrong - waiting a year risks missing a growing tumour; asymmetry needs imaging now.","Wrong - she has no positional vertigo, so Dix-Hallpike adds nothing.","Wrong - vascular imaging does not explain a progressive unilateral SNHL.","Correct - gadolinium MRI of the IAM is the investigation of choice to exclude vestibular schwannoma."],"r":"Lecturer pearl"},{"t":"PTA","stem":"A 58-year-old woman with a 20-year history of an intermittently discharging left ear attends ENT clinic. PTA of the left ear: air conduction 60, 65, 70 and 75 dB HL at 0.5, 1, 2 and 4 kHz; bone conduction 30, 35, 40 and 45 dB HL at the same frequencies. The right ear is normal.\nHow is the left-ear hearing loss best classified?","o":["Moderate mixed hearing loss","Severe mixed hearing loss","Moderate conductive hearing loss","Moderate sensorineural hearing loss","Mild sensorineural hearing loss"],"a":0,"e":"**Severity** is read from the **air conduction** average (here about 68 dB HL = **moderate**, 41-70 dB HL on the BSA scale). **Type** is read from **bone conduction**: BC is abnormal (above 20 dB HL) and there is a 30 dB air-bone gap, so the loss is **mixed**, the classic pattern of chronic otitis media (conductive element from the perforation or ossicles plus cochlear damage from toxins). Note: slides p85 and p89 say an air-bone gap of 10 dB or more, p91 says more than 10 dB; teach a gap of more than about 10 dB.","w":["Correct - AC average about 68 dB HL is moderate; abnormal BC plus a 30 dB gap makes it mixed.","Wrong - severe starts at 71 dB HL; the AC average here is about 68 dB HL.","Wrong - conductive loss needs normal BC; her BC is 30-45 dB HL.","Wrong - sensorineural loss has no air-bone gap; here the gap is 30 dB.","Wrong - mild is 20-40 dB HL, and the large air-bone gap excludes pure SNHL."],"r":"Slides p83-91"},{"t":"PTA","stem":"A 46-year-old man who has worked for 20 years in a palm-oil mill without ear protection finds it hard to follow conversation in crowded places. Otoscopy is normal. PTA in both ears: AC and BC equal, 15 dB HL from 250 Hz to 2 kHz, 55 dB HL at 4 kHz, and 30 dB HL at 8 kHz.\nWhat is the most likely diagnosis?","o":["Age-related hearing loss (presbycusis)","Noise-induced hearing loss","Aminoglycoside ototoxicity","Otosclerosis with cochlear involvement","Bilateral Ménière's disease"],"a":1,"e":"A bilateral sensorineural **notch at 4 kHz with recovery at 8 kHz** is the signature of **noise-induced hearing loss**: the cochlear region tuned around 4 kHz is the most vulnerable to noise trauma. Presbycusis slopes down steadily to 8 kHz without recovery, ototoxicity starts at the highest frequencies, and Ménière's affects the low frequencies first. Advise hearing protection and workplace hearing surveillance.","w":["Wrong - presbycusis gives a steadily sloping high-frequency loss that is worst at 8 kHz, with no recovery.","Correct - a 4 kHz notch recovering at 8 kHz in a noise-exposed worker is classic noise-induced loss.","Wrong - aminoglycoside damage begins at the highest frequencies (8 kHz and above).","Wrong - otosclerosis gives a conductive loss with an air-bone gap; here AC equals BC.","Wrong - Ménière's gives fluctuating low-frequency loss with vertigo, usually one-sided at first."],"r":"Slide p88"},{"t":"PTA","stem":"A 30-year-old woman notices that her hearing in both ears has worsened since her second pregnancy, yet she hears speech better on a noisy bus. Both tympanic membranes look normal. PTA shows bilateral AC thresholds around 45 dB HL across all frequencies; BC is 10-15 dB HL except for a dip to 35 dB HL at 2 kHz. Tympanograms show a peak at 0 daPa with compliance of 0.2 ml.\nWhat is the most likely underlying pathology?","o":["Fluid filling the middle ear cleft","Disruption of the incudostapedial joint","Otospongiotic fixation of the stapes","Hyaline plaques within the tympanic membrane","Outer hair cell loss at the basal cochlea"],"a":2,"e":"Progressive bilateral **conductive loss with a normal drum** in a young woman, worse with pregnancy, with paracusis Willisii (hearing better in noise), suggests **otosclerosis**. The **Carhart notch** (BC dip at **2 kHz**) is a mechanical artefact of stapes fixation that improves after stapes surgery, and the tympanogram is **type As** (normal pressure, low compliance). Effusion would give a flat type B trace, and ossicular discontinuity a high-compliance type Ad.","w":["Wrong - effusion gives a dull drum and a flat type B tympanogram, not a peak at 0 daPa.","Wrong - discontinuity gives a hypermobile type Ad trace with high compliance.","Correct - stapes fixation gives conductive loss, a 2 kHz Carhart notch and a type As trace.","Wrong - tympanosclerotic plaques are visible on the drum, and her drums are normal.","Wrong - outer hair cell loss is sensorineural, with no air-bone gap."],"r":"Lecturer pearl"},{"t":"PTA","stem":"A 40-year-old man woke this morning with a blocked, deaf right ear and loud tinnitus. There is no vertigo, pain or discharge. Otoscopy is normal on both sides. With a 512 Hz tuning fork, Rinne is positive in both ears and Weber lateralises to the left.\nWhat is the most appropriate next step?","o":["Nasal decongestant and autoinflation, review in 6 weeks","Softening drops and ear syringing of the right ear","Oral amoxicillin for presumed otitis media","Same-day ENT referral for PTA and oral steroids","Reassure and repeat tuning fork tests in a month"],"a":3,"e":"Rinne positive with **Weber lateralising to the better (left) ear** means a **right sensorineural loss**; a conductive loss would send Weber to the deaf ear. Sudden SNHL is an **otological emergency**: confirm with same-day PTA and start high-dose oral steroid (e.g. prednisolone 1 mg/kg, maximum 60 mg) as early as possible, then MRI IAM to exclude a retrocochlear cause. The trap is treating a 'blocked ear' as wax or Eustachian tube dysfunction.","w":["Wrong - this treats Eustachian tube dysfunction, but the tuning forks show sensorineural loss.","Wrong - the canals are clear on otoscopy, and syringing does nothing for cochlear loss.","Wrong - the drums are normal, so there is no evidence of otitis media.","Correct - sudden SNHL needs same-day audiometry and early oral steroids.","Wrong - a month's delay loses the window in which steroids help recovery."],"r":"Lecturer pearl"},{"t":"TYMP","stem":"A 6-year-old girl had bilateral grommets inserted 6 months ago for glue ear. At review both ears are dry. Tympanometry of the right ear shows a flat trace with no identifiable peak and an ear canal volume of 2.4 ml; before surgery the same ear read 0.7 ml.\nWhat is the best interpretation of the right tympanogram?","o":["Middle ear effusion behind a blocked grommet","Grommet extruded into canal and blocked by wax","Eustachian tube dysfunction with negative pressure","Hypermobile drum from ossicular discontinuity","A patent grommet connecting canal and middle ear"],"a":4,"e":"A **type B** (flat) trace must be read with the **ECV**: **normal ECV = effusion**, **low ECV = wax or probe against the canal wall**, **high ECV = perforation or patent grommet**, because the probe now measures the canal plus the middle ear space. A jump from 0.7 to 2.4 ml with a dry ear means the grommet is open and working. Note: slide p98 describes type B as having normal ECV; type B is any flat trace, and the ECV tells you the cause.","w":["Wrong - a blocked grommet with effusion gives a flat trace with a normal, not raised, ECV.","Wrong - wax blocking the canal gives a flat trace with a low ECV.","Wrong - Eustachian tube dysfunction gives a type C trace with a negative-pressure peak.","Wrong - discontinuity gives a type Ad trace with a tall peak, not a flat one.","Correct - a flat trace with a high ECV after grommet insertion means a patent grommet."],"r":"Slide p98"},{"t":"TYMP","stem":"A 7-year-old boy has had a blocked left ear for 10 days after a cold, with no pain or fever. Otoscopy shows a retracted tympanic membrane with a prominent short process of the malleus and no fluid level. Left tympanometry: peak at −250 daPa, static compliance 0.6 ml, ECV 0.8 ml.\nWhich tympanogram type is this, and what does it indicate?","o":["Type B, indicating middle ear effusion","Type As, indicating a stiff, fixed ossicular chain","Type C, indicating Eustachian tube dysfunction","Type Ad, indicating ossicular discontinuity","Type A, indicating a normal middle ear"],"a":2,"e":"Normal peak pressure is **+50 to −100 daPa** with compliance 0.3-1.7 ml. A peak shifted well into **negative pressure with normal compliance and ECV is type C**, meaning the middle ear is below atmospheric pressure because of **Eustachian tube dysfunction**, here after an upper respiratory infection. It may progress to effusion (type B) but usually resolves with watchful waiting or autoinflation.","w":["Wrong - type B has no peak at all; this trace has a clear peak.","Wrong - type As peaks near 0 daPa with low compliance; here compliance is normal and the peak is negative.","Correct - a peak at −250 daPa with normal compliance and ECV is type C from Eustachian tube dysfunction.","Wrong - type Ad peaks near 0 daPa with very high compliance.","Wrong - type A peaks between +50 and −100 daPa; −250 daPa is outside that range."],"r":"Slide p99"},{"t":"TYMP","stem":"A 26-year-old man was punched on the right side of the head 3 weeks ago and has had right-sided hearing loss since then. The tympanic membrane is intact, with no blood behind it. PTA: right AC 50 dB HL and BC 10 dB HL across frequencies. Right tympanometry: peak at 0 daPa, static compliance 3.0 ml, ECV 1.3 ml.\nWhat is the most likely cause?","o":["Dislocation at the incudostapedial joint","Haemotympanum from temporal bone fracture","Traumatic stapes footplate fixation","Traumatic perforation of the pars tensa","Eustachian tube oedema with negative pressure"],"a":0,"e":"**Type Ad**: normal peak pressure with **markedly raised compliance** (above 1.7 ml), meaning a **flaccid, hypermobile system**. With an intact drum and a large conductive loss (40 dB air-bone gap) after head trauma, this means **ossicular discontinuity**, most often at the incudostapedial joint or the long process of the incus. A thin, scarred drum can also give type Ad, but would not explain a 40 dB gap.","w":["Correct - a hypermobile type Ad trace with a large conductive gap after trauma means ossicular discontinuity.","Wrong - haemotympanum fills the middle ear, giving a flat type B trace with normal ECV, and none is seen.","Wrong - fixation stiffens the system, giving type As (low compliance), not high compliance.","Wrong - the drum is intact; a perforation would give a flat trace with a high ECV.","Wrong - Eustachian tube dysfunction gives a negative-pressure type C peak."],"r":"Slide p97"}]},{"id":"fnp","title":"Facial Nerve Palsy","short":"Facial n.","emoji":"😐","source":"Facial Nerve Palsy (2).pdf","topics":{"ANAT":"Anatomy: course, segments, branches & functions","LOC":"Examination: UMN vs LMN, lesion localisation & House-Brackmann grading","BELL":"Bell's palsy","MRS":"Melkersson-Rosenthal syndrome","RHS":"Ramsay Hunt syndrome (herpes zoster oticus)","OM":"Otitis media (AOM & COM / cholesteatoma)","MOE":"Malignant (necrotising) otitis externa","TUM":"Neoplasms: facial neuroma, parotid & temporal bone cancer","TRA":"Temporal bone fractures","INV":"Electrophysiology & topodiagnostic tests","SURG":"Surgery, iatrogenic & neonatal facial palsy"},"cards":[{"t":"ANAT","q":"What are the three divisions of the facial nerve's course, and where does each begin and end?","a":"• **Intracranial**: motor nucleus in the **lower pons** → internal acoustic meatus (IAM)\n• **Intratemporal**: IAM → **stylomastoid foramen** (within the bony Fallopian canal)\n• **Extracranial**: stylomastoid foramen → terminal branches in the face","m":"Brain → bone → face: the level of the lesion points to the cause (stroke/CPA tumour, ear disease/fracture, parotid).","r":"Slide p5"},{"t":"ANAT","q":"Describe the intracranial course of the facial nerve. What is the facial colliculus?","a":"• Motor fibres arise from the **facial motor nucleus** in the pontine tegmentum (lower pons)\n• They run dorsally and **loop around the abducens (VI) nucleus**, raising the **facial colliculus** in the floor of the 4th ventricle\n• Joined by the **nervus intermedius** (taste, secretomotor and sensory fibres)\n• Exit the brainstem at the **pontomedullary junction** → cerebellopontine angle → IAM with VIII","m":"Colliculus = VII hugging VI: a small pontine lesion here gives ipsilateral VI + LMN VII palsy.","r":"Slide p6"},{"t":"ANAT","q":"What are the functional components of the facial nerve, with their nuclei and targets?","a":"• **SVE (motor)** – facial motor nucleus → muscles of facial expression, **posterior belly of digastric**, **stylohyoid**, stapedius\n• **GVE (parasympathetic)** – lacrimal / superior salivatory nucleus → **lacrimal**, nasal and palatal glands (via GSPN) and **submandibular + sublingual** glands (via chorda tympani)\n• **SVA (taste)** – nucleus of tractus solitarius ← **anterior ⅔ of tongue** (except circumvallate papillae = IX)\n• **GSA (sensory)** – spinal trigeminal nucleus ← skin of the concha and around the ear\n• The **parotid** is supplied by **IX** (otic ganglion), not VII","m":"Face, Ear, Taste, Tears (and spit): the jobs of VII.","r":"Slide p7"},{"t":"ANAT","q":"Name the four intratemporal segments of the facial nerve with their approximate lengths.","a":"• **Meatal** (8-10 mm) – within the internal acoustic meatus\n• **Labyrinthine** (~4 mm) – fundus of IAM → **geniculate ganglion**, where the nerve turns posteriorly (first genu)\n• **Tympanic / horizontal** (~11 mm) – geniculate ganglion → just above the pyramidal eminence\n• **Mastoid / vertical** (~13 mm) – pyramid (second genu) → **stylomastoid foramen**","m":"M-L-T-M, about 9-4-11-13 mm: the shortest (labyrinthine) is also the narrowest and most vulnerable.","r":"Slides p8-10"},{"t":"ANAT","q":"Why is the labyrinthine segment the classic site of compression in Bell's palsy?","a":"• It is the **narrowest** part of the Fallopian canal – the **meatal foramen** is only ~**0.68 mm** wide\n• The nerve nearly fills the canal here, so slight oedema causes compression\n• It is a **vascular watershed** without a good anastomotic arterial arcade → easily ischaemic\n• Oedema → venous congestion → ischaemia → more oedema (vicious cycle)\n• Hence decompression for Bell's targets this segment via the **middle cranial fossa**","m":"A tight collar on a swollen neck: the tightest point strangles first.","r":"Lecturer pearl"},{"t":"ANAT","q":"What are the relations of the tympanic segment, and why does it matter surgically?","a":"• Runs on the medial wall of the middle ear **above the oval window** (stapes) and **below the lateral semicircular canal**\n• Commonest site of **natural bony dehiscence** → nerve exposed to middle-ear infection (AOM palsy) and cholesteatoma\n• Commonest site of **iatrogenic injury** in middle-ear and mastoid surgery\n• The lateral SCC is the surgeon's landmark for finding it","m":"A sandwich: lateral SCC on top, oval window below, the nerve is the filling.","r":"Slide p8"},{"t":"ANAT","q":"Describe the mastoid segment of the facial nerve and the branches it gives off.","a":"• Turns downward at the **second genu** (near the pyramid) and descends vertically to the **stylomastoid foramen** (~13 mm)\n• **Nerve to stapedius** arises at its upper end, near the pyramid\n• **Chorda tympani** arises from the **middle of the vertical segment**, crosses medial to the tympanic membrane and joins the lingual nerve\n• At risk when drilling the posterior canal wall / facial recess in mastoidectomy","m":"Vertical drop: stapedius at the top, chorda in the middle, foramen at the bottom.","r":"Slides p8-12"},{"t":"ANAT","q":"List the intratemporal branches of the facial nerve in order from proximal to distal.","a":"• **Greater (superficial) petrosal nerve** – from the geniculate ganglion → secretomotor to **lacrimal**, nasal and palatal glands\n• **Nerve to stapedius** – damps loud sound\n• **Chorda tympani** – taste to the anterior ⅔ of the tongue + secretomotor to **submandibular and sublingual** glands\n• A small **sensory communicating branch** to the concha, posterior EAC and outer tympanic membrane","m":"Tears → Ears → Taste: GSPN, stapedius, chorda – the basis of topodiagnosis.","r":"Slide p12"},{"t":"ANAT","q":"Which branches does the facial nerve give between the stylomastoid foramen and the parotid gland?","a":"• **Posterior auricular nerve** – auricular muscles and **occipital belly of occipitofrontalis**\n• **Nerve to the posterior belly of digastric**\n• **Nerve to stylohyoid**\n• The trunk then enters the **parotid** and divides at the pes anserinus","m":"Behind the ear first, then the two neck muscles: digastric and stylohyoid.","r":"Slide p12"},{"t":"ANAT","q":"How does the facial nerve divide within the parotid, and what are its five terminal branches?","a":"• Divides into an upper **temporofacial** and a lower **cervicofacial** division\n• Temporofacial: **temporal**, **zygomatic**\n• Cervicofacial: **buccal**, **marginal mandibular**, **cervical**\n• The nerve plane separates the superficial and deep lobes – the dissection plane of a superficial parotidectomy","m":"Two Zebras Buggered My Cat – Temporal, Zygomatic, Buccal, Marginal mandibular, Cervical (top to bottom).","r":"Slide p11"},{"t":"ANAT","q":"Which skin area does the facial nerve supply, and why is this clinically useful?","a":"• General sensory fibres to the **concha**, retroauricular groove, **posterior EAC** and outer surface of the tympanic membrane\n• Explains why **Ramsay Hunt vesicles** appear in the concha / EAC (VZV in the geniculate ganglion)\n• Reduced sensation of the posterior meatal wall (**Hitselberger sign**) can be an early sign of a CPA tumour such as vestibular schwannoma","m":"The Ramsay Hunt rash maps the sensory territory of VII.","r":"Slides p7-12"},{"t":"ANAT","q":"How do you test each terminal branch of the facial nerve at the bedside?","a":"• **Temporal** – raise the eyebrows (frontalis)\n• **Zygomatic** – screw the eyes shut tightly (orbicularis oculi)\n• **Buccal** – puff out the cheeks, show the teeth (buccinator, orbicularis oris)\n• **Marginal mandibular** – pout / evert the lower lip\n• **Cervical** – grimace and tense the neck (platysma)","m":"Top to bottom: Brows, Eyes, Cheeks, Lips, Neck.","r":"Lecturer pearl"},{"t":"LOC","q":"Why does an upper motor neuron (UMN) facial palsy spare the forehead?","a":"• The part of the facial nucleus supplying the **upper face** receives **bilateral** corticobulbar input\n• The part supplying the **lower face** receives mainly **contralateral** input\n• So a unilateral cortical / internal capsule lesion (stroke, tumour) weakens only the **contralateral lower face**\n• An LMN lesion (nucleus or nerve) paralyses the **whole ipsilateral half**, forehead included","m":"The forehead has two bosses: lose one and the other still runs it.","r":"Lecturer pearl"},{"t":"LOC","q":"Apart from forehead sparing, which features help distinguish UMN from LMN facial palsy?","a":"• UMN: **contralateral** lower face; emotional smiling often preserved despite a weak voluntary smile (**emotional-voluntary dissociation**); usually with hemiparesis or dysphasia\n• UMN: eye closure, taste, tears and stapedial reflex are **normal**\n• LMN: **ipsilateral** whole face, incomplete eye closure, visible **Bell's phenomenon**, ± hyperacusis, taste loss, dry eye","m":"The stroke patient smiles at a joke but not on command.","r":"Lecturer pearl"},{"t":"LOC","q":"What is Bell's phenomenon and what does its presence or absence tell you?","a":"• On attempted eye closure the eyeball **rolls upward and outward**, visible because the lids fail to close\n• A normal protective reflex unmasked by **LMN** orbicularis oculi weakness (needs an intact III)\n• **Present** – the cornea is partly protected under the upper lid\n• **Absent** (a minority of people) – much higher risk of **exposure keratitis** → aggressive eye care, early lid surgery","m":"The eye rolls up to hide behind a lid that will not shut.","r":"Slide p27"},{"t":"LOC","q":"Lesion at the stylomastoid foramen (level A): what are the features?","a":"• Loss of **all muscles of facial expression** on that side (LMN, forehead included)\n• Mouth **deviates to the normal side**; dribbling; cannot close the mouth or eye\n• **Food collects in the vestibule** of the mouth (buccinator paralysis)\n• Flattened expression lines and nasolabial fold\n• **Taste, salivation, tears and stapedial reflex are all normal** – those branches left earlier","m":"Level A = motor only: every other branch already got off the train.","r":"Slide p16"},{"t":"LOC","q":"Lesion above the origin of the chorda tympani (level B): what is added to level A?","a":"• All features of level A, plus\n• **Loss of taste** on the anterior ⅔ of the tongue\n• **Reduced submandibular salivation**\n• Tear production and stapedial reflex remain **normal**\n• Tests: **taste / electrogustometry** and **submandibular salivary flow**","m":"B = bland: taste and spit are lost.","r":"Slide p16"},{"t":"LOC","q":"Lesion above the nerve to stapedius (level C): what is added to level B?","a":"• All features of level B, plus\n• **Hyperacusis** – loud sounds are uncomfortable because the stapedius no longer damps the ossicles\n• **Absent stapedial (acoustic) reflex** on the affected side\n• Lacrimation is still **normal**","m":"C = clatter: noise intolerance.","r":"Slide p17"},{"t":"LOC","q":"Lesion at or above the geniculate ganglion (level D): what is added, and which test proves it?","a":"• All features of level C (i.e. A + B + C), plus\n• **Reduced lacrimation** – the greater petrosal nerve leaves at the geniculate ganglion\n• Proven by an abnormal **Schirmer test** on the affected side\n• Classic causes: Ramsay Hunt, facial schwannoma (geniculate), Bell's (labyrinthine segment), temporal bone fracture\n• The signs are cumulative: each higher level adds one branch to everything below it","m":"D = dry eye: the GSPN has been cut off.","r":"Slide p17"},{"t":"LOC","q":"Lesion at the cerebellopontine angle (level E): how does it present?","a":"• All features of level D: motor, taste, salivation, stapedius and tears may all be affected\n• Plus **VIII involvement** – unilateral **SNHL**, tinnitus, imbalance\n• Large lesions add **V** (reduced corneal reflex) and cerebellar signs\n• Classic causes: **vestibular schwannoma**, meningioma; facial weakness is usually **late and mild** because VII tolerates slow stretching","m":"E = Eighth too: CPA = VII + VIII ± V.","r":"Slide p18"},{"t":"LOC","q":"An LMN facial palsy has loss of taste and hyperacusis but a normal Schirmer test. Where is the lesion?","a":"• Normal tears → lesion is **distal to the geniculate ganglion** (GSPN spared)\n• Hyperacusis / absent stapedial reflex → lesion **proximal to the nerve to stapedius**\n• So the lesion lies between them: the **tympanic segment** (or very top of the mastoid segment)\n• Typical causes: cholesteatoma, AOM with a dehiscent canal, iatrogenic injury","m":"The lesion sits between the last branch that works and the first branch that fails.","r":"Slides p16-17"},{"t":"LOC","q":"Why do patients with LMN facial palsy often have a watery eye even though tear secretion may be reduced?","a":"• **Epiphora** is due to failed **drainage**, not overproduction\n• Orbicularis oculi paralysis → the **lower lid sags** (paralytic ectropion) and the punctum falls away from the globe\n• The blink-driven **lacrimal pump** fails, so tears spill over the cheek\n• Exposure also causes reflex tearing; a **Schirmer test** is needed to judge true secretion","m":"A leaking gutter, not an overflowing tap.","r":"Slide p26"},{"t":"LOC","q":"Outline the House-Brackmann (HB) grading of facial nerve function.","a":"• **I** Normal\n• **II** Mild – slight weakness on close inspection; **complete eye closure with minimal effort**\n• **III** Moderate – obvious but not disfiguring asymmetry; slight-moderate forehead movement; **complete eye closure with effort**\n• **IV** Moderately severe – disfiguring asymmetry; **no forehead movement; incomplete eye closure**\n• **V** Severe – barely perceptible movement\n• **VI** Total paralysis – no movement","m":"Normal, Mild, Moderate, Moderately severe, Severe, Total – severity climbs with the number.","r":"Lecturer pearl"},{"t":"LOC","q":"Which single finding separates House-Brackmann grade III from grade IV, and why does it matter?","a":"• **Eye closure**: grade III closes completely (with effort); grade IV **cannot close completely**\n• Grade IV also has **no forehead movement**\n• Incomplete closure = risk of **exposure keratitis** → intensive eye protection\n• HB III is also the usual best result after nerve grafting or hypoglossal-facial transfer\n• Sunnybrook is an alternative, more detailed regional scale","m":"Three can shut its eye; four cannot.","r":"Lecturer pearl"},{"t":"LOC","q":"Name important causes of bilateral LMN facial palsy.","a":"• **Guillain-Barré syndrome** (commonest acute bilateral cause)\n• **Lyme disease** (Borrelia)\n• **Sarcoidosis** – **Heerfordt syndrome**: uveitis, parotid swelling, fever, facial palsy\n• **Leukaemia / lymphoma**, basal meningitis, HIV\n• **Möbius syndrome** (congenital VI + VII), bilateral temporal bone fractures\n• Bilateral palsy is **not** labelled Bell's without investigation","m":"Bilateral = Big causes: GBS, Lyme, Sarcoid, Leukaemia, Möbius.","r":"Lecturer pearl"},{"t":"LOC","q":"How can a brainstem stroke cause a lower motor neuron pattern of facial palsy?","a":"• A **pontine** lesion damages the facial **nucleus or its fascicle** – that is the lower motor neuron itself\n• So the **forehead is involved** despite a central cause\n• Clues: an **ipsilateral VI palsy** (the fascicle loops around the VI nucleus) ± **contralateral hemiparesis** (Millard-Gubler syndrome)\n• Lesson: forehead involvement means LMN, not necessarily peripheral – look for other brainstem signs","m":"VII + VI on one side, weak limbs on the other = pons.","r":"Lecturer pearl"},{"t":"BELL","q":"How are the causes of facial nerve paralysis classified?","a":"• **Idiopathic**: Bell's palsy, Melkersson-Rosenthal syndrome\n• **Infective**: Ramsay Hunt syndrome, acute and chronic otitis media, malignant otitis externa\n• **Neoplastic**: facial nerve schwannoma, parotid malignancy, temporal bone carcinoma\n• **Traumatic**: temporal bone fracture; iatrogenic (ear, mastoid, parotid surgery); birth (forceps)","m":"I-I-N-T: Idiopathic, Infection, Neoplasm, Trauma.","r":"Slide p22"},{"t":"BELL","q":"Define Bell's palsy. How common is it?","a":"• **Idiopathic, acute-onset, unilateral LMN** (peripheral) facial palsy, developing over **< 72 hours**\n• The **commonest** cause of facial palsy: **60-75%** of cases\n• Both sexes affected equally\n• Always a **diagnosis of exclusion**","m":"Bell's = a bolt from the blue: sudden, one-sided, no other cause found.","r":"Slide p23"},{"t":"BELL","q":"What are the risk factors for Bell's palsy?","a":"• **Increasing age**\n• **Diabetes** (microangiopathy of the vasa nervorum)\n• **Pregnancy** – especially the **third trimester** and first postpartum week (fluid retention); also pre-eclampsia\n• **Positive family history** in 6-8% (narrow Fallopian canal)\n• Recent viral upper respiratory infection","m":"3 Ps: Pregnancy, Pancreas (diabetes), Pensioners.","r":"Slide p23"},{"t":"BELL","q":"Which aetiological theories have been proposed for Bell's palsy?","a":"• **Viral** – reactivation of **herpes simplex (HSV-1)** is most favoured; also VZV, EBV\n• **Vascular ischaemia** – primary (cold, emotional stress) or secondary: capillary leak → exudation and oedema → compression of the nerve's microcirculation\n• **Hereditary** – congenitally **narrow Fallopian canal**\n• **Autoimmune** – T-lymphocyte changes","m":"The virus lights the fire; the
