 is the Bell's palsy regimen; Bell's is a diagnosis of exclusion and here the cause is the infected middle ear.","Correct - IV antibiotics, steroids and myringotomy ± grommet decompress the middle ear and treat the infection; protect the eye that will not close.","Wrong - mastoidectomy is added only if there is mastoiditis (tenderness, swelling, coalescence on CT), which is absent here.","Wrong - the ENoG pathway applies to Bell's palsy and trauma; in AOM the priority is to treat and drain the infection now."],"r":"Slide p37"},{"t":"OM","stem":"A 4-year-old girl at a district hospital develops a left lower motor neurone facial palsy on day 1 of an acute middle-ear infection, before any mastoid signs appear. Her parents ask how an ear infection can affect the face so quickly.\nWhich anatomical feature best explains the early facial nerve involvement?","o":["Congenital dehiscence of the bony canal over the tympanic segment, above the oval window","Narrowness of the labyrinthine segment and meatal foramen, with no arterial arcade","Superficial course of the mastoid segment at the stylomastoid foramen in a young child's skull","Open fissures of Santorini in the cartilaginous canal, carrying infection to the nerve","Close relation of the meatal segment to the cochlear nerve inside the internal meatus"],"a":0,"e":"The **tympanic (horizontal) segment** runs above the oval window and below the lateral semicircular canal and is the **commonest site of bony dehiscence**, so middle-ear inflammation reaches the nerve directly; oedema inside the Fallopian canal then causes neuropraxia. The narrow labyrinthine segment explains Bell's palsy, not otitis media, and the fissures of Santorini are the spread route of necrotising otitis externa.","w":["Correct - a dehiscent tympanic segment lies bare in the middle ear, so inflammation and oedema involve the nerve early.","Wrong - the narrow labyrinthine segment is the site of compression in Bell's palsy, not the route by which middle-ear pus reaches the nerve.","Wrong - the superficial stylomastoid course in infants explains forceps injury at birth, not otitis media in a 4-year-old.","Wrong - fissures of Santorini let necrotising otitis externa spread from the ear canal to the skull base.","Wrong - the meatal segment lies in the internal acoustic meatus, far from the middle-ear cleft."],"r":"Slides p8, p36"},{"t":"OM","stem":"A 45-year-old man attends the ENT clinic with years of scanty, foul-smelling left ear discharge. Over the last 10 days his left face has become weak. Examination shows an attic retraction pocket filled with white keratin debris, granulations in the posterosuperior quadrant and a left lower motor neurone facial palsy (House-Brackmann III). There is no fever or neck stiffness.\nWhat is the most appropriate management?","o":["Aural toilet and topical quinolone drops, then review the facial nerve function in 4 weeks","Oral prednisolone 1 mg/kg for 10 days with eye care, operating only if no recovery","Myringotomy and grommet insertion with IV antibiotics and systemic corticosteroids","ENoG from day 3, proceeding to mastoid surgery only if degeneration exceeds 90%","HRCT, then urgent mastoid exploration with removal of disease and nerve decompression"],"a":4,"e":"Facial palsy in **chronic otitis media with cholesteatoma** means the Fallopian canal is being eroded; it does not recover with medical treatment and is an indication for **urgent surgery** (mastoidectomy, removal of cholesteatoma, decompression of the involved segment) after HRCT to map the disease. Myringotomy is the answer for AOM, and waiting for ENoG criteria belongs to Bell's palsy and trauma, not an active erosive process.","w":["Wrong - drops treat the discharge but not the cholesteatoma eroding the canal; delay risks permanent palsy.","Wrong - steroids may reduce oedema briefly, but the cause is erosion by disease that must be removed.","Wrong - myringotomy drains acute middle-ear pus; it does nothing for an attic cholesteatoma.","Wrong - ENoG thresholds guide surgery in Bell's palsy and trauma; here the palsy itself is the surgical indication.","Correct - HRCT maps the disease, then urgent mastoid exploration removes the cholesteatoma and decompresses the nerve."],"r":"Slides p38-39"},{"t":"OM","stem":"During an urgent canal wall-down mastoidectomy for cholesteatoma in a patient with a 1-week facial palsy, the consultant finds the bony canal of the tympanic segment eroded. The cholesteatoma matrix peels off easily, but vascular granulation tissue is seen penetrating the nerve sheath. The nerve is in continuity.\nWhat is the correct way to deal with the granulation tissue?","o":["Excise it from the sheath with sharp microdissection so no inflamed tissue remains","Leave the penetrating granulations and decompress the exposed canal either side","Resect the involved segment and bridge the gap with a great auricular cable graft","Coagulate the granulations with bipolar diathermy to control bleeding, then close","Abandon the procedure and rely on IV antibiotics and steroids to settle the nerve"],"a":1,"e":"**Granulations that penetrate the nerve are not removed**: stripping them injures fibres of a nerve that is still in continuity and able to recover. The canal is decompressed so the oedematous nerve has room. Grafting is only for a segment already destroyed (often delayed), and diathermy near the nerve risks thermal injury.","w":["Wrong - dissecting granulations out of the sheath tears nerve fibres and can convert a recoverable palsy into a permanent one.","Correct - leave granulations that invade the nerve and decompress the canal; the nerve in continuity can recover.","Wrong - resection and grafting are for a destroyed segment, not for a nerve in continuity.","Wrong - thermal injury is a recognised cause of iatrogenic palsy; avoid diathermy on the nerve.","Wrong - the cholesteatoma must still be cleared; medical treatment does not remove the cause."],"r":"Slides p39, p71"},{"t":"MOE","stem":"A 74-year-old man with poorly controlled type 2 diabetes (HbA1c 10.8%) is referred from Klinik Kesihatan with 6 weeks of right ear pain that keeps him awake at night, scanty discharge and no improvement on two courses of ear drops. Examination shows granulation tissue on the floor of the right ear canal at the bony-cartilaginous junction and a right lower motor neurone facial palsy. The ear swab grows Pseudomonas aeruginosa.\nWhich antimicrobial plan is most appropriate?","o":["Topical ciprofloxacin drops with aural toilet for 2 weeks, as the infection is superficial","Oral amoxicillin-clavulanate for 2 weeks with steroid-antibiotic drops for the canal","IV flucloxacillin for 2 weeks, switching to oral cloxacillin once the pain has settled","IV then oral ciprofloxacin for about 6-8 weeks in total, with strict glucose control","IV aciclovir for 7 days with oral prednisolone, since the facial palsy may be viral"],"a":3,"e":"Facial palsy with granulations at the bony-cartilaginous junction in an elderly diabetic means **skull-base osteomyelitis** from necrotising otitis externa. Pseudomonas needs **prolonged antipseudomonal therapy** (ciprofloxacin IV, then oral: about 2 weeks IV plus 6 weeks oral on the slide), aural toilet and strict diabetic control. Topical treatment has already failed, and co-amoxiclav and flucloxacillin do not cover Pseudomonas.","w":["Wrong - topical treatment has already failed; once bone and the facial nerve are involved, systemic therapy is needed.","Wrong - co-amoxiclav has no useful antipseudomonal activity, and 2 weeks is far too short for osteomyelitis.","Wrong - flucloxacillin targets Staphylococcus aureus, not Pseudomonas aeruginosa.","Correct - prolonged ciprofloxacin (IV, then oral, about 6-8 weeks) plus diabetic control treats Pseudomonas skull-base osteomyelitis.","Wrong - a palsy with granulations in a diabetic is infective osteomyelitis; there are no vesicles to suggest zoster."],"r":"Slide p43"},{"t":"MOE","stem":"A 69-year-old diabetic woman on IV ciprofloxacin for skull-base osteomyelitis from the right ear still has a friable, bleeding mass of granulation tissue in the ear canal after 3 weeks, and her ear pain is no better. She has a right lower motor neurone facial palsy.\nWhich investigation is most important now to exclude a must-not-miss alternative diagnosis?","o":["Repeat ear swab culture and sensitivity to look for ciprofloxacin resistance","Gallium-67 scan to judge whether the osteomyelitis is resolving on treatment","Biopsy of the ear canal granulation tissue for histopathological examination","Serial ESR and CRP to track the inflammatory response to the antibiotics","Contrast MRI of the skull base to map soft-tissue and intracranial extension"],"a":2,"e":"**Squamous cell carcinoma of the ear canal** can mimic necrotising otitis externa exactly: chronic pain, discharge, granulations and cranial nerve palsy. Granulations that persist or bleed despite treatment must be **biopsied**. The other tests monitor infection or map its extent but cannot exclude malignancy.","w":["Wrong - resistance is worth checking, but culture cannot exclude a carcinoma hiding under the granulations.","Wrong - gallium-67 monitors infection activity; it does not distinguish infection from tumour.","Correct - tissue biopsy is the only way to exclude carcinoma mimicking necrotising otitis externa.","Wrong - inflammatory markers help follow treatment but are non-specific and are raised in both conditions.","Wrong - MRI shows soft-tissue extent, but tumour and infection look alike; histology is needed."],"r":"Slide p43"},{"t":"MOE","stem":"A 70-year-old diabetic man has severe nocturnal right ear pain, an oedematous ear canal with purulent discharge, and a positive Tc-99m bone scan. The house officer says the diagnosis of necrotising otitis externa is confirmed because his ESR is 95 mm/h.\nAccording to the original Cohen and Friedman (1987) criteria, which further finding is an obligatory (major) criterion?","o":["Granulation tissue in the external auditory canal","Pseudomonas aeruginosa grown from the ear swab","Facial or other cranial nerve involvement","Erythrocyte sedimentation rate above 50 mm/h","Diabetes mellitus or another debilitating illness"],"a":0,"e":"Cohen and Friedman's **major criteria (all required)** are pain, oedema, exudate, **granulation tissue**, microabscess at surgery, and a positive Tc-99m scan or failure of local treatment for at least 1 week. Pseudomonas, diabetes, cranial nerve involvement, positive radiograph, debility and old age are only **minor**. Note: the slide lists a high ESR as a criterion; it is not part of the original criteria, though ESR and CRP are useful for monitoring.","w":["Correct - granulation tissue is one of the obligatory major criteria.","Wrong - Pseudomonas on culture is a minor criterion; the diagnosis does not depend on it.","Wrong - cranial nerve involvement is a minor criterion, even though it signals skull-base disease.","Wrong - ESR is not an original Cohen criterion (the slide is wrong here); it is used to monitor response.","Wrong - diabetes and debility are minor criteria (risk factors), not obligatory findings."],"r":"Slide p42"},{"t":"MOE","stem":"A 66-year-old diabetic man has completed 6 weeks of ciprofloxacin for necrotising otitis externa with a facial palsy. His pain has gone and the ear canal has healed. His Tc-99m bone scan at diagnosis was strongly positive. The team must decide whether antibiotics can be stopped.\nWhich imaging test is best for showing that the osteomyelitis has resolved?","o":["Repeat Tc-99m bone scan, comparing uptake with the scan at diagnosis","HRCT of the temporal bone, looking for re-ossification of eroded bone","Plain mastoid radiographs, looking for return of air-cell clarity","MRI of the skull base, looking for resolution of marrow signal change","Gallium-67 scan, as uptake returns to normal once infection settles"],"a":4,"e":"**Tc-99m** reflects osteoblastic activity and stays positive for months or years after cure, so it is good for **diagnosis** but useless for follow-up. **Gallium-67** binds to leucocytes in active inflammation, so it normalises as the infection resolves and is used to **monitor** treatment. CT bone changes and MRI signal lag far behind clinical cure.","w":["Wrong - Tc-99m stays positive long after cure because bone remodelling continues.","Wrong - CT shows bone erosion well, but re-ossification lags months behind control of infection.","Wrong - plain films are insensitive in both directions and are not used to time antibiotics.","Wrong - marrow signal change on MRI persists after cure, so it overestimates ongoing disease.","Correct - gallium-67 uptake falls as active infection resolves, making it the monitoring scan."],"r":"Lecturer pearl"},{"t":"TUM","stem":"A 52-year-old woman is referred from Klinik Kesihatan with right facial weakness that has crept on over 8 months. For several months before the weakness, the right side of her face twitched. She now has a right lower motor neurone palsy (House-Brackmann III), normal otoscopy, no parotid mass and a mild right sensorineural hearing loss.\nWhat is the most appropriate next investigation?","o":["Electroneurography to measure the percentage of degenerated nerve fibres","Gadolinium MRI of the internal meatus, temporal bone and parotid","Fasting blood glucose, HbA1c and ESR to look for a metabolic cause","Serum ACE, calcium and chest radiograph to look for sarcoidosis","Schirmer test and stapedial reflex for topodiagnostic localisation"],"a":1,"e":"**Slowly progressive palsy**, **twitching before weakness**, hearing loss or recurrent ipsilateral palsy are red flags: this is a **tumour until proven otherwise** (facial or vestibular schwannoma, parotid or temporal bone malignancy), not Bell's palsy. **Gadolinium MRI** shows the lesion along the whole course, with HRCT added for bony canal changes. Electrophysiology and topodiagnosis grade or localise the lesion but do not identify its cause.","w":["Wrong - ENoG measures degeneration in acute complete palsy; it says nothing about the cause of a slow palsy.","Correct - gadolinium MRI of the whole course (CPA, internal meatus, temporal bone, parotid) is needed to find a tumour.","Wrong - diabetes is a risk factor for Bell's palsy, but a palsy evolving over 8 months is not Bell's.","Wrong - sarcoidosis causes facial palsy (often bilateral), but twitching and slow progression point to a tumour first.","Wrong - topodiagnostic tests suggest the level of the lesion but cannot show what it is."],"r":"Slide p45"},{"t":"TUM","stem":"A 38-year-old man has mild right facial weakness (House-Brackmann II) and normal hearing. Gadolinium MRI shows an 8 mm enhancing fusiform lesion of the facial nerve at the geniculate ganglion, unchanged on a repeat scan 6 months later.\nWhat is the most appropriate management?","o":["Total resection through a middle fossa approach with immediate sural nerve graft","Translabyrinthine resection of the tumour with hypoglossal-facial anastomosis","Stereotactic radiosurgery now to prevent any further loss of facial function","Observation with serial MRI and facial nerve grading, treating if it grows","High-dose oral prednisolone for 10 days, then repeat MRI to assess regression"],"a":3,"e":"Facial schwannomas grow slowly, and resecting one means sacrificing the nerve; a graft gives at best about **House-Brackmann III**, worse than this patient's grade II. So a small tumour with good function is managed by **wait-and-scan** (serial MRI). Resection with grafting is for growing tumours or poor function, and radiosurgery for growth in poor surgical candidates; translabyrinthine surgery would sacrifice normal hearing.","w":["Wrong - resection with grafting would leave him worse (about HB III) than his current grade II.","Wrong - translabyrinthine surgery destroys hearing, and hypoglossal-facial transfer is for an unavailable proximal stump.","Wrong - radiosurgery is kept for growing or symptomatic tumours in elderly or unfit patients, not a stable small tumour.","Correct - a small, stable schwannoma with good facial function is observed with serial MRI.","Wrong - steroids do not shrink a schwannoma; this is a structural benign tumour, not oedema."],"r":"Slide p46"},{"t":"TUM","stem":"A 58-year-old man has had a firm right preauricular lump for 5 months. Over the last month he has developed aching pain, numbness over the right temple and weakness of the right lower face. FNAC is reported as a salivary gland neoplasm, type to be confirmed, and MRI shows thickening of the facial nerve extending towards the stylomastoid foramen.\nWhich tumour type is most associated with this pattern of spread?","o":["Pleomorphic adenoma","Warthin's tumour","Adenoid cystic carcinoma","Acinic cell carcinoma","Low-grade mucoepidermoid carcinoma"],"a":2,"e":"A parotid lump with facial weakness, pain or numbness is **malignant until proven otherwise**; benign tumours almost never paralyse the nerve. **Adenoid cystic carcinoma** is notorious for **perineural spread** along VII and V (auriculotemporal), with skip lesions and late recurrence. Mucoepidermoid carcinoma is the commonest parotid malignancy, but perineural spread is the hallmark of adenoid cystic.","w":["Wrong - the commonest parotid tumour, but benign; facial palsy is very rare and should make you doubt the diagnosis.","Wrong - benign, often bilateral, in older male smokers; it does not invade nerves.","Correct - adenoid cystic carcinoma characteristically tracks along nerves, causing pain, numbness and palsy.","Wrong - a usually low-grade malignancy; perineural spread is not its typical feature.","Wrong - mucoepidermoid is the commonest malignancy, but low-grade tumours rarely spread along the nerve."],"r":"Slide p47"},{"t":"TUM","stem":"A 67-year-old man with 30 years of left chronic ear discharge now has bloody otorrhoea, deep ear pain and a friable mass filling the left ear canal. There is a left lower motor neurone facial palsy. Biopsy confirms squamous cell carcinoma, and HRCT shows erosion of the canal floor with middle-ear involvement.\nUnder the modified Pittsburgh staging, how does the facial palsy affect the T stage?","o":["No effect, as the T stage depends only on the extent of bone erosion","Upstages it to T2, as nerve involvement counts as limited spread","Upstages it to T3, the stage that covers middle-ear and nerve disease","Makes it T4, whatever the extent of bone erosion seen on HRCT","Counts as distant spread, so it is staged M1 and treated palliatively"],"a":3,"e":"In the **modified Pittsburgh** system any **facial nerve paresis makes the tumour T4**, as do erosion of the cochlea, petrous apex, medial middle-ear wall, carotid canal, jugular foramen or dura, or more than 0.5 cm of soft-tissue spread. T4 disease needs extended (subtotal) temporal bone resection with parotidectomy and neck management plus postoperative radiotherapy, and has a poor prognosis. Facial palsy is a local, not a metastatic, feature.","w":["Wrong - facial nerve paresis is itself a T4 criterion, independent of bone erosion.","Wrong - T2 is limited bony erosion of the canal (not full thickness) or soft tissue under 0.5 cm.","Wrong - middle-ear or mastoid erosion alone is T3; adding facial paresis moves it to T4.","Correct - facial nerve paresis is a T4 criterion in the modified Pittsburgh staging.","Wrong - nerve involvement is local extension; M1 means distant metastasis such as lung or bone."],"r":"Lecturer pearl"},{"t":"TRA","stem":"A 24-year-old motorcyclist is seen in the ED after a blow to the right side of the head. GCS is 15. There is bleeding from the right ear, a step in the posterosuperior canal wall and a torn tympanic membrane. Facial movement was symmetrical on arrival, but on day 2 he develops right facial weakness: the eye closes fully with effort and forehead movement is reduced (House-Brackmann III).\nWhat is the most appropriate management of the facial weakness?","o":["Transmastoid exploration and decompression of the nerve within 24 hours","Middle fossa decompression of the labyrinthine segment and geniculate","Hypoglossal-facial anastomosis once his other injuries have been stabilised","Exploration and end-to-end repair, which works best within 72 hours","Systemic steroids, eye care and serial facial assessment, expecting recovery"],"a":4,"e":"**Delayed, incomplete** palsy after a lateral blow (longitudinal fracture pattern) is due to oedema or haematoma around an intact nerve and has an **excellent prognosis** with steroids, eye care and observation. Surgery is considered for **immediate, complete** palsy with more than 90% degeneration on ENoG or a bony fragment in the canal. Repair or nerve transfer presumes a transected nerve, which delayed onset effectively rules out.","w":["Wrong - early exploration is for immediate complete palsy, not delayed incomplete weakness.","Wrong - this approach is for injury to the labyrinthine segment with immediate complete palsy and severe degeneration.","Wrong - hypoglossal-facial transfer is a reanimation option when the proximal nerve is unusable, not for a recovering nerve.","Wrong - a nerve that worked on arrival was not divided; there is nothing to repair.","Correct - delayed incomplete post-traumatic palsy is treated conservatively and usually recovers fully."],"r":"Slides p53-54"},{"t":"TRA","stem":"A 40-year-old man falls backwards from scaffolding and strikes his occiput. In the ED he has a complete left facial palsy that has been present since he regained awareness, severe vertigo with vomiting and spontaneous nystagmus. Weber lateralises to the right and Rinne is positive on both sides. The left drum is intact with blood behind it.\nWhich fracture pattern best explains these findings?","o":["Transverse fracture running across the labyrinth","Longitudinal fracture through the tegmen and ossicles","Isolated fracture of the tympanic plate of the ear canal","Fracture of the squamous temporal bone above the canal","Fracture of the mastoid tip, sparing the middle ear"],"a":0,"e":"Occipital or frontal blows cause **transverse fractures** that cross the petrous pyramid through the vestibule and cochlea: **profound SNHL** (Weber away from the injured ear, Rinne positive), intense vertigo and nystagmus, and **immediate, often permanent** facial palsy (about 50%). Longitudinal fractures follow a lateral blow, tear the drum and disrupt the ossicles (conductive loss) and cause delayed, usually temporary palsy in about 20%. Note: slide p52 reverses the incidence; **longitudinal fractures are the commoner type (about 70-90%)** and transverse about 10-30%.","w":["Correct - an occipital blow, SNHL, intense vertigo and immediate palsy are the transverse (otic capsule-violating) pattern.","Wrong - longitudinal fractures follow lateral blows, tear the drum and give conductive loss with delayed palsy.","Wrong - a tympanic plate fracture affects the ear canal only and spares the labyrinth and nerve.","Wrong - a squamous fracture lies above the ear and does not reach the labyrinth or Fallopian canal.","Wrong - a mastoid tip fracture would not explain a dead ear, intense vertigo and nystagmus."],"r":"Slides p52-54"},{"t":"TRA","stem":"A 30-year-old woman is admitted after a high-speed road traffic accident. The ambulance crew documented a complete right facial palsy at the scene, and it is still complete (House-Brackmann VI) on day 1. She has right haemotympanum and is otherwise stable.\nWhat is the best next step for the facial nerve?","o":["Prednisolone and eye care, reviewing the face monthly for 3 months","HRCT temporal bones, then ENoG from day 3 to assess degeneration","Needle EMG today to look for the fibrillation potentials of denervation","Gadolinium MRI of the brain and internal meatus as the first imaging","Minimal nerve excitability test today, repeated weekly for a month"],"a":1,"e":"**Immediate complete** post-traumatic palsy suggests transection or bony impingement, so define the fracture with **HRCT** and quantify degeneration with **ENoG** (meaningful from about day 3, once Wallerian degeneration reaches the stimulation site). More than 90% degeneration within 14 days, or a fragment impinging on the canal, is an indication for exploration and decompression or repair. EMG fibrillation and NET changes appear too late to help on day 1.","w":["Wrong - conservative care suits delayed incomplete palsy; for immediate complete palsy it risks missing the window for repair.","Correct - HRCT shows the fracture and the nerve's relation to it; ENoG from day 3 identifies those needing surgery.","Wrong - fibrillation potentials take 10-21 days to appear, so EMG on day 1 cannot show denervation.","Wrong - HRCT, not MRI, is the first imaging for fracture lines through the Fallopian canal.","Wrong - degeneration cannot be detected for 48-72 hours, so a day-1 NET would look falsely normal."],"r":"Slides p54, p58, p64"},{"t":"TRA","stem":"A 19-year-old rugby player is struck on the left temporoparietal region. He has blood in the left ear canal, a tear of the left tympanic membrane and a mild left facial weakness that began 2 days after the injury. Vestibular examination is normal.\nWhich tuning fork finding is most expected?","o":["Left Rinne negative; Weber lateralises to the left","Left Rinne positive; Weber lateralises to the right","Left Rinne negative; Weber lateralises to the right","Rinne positive on both sides; Weber central","Rinne negative on both sides; Weber central"],"a":0,"e":"A lateral blow produces a **longitudinal (otic capsule-sparing)** fracture along the canal roof and middle ear, tearing the drum, filling the middle ear with blood and disrupting the ossicles: **conductive loss**, so Rinne is negative and Weber goes to the injured ear. The otic capsule is spared, so vertigo is mild and SNHL uncommon. Rinne negative with Weber to the opposite side is a false-negative Rinne from a dead ear, typical of a transverse fracture.","w":["Correct - conductive loss in the injured ear: Rinne negative and Weber lateralising to that ear.","Wrong - this is the sensorineural pattern of a transverse, otic capsule-violating fracture.","Wrong - this is a false-negative Rinne from a dead left ear, which would go with a transverse fracture.","Wrong - this is normal hearing, unlikely with a torn drum and blood in the middle ear.","Wrong - bilateral conductive loss would need injury to both ears."],"r":"Slides p53-54"},{"t":"INV","stem":"A 35-year-old man is on day 5 of a complete right Bell's palsy treated with prednisolone. A minimal nerve excitability test is performed over the stylomastoid foramen: the threshold for a visible twitch is 3.0 mA on the normal left side and 7.5 mA on the right.\nWhat is the correct interpretation?","o":["Conduction block only, as both sides still respond to the stimulus","Degeneration, as the difference between the sides is over 3.5 mA","A normal result, as a difference is only significant above 10 mA","Uninterpretable, as the test is only valid 3 weeks after onset","Reinnervation, as the threshold on the right is falling to normal"],"a":1,"e":"In the minimal NET the threshold current for a twitch is compared side to side. In pure **conduction block (neurapraxia)** the distal nerve conducts normally, so thresholds are equal; a **difference greater than 3.5 mA** indicates **degeneration** and a poorer prognosis. Degeneration cannot be detected before 48-72 hours, so the test is useful from day 3, not only after 3 weeks.","w":["Wrong - a response is still present, but a 4.5 mA difference means fibres are degenerating, not just blocked.","Correct - a side-to-side difference above 3.5 mA is the threshold for degeneration.","Wrong - the cut-off is 3.5 mA, not 10 mA.","Wrong - NET becomes informative after 48-72 hours; by 3 weeks it has little to add.","Wrong - a single raised threshold shows loss of excitable fibres; reinnervation is shown by polyphasic EMG potentials."],"r":"Slide p55"},{"t":"INV","stem":"A 27-year-old man has a deep laceration in front of the right ear from broken glass and complete paralysis of the right face. A nerve excitability test done 6 hours after the injury, stimulating the branches distal to the wound, shows equal thresholds on both sides.\nWhat is the best explanation for this result?","o":["The nerve is in conduction block only and will recover in a few weeks","The stimulating current has spread across to the opposite facial nerve","The current is stimulating the facial muscles directly, not the nerve","The main trunk is intact, so surgical exploration is not required","Distal segments conduct until Wallerian degeneration, after 48-72 h"],"a":4,"e":"After transection the distal nerve keeps conducting until **Wallerian degeneration** reaches it, about **48-72 hours** later, so electrical tests distal to the lesion look normal at first. A normal early test does not exclude division; a clinically complete palsy after a penetrating wound in the nerve's path needs **exploration**, ideally with repair **within 72 hours** while the distal branches can still be stimulated to identify them.","w":["Wrong - an equal threshold this early cannot distinguish neurapraxia from transection.","Wrong - the test is done unilaterally at standard currents; crossover to the other side does not occur.","Wrong - nerve thresholds are far lower than direct muscle thresholds; the twitch is from intact distal nerve.","Wrong - a normal early test is falsely reassuring; the wound and complete palsy demand exploration.","Correct - the distal stump conducts normally until Wallerian degeneration sets in after 48-72 hours."],"r":"Slides p55, p67"},{"t":"INV","stem":"A 42-year-old woman has a complete left Bell's palsy (House-Brackmann VI) that began 9 days ago, despite prednisolone started within 48 hours. ENoG shows 95% degeneration compared with the right side, and needle EMG shows no voluntary motor unit potentials. She is keen on any intervention that might help.\nWhat is the most appropriate option to discuss?","o":["Transmastoid decompression of the tympanic and mastoid segments only","Hypoglossal-facial anastomosis now, as the nerve will not recover","Middle fossa decompression of the labyrinthine segment and meatal foramen","Repeat ENoG in 3 months and decompress if there is still no recovery","Change to aciclovir alone, since the steroids have clearly failed"],"a":2,"e":"**More than 90% degeneration on ENoG within 14 days** with no voluntary EMG activity predicts poor recovery, and this is the only group in whom decompression is considered. The Bell's lesion is at the **meatal foramen and labyrinthine segment** (narrowest part of the canal), so the **middle cranial fossa** approach is needed; transmastoid decompression misses it. Note: the slides list decompression as Bell's treatment without qualification; it is controversial, rarely done and only useful within 14 days, while steroids remain the mainstay.","w":["Wrong - transmastoid decompression does not reach the meatal foramen, where the Bell's nerve is compressed.","Wrong - the nerve is in continuity and may still recover partially; reanimation is for a nerve that cannot recover.","Correct - with over 90% degeneration within 14 days, middle fossa decompression of the labyrinthine segment can be discussed.","Wrong - decompression only has a chance of benefit within about 14 days; at 3 months the window has passed.","Wrong - antiviral therapy alone is not recommended, and changing drugs does not address the degeneration."],"r":"Slides p28, p58"},{"t":"INV","stem":"A 50-year-old man has had a complete right facial palsy for 5 days after a temporal bone fracture. The house officer requests needle EMG today to show whether the nerve has degenerated.\nWhat is the main limitation of EMG at this stage?","o":["Fibrillation potentials of denervation take 10-21 days to appear","EMG cannot be performed when there is no voluntary facial movement","Needle insertion into paralysed muscle is unsafe in the first fortnight","EMG shows only reinnervation (polyphasic potentials), not degeneration","EMG gives a percentage of degenerated fibres but no prognostic value"],"a":0,"e":"Denervated muscle shows **fibrillation potentials only 10-21 days after injury**, once degeneration reaches the motor end-plates, so EMG is most useful **from about 2-3 weeks onwards**; between day 3 and day 21 **ENoG** is the test of choice. Early on, the useful EMG finding is voluntary motor unit potentials, which mean some fibres are intact and the prognosis is good. Note: the slide says EMG is most helpful within 2-3 weeks of onset; more precisely, it becomes useful from 2-3 weeks.","w":["Correct - fibrillation potentials appear only after 10-21 days, so a day-5 EMG cannot show denervation.","Wrong - EMG records spontaneous activity and can be done without voluntary movement, as the slide notes.","Wrong - needle EMG is safe at any stage; the problem is timing, not safety.","Wrong - EMG shows both fibrillation (denervation) and polyphasic (reinnervation) potentials.","Wrong - the percentage of degenerated fibres comes from ENoG, not EMG."],"r":"Slide p57"},{"t":"INV","stem":"A 45-year-old woman has a right lower motor neurone facial palsy. Schirmer test at 5 minutes: 18 mm on the right and 20 mm on the left. Stapedial reflex recorded from the right ear is absent. Electrogustometry threshold is raised on the right anterior tongue, and right submandibular flow is reduced by 60%.\nWhere is the lesion most likely to be?","o":["Cerebellopontine angle, involving VII and VIII together","Labyrinthine segment, proximal to the geniculate ganglion","Between the geniculate ganglion and the nerve to stapedius","Between the nerve to stapedius and the chorda tympani","Stylomastoid foramen, distal to the chorda tympani"],"a":2,"e":"Work from proximal to distal. A **normal Schirmer** (here a 10% difference; abnormal is a 25% or greater reduction) means the **GSPN is intact**, so the lesion is distal to the geniculate ganglion. An **absent stapedial reflex** puts it proximal to the nerve to stapedius, and reduced taste and submandibular flow agree. So the lesion is in the **tympanic segment**, between the geniculate ganglion and the nerve to stapedius.","w":["Wrong - a CPA lesion would reduce tearing too and usually brings VIII signs.","Wrong - a lesion above the geniculate ganglion would reduce lacrimation on the Schirmer test.","Correct - normal tearing but lost stapedial reflex, taste and salivation place the lesion between the geniculate ganglion and the nerve to stapedius.","Wrong - a lesion below the nerve to stapedius would leave the stapedial reflex intact.","Wrong - a stylomastoid lesion spares taste, salivation and the stapedial reflex."],"r":"Slides p16-17, p59-63"},{"t":"SURG","stem":"A 28-year-old man has an immediate complete left facial palsy after a head injury. On day 6, ENoG shows 96% degeneration. HRCT shows a fracture line through the region of the geniculate ganglion and labyrinthine segment, sparing the otic capsule, and audiometry shows normal cochlear function.\nWhich surgical approach is most appropriate to decompress the injured segment?","o":["Transmastoid approach alone, decompressing the tympanic and mastoid segments","Translabyrinthine approach, exposing the whole intratemporal course","Retrosigmoid approach to the cerebellopontine angle and internal meatus","Middle cranial fossa approach, combined with transmastoid if needed","Transcanal approach after raising a tympanomeatal flap"],"a":3,"e":"The **middle cranial fossa** approach reaches the labyrinthine segment, geniculate ganglion and meatal segment from above **while preserving hearing**, and in trauma it is often combined with a transmastoid approach for the distal segments. Transmastoid alone reaches only the tympanic and mastoid segments. **Translabyrinthine** exposure gives the whole intratemporal course but destroys hearing, so it is used only when cochleovestibular function is already lost.","w":["Wrong - transmastoid access stops at the tympanic segment and cannot reach the labyrinthine segment safely.","Wrong - this sacrifices the labyrinth and hearing, so it is only for an ear that is already dead.","Wrong - the retrosigmoid route is for CPA and meatal lesions, not the geniculate region.","Correct - the middle fossa route exposes the labyrinthine segment and geniculate ganglion with hearing preserved.","Wrong - a transcanal route gives only limited access to the tympanic segment in the middle ear."],"r":"Slide p66"},{"t":"SURG","stem":"A 35-year-old woman wakes after a modified radical mastoidectomy, done under general anaesthesia with lidocaine-adrenaline infiltration, and has a complete right facial palsy. The operation note does not record the nerve being seen or injured, and the canal is tightly packed.\nWhat is the best initial management?","o":["Return to theatre at once for exploration, without any period of observation","Start prednisolone and observe, arranging ENoG at 3 weeks if no recovery","Arrange HRCT, then ENoG on day 3 to decide whether to explore the nerve","Plan a hypoglossal-facial anastomosis once the mastoid cavity has healed","Wait a few hours and loosen the pack; re-explore if the palsy stays complete"],"a":4,"e":"**Immediate post-operative palsy** may be due to local anaesthetic reaching a dehiscent nerve or to tight packing, so **wait a few hours** and **loosen the pack**. If the palsy is still complete and the nerve's integrity is uncertain, **re-explore promptly** (ideally by a senior surgeon) to decompress or repair it. Palsy of **delayed onset** after ear surgery is due to oedema and is treated with steroids and observation.","w":["Wrong - a few hours' wait excludes the commonest benign cause, local anaesthetic, before a second anaesthetic.","Wrong - steroids and observation suit delayed-onset palsy; immediate complete palsy may mean a divided nerve.","Wrong - waiting for day-3 ENoG wastes the best window for repair of a possibly divided nerve.","Wrong - reanimation is for a nerve that cannot be repaired; first find out whether it is intact.","Correct - allow local anaesthetic to wear off and relieve the packing, then re-explore if the palsy persists."],"r":"Lecturer pearl"},{"t":"SURG","stem":"A newborn delivered by forceps has a bruise over the left mastoid and preauricular area. On crying, the left side of the face does not move and the left eye stays open, and the rooting response is weak on the left. There are no dysmorphic features, and eye abduction is normal on both sides.\nWhat is the most appropriate management?","o":["Early surgical exploration and neuroplasty of the compressed facial nerve","Eye lubricant and protection with observation for spontaneous recovery","Oral prednisolone 1 mg/kg daily for 10 days to reduce nerve oedema","ENoG on day 3, with decompression if degeneration exceeds 90 percent","MRI brain for Möbius syndrome and referral for genetic counselling"],"a":1,"e":"In the newborn the **mastoid process is undeveloped**, so the nerve emerges superficially and is compressed by the forceps blade; it is almost always in continuity and **about 90% recover spontaneously**. Management is **eye protection** (lubricant or ointment) and observation, with electrophysiology and surgery only if there is no recovery at all. Note: the slide lists neuroplasty as management; surgery is rarely needed. Forceps bruising and normal abduction argue against Möbius syndrome (bilateral VI and VII), which does not recover.","w":["Wrong - the slide lists neuroplasty, but traumatic neonatal palsy usually recovers without surgery.","Correct - protect the open eye and observe; most forceps palsies recover fully.","Wrong - steroids are not part of the standard management of birth-related facial palsy.","Wrong - the adult ENoG pathway is not used here; nearly all these nerves are in continuity and recover.","Wrong - Möbius is bilateral with VI palsy and no birth trauma; this unilateral palsy follows forceps injury."],"r":"Slide p73"}]},{"id":"pharynx","title":"Pharyngotonsillar Disorders & OSA","short":"Throat & OSA","emoji":"😴","source":"Pharyntonsillar disease and OSA_260927_082342.pdf","topics":{"ANAT":"Anatomy: Waldeyer's ring, oropharynx, innervation & pharyngeal spaces","PHYS":"Physiology: swallowing & tonsillar immunity","TONS":"Acute & chronic tonsillitis (and membrane differentials)","TSX":"Tonsillectomy: indications & complications","QUIN":"Peritonsillar abscess (quinsy)","PPA":"Parapharyngeal abscess","RPA":"Retropharyngeal abscess","TUM":"Oropharyngeal tumours: benign & carcinoma","OSA":"OSA: risk factors, features, screening & diagnosis","OSAT":"OSA: treatment & complications"},"cards":[{"t":"ANAT","q":"What is Waldeyer's ring, and what are its components and their positions?","a":"• **Incomplete ring of MALT** (T cells, B cells, macrophages) guarding the entrance to the aerodigestive tract\n• **Pharyngeal tonsil (adenoid)** – roof and posterior wall of nasopharynx (superior)\n• **Tubal tonsils** – around the Eustachian tube openings, near the salpingopharyngeal fold (lateral, upper)\n• **Palatine tonsils** – tonsillar fossae of the oropharynx (lateral)\n• **Lingual tonsil** – base (posterior 1/3) of tongue (inferior)\n• First-line defence against inhaled and ingested pathogens","m":"Clock face from above: adenoid at 12, tubal tonsils at 2 and 10, palatine tonsils at 3 and 9, lingual tonsil at 6.","r":"Slides p5-6"},{"t":"ANAT","q":"Where exactly does the palatine tonsil sit, and what forms its bed?","a":"• Lies in the **tonsillar fossa** on each side of the oropharynx\n• **Anterior pillar = palatoglossal arch**; **posterior pillar = palatopharyngeal arch**\n• Lateral bed: tonsillar capsule on the **superior constrictor** muscle\n• Potential **peritonsillar space** between capsule and superior constrictor = site of quinsy\n• Most commonly infected and surgically removed part of Waldeyer's ring","m":"Pillars in alphabetical order front to back: palatoGlossal before palatoPharyngeal (G before P).","r":"Slides p6, p10"},{"t":"ANAT","q":"What are the boundaries of the oropharynx?","a":"• **Superior:** soft palate / pharyngeal isthmus (opens into nasopharynx)\n• **Inferior:** upper border of the epiglottis (opens into laryngopharynx)\n• **Anterior:** oropharyngeal isthmus and **posterior 1/3 of tongue**\n• **Posterior:** posterior pharyngeal wall in front of **C2-C3**\n• **Lateral:** palatine tonsils and palatopharyngeal arches\n• Key structures: base of tongue, lingual tonsils, palatine tonsils, superior constrictor","m":"Oropharynx spans soft palate to tip of epiglottis – the part you see when the patient says 'Ahh'.","r":"Slide p10"},{"t":"ANAT","q":"What is the arterial supply and venous drainage of the palatine tonsil, and which vessels bleed after tonsillectomy?","a":"• Arteries: **tonsillar branch of facial artery (main supply)**, ascending palatine, ascending pharyngeal, dorsal lingual, lesser palatine\n• Veins: **paratonsillar (external palatine) vein** → pterygoid plexus above and facial / internal jugular vein below\n• Post-tonsillectomy bleeding usually comes from the **paratonsillar vein** or the **tonsillar artery** at the lower pole\n• The **internal carotid artery** lies about 2.5 cm posterolateral to the tonsil – relevant in deep neck abscesses","m":"Five arteries, one main: the Facial artery Feeds the tonsil.","r":"Slide p11"},{"t":"ANAT","q":"Where does the palatine tonsil drain lymph, and which node enlarges in tonsillitis?","a":"• Main drainage: **jugulodigastric (upper deep cervical) node** – the 'tonsillar node' below the angle of the mandible\n• Also retropharyngeal nodes (posterior pharyngeal wall, adenoids)\n• Enlarged, tender jugulodigastric node is a classic sign of acute tonsillitis; suppuration → cervical abscess\n• Note: slide p11 lists only retropharyngeal nodes; the tonsil drains mainly to the jugulodigastric node (as p22 states)","m":"Feel just below the angle of the jaw – the jugulodigastric node is the tonsil's sentry.","r":"Slides p11, p22"},{"t":"ANAT","q":"Which nerve gives sensation to the oropharynx and tonsil, and why does tonsil disease cause earache?","a":"• **Glossopharyngeal nerve (CN IX)** is the main sensory nerve: oropharyngeal mucosa, palatine tonsil, posterior 1/3 of tongue, soft palate\n• CN IX also supplies the middle ear via its **tympanic branch (Jacobson's nerve)**\n• So tonsillitis, quinsy, tonsillar carcinoma and post-tonsillectomy pain are felt as **referred otalgia**\n• Earache with a normal ear drum in an adult smoker → examine the oropharynx for cancer","m":"IX = Ear and Throat on one wire: pain in the tonsil rings in the ear.","r":"Slide p11"},{"t":"ANAT","q":"What is the motor nerve supply of the soft palate and pharynx?","a":"• **Pharyngeal plexus** – fibres of the **vagus (CN X)** with the cranial accessory (CN XI)\n• Supplies pharyngeal constrictors, palatopharyngeus, salpingopharyngeus, levator veli palatini, uvular muscle, palatoglossus\n• **Exception: tensor veli palatini** – supplied by the **mandibular nerve (CN V3)** via the nerve to medial pterygoid\n• Stylopharyngeus is the only pharyngeal muscle supplied by **CN IX**","m":"'Tensor is the Trigeminal one' – both start with T.","r":"Slides p7, p11"},{"t":"ANAT","q":"How is sensation and taste supplied to the tongue?","a":"• **Anterior 2/3:** general sensation **lingual nerve (V3)**; taste **chorda tympani (VII)**\n• **Posterior 1/3:** general sensation **and** taste **glossopharyngeal (IX)**\n• **Epiglottic region / vallecula:** sensation and taste **internal laryngeal nerve (X)**\n• Clinical: base-of-tongue cancer → referred otalgia via IX","m":"Front of tongue borrows two nerves (V for touch, VII for taste); the back does both with one (IX).","r":"Slide p8"},{"t":"ANAT","q":"What supplies the muscles of the tongue, and what is the exception?","a":"• All intrinsic and extrinsic tongue muscles: **hypoglossal nerve (CN XII)**\n• **Exception: palatoglossus** – supplied by the **vagus (CN X)** via the pharyngeal plexus (it is really a palatal muscle)\n• XII palsy (LMN): tongue deviates **towards** the side of the lesion, with wasting and fasciculation","m":"Palatoglossus belongs to the Palate gang, so it takes the palate's nerve – X, not XII.","r":"Slide p8"},{"t":"ANAT","q":"What is the gag reflex, what triggers it and what are its nerve pathways?","a":"• Involuntary bilateral contraction of pharyngeal muscles and elevation of the soft palate to prevent choking on foreign material\n• Trigger: touching the **posterior pharyngeal wall, tonsillar pillars or base of tongue**\n• **Afferent: CN IX**; **efferent: CN X**\n• Absent gag on one side → think IX / X lesion (e.g. post-styloid parapharyngeal pathology, jugular foramen)","m":"Gag goes in on IX, out on X – 'nine in, ten out'.","r":"Slide p9"},{"t":"ANAT","q":"Describe the parapharyngeal space: shape, extent, boundaries and connections.","a":"• **Inverted pyramid**: base at the **skull base**, apex at the **hyoid** bone\n• **Medial:** buccopharyngeal fascia over the superior constrictor (pharynx/tonsil)\n• **Lateral:** superficial layer of deep cervical fascia over the medial pterygoid, mandible and parotid\n• Connects **posteriorly with the retropharyngeal space** and **anteriorly with the submandibular space**\n• Infection reaches it from **teeth, tonsils/pharynx, maxilla or mandible**","m":"Upside-down pyramid hanging from the skull base beside the throat, pointing down at the hyoid.","r":"Slide p12"},{"t":"ANAT","q":"What are the boundaries of the retropharyngeal space, and why is the danger space so called?","a":"• Retropharyngeal space: **anterior** – buccopharyngeal fascia (behind pharynx); **posterior** – **alar fascia**\n• Extends from **skull base** down into the upper mediastinum; contains retropharyngeal nodes\n• **Danger space** lies between the **alar** and **prevertebral** fascia and runs from skull base to the **diaphragm**\n• Infection: Waldeyer's ring / dental focus → retropharyngeal space → danger space → **mediastinitis**\n• Note: slide p38 calls the posterior boundary prevertebral fascia; correct is alar fascia (as p12 states)","m":"Front to back: pharynx – retropharyngeal space – Alar – DANGER – Prevertebral – spine. Danger is sandwiched between A and P.","r":"Slides p12, p38"},{"t":"PHYS","q":"What are the functions of the oropharynx?","a":"• **Common conduit** for air (to lungs) and food (to oesophagus)\n• **Deglutition** – the pharyngeal phase of swallowing\n• **Local defence and immunity** – Waldeyer's ring\n• **Part of the vocal tract** – resonance and articulation\n• **Taste** – posterior 1/3 of tongue and epiglottic region","m":"'CRISP-T': Conduit, Resonance, Immunity, Swallowing, Protection of airway, Taste.","r":"Slides p14-15"},{"t":"PHYS","q":"What happens in the oral phase of swallowing?","a":"• **Voluntary** phase\n• **Preparatory:** food + saliva form a bolus; bolus held on the tongue against the hard palate; soft palate and tongue rest down (seals the back of the mouth)\n• **Propulsion:** tongue presses on the palate from front to back, pushing the bolus backwards\n• Oropharyngeal isthmus then opens to receive the bolus\n• **Breathing continues** during the oral phase","m":"Oral phase = you are still in charge; once the bolus touches the pillars, the reflex takes over.","r":"Slide p17"},{"t":"PHYS","q":"What are the key events of the pharyngeal phase of swallowing?","a":"• **Involuntary** reflex; two jobs: **move the bolus** and **protect the airway**\n• **Soft palate rises** to close the nasopharynx (prevents nasal regurgitation)\n• **Larynx elevates**, **epiglottis folds back** over the inlet, **vocal cords close** = **deglutition apnoea**\n• **Upper oesophageal sphincter (cricopharyngeus) relaxes**\n• Tongue pushes the bolus down and **pharyngeal constrictors contract sequentially**","m":"Shut the three doors – nose (soft palate), larynx (epiglottis + cords) – and open the fourth (UES).","r":"Slide p18"},{"t":"PHYS","q":"Which phases of swallowing are voluntary, and what happens in the oesophageal phase?","a":"• **Oral – voluntary**; **pharyngeal – involuntary (reflex)**; **oesophageal – involuntary**\n• Oesophageal phase: **peristalsis** carries the bolus down; lower oesophageal sphincter relaxes\n• After the bolus passes, the epiglottis returns upright and the airway reopens\n• Clinical: pharyngeal-phase failure (e.g. IX/X palsy) causes **aspiration** and nasal regurgitation","m":"One voluntary, two automatic – you choose to swallow, then the body finishes the job.","r":"Lecturer pearl"},{"t":"PHYS","q":"How do the tonsils generate mucosal immunity?","a":"• **M cells** over the tonsillar crypts capture antigens and deliver them to the underlying lymphoid tissue\n• Activates **T and B lymphocytes**\n• **B cells → secretory IgA** (mucosal protection); IgM and IgG neutralise bacteria, viruses and fungi\n• **T cells** → cell-mediated immunity\n• Tonsils are most active in childhood – why they enlarge physiologically up to about 7-8 years","m":"M cells are the Mailmen: they post antigens from the crypt surface to the lymphocytes below.","r":"Slide p19"},{"t":"TONS","q":"How is tonsillitis classified by duration, and what defines recurrent tonsillitis (Paradise criteria)?","a":"• **Acute:** < 2 weeks\n• **Chronic:** persistent > 3 months\n• **Recurrent (Paradise criteria):** **≥ 7 episodes in 1 year**, or **≥ 5/year for 2 years**, or **≥ 3/year for 3 years**\n• Recurrent episodes meeting these criteria are the commonest indication for tonsillectomy","m":"7-5-3: seven in one, five for two, three for three.","r":"Slide p21"},{"t":"TONS","q":"What organisms cause acute tonsillitis?","a":"• **Viral (~70%, commonest, usually milder):** adenovirus, rhinovirus, influenza, EBV, HSV, CMV\n• **Main bacterial cause: group A β-haemolytic Streptococcus (S. pyogenes)**\n• Others: Staphylococcus aureus, pneumococcus, H. influenzae\n• Note: slide p21 lists staphylococcus first; the main bacterial cause is group A Streptococcus (as p22 states)","m":"Most sore throats are viral; the bacterium to treat and fear is GAS – Group A Strep (rheumatic fever).","r":"Slides p21-22"},{"t":"TONS","q":"What are the symptoms of acute tonsillitis, and who does it affect?","a":"• Mainly **school-aged children** and adults under 50; rare in infants\n• **Sore throat**, **odynophagia / dysphagia**, **fever** (may be high in children)\n• **Earache** – referred via CN IX, or due to coexisting AOM\n• Constitutional: headache, body ache, malaise\n• Young children may present with vomiting, abdominal pain or refusing feeds","m":"Throat, fever, ear – the classic triad of a child with tonsillitis.","r":"Slide p22"},{"t":"TONS","q":"What examination findings support acute tonsillitis?","a":"• **Foetid breath** and coated tongue\n• Hyperaemia of the pillars, soft palate and uvula\n• Tonsils **red and swollen**; yellow spots of pus at crypt openings (follicular) or a whitish membrane (membranous)\n• **Enlarged, tender jugulodigastric nodes**\n• Check for asymmetry, uvula deviation and trismus – these point to quinsy rather than simple tonsillitis","m":"Look in the mouth, then feel the neck – the tender jugulodigastric node confirms it.","r":"Slide p22"},{"t":"TONS","q":"What are the four clinical types of acute tonsillitis?","a":"• **Catarrhal (superficial):** surface epithelium only, part of generalised pharyngitis, usually **viral**\n• **Follicular:** infection in the crypts → **yellowish spots of pus** at crypt openings\n• **Parenchymatous:** whole tonsil uniformly enlarged, red, congested – may **meet in the midline**\n• **Membranous:** exudate from crypts coalesces into a whitish membrane that is **easily wiped away**","m":"CFPM – going deeper and wider: Catarrhal (surface) → Follicular (crypts) → Parenchymatous (whole tonsil) → Membranous (coalesced).","r":"Slide p23"},{"t":"TONS","q":"Which clinical scores help decide on antibiotics in sore throat?","a":"• **Centor:** fever > 38 °C, tonsillar exudate, tender anterior cervical nodes, **absence of cough** (1 point each)\n• **McIsaac** adds age: +1 if 3-14 y, −1 if ≥ 45 y\n• **FeverPAIN:** Fever, Purulence, Attend rapidly (≤ 3 days), Inflamed tonsils, No cough/coryza\n• Centor 3-4 or FeverPAIN ≥ 4 → bacterial infection more likely → consider antibiotics\n• Low scores → analgesia, fluids, no antibiotic (most are viral)","m":"Centor = 'no cough plus three signs'; cough and coryza point to a virus.","r":"Lecturer pearl"},{"t":"TONS","q":"How do you treat acute bacterial tonsillitis?","a":"• Bed rest, **plenty of oral fluids**, warm saline gargles\n• Analgesia: **paracetamol ± NSAID** (e.g. ibuprofen)\n• **Penicillin V for 10 days** – drug of choice; full course eradicates group A Strep (prevents rheumatic fever)\n• Penicillin allergy: **erythromycin / other macrolide**\n• **Avoid amoxicillin/ampicillin** if infectious mononucleosis is possible (rash)\n• Note: slide p28 says 'aspirin or paracetamol'; **avoid aspirin** in children (Reye syndrome) and in anyone who may need tonsil surgery (bleeding)","m":"Pen V for ten: 'P-10'. Aspirin = Reye's + bleeding – keep it off the throat ward.","r":"Slide p28"},{"t":"TONS","q":"What are the differential diagnoses of a membrane over the tonsil?","a":"• **Membranous tonsillitis**\n• **Diphtheria**\n• **Vincent's angina**\n• **Infectious mononucleosis**\n• **Agranulocytosis**, **leukaemia**\n• **Aphthous ulcers**, **traumatic ulcer**, **candidal infection**\n• **Malignancy of the tonsil**","m":"Sort the list into three bins: Infection (tonsillitis, diphtheria, Vincent, IM, Candida), Blood (agranulocytosis, leukaemia), Ulcer/tumour (aphthous, traumatic, malignancy).","r":"Slide p24"},{"t":"TONS","q":"How does diphtheria differ from membranous tonsillitis, and how is it managed?","a":"• **Corynebacterium diphtheriae**; unvaccinated child; insidious, low-grade fever but very toxic\n• **Greyish-white membrane extending beyond the tonsil** onto pillars, soft palate and uvula\n• **Adherent – bleeds when removed** (tonsillitis membrane wipes off easily)\n• **Bull neck** (marked nodes and oedema); risks: airway obstruction, myocarditis, palatal/nerve palsy\n• Management: isolate, **notify (notifiable in Malaysia)**, throat swab, **antitoxin** urgently + **penicillin or erythromycin**, airway care, trace and treat contacts","m":"Diphtheria: Dirty grey, Doesn't wipe off, Drips blood, Deadly toxin.","r":"Lecturer pearl"},{"t":"TONS","q":"What features point to infectious mononucleosis in a patient with membranous tonsillitis?","a":"• **EBV**; adolescent / young adult\n• Prolonged fever, malaise, very enlarged tonsils with membrane\n• **Generalised lymphadenopathy** (posterior cervical), **splenomegaly**, **palatal petechiae**\n• FBC: **lymphocytosis with atypical lymphocytes**; **Monospot / Paul-Bunnell** (heterophile antibodies), EBV serology\n• **Amoxicillin/ampicillin → widespread maculopapular rash**\n• Advise **no contact sports for ~4-6 weeks** (splenic rupture); steroids if airway threatened","m":"'Kissing disease': big tonsils, big nodes, big spleen – and an amoxicillin rash.","r":"Lecturer pearl"},{"t":"TONS","q":"What is Vincent's angina?","a":"• Ulceromembranous tonsillitis / gingivitis due to **fusiform bacilli + spirochaetes** (Borrelia vincentii)\n• Associated with **poor oral hygiene**, malnutrition, debilitated patients\n• **Painful ulcer covered by a membrane** that leaves a bleeding ulcer when removed; often unilateral; foul breath, bleeding gums\n• Diagnosis: smear of the membrane\n• Treatment: **penicillin and/or metronidazole**, oral hygiene, hydrogen peroxide mouthwash","m":"Vincent = Very poor oral hygiene + Vermicular spirochaetes.","r":"Lecturer pearl"},{"t":"TONS","q":"Which membrane or ulcer on the tonsil demands a full blood count or a biopsy?","a":"• **Agranulocytosis** (drug-induced, e.g. carbimazole) and **acute leukaemia** – necrotic ulcer/membrane, minimal pus, sepsis, bruising → **urgent FBC**\n• **Malignancy** – **unilateral**, ulcerated, indurated or enlarging tonsil, often an **older smoker/drinker**, referred otalgia, neck node → **biopsy**\n• Any 'tonsillitis' not responding to antibiotics, or unilateral, is not simple tonsillitis","m":"Bilateral and young = infection; unilateral and old = cancer until proven otherwise.","r":"Lecturer pearl"},{"t":"TONS","q":"What causes chronic tonsillitis, and what are its types?","a":"• Complication of **repeated acute tonsillitis**, or **subclinical** infection of the tonsil\n• Predisposed by chronic infection in the **sinuses and teeth**\n• Mainly **children and young adults**; rare > 50 years\n• Types: **chronic follicular** (crypts full of infected cheesy material), **chronic parenchymatous** (hyperplasia, large tonsils), **chronic fibroid** (small but infected tonsils)","m":"Chronic types = 'Follicles, Flesh, Fibrosis'.","r":"Slide p25"},{"t":"TONS","q":"What are the clinical features and treatment of chronic tonsillitis?","a":"• Symptoms: **recurrent sore throat**, chronic throat irritation with cough, **bad taste / halitosis** (pus in crypts), thick speech, dysphagia, choking spells at night\n• Signs: varying enlargement; **yellow beads of pus**; small tonsils where pressure on the anterior pillar **expresses cheesy material**; **flushed anterior pillars**; enlarged jugulodigastric nodes\n• Treatment: conservative – general health, diet, treat teeth, nose and sinus infection\n• **Tonsillectomy** if recurrent attacks or tonsils interfere with speech, swallowing or breathing","m":"Chronic tonsillitis smells before it hurts – halitosis and cheesy crypts.","r":"Slides p26-27"},{"t":"TONS","q":"What are the complications of acute tonsillitis?","a":"• **Local / suppurative:** chronic tonsillitis, **peritonsillar abscess**, **parapharyngeal abscess**, **cervical abscess** (suppuration of jugulodigastric node), **acute otitis media**\n• **Systemic / non-suppurative (GAS):** **rheumatic fever**, **acute post-streptococcal glomerulonephritis**, scarlet fever\n• **Subacute bacterial endocarditis** (Streptococcus viridans) in valvular heart disease","m":"Spreads around (abscesses, ear) or stirs the immune system (heart, joints, kidneys).","r":"Slide p28"},{"t":"TONS","q":"What are tonsillolith, tonsillar cyst and intratonsillar abscess?","a":"• **Tonsillolith:** blocked crypt → debris accumulates → **calcium and magnesium salts** deposit → stone that enlarges and may ulcerate through; causes halitosis, foreign body feeling\n• **Tonsillar cyst:** blocked crypt → yellowish swelling over the tonsil; usually **symptomless**; easily drained\n• **Intratonsillar abscess:** pus **within** the tonsil – swollen, red, local pain and dysphagia; drain ± tonsillectomy","m":"All three start with a blocked crypt: stone (salts), sac (cyst) or pus (abscess).","r":"Slides p27-28"},{"t":"TSX","q":"What are the absolute indications for tonsillectomy?","a":"• **Recurrent throat infection** meeting **Paradise criteria** (7 in 1 y / 5 per y for 2 y / 3 per y for 3 y)\n• **Peritonsillar abscess** – children after the first episode; adults after a second episode\n• Tonsillitis causing **febrile seizures**\n• **Obstructive hypertrophy** → sleep-disordered breathing / **OSA**, dysphagia, **cor pulmonale**\n• **Suspected malignancy** – e.g. **unilateral tonsillar enlargement** (excision biopsy)","m":"'Recurrent, Abscess, Seizures, Obstruction, Malignancy' – RASOM.","r":"Slide p28"},{"t":"TSX","q":"What are the relative indications for tonsillectomy, and other uses of the operation?","a":"• Relative: **diphtheria carriers** and **streptococcal carriers** not cleared by antibiotics\n• **Chronic tonsillitis** with halitosis and cheesy crypts unresponsive to treatment\n• **Recurrent streptococcal tonsillitis in valvular heart disease** (risk of rheumatic fever / endocarditis)\n• As part of another operation: **uvulopalatopharyngoplasty**, **glossopharyngeal neurectomy**, **removal of an elongated styloid process** (Eagle syndrome)","m":"Relative = carriers, chronic smell, cardiac risk; 'access' = the tonsil is in the way of another operation.","r":"Slide p28"},{"t":"TSX","q":"What are the contraindications to tonsillectomy?","a":"• **Acute infection** of the tonsils – wait **2-3 weeks** (more bleeding when inflamed)\n• **Bleeding disorder** (haemophilia, von Willebrand disease, leukaemia) until corrected\n• **Cleft palate / submucous cleft** – risk of velopharyngeal insufficiency (nasal speech)\n• **Anaemia** (Hb < 10 g/dL) and uncontrolled systemic disease (diabetes, hypertension, heart disease)\n• Old teaching: avoid during **polio epidemics** (bulbar polio)","m":"Before you cut, check: infection, blood (clotting + Hb), cleft, systemic disease.","r":"Lecturer pearl"},{"t":"TSX","q":"In what position is tonsillectomy performed, and why?","a":"• **Rose's position:** supine, **head extended** with a sandbag/pad under the shoulders\n• Mouth held open with a **Boyle-Davis mouth gag**\n• Extension lets **blood pool in the nasopharynx** rather than run into the larynx (airway protected; cuffed tube in place)\n• Gives the surgeon a direct view of the tonsillar fossae\n• Techniques: cold steel dissection, bipolar diathermy, coblation","m":"Rose's position: chin to the ceiling, blood to the nasopharynx, not the larynx.","r":"Slide p28"},{"t":"TSX","q":"What is primary (reactionary) post-tonsillectomy haemorrhage, and how is it managed?","a":"• Bleeding within **24 hours**, usually in the **first few hours** after surgery\n• Cause: slipped ligature, rise in BP on waking, unsecured vessel (**paratonsillar vein**, tonsillar branch of facial artery)\n• Signs: frequent swallowing, vomiting dark blood, tachycardia, pallor – children hide blood loss\n• Management: resuscitate (IV access, group and crossmatch), sit up, remove clot, pressure/adrenaline swab\n• Persistent bleeding → **return to theatre** for haemostasis under GA (beware stomach full of blood)","m":"Reactionary = Reaction to the operation (first 24 h) → Return to theatre.","r":"Lecturer pearl"},{"t":"TSX","q":"What is secondary post-tonsillectomy haemorrhage, and how is it managed?","a":"• Bleeding at **day 5-10** post-operatively\n• Cause: **infection of the tonsillar bed** with slough separation\n• Management: **admit**, IV access, FBC and group and save, **IV antibiotics**, hydrogen peroxide gargles\n• Most settle; heavy or persistent bleeding → **return to theatre**\n• Advise all patients at discharge to return immediately if any bleeding occurs","m":"Secondary = Septic, Seven-ish days (5-10).","r":"Lecturer pearl"},{"t":"TSX","q":"Apart from haemorrhage, what are the complications of tonsillectomy?","a":"• **Pain** and **referred otalgia** (CN IX) – peaks around day 3-5; regular analgesia\n• **Dehydration** from poor oral intake – encourage eating and drinking normally\n• Airway: laryngospasm, aspiration of blood, obstruction (especially in OSA children – monitor overnight)\n• Injury: teeth, lips, uvula, soft palate, temporomandibular joint (gag)\n• Infection of tonsillar bed, velopharyngeal insufficiency, rarely **ICA injury**\n• Anaesthetic complications","m":"After tonsils: Pain, Ear pain, Poor drinking, Puffy airway.","r":"Lecturer pearl"},{"t":"QUIN","q":"What is a peritonsillar abscess (quinsy), and where exactly is the pus?","a":"• Collection of pus in the **peritonsillar space**\n• Between the **tonsillar capsule** and the **superior constrictor** muscle\n• Usually at the **upper pole**, in the soft palate above the tonsil\n• Almost always **unilateral**\n• Commonest deep neck space infection in **adults**","m":"Quinsy pus sits outside the capsule but inside the constrictor – 'between the coat and the wall'.","r":"Slide p31"},{"t":"QUIN","q":"How does a quinsy develop, and who gets it?","a":"• Sequence: infected tonsillar crypt (often near the **Weber glands** at the upper pole) → **intratonsillar abscess** → bursts through the capsule → **peritonsillitis (cellulitis)** → **peritonsillar abscess**\n• Usually follows acute tonsillitis; may arise **de novo** without preceding sore throat\n• **Common in adults**, rare in children even though tonsillitis is common in children\n• Risk factors: **smoking**, **previous quinsy**","m":"Crypt → inside tonsil → through capsule → cellulitis → abscess: five steps from sore throat to quinsy.","r":"Slide p31"},{"t":"QUIN","q":"Which organisms cause peritonsillar abscess?","a":"• **Mixed aerobic and anaerobic** infection\n• Aerobes: **Streptococcus pyogenes** (commonest), Staphylococcus aureus, H. influenzae\n• Anaerobes: **Bacteroides** species, Fusobacterium\n• Hence antibiotic must cover anaerobes: **co-amoxiclav**, or penicillin + **metronidazole**","m":"Quinsy is a mixed bag – always cover anaerobes.","r":"Slide p31"},{"t":"QUIN","q":"What are the symptoms of a quinsy, and why do trismus and earache occur?","a":"• General: fever, chills and rigors, malaise, headache, body ache, nausea\n• Local: **severe unilateral throat pain**, **odynophagia** (cannot swallow saliva – **drooling**), **dehydration**\n• **'Hot potato' voice** – muffled, thick speech\n• **Trismus** – spasm of the **medial pterygoid** irritated by pus lateral to the constrictor\n• **Unilateral earache** – referred via **CN IX**\n• Foul breath","m":"Quinsy 'T's: Tonsil pain one side, Trismus, Thick (hot potato) voice, Tympanic referred pain.","r":"Slide p32"},{"t":"QUIN","q":"What are the examination findings in a quinsy?","a":"• **Bulging of the soft palate and anterior pillar above the tonsil** on the affected side\n• **Uvula oedematous and deviated to the OPPOSITE side**\n• Tonsil congested, swollen and pushed **downwards and medially**; mucopus over the tonsillar region\n• Trismus limits the view\n• **Cervical lymphadenopathy**; **torticollis** towards the affected side","m":"The pus pushes the uvula away – it points to the healthy side.","r":"Slide p33"},{"t":"QUIN","q":"How do you tell peritonsillitis (cellulitis) from a peritonsillar abscess?","a":"• Clinically similar: unilateral pain, palatal swelling, trismus\n• Abscess favoured by: marked **bulge with fluctuance**, uvula deviation, worsening despite 24-48 h IV antibiotics\n• **Needle aspiration** at the point of maximum bulge: pus = abscess; no pus = peritonsillitis (or abscess missed)\n• **CECT neck** if diagnosis unclear, aspiration dry, or deeper (parapharyngeal) spread suspected\n• Peritonsillitis: IV antibiotics, fluids, analgesia; abscess: drain + antibiotics","m":"Needle settles the argument: pus or no pus.","r":"Lecturer pearl"},{"t":"QUIN","q":"What investigations are done in a quinsy?","a":"• **Pus for culture and sensitivity** (from aspiration or I&D)\n• **CECT neck** if parapharyngeal/deep neck extension, failure to improve, or unclear diagnosis\n• FBC (leucocytosis), renal profile (dehydration), glucose (diabetes)\n• Consider Monospot / EBV serology in young adults with atypical features","m":"Get the pus, and scan if it may have gone deep.","r":"Slide p33"},{"t":"QUIN","q":"What is the medical management of a quinsy?","a":"• **Admit**; **IV fluid replacement** (patient often cannot swallow)\n• **IV co-amoxiclav (Augmentin) 1.2 g TDS** – or IV benzylpenicillin + metronidazole; clindamycin if penicillin-allergic\n• **Analgesia** (paracetamol, NSAID) and a **corticosteroid** (e.g. single dose of IV dexamethasone) to reduce pain, swelling and trismus\n• **Oral hygiene:** hydrogen peroxide or saline mouthwash\n• Switch to oral antibiotics to complete the course once eating","m":"Fluids, Augmentin, painkiller, steroid – then let the knife do the rest.","r":"Slide p33"},{"t":"QUIN","q":"How is a quinsy drained, and when is tonsillectomy done?","a":"• Under **local anaesthetic**, patient sitting up with suction ready\n• **Needle aspiration** or **incision and drainage** at the **point of maximum bulge** – above the upper pole, where a horizontal line through the **base of the uvula** meets a vertical line along the **anterior pillar**\n• Keep the blade guarded (shallow incision) – the ICA lies posterolateral\n• Followed by warm salt-water gargles\n• **Interval tonsillectomy** about **4-6 weeks** later; or **hot (abscess) tonsillectomy** in selected cases","m":"Cross-hairs: base of uvula across, anterior pillar down – aim where they meet.","r":"Slide p33"},{"t":"QUIN","q":"What are the complications of a peritonsillar abscess?","a":"• Early: **parapharyngeal abscess**, **laryngeal oedema** (airway obstruction), **septicaemia**\n• Aspiration of pus → **pneumonitis / lung abscess** (spontaneous rupture during sleep)\n• **Internal jugular vein thrombophlebitis** (Lemierre syndrome – Fusobacterium, septic emboli)\n• **Spontaneous haemorrhage** from erosion of the carotid artery or jugular vein\n• Late: **recurrent quinsy** and recurrent tonsillitis","m":"Quinsy can spread Out (parapharyngeal), Down (larynx, lungs) or into Vessels (IJV, carotid).","r":"Slide p34"},{"t":"PPA","q":"How is the parapharyngeal space divided, and what does the prestyloid compartment contain?","a":"• The **styloid process and its muscles** divide it into **prestyloid (anterior)** and **poststyloid (posterior)** compartments\n• **Prestyloid** contents: mostly **fat**; **deep lobe of parotid**; **internal maxillary artery**; branches of **V3** (inferior alveolar, lingual, auriculotemporal nerves); styloglossus and stylopharyngeus\n• Prestyloid infection lies next to the **medial pterygoid** → trismus","m":"Prestyloid = 'Fat, Parotid, Maxillary artery, V3' – soft stuff in front.","r":"Slide p35"},{"t":"PPA","q":"What does the poststyloid compartment contain, and why does it matter?","a":"• **Internal carotid artery**, **internal jugular vein**\n• **Cranial nerves IX, X, XI, XII**\n• **Cervical sympathetic chain**; associated lymph nodes\n• Clinical: infection here can cause **IX-XII palsies**, **Horner syndrome**, **IJV thrombophlebitis** and **carotid erosion / haemorrhage**","m":"Poststyloid = the carotid sheath crowd: 'Carotid, Jugular, 9-10-11-12, Sympathetic'.","r":"Slide p35"},{"t":"PPA","q":"What are the sources of a parapharyngeal abscess?","a":"• **Pharynx:** acute/chronic tonsillitis and adenoiditis, **bursting of a peritonsillar abscess**\n• **Teeth:** dental infection, especially lower third molar\n• **Ear:** **Bezold abscess**, petrositis\n• **Other spaces:** parotid, retropharyngeal and submandibular infections\n• **Trauma:** penetrating neck injury, LA injection for tonsillectomy or **inferior alveolar (mandibular) nerve block**","m":"'PTEST': Pharynx, Teeth, Ear, Spaces, Trauma.","r":"Slide p36"},{"t":"PPA","q":"What are the clinical features of a parapharyngeal abscess, anterior versus posterior compartment?","a":"• General: fever, sore throat, odynophagia, **torticollis**, pain and swelling\n• **Anterior (prestyloid):** **prolapse of the tonsil and tonsillar fossa** medially, **trismus**, external swelling **behind the angle of the jaw**\n• **Posterior (poststyloid):** **bulge of the pharynx behind the posterior pillar**, swelling of the parotid region, **paralysis of CN IX, X, XI, XII**, Horner syndrome\n• Little or no trismus in poststyloid abscess","m":"Anterior = Angle-of-jaw swelling + trismus; Posterior = Palsies (IX-XII).","r":"Slide p36"},{"t":"PPA","q":"How do you distinguish a parapharyngeal abscess from a quinsy on examination?","a":"• Quinsy: swelling **above** the tonsil in the soft palate; uvula markedly deviated; little external neck swelling\n• Parapharyngeal abscess: tonsil itself often **looks normal** but the **tonsil and lateral pharyngeal wall are pushed medially**\n• Parapharyngeal: firm **swelling behind the angle of the mandible**, torticollis, may have **cranial nerve palsies**\n• Both have trismus; CECT confirms which space is involved","m":"Quinsy pushes the palate down and the uvula across; parapharyngeal pushes the whole side wall in and bulges the neck out.","r":"Lecturer pearl"},{"t":"PPA","q":"What is the key investigation for a suspected parapharyngeal abscess, and what does it show?","a":"• **Contrast-enhanced CT (CECT) of the neck** (extend to the chest if mediastinal spread suspected)\n• Shows a **rim-enhancing fluid collection**, its compartment (pre- vs poststyloid) and relation to the **carotid sheath**\n• Detects spread to retropharyngeal space or mediastinum and IJV thrombosis\n• Plus: FBC, CRP, blood cultures, glucose; assess the **airway** first","m":"No CT, no knife – you must see the carotid before you drain.","r":"Slide p37"},{"t":"PPA","q":"How is a parapharyngeal abscess treated?","a":"• **Secure the airway** (stridor → awake fibreoptic intubation or tracheostomy)\n• **IV antibiotics** covering aerobes and anaerobes (e.g. co-amoxiclav or ceftriaxone + metronidazole)\n• **Incision and drainage – transcervical (external) approach** is standard for most, and for large or **poststyloid** abscesses: protects the great vessels\n• **Transoral** drainage only for select, accessible abscesses medial to and away from the carotid/IJV","m":"Go in from the neck where you can see and control the carotid – not blindly through the mouth.","r":"Slide p37"},{"t":"PPA","q":"What are the complications of a parapharyngeal abscess?","a":"• **Acute laryngeal oedema** with respiratory obstruction\n• **Thrombophlebitis of the internal jugular vein** with septicaemia (Lemierre syndrome)\n• **Carotid artery erosion** – sentinel bleeding, haemorrhage\n• Spread to the **retropharyngeal space**\n• Spread to the **mediastinum** along the carotid sheath → mediastinitis","m":"Airway, Vessels, Spread – the three ways it kills.","r":"Slide p37"},{"t":"RPA","q":"Why is acute retropharyngeal abscess mainly a disease of young children?","a":"• The retropharyngeal space contains **retropharyngeal lymph nodes (nodes of Rouvière)** draining the nose, adenoids, nasopharynx and Eustachian tube\n• These nodes **regress by about 3-5 years** of age\n• Acute RPA = **suppuration of these nodes** after URTI, adenoiditis, tonsillitis or nasopharyngitis\n• Hence most acute cases are in children **under 5**; in adults think trauma (fish bone, instrumentation) or TB","m":"No nodes, no acute abscess – Rouvière's nodes retire before school age.","r":"Slide p38"},{"t":"RPA","q":"What are the clinical features of an acute retropharyngeal abscess?","a":"• Young child, **sudden rapid progression** after a URTI; fever, irritability\n• **Dysphagia**, **drooling**, refusal to feed\n• **Difficulty breathing**, **stridor**, **croupy cough**\n• **Neck held stiff / extended**, torticollis\n• **Bulge of the posterior pharyngeal wall**, typically to **one side of the midline**","m":"A drooling child with stridor who will not move the neck – look behind the pharynx.","r":"Slide p39"},{"t":"RPA","q":"Why is the bulge of an acute retropharyngeal abscess off the midline but a chronic one central?","a":"• Acute: pus is in the **retropharyngeal space**, divided in the midline by a fibrous **median raphe** (superior constrictor attached to the fascia) → bulge on **one side**\n• Chronic (TB of cervical spine): pus is **behind the prevertebral fascia**, which has no midline septum → **central** bulge\n• Lateral X-ray in chronic cases may show vertebral body destruction","m":"Acute = Aside (one side); Chronic = Central.","r":"Lecturer pearl"},{"t":"RPA","q":"How is an acute retropharyngeal abscess investigated?","a":"• **Airway first** – examine gently; do not upset a child with stridor\n• **Lateral soft-tissue X-ray of the neck** (neck extended, on inspiration): **prevertebral widening** (more than about 7 mm at C2 or more than about half the vertebral body width), air-fluid level, loss of cervical lordosis\n• **CECT neck** – confirms abscess vs cellulitis and shows extent (mediastinum)\n• **FBC (raised WBC), ESR, CRP**, blood culture","m":"Lateral neck film in a child: prevertebral soft tissue at C2 thicker than about 7 mm = suspect pus.","r":"Slide p39"},{"t":"RPA","q":"How is an acute retropharyngeal abscess managed?","a":"• **Secure the airway** – may need intubation or **tracheostomy**\n• **Intraoral incision and drainage** with the child in **Trendelenburg (head-down) position** and suction ready, to prevent aspiration of pus\n• **IV antibiotics** (e.g. co-amoxiclav or ceftriaxone + metronidazole), IV fluids\n• Small phlegmons may settle on antibiotics alone with close monitoring","m":"Head down, suck, cut – so the pus runs out of the mouth, not into the lungs.","r":"Slide p39"},{"t":"RPA","q":"What are the features and management of a chronic retropharyngeal abscess?","a":"• **Adult**; **slow, insidious** onset\n• Cause: **TB** of retropharyngeal nodes (from deep cervical node TB) or **caries of the cervical spine (Pott's disease)** – actually in the prevertebral space\n• Features: throat discomfort, mild dysphagia, **spinal tenderness**, **central fluctuant swelling** of the posterior pharyngeal wall\n• Investigations: FBC, ESR, CRP, CT/MRI spine and neck, CXR, AFB/GeneXpert on pus\n• Treatment: **antitubercular therapy**; drain **externally** (incision behind the sternocleidomastoid), not intraorally – avoids a chronic sinus","m":"Chronic = Cold abscess, Central bulge, Cervical spine TB, Cut from outside.","r":"Slide p39"},{"t":"RPA","q":"What are the complications of a retropharyngeal abscess?","a":"• **Airway obstruction** (oedema or spontaneous rupture and aspiration of pus)\n• **Sepsis**\n• **Mediastinitis** – via the danger space\n• **Purulent meningitis**\n• Others: IJV thrombosis, carotid erosion, atlanto-axial instability (Grisel syndrome)","m":"'ASMM': Airway, Sepsis, Mediastinum, Meninges.","r":"Slide p40"},{"t":"TUM","q":"How are oropharyngeal tumours classified, and what are the sites of malignancy?","a":"• **Benign:** papilloma, haemangioma, pleomorphic adenoma (minor salivary glands), mucous cyst\n
