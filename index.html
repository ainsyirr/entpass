is **complete wide excision** with a margin (often including periosteum). It is potentially malignant (carcinoma ex pleomorphic adenoma), so observation is wrong, and it is not managed with primary radiotherapy.","w":["Wrong - it is a solid tumour, not a cyst or abscess; incision achieves nothing and seeds tumour.","Wrong - pseudopod extensions through the incomplete capsule make enucleation prone to recurrence.","Wrong - pleomorphic adenoma is treated surgically; radiotherapy is not primary treatment for this benign tumour.","Correct - wide local excision with a margin of normal tissue prevents recurrence of a palatal pleomorphic adenoma.","Wrong - pleomorphic adenoma can undergo malignant change, so it should be excised."],"r":"Slide p44"},{"t":"OSA","stem":"A 56-year-old woman is seen at a Klinik Kesihatan because her husband complains of her loud snoring. She feels refreshed during the day and he has never noticed pauses in her breathing. She takes amlodipine for hypertension. BMI is 32 kg/m² and neck circumference is 43 cm.\nWhat is her STOP-BANG score and the most appropriate action?","o":["Score 2; low risk, so give weight-loss advice only","Score 3; low risk, so repeat the questionnaire yearly","Score 5; high risk, so start CPAP without a sleep study","Score 6; high risk, so refer directly for tonsillectomy","Score 4; intermediate risk, so refer for a sleep study"],"a":4,"e":"S1 (loud snoring) + T0 + O0 + P1 (treated hypertension) + B0 (BMI not > 35) + A1 (> 50) + N1 (> 40 cm) + G0 = **4**. STOP-BANG 0-2 is low, 3-4 intermediate and 5-8 high risk; a score of **≥ 3** warrants objective sleep testing. Note: slide p56 writes 'STOP-BANG > 3'; the standard cut-off is ≥ 3. STOP-BANG screens - it never replaces a sleep study before CPAP or surgery.","w":["Wrong - this misses the age and neck points; the score is 4.","Wrong - the score is 4, and a score of 3 is already intermediate risk needing referral, not low risk.","Wrong - BMI 32 does not score (cut-off > 35) and she is female; even high scores need a diagnostic study before CPAP.","Wrong - the score is 4, and there is no tonsillar hypertrophy; surgery is never planned from a questionnaire.","Correct - snoring, pressure, age > 50 and neck > 40 cm give 4 (intermediate risk), so refer for a diagnostic sleep study."],"r":"Slide p56"},{"t":"OSA","stem":"A 48-year-old taxi driver is referred because his wife has witnessed long pauses in his breathing. He nearly fell asleep at a traffic light last week. Epworth Sleepiness Scale is 16, BMI 38 kg/m² and neck circumference 45 cm. Overnight pulse oximetry alone (one channel) at the district hospital was reported as normal.\nWhat is the most appropriate next step?","o":["Attended level 1 polysomnography in a sleep laboratory","Reassure him that overnight oximetry has excluded OSA","Repeat the Epworth Sleepiness Scale in three months","Drug-induced sleep endoscopy to grade the obstruction","Uvulopalatopharyngoplasty with a tonsillectomy"],"a":0,"e":"Single- or dual-channel oximetry is a **level 4** study - screening only, it cannot exclude OSA (slide p57). With a high pre-test probability (witnessed apnoeas, ESS 16 > 10, BMI 38), a negative, inconclusive or inadequate limited study must be followed by full **polysomnography**; only levels 1-3 can diagnose. He must be advised not to drive while sleepy until treated. DISE and surgery come only after OSA is confirmed and CPAP has been considered.","w":["Correct - a negative level 4 study with high clinical suspicion must be followed by full polysomnography.","Wrong - level 4 oximetry is a screening tool and cannot exclude OSA in a high-probability patient.","Wrong - ESS only measures sleepiness; repeating it delays diagnosis in a sleepy professional driver.","Wrong - DISE localises collapse before surgery; it is not used to diagnose OSA.","Wrong - surgery is not planned before OSA is confirmed and CPAP, the first-line treatment, is considered."],"r":"Slide p57"},{"t":"OSA","stem":"A 45-year-old man undergoes polysomnography as part of a research screening programme. He has no complaints of snoring or daytime sleepiness (ESS 4) and no hypertension, diabetes or cardiac disease. His apnoea-hypopnoea index is 22 events/hour, mostly obstructive.\nWhat is the correct interpretation?","o":["Not OSA, because he has no symptoms or comorbidity","Moderate OSA, diagnosed even without any symptoms","Mild OSA, but only if symptoms develop in future","Severe OSA, as the index is above 20 events/hour","Primary snoring with no apnoea-related disease"],"a":1,"e":"Adult OSA is diagnosed with **AHI ≥ 5 plus** typical symptoms or associated disease, or **AHI ≥ 15 regardless of symptoms** (slide p58). Severity: mild 5 to < 15, moderate 15-30, severe > 30 events/hour, so 22 is moderate. ESS measures subjective sleepiness, not airway collapse, so a low ESS does not exclude OSA.","w":["Wrong - symptoms are only needed when AHI is 5-14; an AHI of 15 or more is diagnostic on its own.","Correct - AHI 15-30 is moderate OSA, and AHI ≥ 15 is diagnostic even without symptoms.","Wrong - 22 is above the mild range (5 to < 15) and the diagnosis does not wait for symptoms.","Wrong - severe OSA is AHI > 30 events/hour.","Wrong - primary snoring has no significant apnoeas or desaturation; his AHI is 22."],"r":"Slide p58"},{"t":"OSA","stem":"A 40-year-old woman with BMI 46 kg/m² presents with hypersomnolence, morning headaches and ankle swelling. Spirometry, chest X-ray and thyroid function are normal. An awake arterial blood gas on room air shows pH 7.37, PaCO2 56 mmHg, PaO2 62 mmHg and a raised bicarbonate.\nWhich diagnosis best explains the daytime blood gas?","o":["Obstructive sleep apnoea alone","Central sleep apnoea from opioids","Obesity hypoventilation syndrome","Primary snoring with nasal blockage","Chronic obstructive pulmonary disease"],"a":2,"e":"**Obesity hypoventilation syndrome** = BMI ≥ 30 + awake daytime **PaCO2 > 45 mmHg** with other causes of hypoventilation excluded (normal spirometry, chest X-ray and thyroid) (slide p60). Most OHS patients also have OSA, but OSA alone does not cause daytime hypercapnia; the raised bicarbonate shows chronic CO2 retention and ankle oedema hints at cor pulmonale. These patients often need BiPAP rather than CPAP.","w":["Wrong - OSA causes nocturnal desaturation, but daytime PaCO2 stays normal unless OHS coexists.","Wrong - there is no opioid use, and central apnoea does not explain obesity-related daytime hypercapnia.","Correct - BMI ≥ 30 with awake PaCO2 > 45 mmHg and other causes excluded defines OHS.","Wrong - primary snoring causes no apnoeas, desaturation or blood gas abnormality.","Wrong - normal spirometry excludes COPD as the cause of hypercapnia."],"r":"Slide p60"},{"t":"OSA","stem":"A 69-year-old man with ischaemic heart failure (ejection fraction 25%) is referred for disturbed sleep. He is not obese and takes no opioids. Polysomnography shows repeated cycles of waxing and waning breathing with 20-second pauses, during which both airflow and chest and abdominal belt movements are absent.\nWhat is the most likely diagnosis?","o":["Obstructive sleep apnoea","Obesity hypoventilation","Mixed sleep apnoea","Central sleep apnoea","Upper airway resistance syndrome"],"a":3,"e":"In **central apnoea** the airway is open but the brainstem stops driving the respiratory muscles, so airflow AND respiratory effort are both absent (slide p52); in heart failure this takes the crescendo-decrescendo **Cheyne-Stokes** pattern (slide p60). In obstructive apnoea effort continues, often with paradoxical chest-abdominal movement, against a closed airway. Mixed apnoea starts central and ends with obstructed efforts.","w":["Wrong - in obstructive apnoea chest and abdominal effort continue while airflow stops.","Wrong - he is not obese, and OHS is defined by awake daytime hypercapnia, not this PSG pattern.","Wrong - mixed apnoea begins without effort but ends with obstructed breathing efforts.","Correct - absent airflow AND absent effort in a waxing-waning pattern with heart failure = central (Cheyne-Stokes) apnoea.","Wrong - upper airway resistance causes effort-related arousals with increasing effort, not absent effort."],"r":"Slides p52, p60"},{"t":"OSA","stem":"A 45-year-old woman is referred with loud snoring, daytime fatigue and 8 kg weight gain over a year. She also reports cold intolerance, constipation and a hoarse voice. Examination shows dry skin, an enlarged tongue, a puffy face and slow-relaxing ankle reflexes. BMI is 31 kg/m².\nAlongside a sleep study, which blood test is most important to request?","o":["Glycated haemoglobin","Morning serum cortisol","Serum IGF-1 level","Serum ferritin level","TSH and free T4"],"a":4,"e":"Weight gain, cold intolerance, hoarseness, macroglossia and slow-relaxing reflexes point to **hypothyroidism**, an endocrine cause of OSA (slide p52) through macroglossia, mucopolysaccharide deposition in the pharynx and reduced ventilatory drive. Treating it with thyroxine can improve or resolve the OSA. IGF-1 screens for acromegaly, which also causes macroglossia and OSA, but she has hypothyroid rather than acromegalic features.","w":["Wrong - diabetes screening is reasonable in obesity but does not explain her hypothyroid features.","Wrong - cortisol tests for Cushing's syndrome; she has no striae, proximal myopathy or plethora.","Wrong - IGF-1 tests for acromegaly, which also gives macroglossia, but she lacks coarse features or enlarging hands.","Wrong - ferritin looks for iron deficiency in restless legs; it does not explain this picture.","Correct - hypothyroidism is a treatable cause of OSA; TSH and free T4 confirm it."],"r":"Slide p52"},{"t":"OSA","stem":"A 52-year-old man with loud snoring completes the Epworth Sleepiness Scale at ENT clinic. His scores are: sitting and reading 2, watching TV 3, sitting inactive in a public place 2, car passenger for an hour 3, lying down in the afternoon 3, sitting and talking 0, sitting quietly after lunch 2, in a car stopped in traffic 1.\nWhat is the correct interpretation?","o":["16; excessive sleepiness, so arrange a sleep study","16; this confirms moderate OSA, so start CPAP","14; borderline sleepiness, so repeat in 6 months","8; normal daytime sleepiness, so take no action","16; this indicates severe OSA, so refer for UPPP"],"a":0,"e":"ESS has 8 situations each scored 0-3 (total 0-24); his total is **16**, and **> 10 indicates excessive daytime sleepiness** (slide p56). ESS measures subjective sleepiness only - it is **not diagnostic** of OSA and does not grade severity, so the next step is objective sleep testing, not treatment. Severity comes from the AHI.","w":["Correct - 16 is above 10 (excessive sleepiness), and objective sleep testing is needed to diagnose OSA.","Wrong - ESS is not diagnostic and cannot grade OSA; CPAP needs a confirmed diagnosis.","Wrong - the total is 16, not 14, and either score is above 10, not borderline.","Wrong - the total is 16; 8 would be within normal limits.","Wrong - ESS cannot grade severity, and surgery is never planned from a questionnaire."],"r":"Slide p56"},{"t":"OSA","stem":"A 38-year-old man with moderate OSA (AHI 24 events/hour) has stopped CPAP after 6 months despite mask refits and humidification. BMI is 27 kg/m². He has a modified Mallampati grade 3 and grade 2 tonsils, and wants surgery.\nWhich assessment most accurately identifies the level and pattern of airway collapse before surgery?","o":["Awake nasendoscopy with Müller's manoeuvre","Drug-induced sleep endoscopy","Lateral cephalometric radiograph","Repeat attended polysomnography","Awake CT scan of the upper airway"],"a":1,"e":"**DISE** reproduces sleep-like muscle relaxation with propofol or midazolam, showing the site (palate, oropharynx, tongue base, epiglottis) and pattern of collapse (slide p59). The Malaysian CPG considers it more accurate than awake **FNMM** (Müller's manoeuvre), which is a fallback when DISE is not possible. Awake imaging misses dynamic collapse, and PSG quantifies severity but cannot localise the obstruction.","w":["Wrong - awake FNMM is less accurate than DISE and is offered only when DISE cannot be performed.","Correct - DISE shows the site and degree of dynamic collapse under sedation and guides sleep surgery.","Wrong - cephalometry shows skeletal relationships but not dynamic soft-tissue collapse during sleep.","Wrong - PSG measures severity (AHI) but cannot localise the level of obstruction.","Wrong - an awake static scan misses the collapse that only happens with sleep-related muscle relaxation."],"r":"Slide p59"},{"t":"OSAT","stem":"A 50-year-old lorry driver has polysomnography showing AHI 38 events/hour with nadir SpO2 78%. ESS is 15, BMI 33 kg/m², and he has hypertension. His tonsils are grade 1 and his nasal airway is clear.\nWhat is the most appropriate first-line treatment?","o":["Mandibular advancement device fitted by a dentist","Uvulopalatopharyngoplasty under general anaesthesia","Nightly CPAP, with weight-loss and driving advice","Positional therapy with the tennis-ball technique","Tracheostomy to bypass the obstructed upper airway"],"a":2,"e":"AHI > 30 is **severe OSA**; **CPAP** is the gold-standard first-line treatment for moderate-severe disease, pneumatically splinting the whole pharynx, combined with weight loss, avoiding alcohol and sedatives, and advice not to drive while sleepy. Mandibular advancement suits mild-moderate or CPAP-intolerant OSA, UPPP succeeds poorly with small tonsils and obesity, and tracheostomy is the last resort (slide p61).","w":["Wrong - a mandibular advancement device is for mild-moderate OSA or CPAP intolerance, not first-line in severe disease.","Wrong - UPPP has a low success rate in severe OSA with obesity and small tonsils, and is not first-line.","Correct - CPAP is first-line for severe OSA, with lifestyle measures and driving safety advice.","Wrong - positional therapy alone is for mild, supine-predominant OSA, not severe disease.","Wrong - tracheostomy is curative but reserved as the last resort when other treatments fail."],"r":"Lecturer pearl"},{"t":"OSAT","stem":"A 44-year-old man with severe OSA cannot use CPAP for more than an hour a night because of nasal blockage and mouth leak. Anterior rhinoscopy shows a septal deviation to the left and bilateral inferior turbinate hypertrophy. He is booked for septoplasty and inferior turbinate reduction.\nWhat is the main expected benefit of this surgery?","o":["Cure of the OSA, so that CPAP can be stopped","Normalisation of the AHI in most patients","No further need for a follow-up sleep study","Better CPAP tolerance at a lower pressure","Prevention of tongue-base collapse in REM sleep"],"a":3,"e":"Nasal surgery lowers nasal resistance (slide p63), which improves CPAP comfort and adherence and may lower the pressure needed, but it seldom cures OSA because collapse occurs at the palate and tongue base. He should continue CPAP and have treatment efficacy re-assessed. Expecting a normal AHI after septoplasty alone is the trap.","w":["Wrong - nasal surgery rarely cures OSA; collapse is mainly retropalatal and retroglossal.","Wrong - the AHI usually changes little after isolated nasal surgery.","Wrong - he still has severe OSA and needs ongoing CPAP with review of its effectiveness.","Correct - reducing nasal resistance improves CPAP tolerance and may lower the pressure required.","Wrong - nasal surgery does not affect tongue-base collapse, which worsens in REM sleep."],"r":"Slides p61, p63"},{"t":"OSAT","stem":"A 5-year-old boy of normal weight has loud nightly snoring, witnessed pauses, restless sleep, bedwetting and poor concentration at school. He mouth-breathes, his tonsils are grade 4 and meet in the midline, and a lateral neck X-ray shows a large adenoid. Polysomnography shows an obstructive AHI of 12 events/hour.\nWhat is the most appropriate management?","o":["Nightly CPAP through a nasal mask","Intranasal steroid alone for a year","Custom mandibular advancement device","Weight-reduction programme and review","Adenotonsillectomy"],"a":4,"e":"In children an obstructive **AHI > 1** is abnormal and AHI 12 is severe; with adenotonsillar hypertrophy, **adenotonsillectomy is first-line** (obstructive hypertrophy is an absolute indication, slide p28). Intranasal steroids are an option only for mild disease or as a bridge, and CPAP is for children unfit for or failing surgery. Severe paediatric OSA needs overnight post-operative monitoring because of respiratory complications.","w":["Wrong - CPAP is for children unfit for surgery or with residual OSA after adenotonsillectomy.","Wrong - intranasal steroids help mild paediatric OSA only; AHI 12 with grade 4 tonsils needs surgery.","Wrong - oral appliances are not used in a growing 5-year-old with adenotonsillar obstruction.","Wrong - he is of normal weight; the cause is adenotonsillar hypertrophy.","Correct - adenotonsillectomy is first-line for paediatric OSA due to adenotonsillar hypertrophy."],"r":"Lecturer pearl"},{"t":"OSAT","stem":"A 41-year-old man is brought by his wife, who now sleeps in another room because of his snoring. Polysomnography shows AHI 11 events/hour with mainly supine events; ESS is 9. BMI is 25 kg/m². He has a retruded mandible, healthy teeth and small tonsils, and found CPAP intolerable after a 2-month trial.\nWhat is the most appropriate treatment?","o":["Custom mandibular advancement device","Uvulopalatopharyngoplasty","Maxillomandibular advancement surgery","Tracheostomy","Referral for bariatric surgery"],"a":0,"e":"A **mandibular advancement appliance** holds the mandible and tongue forward, enlarging the retroglossal airway; it suits **mild-moderate OSA** or CPAP intolerance, especially with retrognathia and good teeth (slide p61). Positional therapy can be added for supine-predominant events. Maxillomandibular advancement is for severe OSA failing other options, bariatric surgery for obesity, and tracheostomy is the last resort. Treatment also relieves the bed partner ('spouse syndrome', slide p65).","w":["Correct - mild OSA, CPAP intolerance, retrognathia and healthy teeth make a mandibular advancement device ideal.","Wrong - UPPP has limited success, especially with small tonsils and retroglossal (retrognathic) narrowing.","Wrong - maxillomandibular advancement is major skeletal surgery for severe OSA failing other treatments.","Wrong - tracheostomy is the last resort for severe, refractory OSA, not mild disease.","Wrong - his BMI is 25, so bariatric surgery has no role."],"r":"Slides p61, p65"}]}];
const APP_VERSION = '2026.11.07-1241';

/* ---------- storage (localStorage with in-memory fallback) ---------- */
const MEM = {};
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? (k in MEM ? MEM[k] : d) : JSON.parse(v);}catch(e){ return k in MEM ? MEM[k] : d; } },
  set(k, v){ MEM[k] = v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const KEY='entpass.v1', KEYD='entpass.customDecks';
let S = Object.assign({cards:{}, mcq:{}, hist:[], theme:null, cur:'all', done:{}}, LS.get(KEY, {}));
if (!S.done) S.done = {};
function save(){ LS.set(KEY, S); }

/* ---------- decks ---------- */
let DECKS = [], CARDS = [], MCQ = [], BYID = {};
function customDecks(){ return LS.get(KEYD, []); }
function setCustomDecks(a){ LS.set(KEYD, a); }
function buildIndex(){
  const map = new Map();
  BUILTIN.forEach(d => map.set(d.id, Object.assign({builtin:true}, d)));
  customDecks().forEach(d => map.set(d.id, Object.assign({builtin:false}, d)));
  DECKS = [...map.values()];
  CARDS = []; MCQ = []; BYID = {};
  DECKS.forEach(d => {
    d.topics = d.topics || {};
    (d.cards||[]).forEach((c,i) => { c.id = d.id+':c'+(i+1); c.deck = d.id; c.t = c.t || 'GEN'; if(!d.topics[c.t]) d.topics[c.t] = c.t; CARDS.push(c); BYID[c.id]=c; });
    (d.mcq||[]).forEach((q,i) => { q.id = d.id+':q'+(i+1); q.deck = d.id; q.t = q.t || 'GEN'; if(!d.topics[q.t]) d.topics[q.t] = q.t; MCQ.push(q); BYID[q.id]=q; });
  });
  if (S.cur !== 'all' && !DECKS.find(d => d.id === S.cur)) S.cur = 'all';
}
const deckOf = id => DECKS.find(d => d.id === id);
const curDecks = () => S.cur === 'all' ? DECKS : DECKS.filter(d => d.id === S.cur);
const curIds = () => new Set(curDecks().map(d => d.id));
const tKey = (deck, t) => deck + '/' + t;
const tName = key => { const [d, t] = key.split('/'); const dk = deckOf(d); return (dk && dk.topics[t]) || t; };
function topicsOf(decks){ const out=[]; decks.forEach(d => Object.keys(d.topics).forEach(t => out.push(tKey(d.id,t)))); return out; }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
function fmtStem(s){
  s = String(s||''); const i = s.lastIndexOf('\n');
  if (i < 0) return fmt(s);
  return fmt(s.slice(0,i)) + '<span class="ql">' + fmt(s.slice(i+1)) + '</span>';
}
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pct = (a,b) => b ? Math.round(100*a/b) : 0;
const cst = id => S.cards[id] || {b:0, s:false, n:0};
const mst = id => S.mcq[id] || {r:0, w:0, l:null};
const L = 'ABCDE';
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2200); }
const starsOf = k => { const n = Math.min(3, (S.done||{})[k] || 0); return `<span class="tstar" title="Finished ${(S.done||{})[k]||0} time(s)">${'★'.repeat(n)}<span class="off">${'☆'.repeat(3-n)}</span></span>`; };
const prov = x => x && x.r ? `<span class="prov">📌 ${esc(x.r)}</span>` : '';
function barCls(p){ return p<50?'red':p<75?'amb':'grn'; }
function deckLabel(){ if (S.cur==='all') return '📚 All decks'; const d=deckOf(S.cur); return d ? (d.emoji||'📘')+' '+(d.short||d.title) : 'All decks'; }

let VIEW = 'home';
let cardSel = {topics:null, mode:'due', shuffle:true, n:20};
let mcqSel = {topics:null, pool:'all', n:10, mode:'study'};

function go(v){ VIEW = v; if (v!=='quiz' && TIMER){ clearInterval(TIMER); TIMER=null; } render(); window.scrollTo(0,0); }
function render(){

function deckBtn(id, em, title, sub){

function pickDeck(id){ S.cur = id; save(); cardSel.topics=null; mcqSel.topics=null; document.querySelectorAll('.modal').forEach(m=>m.remove()); render(); }

/* ---------- stats ---------- */
function deckStats(ids){
  const cs = CARDS.filter(c => ids.has(c.deck)), qs = MCQ.filter(q => ids.has(q.deck));
  let mast=0, seen=0, star=0; cs.forEach(c => { const s=cst(c.id); if (s.b>=2) mast++; if (s.n>0) seen++; if (s.s) star++; });
  let r=0, w=0, att=0; qs.forEach(q => { const s=mst(q.id); r+=s.r; w+=s.w; if (s.r+s.w>0) att++; });
  return {cards:cs.length, mast, seen, star, mcq:qs.length, att, acc: pct(r, r+w), tries:r+w};
}

function learnTopic(deck, t){
  document.querySelectorAll('.modal').forEach(m=>m.remove());
  const pool = CARDS.filter(c=>c.deck===deck&&c.t===t);
  if (!pool.length){ toast('No cards in this topic'); return; }
  SESSION = {q: pool.map(c=>c.id), i:0, flip:false, again:0, got:0, total:pool.length, topic:tKey(deck,t), seen:{}};
  go('session');
}
function topicQuiz(k){
  const ids = MCQ.filter(q=>tKey(q.deck,q.t)===k).map(q=>q.id);
  mcqSel.mode = 'study'; startQuiz(shuffle(ids));
}

function quickWrong(){ mcqSel = {topics:null, pool:'wrong', n:999, mode:'study'}; startQuiz(); }

/* ---------- FLASHCARDS setup ---------- */
function selTopics(sel){ const all = topicsOf(curDecks()); return sel && sel.length ? sel.filter(t=>all.includes(t)) : all; }
function vCards(){
  const decks = curDecks(), all = topicsOf(decks), on = new Set(selTopics(cardSel.topics));
  const pool = cardPool();
  return `<h2>Flashcards</h2>
  <h3>Topics <button class="chip" style="float:right;margin-top:-6px" onclick="cardSel.topics=null;render()">all</button></h3>
  ${topicChips(cardSel, k => { const cs=CARDS.filter(c=>tKey(c.deck,c.t)===k); const m=cs.filter(c=>cst(c.id).b>=2).length;
     return `<button class="chip ${on.has(k)&&cardSel.topics?'on':''}" onclick="togTopic(cardSel,'${k}')">${esc(tName(k))} <small>${m}/${cs.length}</small></button>`; })}
  <h3>Which cards</h3>
  <div class="seg">${[['due','Not mastered'],['unseen','Unseen'],['weak','Weak'],['star','★ Starred'],['all','All']].map(([k,l])=>`<button class="${cardSel.mode===k?'on':''}" onclick="cardSel.mode='${k}';render()">${l}</button>`).join('')}</div>
  <h3>How many</h3>
  <div class="seg">${[10,20,40,9999].map(n=>`<button class="${cardSel.n===n?'on':''}" onclick="cardSel.n=${n};render()">${n>999?'All':n}</button>`).join('')}</div>
  <h3>Order</h3>
  <div class="seg"><button class="${cardSel.shuffle?'on':''}" onclick="cardSel.shuffle=true;render()">Shuffled</button><button class="${!cardSel.shuffle?'on':''}" onclick="cardSel.shuffle=false;render()">In order (as lecture)</button></div>
  <div style="height:14px"></div>
  <button class="btn" onclick="startCards()" ${pool.length?'':'disabled'}>Start ${Math.min(pool.length, cardSel.n)} cards</button>
  <div style="height:10px"></div>
  <button class="btn sec" onclick="go('browse')">🔎 Browse & search all cards</button>
  ${pool.length?'':'<p class="empty">No cards match. Try another filter.</p>'}`;
}
function topicChips(sel, chipFn){
  const decks = curDecks();
  if (decks.length === 1) return `<div class="chips">${topicsOf(decks).map(chipFn).join('')}</div>`;
  const on = new Set(sel.topics || []);
  return decks.map(d => { const ks = topicsOf([d]); const any = ks.some(k => on.has(k));
    return `<details class="grp" ${any?'open':''}><summary>${esc(d.emoji||'')} ${esc(d.title)} <small class="muted">(${ks.length} topics${any?' · '+ks.filter(k=>on.has(k)).length+' selected':''})</small> ▾</summary>
    <div class="chips"><button class="chip" onclick="pickWholeDeck(${sel===cardSel?'cardSel':'mcqSel'},'${d.id}')">✔ whole deck</button>${ks.map(chipFn).join('')}</div></details>`; }).join('');
}
function pickWholeDeck(sel, id){
  const ks = topicsOf([deckOf(id)]), cur = new Set(sel.topics || []);
  const allOn = ks.every(k => cur.has(k));
  ks.forEach(k => allOn ? cur.delete(k) : cur.add(k));
  const all = topicsOf(curDecks());
  sel.topics = cur.size && cur.size < all.length ? [...cur] : null; render();
}
function togTopic(sel, k){
  const all = topicsOf(curDecks());
  let cur = sel.topics ? sel.topics.slice() : [];
  cur = cur.includes(k) ? cur.filter(x=>x!==k) : cur.concat(k);
  sel.topics = cur.length && cur.length < all.length ? cur : null;
  render();
}
function cardPool(){
  const on = new Set(selTopics(cardSel.topics)), ids = curIds();
  return CARDS.filter(c => ids.has(c.deck) && on.has(tKey(c.deck,c.t))).filter(c => {
    const s = cst(c.id);
    return {due: s.b<2, unseen: s.n===0, weak: s.n>0 && s.b===0, star: s.s, all: true}[cardSel.mode];
  });
}
function startCards(){
  let pool = cardPool(); if (!pool.length){ toast('No cards match that filter'); return; }
  if (cardSel.shuffle) pool = shuffle(pool);
  pool = pool.slice(0, cardSel.n);
  SESSION = {q: pool.map(c=>c.id), i:0, flip:false, again:0, got:0, total:pool.length, seen:{}};
  go('session');
}

/* ---------- FLASHCARD session ---------- */
function vSession(){
  const s = SESSION; if (!s) return vCards();
  if (s.i >= s.q.length) return `<div class="box" style="text-align:center"><div style="font-size:46px">🎉</div><h2>Session complete</h2>
    ${(s.back||[]).length?`<button class="small" style="color:var(--p);margin:-4px 0 6px" onclick="prevCard()">← Back to the last card</button>`:''}
    <p>${s.got} × Got it · ${s.again} × Again</p>
    ${(s.newStars||[]).length ? `<div class="tip" style="text-align:left">⭐ Topic finished: ${s.newStars.map(k=>`<b>${esc(tName(k))}</b> ${starsOf(k)}`).join('<br>')}<br><span class="small muted">${s.newStars.some(k=>S.done[k]>=3)?'3 stars = fully revised. Keep it fresh with the MCQs!':'Finish it again later for the next star (max 3).'}</span></div>` : ''}</div>
    ${s.topic && MCQ.some(q=>tKey(q.deck,q.t)===s.topic) ? `<button class="btn" onclick="topicQuiz('${s.topic}')">✅ Now the ${MCQ.filter(q=>tKey(q.deck,q.t)===s.topic).length} MCQs on ${esc(tName(s.topic))}</button><div style="height:10px"></div>` : ''}
    <button class="btn ${s.topic?'sec':''}" onclick="${s.topic?'openLearn()':'startCards()'}">${s.topic?'📘 Learn another topic':'Another round'}</button><div style="height:10px"></div>
    <button class="btn sec" onclick="quickQuiz(10,'study')">Test yourself: 10 MCQ</button><div style="height:10px"></div>
    <button class="btn ghost" onclick="go('cards')">Back to flashcards</button>`;
  const c = BYID[s.q[s.i]], st = cst(c.id), d = deckOf(c.deck);
  return `<div class="trow" style="align-items:center"><span class="muted small">Card ${s.i+1} of ${s.q.length}</span>
    <span><button class="small" style="color:var(--p);margin-right:14px;${(s.back||[]).length?'':'opacity:.35'}" onclick="prevCard()" ${(s.back||[]).length?'':'disabled'}>← Previous</button><button class="small" style="color:var(--p)" onclick="go('cards')">✕ End</button></span></div>
  <div class="prog"><i style="width:${pct(s.i,s.q.length)}%"></i></div>
  <div class="scene"><div class="flip ${s.flip?'on':''}" id="flip" onclick="flipCard()">
    <div class="face front"><div class="tp"><span>${esc(tName(tKey(c.deck,c.t)))}</span><span class="pips">${[0,1,2].map(i=>`<i class="${st.b>i?'f':''}"></i>`).join('')}</span></div>
      <div class="q">${fmt(c.q)}</div><div class="hint">Tap to reveal · swipe → got it, ← again</div></div>
    <div class="face back"><div class="tp"><span>Answer</span><span>${esc(d.short||d.title)}</span></div>
      <div class="a">${fmt(c.a)}</div>
      ${c.m?`<div class="hook">💡 ${fmt(c.m)}</div>`:''}
      <div class="src">${prov(c)} 📄 ${esc(d.source||d.title)}</div></div>
  </div></div>
  ${s.flip ? `<div class="act"><button class="btn bad" onclick="rate(0)">↺ Again</button>
     <button class="starb ${st.s?'on':''}" onclick="toggleStar('${c.id}')">★</button>
     <button class="btn ok" onclick="rate(1)">✓ Got it</button></div>`
   : `<button class="btn" onclick="flipCard()">Show answer</button>`}`;
}
function flipCard(){ if (SWIPED){ SWIPED=false; return; } SESSION.flip = !SESSION.flip; render(); }
function toggleStar(id){ const s = cst(id); s.s = !s.s; S.cards[id] = s; save(); render(); }
/* a topic counts as finished once when a session that went to the end covered EVERY card of it */
function markFinished(s){
  const keys = new Set(Object.keys(s.seen).map(id => { const c = BYID[id]; return tKey(c.deck, c.t); }));
  const done = [];
  keys.forEach(k => {
    const all = CARDS.filter(c => tKey(c.deck,c.t) === k);
    if (all.length && all.every(c => s.seen[c.id])){ S.done[k] = (S.done[k]||0) + 1; done.push(k); }
  });
  save(); return done;
}
function rate(ok){
  const s = SESSION, id = s.q[s.i], st = cst(id);
  (s.back = s.back || []).push({id, i:s.i, q:s.q.slice(), got:s.got, again:s.again, card: S.cards[id] ? Object.assign({}, S.cards[id]) : null, seen: !!(s.seen && s.seen[id])});
  if (s.back.length > 300) s.back.shift();
  st.n++;
  if (ok){ st.b = Math.min(3, st.b+1); s.got++; }
  else { st.b = 0; s.again++; const pos = Math.min(s.q.length, s.i+5); s.q.splice(pos, 0, id); }
  S.cards[id] = st; save();
  (s.seen = s.seen || {})[id] = 1;
  s.i++; s.flip = false;
  if (s.i >= s.q.length && !s.counted){ s.counted = true; s.newStars = markFinished(s); }
  render();
}
/* go back to the previous card: undoes the last rating exactly (queue, box, counters, topic stars) */
function prevCard(){
  const s = SESSION; if (!s || !s.back || !s.back.length) return;
  const b = s.back.pop();
  if (s.counted && s.newStars){ s.newStars.forEach(k => { if (S.done && S.done[k]) { S.done[k]--; if (!S.done[k]) delete S.done[k]; } }); }
  s.counted = false; s.newStars = null;
  if (b.card) S.cards[b.id] = b.card; else delete S.cards[b.id];
  if (s.seen && !b.seen) delete s.seen[b.id];
  s.q = b.q; s.i = b.i; s.got = b.got; s.again = b.again; s.flip = true;
  save(); render(); window.scrollTo(0,0);
}
let SWIPED = false;
function bindSwipe(){
  const el = $('#flip'); if (!el) return; let x0=null, y0=null;
  el.addEventListener('touchstart', e => { x0=e.touches[0].clientX; y0=e.touches[0].clientY; }, {passive:true});
  el.addEventListener('touchend', e => {
    if (x0==null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
    if (Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.5 && SESSION.flip){ SWIPED=true; setTimeout(()=>{SWIPED=false},400); rate(dx>0?1:0); }
  });
}

/* ---------- MCQ setup ---------- */
function mcqPool(){
  const on = new Set(selTopics(mcqSel.topics)), ids = curIds();
  return MCQ.filter(q => ids.has(q.deck) && on.has(tKey(q.deck,q.t))).filter(q => {
    const s = mst(q.id);
    return {all:true, new: s.r+s.w===0, wrong: s.l===false}[mcqSel.pool];
  });
}
function vMcq(){
  const all = topicsOf(curDecks()), on = new Set(selTopics(mcqSel.topics)), pool = mcqPool();
  return `<h2>Clinical MCQs</h2>
  <h3>Topics <button class="chip" style="float:right;margin-top:-6px" onclick="mcqSel.topics=null;render()">all</button></h3>
  ${topicChips(mcqSel, k => { const qs=MCQ.filter(q=>tKey(q.deck,q.t)===k); if(!qs.length) return '';
     let r=0,w=0; qs.forEach(q=>{const s=mst(q.id); r+=s.r; w+=s.w;});
     return `<button class="chip ${on.has(k)&&mcqSel.topics?'on':''}" onclick="togTopic(mcqSel,'${k}')">${esc(tName(k))} <small>${qs.length}${r+w?' · '+pct(r,r+w)+'%':''}</small></button>`; })}
  <h3>Question pool</h3>
  <div class="seg">${[['all','All'],['new','Not attempted'],['wrong','Got wrong last time']].map(([k,l])=>`<button class="${mcqSel.pool===k?'on':''}" onclick="mcqSel.pool='${k}';render()">${l}</button>`).join('')}</div>
  <h3>Number of questions</h3>
  <div class="seg">${[5,10,20,30,50,999].map(n=>`<button class="${mcqSel.n===n?'on':''}" onclick="mcqSel.n=${n};render()">${n>500?'All':n}</button>`).join('')}</div>
  <h3>Mode</h3>
  <div class="seg"><button class="${mcqSel.mode==='study'?'on':''}" onclick="mcqSel.mode='study';render()">📖 Study (instant feedback)</button><button class="${mcqSel.mode==='exam'?'on':''}" onclick="mcqSel.mode='exam';render()">⏱️ Exam (timed)</button></div>
  <div style="height:14px"></div>
  <button class="btn" onclick="startQuiz()" ${pool.length?'':'disabled'}>Start ${Math.min(pool.length,mcqSel.n)} questions</button>
  ${pool.length?'':'<p class="empty">No questions in this pool yet.</p>'}
  <div style="height:12px"></div>
  <div class="tip">Options are shuffled every time, so you can't memorise the letter – you have to know the medicine. Exam mode allows ~72 s per question.</div>`;
}
function startQuiz(ids){
  let items = ids ? ids.map(i=>BYID[i]).filter(Boolean) : shuffle(mcqPool()).slice(0, mcqSel.n);
  if (!items.length){ toast('No questions in this pool'); return; }
  QUIZ = {items: items.map(q => ({id:q.id, order: shuffle(q.o.map((_,i)=>i)), pick:null})), i:0, mode:mcqSel.mode, t0:Date.now(), done:false};
  if (TIMER) clearInterval(TIMER);
  if (QUIZ.mode==='exam') TIMER = setInterval(tick, 1000);
  go('quiz');
}
function tick(){
  if (!QUIZ || QUIZ.done || VIEW!=='quiz'){ return; }
  const lim = QUIZ.items.length*72, left = lim - Math.floor((Date.now()-QUIZ.t0)/1000);
  const el = $('#tmr'); if (el) el.textContent = left>0 ? mmss(left) : 'time up';
  if (left <= 0){ clearInterval(TIMER); TIMER=null; finishQuiz(true); }
}
const mmss = s => Math.floor(s/60)+':'+String(s%60).padStart(2,'0');

/* ---------- QUIZ run ---------- */
function vQuiz(){
  const Q = QUIZ; if (!Q) return vMcq();
  const it = Q.items[Q.i], q = BYID[it.id], study = Q.mode==='study', locked = study && it.pick!=null;
  const left = Q.items.length*72 - Math.floor((Date.now()-Q.t0)/1000);
  let h = `<div class="trow"><span class="muted small">Q ${Q.i+1} / ${Q.items.length} · ${esc(tName(tKey(q.deck,q.t)))}</span>
    ${study?`<button class="small" style="color:var(--p)" onclick="finishQuiz()">Finish ✓</button>`:`<span class="timer" id="tmr">${mmss(Math.max(0,left))}</span>`}</div>
    <div class="prog"><i style="width:${pct(Q.items.filter(x=>x.pick!=null).length,Q.items.length)}%"></i></div>
    <div class="box stem">${fmtStem(q.stem)}</div>`;
  it.order.forEach((oi, k) => {
    let cls = '';
    if (locked){ if (oi===q.a) cls='right'; else if (oi===it.pick) cls='wrong'; }
    else if (it.pick===oi) cls='sel';
    h += `<button class="opt ${cls}" onclick="pick(${oi})" ${locked?'disabled':''}><span class="k">${L[k]}</span><span>${fmt(q.o[oi])}${locked && q.w && q.w[oi]?`<span class="why">${fmt(q.w[oi])}</span>`:''}</span></button>`;
  });
  if (locked){
    const ok = it.pick===q.a;
    h += `<div class="verdict ${ok?'ok':'bad'}" id="verdict"><b>${ok?'✅ Correct!':'❌ Not quite.'}</b> ${ok?'':'Answer: <b>'+L[it.order.indexOf(q.a)]+'</b>. '}${fmt(q.e||'')}</div>
      <div class="small muted" style="margin-bottom:10px;overflow-wrap:anywhere">${prov(q)} 📄 ${esc((deckOf(q.deck)||{}).source||'')}</div>
      <button class="btn" onclick="nextQ()">${Q.i<Q.items.length-1?'Next question →':'See results'}</button>`;
  }
  if (!study){
    h += `<div class="row" style="margin-top:4px"><button class="btn sec" onclick="moveQ(-1)" ${Q.i?'':'disabled'}>← Prev</button>
      ${Q.i<Q.items.length-1?`<button class="btn" onclick="moveQ(1)">Next →</button>`:`<button class="btn ok" onclick="finishQuiz()">Finish</button>`}</div>
      <h3>Jump to question</h3><div class="dots">${Q.items.map((x,k)=>`<button class="${x.pick!=null?'a':''} ${k===Q.i?'c':''}" onclick="QUIZ.i=${k};render()">${k+1}</button>`).join('')}</div>
      <button class="btn ghost" onclick="finishQuiz()">Submit exam</button>`;
  }
  return h;
}
function pick(oi){
  const Q = QUIZ, it = Q.items[Q.i];
  if (Q.mode==='study'){
    if (it.pick!=null) return; it.pick = oi; record(it.id, oi===BYID[it.id].a); render();
    setTimeout(()=>{ const v=$('#verdict'); if (v) v.scrollIntoView({behavior:'smooth', block:'center'}); }, 60);
  } else { it.pick = oi; render(); }
}
function record(id, ok){ const s = mst(id); ok ? s.r++ : s.w++; s.l = ok; S.mcq[id] = s; save(); }
function nextQ(){ if (QUIZ.i < QUIZ.items.length-1){ QUIZ.i++; render(); window.scrollTo(0,0); } else finishQuiz(); }
function moveQ(d){ QUIZ.i = Math.max(0, Math.min(QUIZ.items.length-1, QUIZ.i+d)); render(); window.scrollTo(0,0); }
function finishQuiz(force){
  const Q = QUIZ; if (Q.done) return;
  const un = Q.items.filter(x=>x.pick==null).length;
  if (!force && Q.mode==='exam' && un && !confirm(un+' question(s) unanswered. Submit anyway?')) return;
  if (!force && Q.mode==='study' && un && !confirm('End now? '+un+' question(s) not answered will be skipped.')) return;
  if (Q.mode==='exam') Q.items.forEach(x => { if (x.pick!=null) record(x.id, x.pick===BYID[x.id].a); else record(x.id, false); });
  if (Q.mode==='study') Q.items = Q.items.filter(x=>x.pick!=null);
  Q.done = true; Q.secs = Math.round((Date.now()-Q.t0)/1000);
  if (TIMER){ clearInterval(TIMER); TIMER=null; }
  const score = Q.items.filter(x=>x.pick===BYID[x.id].a).length;
  if (Q.items.length){ S.hist.unshift({d:Date.now(), deck:S.cur, score, total:Q.items.length, mode:Q.mode, secs:Q.secs}); S.hist = S.hist.slice(0,40); save(); }
  go('result');
}
function vResult(){
  const Q = QUIZ; if (!Q || !Q.items.length) return `<p class="empty">No answered questions.</p><button class="btn" onclick="go('mcq')">Back</button>`;
  const sc = Q.items.filter(x=>x.pick===BYID[x.id].a).length, p = pct(sc, Q.items.length);
  const msg = p>=85?'Flying colours! 🏆':p>=70?'Solid pass – polish the wrong ones. 💪':p>=50?'Borderline – review explanations below. 📖':'Back to the flashcards for these topics. 🔁';
  const byT = {}; Q.items.forEach(x => { const q=BYID[x.id], k=tKey(q.deck,q.t); byT[k]=byT[k]||[0,0]; byT[k][1]++; if (x.pick===q.a) byT[k][0]++; });
  const wrongIds = Q.items.filter(x=>x.pick!==BYID[x.id].a).map(x=>x.id);
  return `<div class="box" style="text-align:center"><div class="score">${sc}/${Q.items.length}</div><div style="font-size:20px;font-weight:800">${p}%</div>
    <p>${msg}</p><p class="muted small">${Q.mode==='exam'?'Exam':'Study'} mode · ${mmss(Q.secs)}</p></div>
  ${wrongIds.length?`<button class="btn" onclick="mcqSel.mode=QUIZ.mode;startQuiz(${esc(JSON.stringify(wrongIds))})">🔁 Retry the ${wrongIds.length} I got wrong</button><div style="height:10px"></div>`:''}
  <button class="btn sec" onclick="go('mcq')">New quiz</button>
  <h3>By topic</h3><div class="box">${Object.entries(byT).map(([k,[r,t]])=>`<div class="trow"><span>${esc(tName(k))}</span><b>${r}/${t}</b></div><div class="bar ${barCls(pct(r,t))}" style="margin-bottom:9px"><i style="width:${pct(r,t)}%"></i></div>`).join('')}</div>
  <h3>Review every question</h3>
  ${Q.items.map((x,k)=>{ const q=BYID[x.id], ok=x.pick===q.a;
    return `<details><summary>${ok?'✅':'❌'} <b>Q${k+1}</b> ${esc(q.stem.split('\n').pop())}</summary><div class="in">
    <div class="stem">${fmtStem(q.stem)}</div>
    ${x.order.map((oi,j)=>`<div class="opt ${oi===q.a?'right':oi===x.pick?'wrong':''}"><span class="k">${L[j]}</span><span>${fmt(q.o[oi])}${q.w&&q.w[oi]?`<span class="why">${fmt(q.w[oi])}</span>`:''}</span></div>`).join('')}
    ${x.pick==null?'<p class="small" style="color:var(--bad)">Not answered</p>':''}
    <div class="verdict ${ok?'ok':'bad'}">${fmt(q.e||'')}<br>${prov(q)}</div></div></details>`; }).join('')}`;
}

/* ---------- PROGRESS ---------- */
function vProg(){
  const decks = curDecks();
  const rows = [];
  decks.forEach(d => Object.keys(d.topics).forEach(t => {
    const k = tKey(d.id,t), cs = CARDS.filter(c=>c.deck===d.id&&c.t===t), qs = MCQ.filter(q=>q.deck===d.id&&q.t===t);
    const m = cs.filter(c=>cst(c.id).b>=2).length; let r=0,w=0; qs.forEach(q=>{const s=mst(q.id); r+=s.r; w+=s.w;});
    rows.push({k, d, cards:cs.length, m, mp:pct(m,cs.length), mcq:qs.length, acc:r+w?pct(r,r+w):null, score: (cs.length?pct(m,cs.length):100)*0.5 + (r+w?pct(r,r+w):0)*0.5});
  }));
  const active = rows.filter(r => r.acc!=null || CARDS.some(c=>c.deck===r.d.id && tKey(c.deck,c.t)===r.k && cst(c.id).n>0));
  const focus = active.sort((a,b)=>a.score-b.score).slice(0,3);
  const hist = S.hist.filter(h => S.cur==='all' || h.deck===S.cur).slice(0,12);
  return `<h2>Progress</h2>
  <div class="tip">⭐ <b>Topic stars</b> – you earn a star each time you go through <b>every card</b> of a topic to the end (easiest: <b>📘 Learn a topic</b>, or tap a topic name below). 1st time ★☆☆, 2nd ★★☆, 3rd ★★★. <b>${topicsOf(curDecks()).filter(k=>(S.done||{})[k]>0).length}/${topicsOf(curDecks()).length}</b> topics covered so far.</div>
  <h3>Focus next on</h3><div class="box">${focus.length?'':'<span class="muted">Study some cards or MCQs first – your weakest topics will show here.</span>'}${focus.map(r=>`<div class="trow" style="margin-bottom:6px"><span>🎯 ${esc(r.d.emoji||'')} ${esc(tName(r.k))}</span><span class="muted small">${r.mp}% cards${r.acc!=null?' · '+r.acc+'% MCQ':''}</span></div>`).join('')}</div>
  ${decks.map(d => `<h3>${esc(d.emoji||'')} ${esc(d.title)}</h3><div class="box">${rows.filter(r=>r.d===d).map(r=>`
     <div class="trow"><button style="text-align:left;color:var(--p);padding:0" onclick="learnTopic('${r.d.id}','${r.k.split('/')[1]}')">${esc(tName(r.k))} ›${starsOf(r.k)}</button><span class="small muted">${r.m}/${r.cards} cards${r.acc!=null?' · MCQ '+r.acc+'%':''}</span></div>
     <div class="bar ${r.mp<50?'':'grn'}" style="margin-bottom:9px"><i style="width:${r.mp}%"></i></div>`).join('')}
     <button class="btn ghost" style="margin-top:6px;padding:9px" onclick="resetDeck('${d.id}')">Reset progress for this deck</button></div>`).join('')}
  <h3>Recent quizzes</h3><div class="box">${hist.length?hist.map(h=>`<div class="trow" style="margin-bottom:5px"><span>${new Date(h.d).toLocaleDateString()} · ${h.mode==='exam'?'⏱️ exam':'📖 study'} ${h.deck==='all'?'':'· '+esc((deckOf(h.deck)||{}).short||'')}</span><b>${h.score}/${h.total} (${pct(h.score,h.total)}%)</b></div>`).join(''):'<span class="muted">No quizzes yet.</span>'}</div>`;
}
function resetDeck(id){
  if (!confirm('Reset all flashcard and MCQ progress for this deck?')) return;
  Object.keys(S.cards).forEach(k=>{ if (k.startsWith(id+':')) delete S.cards[k]; });
  Object.keys(S.mcq).forEach(k=>{ if (k.startsWith(id+':')) delete S.mcq[k]; });
  Object.keys(S.done||{}).forEach(k=>{ if (k.startsWith(id+'/')) delete S.done[k]; });
  S.hist = S.hist.filter(h=>h.deck!==id); save(); render(); toast('Progress reset');
}

/* ---------- DECKS (add new PDF decks) ---------- */
const AI_PROMPT = `You are a Malaysian consultant ENT (otorhinolaryngology – head & neck) surgeon and clinical lecturer. From the attached PDF lecture, create a study deck for an MBBS student as ONE JSON object (no other text) in exactly this format:
{"id":"short-lowercase-id","title":"Deck title","short":"Short name","emoji":"👂","source":"<pdf file name>",
 "topics":{"T1":"Topic 1 name","T2":"Topic 2 name"},
 "cards":[{"t":"T1","q":"Question","a":"• point 1\\n• **key word** point 2","m":"memory hook / mnemonic","r":"Slide p12"}],
 "mcq":[{"t":"T1","stem":"Clinical vignette (age, sex, history, examination, investigations)...\\nFinal question?","o":["option A","option B","option C","option D","option E"],"a":0,"e":"Explanation of the principle","w":["why A is right/wrong","why B ...","why C ...","why D ...","why E ..."],"r":"Slide p12"}]}
Rules: make N1 flashcards and N2 MCQs covering every topic in the PDF, weighted to exam yield. Flashcards: one focused question each, short bullet answers (\\n between bullets, **bold** keywords), add a mnemonic/memory hook where helpful. MCQs: every stem is a realistic clinical vignette; single best answer; exactly 5 homogeneous, plausible options; the answer must NOT be obvious (test thresholds, next best step, which to avoid, distinguishing similar conditions); the correct option must not be the longest; spread the correct index across 0-4; 'a' is the 0-based index of the correct option; give a one-line reason for every option in 'w'. 'r' = the slide/page the fact comes from. Use Malaysian MOH CPGs where they exist, otherwise standard ENT texts (Dhingra, Scott-Brown) and the Malaysian hospital/ENT clinic context. Never use the double-quote character inside text (use single quotes). Output valid JSON only.`;
function vDecks(){
  const cus = customDecks();
  return `<h2>Decks</h2>
  <div class="tip"><b>Got a new PDF?</b> Turn it into a deck in 2 steps:<br>

  2. Tap <b>Import deck file</b> here. The deck appears in this app with its own progress tracking – no reinstall needed.</div>
  <label class="btn" style="cursor:pointer">📥 Import deck file (.json)<input type="file" accept=".json,application/json,text/plain" style="display:none" onchange="importFile(this)"></label>
  <div style="height:10px"></div>
  <div class="grid2"><button class="btn sec" onclick="pasteDeck()">📋 Paste deck JSON</button><button class="btn sec" onclick="copyPrompt()">🤖 Copy AI prompt</button></div>
  <div style="height:10px"></div>
  <button class="btn ghost" onclick="addOwnCard()">✍️ Write my own flashcard</button>
  <h3>Installed decks</h3>
  ${DECKS.map(d=>`<div class="deck"><span class="em">${esc(d.emoji||'📘')}</span><span style="flex:1;min-width:0"><span class="t">${esc(d.title)}</span><br>
    <span class="s">${(d.cards||[]).length} cards · ${(d.mcq||[]).length} MCQ · ${d.builtin?'built-in':'imported'}${d.source?' · '+esc(d.source):''}</span>
    <span class="row" style="margin-top:8px"><button class="chip" onclick="exportDeck('${d.id}')">⬇️ Export</button>${d.builtin?'':`<button class="chip" onclick="delDeck('${d.id}')">🗑️ Delete</button>`}</span></span></div>`).join('')}
  <h3>Backup</h3>
  <div class="grid2"><button class="btn sec" onclick="exportProgress()">⬇️ Save progress</button>
  <label class="btn sec" style="cursor:pointer">⬆️ Restore progress<input type="file" accept=".json" style="display:none" onchange="importProgress(this)"></label></div>
  <p class="muted small">Progress is stored on this phone in this browser. Use backup before clearing browser data or switching phones. App version ${esc(APP_VERSION)} · ${cus.length} imported deck(s).</p>
  <details><summary>🤖 Show the AI prompt</summary><div class="in"><pre>${esc(AI_PROMPT.replace('N1','100').replace('N2','50'))}</pre></div></details>`;

function copyPrompt(){
  const txt = AI_PROMPT.replace('N1','100').replace('N2','50');
  const done = () => toast('Prompt copied – paste it to your AI with the PDF');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, ()=>fallbackCopy(txt, done)); else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done){ const t=document.createElement('textarea'); t.value=txt; document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); done(); }catch(e){ alert(txt); } t.remove(); }
function normaliseDeck(d){
  if (!d || typeof d!=='object') throw new Error('Not a deck object');
  if (!Array.isArray(d.cards) && !Array.isArray(d.mcq)) throw new Error('Deck needs a "cards" and/or "mcq" array');
  const id = String(d.id || d.title || 'deck').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) || ('deck-'+Date.now());
  const cards = (d.cards||[]).filter(c=>c && c.q && c.a).map(c=>({t:String(c.t||'GEN'), q:String(c.q), a:String(c.a), m:c.m?String(c.m):undefined, r:c.r?String(c.r):undefined}));
  const mcq = (d.mcq||[]).filter(q=>q && q.stem && Array.isArray(q.o) && q.o.length>=2 && Number.isInteger(+q.a) && +q.a>=0 && +q.a<q.o.length)
    .map(q=>({t:String(q.t||'GEN'), stem:String(q.stem), o:q.o.map(String), a:+q.a, e:String(q.e||''), w:Array.isArray(q.w)?q.w.map(String):undefined, r:q.r?String(q.r):undefined}));
  if (!cards.length && !mcq.length) throw new Error('No valid cards or MCQs found');
  return {id, title:String(d.title||id), short:String(d.short||d.title||id).slice(0,24), emoji:String(d.emoji||'📘'), source:String(d.source||''), topics:(d.topics&&typeof d.topics==='object')?d.topics:{}, cards, mcq};
}
function addDecks(obj){
  let arr = Array.isArray(obj) ? obj : (obj && Array.isArray(obj.decks) ? obj.decks : [obj]);
  const decks = arr.map(normaliseDeck), cus = customDecks();
  decks.forEach(d => { const i = cus.findIndex(x=>x.id===d.id); if (i>=0) cus[i]=d; else cus.push(d); });
  setCustomDecks(cus); buildIndex();
  toast('Imported: '+decks.map(d=>d.title+' ('+d.cards.length+' cards, '+d.mcq.length+' MCQ)').join(', '));
  S.cur = decks[decks.length-1].id; save(); go('home');
}
function parseJSONLoose(txt){
  txt = String(txt).trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  try { return JSON.parse(txt); } catch(e){ const a=txt.indexOf('{'), b=txt.lastIndexOf('}'); if (a>=0&&b>a) return JSON.parse(txt.slice(a,b+1)); throw e; }
}
function importFile(inp){
  const f = inp.files[0]; if (!f) return; const r = new FileReader();
  r.onload = () => { try { addDecks(parseJSONLoose(r.result)); } catch(e){ alert('Could not import this file: '+e.message); } inp.value=''; };
  r.readAsText(f);
}
function pasteDeck(){
  const m = document.createElement('div'); m.className='modal'; m.onclick=e=>{ if(e.target===m) m.remove(); };
  m.innerHTML = `<div class="sheet"><h2>Paste deck JSON</h2><textarea id="pj" rows="10" placeholder='{"id":"...","title":"...","cards":[...],"mcq":[...]}'></textarea><div style="height:10px"></div>
   <button class="btn" onclick="try{addDecks(parseJSONLoose(document.getElementById('pj').value));this.closest('.modal').remove();}catch(e){alert('Invalid JSON: '+e.message)}">Import</button></div>`;
  document.body.appendChild(m);
}
function addOwnCard(){
  const m = document.createElement('div'); m.className='modal'; m.onclick=e=>{ if(e.target===m) m.remove(); };
  m.innerHTML = `<div class="sheet"><h2>✍️ My own flashcard</h2><p class="muted small">Saved in the deck “My cards”. Use **double stars** for bold and a new line for each bullet.</p>
   <label class="lb">Topic</label><input id="ot" placeholder="e.g. Otitis media" value="General">
   <label class="lb">Question</label><textarea id="oq" rows="2"></textarea>
   <label class="lb">Answer</label><textarea id="oa" rows="4"></textarea>
   <label class="lb">Memory hook (optional)</label><input id="om">
   <div style="height:12px"></div><button class="btn" onclick="saveOwnCard(this)">Save card</button></div>`;

function saveOwnCard(btn){
  const q=$('#oq').value.trim(), a=$('#oa').value.trim(); if (!q||!a){ toast('Question and answer are needed'); return; }
  const tn=$('#ot').value.trim()||'General', code=tn.toUpperCase().replace(/[^A-Z0-9]+/g,'').slice(0,8)||'GEN';

function download(name, obj){
  const blob = new Blob([JSON.stringify(obj, null, 1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function exportDeck(id){ const d = deckOf(id); const {builtin, ...rest} = d;
  download(id+'.json', {id:rest.id, title:rest.title, short:rest.short, emoji:rest.emoji, source:rest.source, topics:rest.topics,
    cards:(rest.cards||[]).map(({t,q,a,m,r})=>({t,q,a,m,r})), mcq:(rest.mcq||[]).map(({t,stem,o,a,e,w,r})=>({t,stem,o,a,e,w,r}))}); }
function delDeck(id){ if (!confirm('Delete this imported deck? (Its progress is kept in case you re-import it.)')) return;
  setCustomDecks(customDecks().filter(d=>d.id!==id)); if (S.cur===id) S.cur='all'; save(); buildIndex(); render(); }
function exportProgress(){ download('entpass-progress-'+new Date().toISOString().slice(0,10)+'.json', {entpass:1, progress:S, customDecks:customDecks()}); }
function importProgress(inp){
  const f = inp.files[0]; if (!f) return; const r = new FileReader();
  r.onload = () => { try { const o = JSON.parse(r.result); if (!o.progress) throw new Error('not a progress backup');
    if (!confirm('Replace current progress with this backup?')) return;
    S = Object.assign({cards:{}, mcq:{}, hist:[], theme:null, cur:'all', done:{}}, o.progress); save();
    if (Array.isArray(o.customDecks)) setCustomDecks(o.customDecks); buildIndex(); applyTheme(); go('home'); toast('Progress restored');
  } catch(e){ alert('Could not restore: '+e.message); } inp.value=''; };
  r.readAsText(f);
}

/* ---------- theme ---------- */
function applyTheme(){
  const t = S.theme || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

  document.querySelector('meta[name=theme-color]').content = t==='dark' ? '#00363d' : '#00838f';
}
function toggleTheme(){ S.theme = (document.documentElement.dataset.theme==='dark') ? 'light' : 'dark'; save(); applyTheme(); }

/* ---------- keyboard (desktop) ---------- */
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (VIEW==='session' && SESSION && (e.key==='Backspace' || e.key==='p' || e.key==='P')){ e.preventDefault(); prevCard(); return; }
  if (VIEW==='session' && SESSION && SESSION.i < SESSION.q.length){
    if (e.key===' '){ e.preventDefault(); flipCard(); }
    else if (SESSION.flip && (e.key==='ArrowRight'||e.key==='2')) rate(1);
    else if (SESSION.flip && (e.key==='ArrowLeft'||e.key==='1')) rate(0);
  } else if (VIEW==='quiz' && QUIZ){
    const k = 'abcde'.indexOf(e.key.toLowerCase());
    if (k>=0 && k<QUIZ.items[QUIZ.i].order.length) pick(QUIZ.items[QUIZ.i].order[k]);
    else if (e.key==='Enter' || e.key==='ArrowRight'){ if (QUIZ.mode==='study'){ if (QUIZ.items[QUIZ.i].pick!=null) nextQ(); } else moveQ(1); }
    else if (e.key==='ArrowLeft' && QUIZ.mode==='exam') moveQ(-1);
  }
});

/* ---------- website / installable app (PWA) ---------- */
let INSTALL_EVT = null;
const IS_IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const IS_STANDALONE = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALL_EVT = e; if (VIEW==='home') render(); });
window.addEventListener('appinstalled', () => { INSTALL_EVT = null; toast('ENTPass installed 🎉'); render(); });
function installBox(){
  if (IS_STANDALONE || !/^https?:/.test(location.protocol) || S.hideInstall) return '';
  if (INSTALL_EVT) return `<div class="tip">📲 <b>Install ENTPass</b> as an app – opens full-screen and works offline.<div class="row" style="margin-top:8px"><button class="btn" style="padding:9px" onclick="doInstall()">Install app</button><button class="btn sec" style="padding:9px" onclick="S.hideInstall=true;save();render()">Not now</button></div></div>`;
  if (IS_IOS) return `<div class="tip">📲 <b>Add to your iPhone home screen:</b> tap the <b>Share</b> button <b>⬆︎</b> in Safari → <b>Add to Home Screen</b>. It then opens like an app and works offline. <button class="small" style="color:var(--p);float:right" onclick="S.hideInstall=true;save();render()">hide</button></div>`;
  return '';
}
function doInstall(){ if (!INSTALL_EVT) return; INSTALL_EVT.prompt(); INSTALL_EVT.userChoice.finally(()=>{ INSTALL_EVT=null; render(); }); }
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch(e){} }

buildIndex(); applyTheme(); render();
</script>
