narrow canal traps the swelling.","r":"Slide p25"},{"t":"BELL","q":"Explain the pathophysiology of Bell's palsy step by step.","a":"• Latent **HSV-1** in the **geniculate ganglion** reactivates\n• Inflammation → **oedema** of the nerve inside its rigid bony canal\n• Worst at the **labyrinthine segment / meatal foramen** (narrowest, ~0.68 mm)\n• Compression → venous congestion → **ischaemia** → more oedema\n• Most have conduction block only (neurapraxia); severe cases develop **axonal degeneration** → slow, incomplete recovery with synkinesis","m":"Swelling in a bony tunnel: the nerve is strangled where the tunnel is tightest.","r":"Lecturer pearl"},{"t":"BELL","q":"What are the clinical features of Bell's palsy?","a":"• **Sudden** unilateral facial asymmetry, often preceded by **postauricular pain / otalgia**\n• Loss of forehead wrinkles, **inability to close the eye**, visible **Bell's phenomenon**\n• Flattened nasolabial fold, **saliva dribbling** from the angle of the mouth\n• **Epiphora**, **hyperacusis** (stapedius paralysis), **altered taste** (chorda tympani)\n• Palsy may be **complete or incomplete**; recurs in **3-10%**","m":"The whole half-face, forehead included, overnight.","r":"Slide p26"},{"t":"BELL","q":"What is the prognosis of Bell's palsy, and which features predict a good outcome?","a":"• **85-90%** recover fully, most within weeks to 3 months\n• Good: **incomplete palsy** at presentation; recovery beginning **within 3 weeks**; younger age; steroids within 72 h\n• Poor: **complete palsy**, age > 60, diabetes, hypertension, pregnancy, severe pain, **> 90% degeneration on ENoG**\n• Sequelae of poor recovery: **synkinesis**, contracture, **crocodile tears**","m":"Partial and recovering by 3 weeks = a good outcome.","r":"Slide p23"},{"t":"BELL","q":"Bell's palsy is a diagnosis of exclusion. What must the history and examination look for?","a":"• History: speed of onset (sudden vs **gradual**), previous episodes, ear pain or discharge, vesicles, trauma, recent surgery, hearing loss, vertigo\n• Examine and grade the **whole facial nerve** (House-Brackmann)\n• **Otoscopy**: vesicles, AOM, cholesteatoma, granulations, mass\n• **Parotid and neck** palpation: mass, nodes\n• **Other cranial nerves** and limbs: stroke, CPA lesion, GBS","m":"Look in the ear, feel the parotid, test the other nerves – then call it Bell's.","r":"Slide p28"},{"t":"BELL","q":"Which investigations are needed for a typical Bell's palsy?","a":"• **None routinely** – no routine bloods or imaging for a typical acute unilateral palsy (AAO-HNS 2013)\n• Targeted only: **blood glucose** (known or suspected diabetes, before steroids); Lyme serology if exposed\n• **Electrodiagnosis (ENoG)** only for **complete** palsy, between day 3 and 14-21, if decompression is being considered\n• Note: slide lists routine FBC/ESR/smear and a **nerve excitability test done daily**; correct is that these are not routine, and serial NET is a historical test largely replaced by ENoG","m":"Typical Bell's: diagnose clinically, treat fast, scan only if atypical.","r":"Slide p28"},{"t":"BELL","q":"Which red flags should make you doubt Bell's palsy and arrange imaging (gadolinium MRI / HRCT)?","a":"• **Gradual** progression over **> 3 weeks**, or **twitching before weakness**\n• **No recovery by 3-4 months**\n• **Recurrent ipsilateral** palsy\n• **Other cranial nerve** deficits, hearing loss, vertigo\n• **Parotid or neck mass**, ear discharge, cholesteatoma, **vesicles**, severe pain\n• Bilateral palsy; previous skin cancer of the face or scalp (perineural spread)","m":"Slow, twitchy, recurrent or not recovering = tumour until proven otherwise.","r":"Lecturer pearl"},{"t":"BELL","q":"What is the first-line drug treatment for Bell's palsy, and when must it be started?","a":"• **Oral prednisolone** started **within 72 hours** of onset (age 16 and over)\n• Regimens: **50 mg once daily for 10 days**, or **60 mg daily for 5 days then taper** by 10 mg/day\n• Increases complete recovery and reduces synkinesis\n• Check glucose and BP in diabetics; in pregnancy discuss with obstetrics","m":"72 hours to start steroids – the window shuts on day 3.","r":"Slide p28"},{"t":"BELL","q":"What is the role of antiviral drugs in Bell's palsy?","a":"• **Antiviral alone is not recommended** – no proven benefit over placebo\n• May be **added to prednisolone** within 72 h in **severe / complete** palsy (small possible benefit)\n• Typical regimen: **valaciclovir 1 g three times daily for 7 days** (or aciclovir)\n• If vesicles or severe pain suggest Ramsay Hunt syndrome, antivirals become **essential**","m":"The steroid is the engine; the antiviral is an optional passenger.","r":"Slide p28"},{"t":"BELL","q":"How do you protect the eye in a patient with facial palsy and incomplete eye closure?","a":"• **Lubricant eye drops** (artificial tears) frequently by day\n• **Lubricating ointment** and **taping the lid shut** (or a moisture chamber) at night\n• **Sunglasses** / wrap-around glasses outdoors\n• Urgent **ophthalmology** review if eye pain, redness or blurred vision (exposure keratitis)\n• Persistent lagophthalmos: **gold or platinum upper-lid weight**, or tarsorrhaphy","m":"Drops by day, ointment and tape by night.","r":"Slide p28"},{"t":"BELL","q":"When, if ever, is surgical decompression offered for Bell's palsy?","a":"• Rarely – it is **controversial**; steroids are the mainstay\n• Considered only for **complete palsy** with **> 90% degeneration on ENoG within 14 days** of onset and **no voluntary motor units on EMG**\n• Approach: **middle cranial fossa** to decompress the **labyrinthine segment and meatal foramen** (hearing preserved)\n• Facial physiotherapy / retraining supports recovery\n• Note: slide lists decompression as a standard surgical option; correct is that it is exceptional and must be done early","m":"90% within 14 days via the middle fossa: 90-14-MCF.","r":"Slide p28"},{"t":"MRS","q":"What is Melkersson-Rosenthal syndrome and who does it affect?","a":"• Rare neuro-mucocutaneous disorder of **unknown** cause\n• **Classic triad**: recurrent/persistent **orofacial oedema**, recurrent **LMN facial palsy**, **fissured tongue** (lingua plicata)\n• Prevalence ~**0.08%**; **female : male 2 : 1**; usually **25-40 years**","m":"Swollen lip, slack face, furrowed tongue.","r":"Slides p29-30"},{"t":"MRS","q":"How often is the full Melkersson-Rosenthal triad seen, and what is cheilitis granulomatosa?","a":"• Only **8-25%** have the **complete triad**; most have 1-2 features\n• Features may appear together or **years apart**\n• The palsy is typically **recurrent** and may **alternate sides** – think MRS in recurrent palsy with lip swelling\n• **Cheilitis granulomatosa** (Miescher) = the **monosymptomatic** form: granulomatous lip swelling alone","m":"Recurrent palsy plus a puffy lip – ask to see the tongue.","r":"Slide p30"},{"t":"MRS","q":"How is Melkersson-Rosenthal syndrome diagnosed?","a":"• Essentially a **clinical** diagnosis\n• **Lip biopsy** supports it: **non-caseating granulomas** with lymphoedema\n• Exclude mimics with similar histology: **Crohn's disease** (orofacial granulomatosis), **sarcoidosis**, TB and other infections","m":"Granulomas in the lip: think Crohn's and sarcoid before calling it MRS.","r":"Slide p31"},{"t":"MRS","q":"How is Melkersson-Rosenthal syndrome managed?","a":"• No definitive cure; symptoms may **remit spontaneously** and **flare** again\n• Swelling: **intralesional or systemic corticosteroids**, antibiotics, antihistamines, NSAIDs, immunosuppressants (methotrexate), **TNF-α inhibitors**\n• Palsy episodes are treated like Bell's; **facial nerve decompression** is considered for frequent recurrences\n• **Multidisciplinary**: dermatology, gastroenterology, immunology, ophthalmology","m":"No cure – treat each flare and involve the team.","r":"Slide p31"},{"t":"RHS","q":"What is Ramsay Hunt syndrome and who is affected?","a":"• **Herpes zoster oticus**: reactivation of latent **varicella-zoster virus (VZV)**\n• **Herpetic vesicles** of the concha, EAC or pinna + **ipsilateral LMN facial palsy**\n• About 5 per 100,000; men and women equally\n• Anyone who has had chickenpox; mainly **adults over 60** and the immunocompromised","m":"Shingles of the ear: chickenpox's late revenge.","r":"Slide p32"},{"t":"RHS","q":"Explain the pathophysiology of Ramsay Hunt syndrome.","a":"• VZV lies latent in the **geniculate ganglion** after chickenpox\n• Reactivation (age, immunosuppression) → inflammation and oedema along the nerve\n• Sensory fibres → vesicles in the **concha / EAC / pinna**, sometimes **palate and anterior tongue**\n• Inflammation spreads more widely than in Bell's → **VIII** (sometimes IX, X) involvement\n• More axonal degeneration → **worse prognosis than Bell's**","m":"Same ganglion as Bell's, nastier virus.","r":"Lecturer pearl"},{"t":"RHS","q":"What is the classic clinical presentation of Ramsay Hunt syndrome?","a":"• Severe **otalgia** – often precedes the rash\n• **Vesicular rash** in the concha / EAC / pinna\n• **Ipsilateral LMN facial palsy**, often complete\n• The rash may appear **after** the palsy or never (**zoster sine herpete**) – re-examine the ear\n• Diagnosis is **clinical**","m":"Pain, Pox, Palsy.","r":"Slide p33"},{"t":"RHS","q":"Which other cranial nerves can be involved in Ramsay Hunt syndrome, and how do they present?","a":"• **VIII**: **tinnitus**, **SNHL**, **vertigo** (commonest association)\n• **IX**: **dysphagia**, reduced gag reflex\n• **X**: **hoarseness**, vocal cord palsy\n• Several nerves involved = polyneuritis cranialis, a worse prognosis","m":"Hunt spreads to the neighbours: 8 (ear), 9 (swallow), 10 (voice).","r":"Slide p34"},{"t":"RHS","q":"Which investigations are useful in Ramsay Hunt syndrome?","a":"• **VZV PCR** of vesicle fluid – confirms VZV in atypical cases\n• **Pure-tone audiometry** – documents VIII involvement (SNHL)\n• **Laryngoscopy** – if hoarse or dysphagic (X palsy)\n• ENoG for complete palsy; MRI only if atypical","m":"Swab, hear, scope.","r":"Slide p34"},{"t":"RHS","q":"How is Ramsay Hunt syndrome treated?","a":"• **Antiviral** started early (ideally < 72 h): **aciclovir 800 mg five times daily** for 7-10 days or **valaciclovir 1 g three times daily** for 7 days\n• **Plus oral prednisolone** (e.g. 1 mg/kg/day for 5 days, then taper)\n• **Analgesia** – paracetamol / NSAID; neuropathic agents for post-herpetic pain\n• **Eye care** – artificial tears, ointment, taping\n• Short-term vestibular sedatives for vertigo","m":"Unlike Bell's, the antiviral is compulsory here.","r":"Slide p34"},{"t":"RHS","q":"How does Ramsay Hunt syndrome compare with Bell's palsy, and how can it be prevented?","a":"• RHS is **more painful**, more often **complete**, and may involve **VIII**\n• Recovery is **poorer**: complete recovery in only ~**70-75%** even when treated within 72 h (far less if delayed), versus **85-90%** in Bell's\n• More synkinesis and residual weakness\n• Prevention: **recombinant zoster vaccine (Shingrix)** for adults 50 and over and the immunocompromised","m":"Hunt hurts more and heals less.","r":"Lecturer pearl"},{"t":"OM","q":"How common is facial palsy as a complication of acute otitis media?","a":"• A **rare intratemporal complication** of AOM, causing **ipsilateral LMN** facial weakness\n• Pre-antibiotic era: **0.5-0.7%** of AOM cases\n• Antibiotic era: about **0.005%**\n• Mostly **children**; usually recovers well with prompt treatment","m":"Antibiotics made it a hundred times rarer – rare, but you must recognise it.","r":"Slide p35"},{"t":"OM","q":"By what mechanisms does acute otitis media cause facial palsy?","a":"• **Facial canal dehiscence** (usually tympanic segment) → nerve directly exposed to middle-ear pus\n• **Intrafallopian oedema** → raised pressure in the canal → vascular compression → **neurapraxia**\n• Altered middle-ear environment: raised pressure + osteitis\n• **Retrograde spread** of infection along the chorda tympani","m":"A bare nerve in a pus-filled box.","r":"Slide p36"},{"t":"OM","q":"How does facial palsy with acute otitis media present, and how is it investigated?","a":"• Otalgia, fever, reduced hearing, ± otorrhoea; **bulging, inflamed TM**\n• **Ipsilateral LMN** palsy – grade with House-Brackmann\n• **Ear swab C&S** if otorrhoea (or fluid from myringotomy)\n• **HRCT temporal bone** – exclude **coalescent mastoiditis**, cholesteatoma, abscess","m":"Child + red bulging drum + new facial droop = complicated AOM.","r":"Slide p37"},{"t":"OM","q":"How is facial palsy complicating acute otitis media managed?","a":"• Admit: **IV broad-spectrum antibiotics** + **systemic corticosteroids**\n• **Myringotomy ± grommet** – drains the middle ear and provides a culture\n• **Cortical mastoidectomy** if mastoiditis or no improvement\n• **Eye protection** if incomplete closure; facial physiotherapy\n• Nerve decompression is rarely needed – most recover fully","m":"Drain the drum, drip the drugs.","r":"Slide p37"},{"t":"OM","q":"How does chronic otitis media cause facial palsy?","a":"• COM: chronic inflammation of the middle ear and mastoid with **TM perforation and otorrhoea > 3 months**\n• Palsy is usually due to **cholesteatoma** or **penetrating granulation tissue**\n• Erosion of the **Fallopian canal** → nerve exposure, compression, inflammatory oedema\n• Presents with persistent foul otorrhoea, hearing loss, otalgia + **gradual** ipsilateral LMN palsy","m":"Cholesteatoma is a slow bone-eater; the nerve is a late casualty.","r":"Slide p38"},{"t":"OM","q":"Which investigations are needed for facial palsy in chronic otitis media?","a":"• **Ear swab C&S**\n• **HRCT temporal bone** – extent of cholesteatoma, canal erosion, other complications (lateral SCC fistula, tegmen erosion)\n• **Pure-tone audiometry** – baseline hearing before surgery\n• MRI (diffusion-weighted) if intracranial complication or recurrent cholesteatoma is suspected","m":"Bug, bone, baseline hearing.","r":"Slide p39"},{"t":"OM","q":"What is the management of facial palsy in chronic otitis media with cholesteatoma?","a":"• A **surgical urgency** – not managed conservatively\n• **Urgent mastoidectomy with middle-ear exploration**: remove cholesteatoma from the nerve\n• **Facial nerve decompression** where the canal is involved\n• Do **not** strip granulations that penetrate the nerve sheath\n• **Delayed nerve grafting** if a segment is destroyed\n• Supportive: aural toilet, topical ± systemic antibiotics, eye care","m":"AOM palsy = drain; cholesteatoma palsy = operate.","r":"Slide p39"},{"t":"OM","q":"Contrast facial palsy due to acute otitis media with facial palsy due to cholesteatoma.","a":"• **AOM**: usually a **child**, **acute** onset, intact bulging drum, nerve **oedema through a dehiscence**\n• AOM treatment: antibiotics + steroids + **myringotomy**; prognosis **good**\n• **Cholesteatoma**: older child or adult, **gradual** onset, foul discharge, attic retraction or perforation, **bone erosion**\n• Cholesteatoma treatment: **urgent mastoid exploration**; prognosis more **guarded**","m":"Acute = inflammation (reversible); chronic = erosion (structural).","r":"Lecturer pearl"},{"t":"MOE","q":"What is malignant (necrotising) otitis externa and who gets it?","a":"• A **rare invasive infection** of the external ear canal that spreads to cause **skull base osteomyelitis**\n• 'Malignant' describes its relentless course and mortality – it is **not** a cancer\n• Organism: **Pseudomonas aeruginosa** (commonest)\n• At risk: **elderly diabetics**, the immunocompromised (HIV, chemotherapy, renal failure)","m":"Old + diabetic + painful ear that will not settle = MOE until proven otherwise.","r":"Slide p40"},{"t":"MOE","q":"How does infection spread in malignant otitis externa to reach the facial nerve?","a":"• Starts as otitis externa in the canal\n• Spreads through the **fissures of Santorini** (cartilaginous EAC) and the **foramen of Huschke** (bony EAC, if persistent)\n• Invades bone → **osteomyelitis of the temporal bone and skull base**\n• Reaches the facial nerve at the **stylomastoid foramen**","m":"Santorini's cracks let the bug out of the canal.","r":"Slide p40"},{"t":"MOE","q":"What are the symptoms and the classic examination sign of malignant otitis externa?","a":"• Severe **nocturnal otalgia**, pain out of proportion; pain on **chewing**\n• Otorrhoea **not responding to topical treatment**; ± hearing loss\n• Classic sign: **granulation tissue** on the **floor of the EAC at the bony-cartilaginous junction**\n• **Facial nerve palsy** ± other cranial nerve palsies","m":"Granulation on the floor of an old diabetic's canal = MOE.","r":"Slide p42"},{"t":"MOE","q":"Which cranial nerves are involved in malignant otitis externa, and in what order?","a":"• **VII** is the commonest, at the **stylomastoid foramen**\n• Then **IX, X, XI** at the **jugular foramen**, then **XII** (hypoglossal canal)\n• Spread to the petrous apex may involve **V and VI**\n• Any cranial nerve palsy = established **skull base osteomyelitis**","m":"7 first, then the jugular trio 9-10-11, then 12.","r":"Lecturer pearl"},{"t":"MOE","q":"What are the Cohen and Friedman (1987) diagnostic criteria for malignant otitis externa?","a":"• **Major (all required)**: pain, oedema, exudate/discharge, granulation tissue, microabscess (at surgery), **positive Tc-99m bone scan or failure of local treatment for ≥ 1 week**\n• **Minor**: Pseudomonas on culture, positive bone radiograph, diabetes, cranial nerve involvement, debilitating condition, old age\n• Note: slide lists **high ESR** as a criterion; it is **not** a Cohen criterion – ESR/CRP are used to **monitor** treatment","m":"Slide mnemonic for major, A-G: Abscess, Bone scan, exCruciating pain, Discharge, oEdema, Failed treatment, Granulation.","r":"Slide p42"},{"t":"MOE","q":"Which investigations are done for suspected malignant otitis externa?","a":"• Bloods: **FBC, ESR, CRP** (baseline and for monitoring), **glucose / HbA1c**\n• **Ear swab culture** and sensitivity – before antibiotics\n• **Biopsy of granulations** – to **exclude carcinoma** of the canal\n• **HRCT temporal bone** – bone erosion\n• **Bone scan** – early osteomyelitis","m":"Always biopsy the granulation: SCC can look exactly like MOE.","r":"Slide p43"},{"t":"MOE","q":"What does each imaging modality add in malignant otitis externa?","a":"• **HRCT**: bone erosion – but needs substantial demineralisation, so may be normal early\n• **MRI**: soft-tissue and marrow spread, intracranial extension\n• **Tc-99m bone scan**: sensitive for **diagnosis**, but stays positive for months (osteoblastic activity) – not useful for follow-up\n• **Gallium-67** scan: returns to normal as infection settles → **monitors resolution** and helps decide when to stop antibiotics","m":"Technetium tells you it is there; Gallium tells you it has gone.","r":"Lecturer pearl"},{"t":"MOE","q":"How is malignant otitis externa managed?","a":"• **Admit** for analgesia and monitoring\n• **Antipseudomonal antibiotics**: **ciprofloxacin** IV for ~2 weeks then oral for ~6 weeks (6-8 weeks in total), guided by culture\n• Resistant organisms: IV ceftazidime or piperacillin-tazobactam\n• **Strict diabetic control**\n• **Aural toilet** + topical antibiotic drops\n• Surgery only for biopsy, removal of sequestrum or drainage of abscess","m":"Cipro, sugar control, clean canal – for weeks, not days.","r":"Slide p43"},{"t":"TUM","q":"What is a facial nerve schwannoma and where does it usually arise?","a":"• A rare **benign** tumour of the **Schwann cells** of the nerve sheath\n• The **commonest intrinsic tumour** of the facial nerve; can occur anywhere along its course\n• Most are **intratemporal** – classically around the **geniculate ganglion**, often spanning several segments","m":"The Schwann cell is the nerve's insulation: the tumour grows from its own coat.","r":"Slide p44"},{"t":"TUM","q":"How does a facial nerve schwannoma present, and what clue separates it from Bell's palsy?","a":"• **Slowly progressive** facial weakness (weeks to months) or **recurrent ipsilateral** palsy\n• **Facial twitching / hemifacial spasm** from irritation of the nerve\n• **Hearing loss** (conductive if in the middle ear, sensorineural if in the IAM), tinnitus\n• Clue: Bell's is sudden and recovers; tumour palsy is **gradual and does not recover**","m":"Twitching before weakness = tumour until proven otherwise.","r":"Slide p45"},{"t":"TUM","q":"Which investigations are used for a suspected facial nerve schwannoma?","a":"• **House-Brackmann** grading – baseline function\n• **Gadolinium-enhanced MRI** – tumour size, extent and location (investigation of choice)\n• **HRCT temporal bone** – expansion or erosion of the Fallopian canal\n• **Audiometry** – hearing status (guides the approach)\n• **EMG** – degree of nerve damage","m":"MRI shows the tumour; CT shows the bone it has chewed.","r":"Slide p45"},{"t":"TUM","q":"How is a facial nerve schwannoma managed?","a":"• **Wait-and-scan** (serial MRI): small tumour with **good facial function** (HB I-II)\n• **Bony decompression or debulking** (shaving tumour off the nerve): preserves fibres in symptomatic patients with good function\n• **Total resection + nerve graft**: growing tumour, brainstem compression, or **severe pre-existing palsy**\n• **Stereotactic radiosurgery**: small symptomatic tumours, the elderly, poor surgical candidates","m":"A graft gives at best HB III – do not resect a nerve that is working better than that.","r":"Slide p46"},{"t":"TUM","q":"Which malignant tumours occur in the parotid gland?","a":"• **Epithelial**: **mucoepidermoid carcinoma** (commonest parotid malignancy), **adenoid cystic carcinoma** (cylindroma), **acinic cell carcinoma**, adenocarcinoma, squamous cell carcinoma, undifferentiated carcinoma\n• **Non-epithelial**: lymphoma, sarcoma\n• **Adenoid cystic** carcinoma is notorious for **perineural spread** along VII → palsy and skip lesions","m":"Mucoepidermoid is the most common; adenoid cystic creeps along nerves.","r":"Slide p47"},{"t":"TUM","q":"A patient has a parotid lump and an ipsilateral facial palsy. What does this suggest, and how do you assess it?","a":"• **Malignancy** until proven otherwise – benign parotid tumours almost never cause palsy\n• Other malignant clues: rapid growth, pain, fixity, skin involvement, **trismus**, neck nodes\n• Examine the **neck**, **oral cavity / oropharynx** (deep lobe extension) and **ear**\n• **FNAC** (± ultrasound-guided core biopsy)\n• **MRI** (extent, perineural spread) ± **CT** of head and neck","m":"Lump + palsy = cancer.","r":"Slides p47-48"},{"t":"TUM","q":"How is the facial nerve handled during surgery for parotid malignancy?","a":"• Treatment: **total parotidectomy** ± neck dissection → **postoperative radiotherapy** if indicated\n• The nerve is **preserved** if it can be freed from tumour; sacrificed only if **directly involved** or already paralysed\n• **Accidental** transection → **immediate microsurgical repair**\n• **Intentional resection** → **cable graft (great auricular nerve)** or **hypoglossal-facial anastomosis**\n• Skin / soft-tissue defects → flap reconstruction (cervicofacial, pectoralis major, trapezius)","m":"Cut by accident – repair it now; cut on purpose – graft it now.","r":"Slide p48"},{"t":"TUM","q":"What is Frey's syndrome?","a":"• **Gustatory sweating**: sweating and flushing of the preauricular skin while eating, after parotidectomy\n• Cause: **aberrant regeneration** of cut parasympathetic secretomotor fibres (**auriculotemporal nerve**) into the **sweat glands** of the skin flap\n• Diagnosis: **Minor's starch-iodine test**\n• Treatment: antiperspirant, **botulinum toxin**; prevention: thick skin flap, SMAS or fat interposition","m":"Salivary wiring plugged into sweat glands: you eat, your cheek sweats.","r":"Slide p48"},{"t":"TUM","q":"What are the key features of temporal bone carcinoma, and what does facial palsy mean for staging?","a":"• Aetiology: **long-standing chronic otitis media** / cholesteatoma, sun exposure, metastasis\n• Primary: **SCC** (commonest), BCC, adenocarcinoma, rhabdomyosarcoma; secondary: lung, breast, prostate, lymphoma\n• Red flags: **bloody otorrhoea**, severe pain, canal mass or granulation, **facial palsy**\n• Ix: **biopsy (HPE)**, HRCT, MRI\n• Modified Pittsburgh staging: **facial nerve paresis = T4**\n• Rx: lateral / subtotal / total temporal bone resection ± radiotherapy; palliation","m":"An old discharging ear that now bleeds, hurts and droops = carcinoma.","r":"Slides p49-50"},{"t":"TRA","q":"What are the causes and clinical signs of a temporal bone fracture?","a":"• Causes: **motor vehicle accidents** (commonest), falls, assault, severe blunt head trauma\n• **Battle's sign** – postauricular (mastoid) ecchymosis, appears after 1-2 days\n• **Haemotympanum**, bleeding from the ear, TM tear\n• **Hearing loss**, vertigo\n• **Facial nerve palsy**, **CSF otorrhoea**","m":"Bruise behind the ear, blood behind the drum, fluid from the ear.","r":"Slide p52"},{"t":"TRA","q":"What are the types of temporal bone fracture and their relative frequency?","a":"• **Longitudinal**: ~**70-90%** (commonest)\n• **Transverse**: ~**10-30%**\n• **Mixed / oblique**: a combination\n• Note: slide states transverse 80% and longitudinal 20% – this is **reversed**; longitudinal fractures are by far the commonest\n• Modern scheme: **otic capsule-sparing vs otic capsule-violating**","m":"Longitudinal: the most fractures, the fewest palsies.","r":"Slide p52"},{"t":"TRA","q":"Describe a longitudinal temporal bone fracture: mechanism and features.","a":"• Blow to the **temporal or parietal** region (from the side)\n• Runs parallel to the petrous axis through the **EAC roof, middle ear and tegmen**; usually spares the otic capsule\n• Injures **TM, ossicles, tegmen** → **TM perforation, bleeding from the ear, CSF otorrhoea**, haemotympanum\n• **Conductive hearing loss** (ossicular disruption, blood)\n• Facial palsy in ~**20%** – usually **delayed and temporary**","m":"Longitudinal = Lateral blow, Leaking drum, conductive Loss.","r":"Slides p53-54"},{"t":"TRA","q":"Describe a transverse temporal bone fracture: mechanism and features.","a":"• Blow to the **frontal or occipital** region (front-to-back)\n• Crosses the petrous pyramid through the **otic capsule / IAM** → labyrinth and VII injured\n• **Sensorineural hearing loss** (often total), **severe vertigo** with nystagmus, nausea and vomiting\n• TM usually **intact** with haemotympanum; CSF may drain down the Eustachian tube → **CSF rhinorrhoea**\n• Facial palsy in ~**50%** – **immediate, severe, often permanent**","m":"Transverse = Total deafness, Turning (vertigo), Tragic immediate palsy.","r":"Slides p53-54"},{"t":"TRA","q":"Why does the timing of facial palsy after a temporal bone fracture matter so much?","a":"• **Delayed onset** (hours to days) = nerve in continuity, with **oedema or haematoma** → excellent prognosis\n• **Immediate complete** palsy = likely **transection, bone spicule or crush** → poor prognosis without surgery\n• Ask whether the face was moving on arrival in ED (notes, GCS assessment, photos)\n• Commonest site of injury: the **perigeniculate / labyrinthine** region","m":"Late = swollen (wait); immediate = cut (explore).","r":"Slide p54"},{"t":"TRA","q":"What is the otic capsule-sparing vs otic capsule-violating classification, and why is it preferred?","a":"• Based on whether the fracture crosses the **otic capsule** (cochlea / labyrinth)\n• **Sparing** (most): conductive loss, fewer complications\n• **Violating**: much higher risk of **facial palsy** (~2-5×), **CSF leak** (~4-8×) and **SNHL**\n• Predicts complications better than longitudinal / transverse, because most fractures are oblique or mixed on CT","m":"Did it crack the shell of the inner ear? That predicts the damage.","r":"Lecturer pearl"},{"t":"TRA","q":"How do you manage facial palsy after a temporal bone fracture?","a":"• **Incomplete or delayed** palsy: **steroids**, eye care, observation – good recovery\n• **Immediate complete** palsy: **HRCT temporal bone** (fracture line, spicule) + **ENoG** from day 3\n• **> 90% degeneration within 14 days** (or a transected nerve) → **surgical exploration / decompression**\n• Approach by segment and hearing: **transmastoid** ± **middle cranial fossa** if hearing is present; **translabyrinthine** if the ear is dead\n• Transected nerve → end-to-end repair or cable graft","m":"Immediate + complete + > 90% = explore.","r":"Lecturer pearl"},{"t":"INV","q":"Why can electrical tests not distinguish neurapraxia from nerve transection in the first 3 days?","a":"• After an axon is cut, the distal segment still conducts until **Wallerian degeneration** occurs\n• This takes **48-72 hours**\n• So stimulation distal to the lesion (at the stylomastoid foramen) gives a **normal response** in the first 3 days, whatever the injury\n• Hence ENoG / NET are done **from day 3**, and repeated to track degeneration","m":"A cut wire's tail stays live for 3 days.","r":"Slide p55"},{"t":"INV","q":"Describe the minimal nerve excitability test (NET) and its cut-off.","a":"• An older test to separate **conduction block** from **degeneration**\n• Electrode over the **stylomastoid foramen** or a peripheral branch; current increased until a **just-visible twitch** – normal side first, then the paralysed side\n• Conduction block: **no difference** between sides\n• Degeneration: threshold rises; a **difference > 3.5 mA = degeneration**\n• Limitations: subjective, and blind to degeneration for the first 48-72 h","m":"3.5 mA: three and a half and it is going bad.","r":"Slide p55"},{"t":"INV","q":"How does the maximal stimulation test (MST) differ from the nerve excitability test?","a":"• Uses the current giving **maximal facial movement** rather than the threshold current\n• Response compared with the normal side: **equal, decreased or absent**\n• **Reduced or absent** response = degeneration → predicts **incomplete recovery**\n• Like the NET it is subjective and meaningful only after 72 h","m":"NET asks when it twitches; MST asks how hard it can move.","r":"Slide p56"},{"t":"INV","q":"What is electroneurography (ENoG), and when is it performed?","a":"• Objective test: **supramaximal bipolar stimulation** at the stylomastoid foramen; **compound muscle action potentials** recorded from facial muscles\n• Paralysed-side amplitude compared with the normal side → **percentage of degenerated fibres**\n• Used in **complete** palsy; most useful from **day 3-4 to day 21**\n• After ~3 weeks, desynchronised regenerating fibres make it unreliable → use EMG","m":"ENoG = % dead fibres; window day 3 to 21.","r":"Slide p58"},{"t":"INV","q":"How do you interpret ENoG results in Bell's palsy or trauma?","a":"• **< 90% degeneration** within the first 14 days → **good prognosis** – continue medical treatment\n• **> 90% degeneration within 14 days** → **poor prognosis** – consider **surgical decompression** (if EMG shows no voluntary motor units)\n• Rapid progression to > 90% is more ominous than slow progression","m":"Ninety in fourteen: the decompression trigger.","r":"Slide p58"},{"t":"INV","q":"What does EMG show in facial palsy, and when is it most useful?","a":"• Needle electrodes in facial muscles record spontaneous and voluntary activity\n• **Fibrillation potentials** = denervation – appear only **10-21 days** after injury\n• **Polyphasic potentials** = **reinnervation**\n• Early **voluntary motor-unit potentials** = some intact fibres = good prognosis, even if ENoG is poor\n• Most useful **from ~2-3 weeks onwards** and for planning reanimation (nerve substitution vs muscle transfer)\n• Note: slide says EMG is most helpful **within** 2-3 weeks; correct is **after** 2-3 weeks – ENoG is the test of choice from day 3 to 21","m":"Fibrillation = the muscle crying for its lost nerve; polyphasic = the nerve coming home.","r":"Slide p57"},{"t":"INV","q":"Describe Schirmer's test and its interpretation in facial palsy.","a":"• Tests the **greater superficial petrosal nerve** (lacrimal secretomotor supply)\n• A 5 mm filter-paper strip in the **lower conjunctival sac** of both eyes for **5 minutes**; compare the wetted lengths\n• Abnormal: **≥ 25% reduction** vs the normal side, or a combined wetting of **< 25 mm**\n• Abnormal result → lesion **at or proximal to the geniculate ganglion**","m":"Schirmer = tears = geniculate.","r":"Slide p60"},{"t":"INV","q":"How is the stapedial reflex used to localise a facial nerve lesion?","a":"• Tests the **nerve to stapedius** (efferent limb of the acoustic reflex)\n• A **loud sound** is delivered via impedance audiometry; stapedius contraction stiffens the ossicular chain → change in compliance\n• **Absent or > 50% reduced** reflex → lesion **proximal to the nerve to stapedius**\n• Patients may report **hyperacusis**; return of the reflex is an early sign of recovery","m":"No reflex, no damper: the lesion is above the stapedius branch.","r":"Slide p61"},{"t":"INV","q":"How are the chorda tympani tests (taste testing and submandibular salivary flow) performed and interpreted?","a":"• **Electrogustometry / taste testing**: weak electric current or sweet, sour, salty, bitter solutions on the **anterior ⅔ of each side** of the tongue; compare thresholds\n• **Submandibular salivary flow**: cannulate both **Wharton's ducts**, stimulate with **6% citric acid**, compare flow over 5 minutes\n• Abnormal: reduced taste, or **≥ 25% reduction** in flow\n• Either → lesion **proximal to the chorda tympani**","m":"Chorda = taste + spit: both tests probe the same branch.","r":"Slides p62-63"},{"t":"SURG","q":"What is facial nerve decompression, and what is assessed before surgery?","a":"• Surgical opening of the **bony Fallopian canal** (± nerve sheath) to relieve pressure on the nerve\n• Pre-op: **ENoG** (% degeneration), **EMG** (absent voluntary motor units), **HRCT** (fracture, middle-ear disease), **MRI** (tumour), **audiometry** (hearing decides the approach)\n• Risks: **hearing loss**, vertigo, tinnitus, **CSF leak**, infection, bleeding, further nerve injury\n• Done with micro-drills, the operating microscope and **intra-operative nerve monitoring**","m":"Unroof the tunnel before the swollen nerve dies.","r":"Slides p64-65"},{"t":"SURG","q":"Compare the three surgical approaches to the intratemporal facial nerve.","a":"• **Transmastoid**: **tympanic and mastoid** segments; hearing preserved – trauma or disease clearly distal to the geniculate\n• **Middle cranial fossa**: **labyrinthine segment, geniculate ganglion, IAM**; hearing preserved – Bell's decompression; combined with transmastoid in trauma\n• **Translabyrinthine**: the **entire intratemporal course**, but destroys the inner ear – only when hearing is **already lost**","m":"Hearing alive and lesion high → middle fossa; lesion low → mastoid; ear dead → through the labyrinth.","r":"Slide p66"},{"t":"SURG","q":"What are the requirements for an end-to-end facial nerve anastomosis?","a":"• Direct microsurgical **neurorrhaphy** of the proximal and distal stumps\n• For a **small gap** that can be closed **without tension**\n• Especially suited to the **extratemporal** nerve (facial lacerations, parotid surgery)\n• **Early repair (< 72 h)** preferred – the distal stump can still be **electrically stimulated** to identify branches before Wallerian degeneration\n• Gives the best results of all repair methods","m":"Tension-free and within 3 days – before the distal stump goes quiet.","r":"Slide p67"},{"t":"SURG","q":"When is a cable nerve graft used, and which donor nerves are taken?","a":"• When the gap is too large for tension-free end-to-end repair – a graft is preferred to extensive rerouting\n• **Great auricular nerve**: in the same operative field (neck / parotid), ~**7-10 cm**\n• **Sural nerve**: for **longer grafts** (up to ~30-40 cm, e.g. cross-facial grafts)\n• Expected best outcome ~**HB III**, with recovery over 6-12 months","m":"Short gap → great auricular next door; long gap → sural from the leg.","r":"Lecturer pearl"},{"t":"SURG","q":"What is a hypoglossal-facial anastomosis, and what are its pros and cons?","a":"• The hypoglossal nerve is joined to the distal facial nerve to reinnervate the face\n• Indication: **proximal facial stump unavailable** (e.g. after CPA tumour surgery) but **distal nerve and facial muscles intact and viable**\n• Pros: restores **tone**, some movement, better **eye protection**\n• Cons: **ipsilateral tongue atrophy / weakness**, **mass movement / hypertonia**, synkinesis\n• Long-standing palsy with muscle atrophy: **temporalis or free gracilis transfer**, static slings, **gold weight**","m":"Borrow the tongue's nerve to wake the face – the tongue pays.","r":"Slide p69"},{"t":"SURG","q":"How do you prevent and manage facial nerve injury during ear or mastoid surgery?","a":"• At-risk procedures: **mastoidectomy**, tympanoplasty, stapedectomy\n• Prevention: know the anatomy, **magnification**, drill **along, never across** the nerve, avoid thermal injury, gentle handling, **do not remove granulations that penetrate the nerve**\n• **Immediate** post-op palsy: wait a few hours for **local anaesthetic** to wear off and **loosen the packing**; if still complete → **re-explore** (decompress, re-anastomose or cable graft)\n• **Delayed-onset** palsy: oedema → **steroids**, conservative","m":"Immediate = injured (explore); delayed = swollen (steroids) – the same rule as trauma.","r":"Slide p71"},{"t":"SURG","q":"Which facial nerve branch is most often weak after parotid surgery, and what are the rates of palsy?","a":"• **Marginal mandibular branch** – superficial, few cross-connections, vulnerable in lower-pole surgery\n• Causes: stretching / retraction, thermal or mechanical irritation, post-op swelling, tumour position, malignant involvement\n• **Temporary** palsy **10-40%** (mild: 3 weeks-3 months; moderate: 3-6 months, sometimes up to 12)\n• **Permanent** palsy **1-7%**\n• Protection: **intra-operative nerve monitoring**, microsurgical dissection, landmark identification, gentle tissue handling","m":"The marginal branch lives on the margin: thin, alone and low.","r":"Slide p72"},{"t":"SURG","q":"How should a neonatal facial palsy after forceps delivery be managed?","a":"• Cause: forceps blade pressure over the **stylomastoid foramen** – the **mastoid is undeveloped** at birth, so the nerve is superficial → haemorrhage and oedema\n• Signs: facial **asymmetry on crying**, the affected **eye stays open**, **absent rooting reflex** on that side\n• Management: **observation** – about **90% recover spontaneously**; **lubricating eye ointment / drops** and lid taping\n• Note: slide lists **neuroplasty** and antiseptic ointment; correct is observation with eye lubrication – surgery is rarely needed\n• Distinguish **developmental** palsy (e.g. **Möbius**: bilateral VI + VII), which does **not** recover","m":"Forceps palsy: bruised, not broken – watch and protect the eye.","r":"Slide p73"}],"mcq":[{"t":"ANAT","stem":"A 34-year-old woman attends the ENT clinic 2 days after waking with complete left-sided facial weakness involving the forehead. Otoscopy is normal and there are no vesicles. You explain that swelling of the nerve inside its bony canal is thought to compress it at one particular point.\nAt which part of the facial nerve is this compression most likely to occur?","o":["Meatal segment within the internal acoustic meatus","Tympanic segment just above the oval window","Labyrinthine segment at the meatal foramen","Mastoid segment just above the stylomastoid foramen","Extratemporal trunk entering the parotid gland"],"a":2,"e":"The **labyrinthine segment** (about 4 mm) is the narrowest part of the Fallopian canal, with the meatal foramen only about 0.68 mm wide, and it lacks a good anastomotic arterial arcade. Oedema from viral (HSV-1) inflammation therefore compresses the nerve and its microcirculation here first. This is why decompression for severe Bell's palsy targets the labyrinthine segment via the **middle cranial fossa**, not the mastoid.","w":["Wrong - the meatal segment lies in the wide internal acoustic meatus, where there is room to swell.","Wrong - the tympanic segment is the commonest site of bony dehiscence, not of entrapment by oedema.","Correct - the labyrinthine segment and meatal foramen form the narrowest, least well-perfused part of the canal.","Wrong - the mastoid segment is wider; it is the segment reached by transmastoid surgery for trauma or otitis.","Wrong - the extratemporal trunk is not enclosed in bone, so oedema cannot compress it there."],"r":"Slides p8, p25"},{"t":"ANAT","stem":"A 45-year-old man has a canal wall-down mastoidectomy for cholesteatoma at a state hospital. The operation note records that disease was drilled off the medial wall of the middle ear, just above the oval window and below the lateral semicircular canal. He wakes with a complete right lower motor neurone facial palsy that persists after the local anaesthetic has worn off.\nWhich segment of the facial nerve is most likely to have been injured?","o":["Tympanic (horizontal) segment","Labyrinthine segment","Mastoid (vertical) segment","Meatal (internal auditory canal) segment","Geniculate ganglion at the first genu"],"a":0,"e":"The **tympanic segment** (about 11 mm) runs from the geniculate ganglion to the pyramid, **above the oval window and below the lateral semicircular canal**. It is the commonest site of natural dehiscence of the Fallopian canal, so it is the segment most often injured in middle-ear and mastoid surgery and most exposed in acute otitis media. The lateral canal and oval window are the surgeon's landmarks for finding it.","w":["Correct - the tympanic segment lies exactly between the oval window and the lateral semicircular canal.","Wrong - the labyrinthine segment lies medially, between the fundus of the meatus and the geniculate ganglion, away from the middle ear.","Wrong - the mastoid segment descends from the pyramid to the stylomastoid foramen, below the area described.","Wrong - the meatal segment lies inside the internal acoustic meatus and is not reached in mastoid surgery.","Wrong - the geniculate ganglion is at the first genu, anterior to and above the area described."],"r":"Slide p8"},{"t":"ANAT","stem":"A 52-year-old woman is reviewed 6 weeks after middle cranial fossa surgery. Facial movement is normal and taste is intact, but her right eye feels dry. Schirmer test shows 6 mm of wetting on the right and 22 mm on the left after 5 minutes.\nInjury to which branch best explains these findings?","o":["Chorda tympani nerve","Nerve to stapedius","Posterior auricular nerve","Zygomatic branch of the facial nerve","Greater superficial petrosal nerve"],"a":4,"e":"The **greater superficial petrosal nerve** leaves the geniculate ganglion carrying secretomotor fibres to the lacrimal gland via the pterygopalatine ganglion, and runs on the floor of the middle cranial fossa, where it can be stretched. An isolated low Schirmer with normal movement and taste points to the GSPN alone; the zygomatic branch is motor and would cause incomplete closure, not reduced tear production. Note: slide p7 says the lacrimatory nucleus supplies the 'lacrimal and salivary' glands; correctly it supplies the lacrimal, nasal and palatal glands, and the superior salivatory nucleus supplies the submandibular and sublingual glands.","w":["Wrong - chorda tympani injury reduces taste and submandibular flow, and her taste is normal.","Wrong - the nerve to stapedius causes hyperacusis and an absent stapedial reflex, not a dry eye.","Wrong - the posterior auricular nerve supplies the auricular muscles and occipitalis only.","Wrong - the zygomatic branch is motor to orbicularis oculi; her movement is normal and tear volume would not fall.","Correct - the GSPN arises at the geniculate ganglion and carries secretomotor fibres to the lacrimal gland."],"r":"Slides p7, p12, p60"},{"t":"ANAT","stem":"A 38-year-old woman has a stapedotomy for otosclerosis. At follow-up she complains of a metallic taste and reduced taste on the right front of the tongue. Facial movement, tear production and taste over the circumvallate papillae are normal.\nThe injured taste fibres terminate centrally in which nucleus?","o":["Superior salivatory nucleus","Nucleus of the tractus solitarius","Spinal nucleus of the trigeminal nerve","Motor nucleus of the facial nerve","Inferior salivatory nucleus"],"a":1,"e":"Taste from the anterior two-thirds of the tongue is **special visceral afferent**, carried in the **chorda tympani** (which crosses the middle ear and is easily stretched in stapes surgery) to the geniculate ganglion and on to the **nucleus of the tractus solitarius**. The circumvallate papillae are supplied by IX, so taste there is preserved. The superior salivatory nucleus sends efferent secretomotor fibres along the same chorda tympani, which is the usual point of confusion.","w":["Wrong - the superior salivatory nucleus is efferent (GVE) to the submandibular and sublingual glands, not the taste relay.","Correct - SVA taste fibres of VII end in the nucleus of the tractus solitarius.","Wrong - the spinal trigeminal nucleus receives general sensation from the concha and ear canal carried by VII.","Wrong - the motor nucleus (SVE) in the lower pons supplies the muscles of facial expression, which are normal.","Wrong - the inferior salivatory nucleus belongs to IX and supplies the parotid gland."],"r":"Slides p7, p12"},{"t":"ANAT","stem":"A 63-year-old hypertensive man presents to the ED with sudden double vision. He cannot look to the right with either eye, and has complete right facial weakness including the forehead. MRI shows a small haemorrhage in the dorsal pons at the floor of the fourth ventricle.\nWhich anatomical relationship best explains this combination?","o":["VII and VIII run together in the internal acoustic meatus","Nervus intermedius joins the motor root at the geniculate ganglion","VI and VII both exit the brainstem at the pontomedullary junction","Facial motor fibres loop dorsally around the abducens nucleus","Upper facial motor neurones receive bilateral cortical input"],"a":3,"e":"In the pons, facial motor fibres run dorsally and **loop around the abducens nucleus**, raising the **facial colliculus** in the floor of the fourth ventricle. A lesion here gives a lower motor neurone facial palsy (forehead involved) plus an ipsilateral **horizontal gaze palsy**, because the abducens nucleus drives both eyes for lateral gaze. A lesion of the VI nerve fascicle alone would cause only failure of abduction of one eye.","w":["Wrong - the shared meatus explains VII plus VIII (hearing, balance) loss in CPA lesions, not a gaze palsy.","Wrong - the nervus intermedius joins the motor root at the brainstem and CPA, and has no link with eye movement.","Wrong - a ventral exit-zone lesion would give a VI nerve palsy with VII, not a dorsal pontine conjugate gaze palsy.","Correct - the facial colliculus is formed by VII fibres looping round the abducens nucleus, so both are hit together.","Wrong - bilateral cortical input explains forehead sparing in UMN lesions; here the forehead is involved."],"r":"Slide p6"},{"t":"LOC","stem":"A 68-year-old man is brought to the ED 2 hours after the sudden onset of drooping of the left side of his mouth and clumsiness of the left hand. He can wrinkle his forehead and close both eyes tightly and symmetrically. Taste and hearing are normal.\nWhere is the lesion most likely to be?","o":["Right internal capsule (corticobulbar fibres)","Left facial motor nucleus in the caudal pons","Left cerebellopontine angle near the meatus","Left geniculate ganglion in the temporal bone","Left stylomastoid foramen below the ear"],"a":0,"e":"Weakness of the lower face with a spared forehead and normal eye closure is an **upper motor neurone** pattern. The part of the facial motor nucleus supplying the upper face receives corticobulbar fibres from **both** hemispheres, so a unilateral cortical or capsular lesion weakens only the **contralateral lower face**. Hand weakness on the same side as the facial droop confirms a right hemispheric stroke: activate the stroke pathway rather than treating as Bell's palsy.","w":["Correct - a contralateral corticobulbar lesion weakens the lower face only, with ipsilateral arm signs.","Wrong - a nuclear (LMN) lesion paralyses the whole half of the face, including the forehead.","Wrong - a CPA lesion causes an LMN palsy with forehead involvement and usually hearing loss.","Wrong - a geniculate lesion causes a full LMN palsy plus reduced lacrimation and taste.","Wrong - a stylomastoid lesion paralyses all facial muscles on that side, forehead included."],"r":"Lecturer pearl"},{"t":"LOC","stem":"A 30-year-old man is seen in the ENT clinic 5 days after onset of right-sided facial weakness involving the forehead. He finds loud sounds uncomfortable in the right ear. Schirmer test shows 20 mm on the right and 22 mm on the left. The right stapedial reflex is absent and electrogustometry shows a raised threshold on the right anterior tongue.\nWhere is the lesion most likely to be?","o":["Meatal segment in the internal acoustic meatus","Mastoid segment below the chorda tympani origin","Mastoid segment between stapedius and chorda branches","Tympanic segment distal to the geniculate ganglion","Labyrinthine segment proximal to the geniculate"],"a":3,"e":"Work down the branches: normal tears mean the GSPN (at the geniculate ganglion) is spared, while hyperacusis and an absent stapedial reflex place the lesion **above the nerve to stapedius**, and reduced taste agrees. The lesion therefore lies between the geniculate ganglion and the nerve to stapedius, i.e. the **tympanic segment**. The tear difference here (20 vs 22 mm) is well under the 25% threshold, so Schirmer is normal.","w":["Wrong - a meatal lesion is proximal to the geniculate ganglion, so lacrimation would be reduced (and VIII often affected).","Wrong - below the chorda tympani only motor loss occurs; taste and the stapedial reflex would be normal.","Wrong - between these branches taste is lost but the stapedial reflex is preserved.","Correct - geniculate ganglion spared (normal tears) but the nerve to stapedius and chorda fibres are affected.","Wrong - a labyrinthine lesion is above the GSPN, so the Schirmer test would be reduced."],"r":"Slides p16-17, p60-62"},{"t":"LOC","stem":"A 55-year-old woman is referred from a Klinik Kesihatan with 2 years of progressive left-sided hearing loss and tinnitus, and 3 months of slowly increasing left facial weakness. Pure-tone audiometry shows a left sensorineural loss. The left Schirmer test is reduced by 60% and the left stapedial reflex is absent.\nWhere is the lesion most likely to be?","o":["Geniculate ganglion","Labyrinthine segment","Tympanic segment","Facial motor nucleus in the pons","Cerebellopontine angle"],"a":4,"e":"Reduced lacrimation places the lesion at or above the geniculate ganglion, and sensorineural hearing loss with tinnitus shows that VIII is involved too; proximal to the geniculate ganglion, VII and VIII lie together only in the **internal acoustic meatus / cerebellopontine angle**. Hearing loss preceding slow facial weakness is the typical pattern of a CPA mass such as a vestibular schwannoma, which needs **gadolinium MRI**. A nuclear lesion in the pons would not reduce tear production, because lacrimal fibres arise from a separate nucleus.","w":["Wrong - a geniculate lesion reduces tears but does not explain sensorineural loss and tinnitus.","Wrong - an isolated labyrinthine segment lesion would not usually cause progressive SNHL preceding the palsy.","Wrong - a tympanic segment lesion spares the GSPN, so Schirmer would be normal.","Wrong - a pontine nuclear lesion spares lacrimation and taste and usually gives other brainstem signs.","Correct - lacrimal, stapedial and VIII involvement together localise to the CPA (category E)."],"r":"Slides p17-18"},{"t":"LOC","stem":"A 42-year-old woman is reviewed in the ENT clinic 10 days after onset of a right lower motor neurone facial palsy. At rest the face looks symmetrical. On effort there is no forehead movement, the right eye does not close completely even with maximum effort, and the mouth moves but is clearly asymmetrical.\nWhat is her House-Brackmann grade?","o":["Grade II","Grade III","Grade IV","Grade V","Grade VI"],"a":2,"e":"The hinge between House-Brackmann **III and IV is eye closure**: grade III still achieves complete closure with effort and keeps some forehead movement, whereas grade IV has **incomplete eye closure** and no forehead movement, with normal symmetry at rest. Grade V has only barely perceptible movement and asymmetry at rest; grade VI is total paralysis. Incomplete closure also means she needs active eye protection.","w":["Wrong - grade II is slight weakness with complete eye closure on minimal effort.","Wrong - grade III keeps complete eye closure with effort and some forehead movement.","Correct - incomplete eye closure, no forehead movement and asymmetric mouth with symmetry at rest is grade IV.","Wrong - grade V has only barely perceptible movement and asymmetry at rest.","Wrong - grade VI is total paralysis with no movement at all."],"r":"Lecturer pearl"},{"t":"LOC","stem":"A 70-year-old man has a complete left lower motor neurone facial palsy. When asked to close his eyes, the left lid stays open and the left eyeball does not roll upwards, so the cornea remains in view.\nWhat is the main clinical significance of this finding?","o":["The lesion is upper motor neurone and will spare the forehead","The cornea stays exposed, giving a high risk of keratitis","The lesion must lie proximal to the geniculate ganglion","More than 90% of facial nerve fibres have already degenerated","Lacrimal secretion has failed, so the Schirmer test will be low"],"a":1,"e":"**Bell's phenomenon** is the normal upward and outward roll of the eye on attempted closure (oculomotor nerve to superior rectus); in an LMN palsy it becomes visible because the lid fails to close. When it is **absent**, the cornea is not tucked under the upper lid, so **exposure keratitis** is much more likely and eye protection must be aggressive (lubricants, night ointment and taping, early ophthalmology review). It neither localises the lesion nor measures degeneration.","w":["Wrong - Bell's phenomenon is seen with LMN palsy; its absence does not make the lesion UMN.","Correct - without the protective upward roll the cornea stays exposed, so keratitis risk is high.","Wrong - lesion level is judged with Schirmer, stapedial reflex and taste tests, not Bell's phenomenon.","Wrong - degeneration is quantified by ENoG, not by eye movement on closure.","Wrong - Bell's phenomenon depends on the oculomotor nerve and says nothing about tear secretion."],"r":"Slides p15, p27"},{"t":"LOC","stem":"A 32-year-old woman presents to the ENT clinic with weakness of both sides of her face developing over 10 days. She has had a low-grade fever for a month and painful red eyes. Both parotid glands are diffusely swollen and non-tender. Chest X-ray shows bilateral hilar lymphadenopathy.\nWhat is the most likely diagnosis?","o":["Guillain-Barré syndrome","Bilateral Bell's palsy","Mumps parotitis","Heerfordt syndrome","Lyme neuroborreliosis"],"a":3,"e":"**Bilateral** facial palsy is never simply Bell's palsy until systemic causes are excluded. Uveitis, parotid enlargement, fever and facial palsy form **Heerfordt syndrome (uveoparotid fever)**, a form of sarcoidosis, and bilateral hilar lymphadenopathy supports it. Check serum ACE and calcium and consider biopsy for non-caseating granulomas; other bilateral causes to remember are Guillain-Barré syndrome, Lyme disease, leukaemia and Möbius syndrome.","w":["Wrong - GBS causes bilateral palsy but with ascending weakness and areflexia, not uveitis or parotid swelling.","Wrong - Bell's palsy is rarely bilateral and does not explain fever, uveitis, parotid swelling or hilar nodes.","Wrong - mumps causes tender parotitis but facial palsy and uveitis with hilar nodes are not features.","Correct - uveitis, parotid swelling, fever and facial palsy with hilar nodes is sarcoid uveoparotid fever.","Wrong - Lyme disease can cause bilateral palsy but needs tick exposure and is not linked with parotid enlargement or hilar nodes."],"r":"Lecturer pearl"},{"t":"LOC","stem":"A 41-year-old man has a complete right lower motor neurone facial palsy. MRI shows a small facial nerve schwannoma confined to the mastoid segment, below the origin of the nerve to stapedius and above the origin of the chorda tympani.\nWhich additional finding would you expect?","o":["Reduced right Schirmer test","Absent right stapedial reflex","Hyperacusis in the right ear","Sensorineural hearing loss on the right","Reduced right submandibular flow"],"a":4,"e":"Topodiagnosis is **cumulative from below upwards**. A lesion between the nerve to stapedius and the chorda tympani spares the GSPN (tears normal) and the stapedius (reflex present, no hyperacusis) but interrupts the **chorda tympani**, so taste on the anterior two-thirds and **submandibular salivary flow** fall. Sensorineural loss would need the inner ear or VIII to be involved.","w":["Wrong - the GSPN leaves at the geniculate ganglion, well above this lesion, so tears are normal.","Wrong - the nerve to stapedius arises above the lesion, so the reflex is preserved.","Wrong - hyperacusis needs stapedius paralysis, which requires a lesion above the nerve to stapedius.","Wrong - the cochlea and VIII are not involved by a mastoid segment lesion.","Correct - the chorda tympani arises below the lesion, so its secretomotor and taste fibres are lost."],"r":"Slides p16, p62-63"},{"t":"LOC","stem":"A 72-year-old woman is reviewed on the stroke ward. When asked to show her teeth, the right corner of her mouth barely moves, but when her grandson tells a joke she smiles symmetrically. Forehead wrinkling and eye closure are normal on both sides.\nWhich pathway is most likely to be damaged?","o":["Left corticobulbar fibres to the facial nucleus","Right facial nerve within the temporal bone","Extrapyramidal emotional pathway via the left thalamus","Right facial motor nucleus in the pons","Right marginal mandibular branch of the facial nerve"],"a":0,"e":"Voluntary facial movement is carried from the motor cortex in **corticobulbar fibres**, whereas emotional (mimetic) smiling is driven by separate extrapyramidal and limbic pathways. A cortical or capsular stroke therefore weakens **voluntary** lower-face movement but spares spontaneous smiling and the forehead (bilateral supply), a classic UMN pattern. The reverse dissociation, a weak emotional smile with normal voluntary movement, points to a thalamic or extrapyramidal lesion.","w":["Correct - a contralateral corticobulbar lesion weakens voluntary lower-face movement and spares emotional smiling.","Wrong - an intratemporal LMN lesion would affect forehead, eye closure and emotional smiling too.","Wrong - an emotional pathway lesion causes the opposite dissociation, a weak spontaneous smile.","Wrong - a nuclear lesion is LMN and paralyses all movements of that side, including the forehead.","Wrong - a marginal mandibular lesion weakens the lower lip for both voluntary and emotional movement."],"r":"Lecturer pearl"},{"t":"BELL","stem":"A 35-year-old teacher attends a Klinik Kesihatan 24 hours after waking with complete right-sided facial weakness involving the forehead. She had a mild right postauricular ache the day before. Otoscopy, parotid and neck examination are normal, there are no vesicles and other cranial nerves are intact. Her capillary glucose is normal.\nWhat is the most appropriate management?","o":["Oral aciclovir for 7 days with eye lubricants","Prednisolone 50 mg daily for 10 days plus eye care","Urgent MRI brain before any treatment is started","Eye care alone and review if not improving in 3 weeks","Referral for urgent surgical decompression of the nerve"],"a":1,"e":"This is a typical idiopathic acute LMN palsy with no red flags, seen within 72 hours. **Oral prednisolone started within 72 hours** (e.g. 50 mg daily for 10 days, or 60 mg for 5 days then taper) increases full recovery and is the mainstay, with eye care to protect the cornea. Antiviral monotherapy is not recommended and routine imaging is not needed when the picture is typical. Note: slide p28 lists surgical decompression as a treatment; it is controversial and reserved for complete palsy with more than 90% degeneration on ENoG within 14 days.","w":["Wrong - antiviral therapy alone is not recommended; it gives no proven benefit without a steroid.","Correct - prednisolone within 72 hours plus eye care is the evidence-based first-line treatment.","Wrong - imaging is for red flags or atypical features; delaying steroids loses the 72-hour window.","Wrong - withholding steroids from an eligible patient reduces her chance of full recovery.","Wrong - decompression is controversial and only considered after ENoG shows more than 90% degeneration."],"r":"Slide p28"},{"t":"BELL","stem":"A 48-year-old man presents to the ED 36 hours after the onset of a left lower motor neurone facial palsy, House-Brackmann V. Examination finds no other abnormality. The medical officer drafts a management plan.\nWhich part of the plan should be avoided?","o":["Prednisolone started at this ED visit","Adding valaciclovir to prednisolone because the palsy is severe","Lubricant drops by day with ointment and lid taping at night","Valaciclovir alone, withholding steroids to avoid side effects","Referral if there is no recovery at all by 3 months"],"a":3,"e":"Steroids are the evidence-based core of treatment and **antiviral therapy alone** has not been shown to help, so replacing the steroid with an antiviral is the error. Guidelines (AAO-HNS 2013) allow an antiviral to be **added** to prednisolone in severe palsy (HB V-VI), for a small possible benefit. Eye protection, and re-evaluation for another diagnosis if there is no recovery by 3-4 months, are both recommended.","w":["Wrong - starting prednisolone within 72 hours is the recommended core of treatment.","Wrong - adding an antiviral to a steroid is an accepted option in severe palsy.","Wrong - this is the standard eye-protection regimen for incomplete closure.","Correct - antiviral monotherapy is not recommended and withholding steroids lowers recovery rates.","Wrong - failure to recover by 3-4 months is a red flag that warrants referral and imaging."],"r":"Lecturer pearl"},{"t":"BELL","stem":"A 50-year-old woman was diagnosed with Bell's palsy 6 weeks ago and given prednisolone. She now says her left face had been twitching for months before any weakness, and the weakness has steadily worsened over 5 weeks rather than starting suddenly. There is no recovery.\nWhat is the most appropriate next step?","o":["A second course of oral prednisolone","Electroneurography to quantify degeneration","Gadolinium-enhanced MRI along the facial nerve","Facial physiotherapy and review in 3 months","Adding oral valaciclovir for a further 7 days"],"a":2,"e":"Bell's palsy starts suddenly, peaks within about 72 hours and usually begins to recover within 3 weeks. **Gradual progression beyond 3 weeks, twitching before weakness**, no recovery by 3-4 months or a recurrent ipsilateral palsy are red flags for a **tumour** (facial schwannoma, parotid malignancy) until proven otherwise. Gadolinium MRI from the brainstem to the parotid is needed; repeating steroids or degeneration tests only delays the diagnosis.","w":["Wrong - more steroid treats a diagnosis that the history has already made unlikely.","Wrong - ENoG measures degeneration but cannot identify the cause of a progressive palsy.","Correct - progressive palsy with prior twitching needs gadolinium MRI to exclude a tumour.","Wrong - waiting 3 months risks missing a treatable neoplasm.","Wrong - antivirals have no role here and do not address the suspected tumour."],"r":"Lecturer pearl"},{"t":"BELL","stem":"A 31-year-old woman with a left lower motor neurone facial palsy of sudden onset is reviewed in the ENT clinic. She asks how likely full recovery is, and you consider the factors known to affect prognosis.\nWhich finding would most favour complete recovery?","o":["Complete paralysis (HB VI) at presentation","Onset during the third trimester of pregnancy","Poorly controlled type 2 diabetes mellitus","Return of some voluntary movement by day 14","Age over 60 years at the time of onset"],"a":3,"e":"About 85-90% of patients recover fully overall. Prognosis is best when the palsy is **incomplete** and when **clinical recovery begins within 3 weeks** of onset, because early return of movement shows that most fibres had only neurapraxia. Complete palsy, older age, diabetes and pregnancy (especially the third trimester) are linked to poorer recovery.","w":["Wrong - complete paralysis carries a worse prognosis than an incomplete palsy.","Wrong - pregnancy, especially the third trimester, is a risk factor with poorer outcomes.","Wrong - diabetes (microangiopathy) is a risk factor and is linked to poorer recovery.","Correct - recovery that starts within 3 weeks predicts full recovery.","Wrong - increasing age is associated with incomplete recovery."],"r":"Slide p23"},{"t":"BELL","stem":"A 40-year-old man presents to the ED 1 day after the sudden onset of right facial weakness. You are deciding whether this is an idiopathic palsy or something else.\nWhich finding most strongly suggests an alternative diagnosis?","o":["Weakness of the right forehead as well as the mouth","Pain behind the right ear starting a day before the weakness","Discomfort with loud sounds in the right ear","Altered taste on the right front of the tongue","A firm 2 cm lump palpable in the right parotid region"],"a":4,"e":"Forehead involvement, retroauricular pain, hyperacusis and altered taste are all **expected** in idiopathic (Bell's) palsy, because the whole intratemporal nerve, including the stapedius and chorda tympani fibres, is affected. A **parotid mass with facial weakness** is a malignant parotid tumour until proven otherwise and needs imaging and FNAC. Bell's palsy is a diagnosis of exclusion, so always examine the ear, parotid and neck.","w":["Wrong - forehead weakness simply confirms an LMN palsy, which is what Bell's palsy is.","Wrong - postauricular pain before or with onset is common in Bell's palsy.","Wrong - hyperacusis from stapedius paralysis is a recognised feature of Bell's palsy.","Wrong - altered taste from chorda tympani involvement is common in Bell's palsy.","Correct - a parotid mass makes malignancy the working diagnosis, not Bell's palsy."],"r":"Slides p26, p28"},{"t":"BELL","stem":"A 60-year-old man has a right House-Brackmann V facial palsy of 3 days' duration. He cannot close the right eye, his eye barely rolls upwards on attempted closure and he complains of a gritty, watering eye. Fluorescein staining of the cornea is negative.\nWhich eye-protection plan is most appropriate?","o":["Lubricant drops by day, ointment and lid taping at night","Topical steroid drops four times daily until closure returns","Immediate gold-weight implantation into the upper eyelid","Antibiotic drops only if a discharge develops","Firm eye pad applied over the open eye during the day"],"a":0,"e":"Incomplete closure with a poor Bell's phenomenon leaves the cornea exposed, and the watering is reflex tearing from dryness, not adequate protection. **Lubricant drops by day, ointment with lid taping at night** and sunglasses outdoors are first-line, with ophthalmology review if pain, redness or staining develop. Gold-weight or tarsorrhaphy is reserved for prolonged non-recovery, and a pad over an open eye can abrade the cornea.","w":["Correct - day lubricants plus night ointment and taping is the first-line corneal protection.","Wrong - topical steroids do not protect the cornea and risk infection.","Wrong - gold-weight loading is for persistent palsy, not the first days of a likely recoverable one.","Wrong - waiting for discharge allows exposure keratitis to develop.","Wrong - a pad over an open eye can rub and abrade the cornea."],"r":"Slide p28"},{"t":"BELL","stem":"A 38-year-old man has a complete right lower motor neurone facial palsy that began suddenly 10 days ago, with no recovery despite prednisolone from day 1. ENoG shows 95% degeneration compared with the normal side, and needle EMG shows no voluntary motor unit potentials. After counselling, he opts for surgical decompression.\nWhich surgical approach reaches the segment most relevant to his condition?","o":["Transmastoid approach","Middle cranial fossa approach","Translabyrinthine approach","Transparotid approach via the main trunk","Endaural approach to the tympanic segment"],"a":1,"e":"The presumed site of compression in Bell's palsy is the **labyrinthine segment and meatal foramen**, which the transmastoid route cannot reach without sacrificing the inner ear; the **middle cranial fossa** approach exposes it while preserving hearing. Decompression is controversial and offered only for complete palsy with **more than 90% degeneration on ENoG within 14 days** and no voluntary EMG activity. Note: slide p28 suggests daily nerve excitability testing and lists decompression as routine treatment; ENoG (day 3/4 to 21) is the preferred test and steroids remain the mainstay.","w":["Wrong - the transmastoid route exposes the tympanic and mastoid segments, not the labyrinthine segment.","Correct - the middle cranial fossa route reaches the labyrinthine segment and meatal foramen with hearing preserved.","Wrong - translabyrinthine surgery destroys hearing and is used only when hearing is already lost.","Wrong - a parotid approach exposes the extratemporal nerve, distal to the site of compression.","Wrong - a transcanal approach reaches only the tympanic segment in the middle ear."],"r":"Slides p28, p58, p66"},{"t":"MRS","stem":"A 28-year-old woman attends the ENT clinic with her second episode of right lower motor neurone facial palsy in 3 years. She describes recurrent painless swelling of the upper lip lasting days to weeks. Her tongue has deep furrows. She takes no regular medication.\nWhich investigation is most helpful in confirming the diagnosis?","o":["Biopsy of the swollen lip for histology","Serum C1-esterase inhibitor level","Gadolinium MRI of the internal acoustic meatus","Electroneurography of the facial nerve","VZV PCR of a swab from the tongue"],"a":0,"e":"Recurrent orofacial oedema, recurrent LMN facial palsy and a fissured tongue (lingua plicata) is **Melkersson-Rosenthal syndrome**. It is a clinical diagnosis, but **lip biopsy showing non-caseating granulomas** supports it and helps exclude infection (e.g. tuberculosis), sarcoidosis and orofacial Crohn's disease. Hereditary angioedema causes recurrent swelling but not facial palsy or a fissured tongue.","w":["Correct - lip biopsy shows non-caseating granulomas and excludes infective causes.","Wrong - C1-esterase inhibitor deficiency explains swelling but not facial palsy or a fissured tongue.","Wrong - MRI is for progressive or atypical palsy and does not confirm this syndrome.","Wrong - ENoG measures nerve degeneration but does not establish the cause.","Wrong - VZV PCR is for suspected zoster; there are no vesicles here."],"r":"Slides p30-31"},{"t":"MRS","stem":"A 33-year-old woman has had persistent painless swelling of the upper lip for a year. She has never had facial weakness and her tongue is normal. Lip biopsy shows non-caseating granulomas; chest X-ray and serum ACE are normal and she has no bowel symptoms.\nWhat is the best description of her condition?","o":["Hereditary angioedema","Heerfordt syndrome","Lip tuberculosis (lupus vulgaris)","Cheilitis granulomatosa","ACE inhibitor-induced angioedema"],"a":3,"e":"Most patients with Melkersson-Rosenthal syndrome have only one or two features; only **8-25%** show the full triad, and features may appear years apart. Granulomatous lip swelling alone is the **monosymptomatic** form, called **cheilitis granulomatosa**, so she needs follow-up for a later facial palsy. Treatment is symptomatic (e.g. intralesional steroid) and recurrences are common.","w":["Wrong - hereditary angioedema gives episodic non-granulomatous swelling that resolves in days.","Wrong - Heerfordt syndrome (sarcoid) needs uveitis, parotid swelling and usually hilar nodes or raised ACE.","Wrong - tuberculosis gives caseating granulomas and usually other evidence of TB.","Correct - isolated granulomatous lip swelling is the monosymptomatic form of Melkersson-Rosenthal syndrome.","Wrong - drug angioedema is episodic, non-granulomatous and needs an ACE inhibitor history."],"r":"Slide p30"},{"t":"RHS","stem":"A 67-year-old man presents to the ED with 3 days of severe burning pain in the right ear. Today he has complete right facial weakness including the forehead, vertigo and tinnitus. There are crusted vesicles in the right concha and external auditory canal.\nWhat is the most appropriate initial treatment?","o":["Oral prednisolone alone with eye care","Valaciclovir plus prednisolone with eye care","Topical aciclovir cream to the ear and analgesia","IV ceftriaxone with urgent myringotomy","Oral valaciclovir alone, with steroids withheld"],"a":1,"e":"Otalgia, vesicles in the concha/EAC and an LMN facial palsy with VIII symptoms is **herpes zoster oticus (Ramsay Hunt)** from VZV reactivation. Start an **oral antiviral (aciclovir or valaciclovir) plus prednisolone** as early as possible, ideally within 72 hours, with analgesia (including neuropathic agents) and eye care. Recovery is worse than in Bell's palsy, so steroid or antiviral monotherapy undertreats it.","w":["Wrong - steroid alone omits the antiviral that targets active VZV replication.","Correct - combined antiviral and steroid, started early, gives the best chance of recovery.","Wrong - topical antiviral does not reach the geniculate ganglion or the nerve.","Wrong - this is a viral infection, not acute otitis media; the drum is not the problem.","Wrong - antiviral alone leaves nerve oedema untreated; the steroid is part of standard care."],"r":"Slides p32-34"},{"t":"RHS","stem":"A 72-year-old woman is admitted with right otalgia, vesicles in the right concha and a right lower motor neurone facial palsy. On day 2 she develops a hoarse, breathy voice and coughs when drinking water. Her gag reflex is reduced on the right.\nWhich investigation is most appropriate next?","o":["Pure-tone audiometry","Electroneurography of the right facial nerve","Contrast CT of the neck","Barium swallow","Flexible nasolaryngoscopy"],"a":4,"e":"Hoarseness, a breathy voice and coughing on swallowing with a reduced gag mean the zoster has spread to **IX and X**, a recognised extension of Ramsay Hunt syndrome. **Flexible nasolaryngoscopy** shows vocal cord palsy and pooling of secretions and guides a swallow assessment to prevent aspiration. Audiometry is for VIII symptoms (hearing loss, tinnitus) and does not assess the larynx.","w":["Wrong - audiometry assesses VIII involvement, not the larynx or swallow.","Wrong - ENoG grades facial nerve degeneration and does not explain the new symptoms.","Wrong - CT is not needed first; the problem is a cranial neuropathy, not a neck mass.","Wrong - barium swallow risks aspiration and does not show vocal cord movement.","Correct - laryngoscopy confirms vocal cord palsy and pooling from CN X involvement."],"r":"Slide p34"},{"t":"RHS","stem":"A 62-year-old man presents with severe right otalgia followed 2 days later by a right lower motor neurone facial palsy. He also reports right-sided tinnitus. Careful examination of the pinna, ear canal and oral cavity shows no rash or vesicles.\nWhich test would best confirm the suspected cause?","o":["HSV-1 IgM serology","Tzanck smear of the ear canal skin","VZV PCR of saliva or ear canal swab","Gadolinium MRI of the internal acoustic meatus","Electroneurography at day 3"],"a":2,"e":"Severe otalgia with an LMN palsy and VIII symptoms but no rash suggests **zoster sine herpete**, a Ramsay Hunt variant often misdiagnosed as Bell's palsy. **VZV PCR** (or rising VZV antibody titres) confirms it in atypical cases and justifies antiviral therapy with steroids. A Tzanck smear needs vesicles and cannot distinguish HSV from VZV.","w":["Wrong - HSV serology is non-specific and does not identify VZV reactivation.","Wrong - a Tzanck smear needs vesicles and cannot separate HSV from VZV.","Correct - VZV PCR confirms zoster when the typical rash is absent.","Wrong - MRI may show nerve enhancement but does not identify the virus.","Wrong - ENoG measures degeneration, not cause, and day 3 is only the start of its useful window."],"r":"Slide p34"},{"t":"RHS","stem":"A 70-year-old woman has vesicles in the left concha and on the left side of the anterior tongue, with left otalgia and a complete left lower motor neurone facial palsy. She had chickenpox as a child.\nIn which structure has the virus most likely reactivated?","o":["Trigeminal (Gasserian) ganglion in Meckel's cave","Spiral ganglion within the cochlear modiolus","Geniculate ganglion at the first genu","Pterygopalatine ganglion in its fossa","Dorsal root ganglion of the C2 nerve"],"a":2,"e":"VZV lies latent in sensory ganglia and in Ramsay Hunt syndrome reactivates in the **geniculate ganglion**, the sensory ganglion of VII. Its sensory fibres supply part of the concha and EAC, and taste fibres from the anterior two-thirds of the tongue pass through it, which explains where the vesicles appear. Inflammation then spreads to the motor fibres in the Fallopian canal and sometimes to VIII, which is why the prognosis is worse than in Bell's palsy.","w":["Wrong - trigeminal zoster causes a dermatomal facial rash (e.g. ophthalmic), not concha vesicles with VII palsy.","Wrong - the spiral ganglion is a cochlear neurone ganglion and does not explain the rash or palsy.","Correct - the geniculate ganglion supplies the concha and anterior tongue taste fibres, matching the rash.","Wrong - the pterygopalatine ganglion is parasympathetic, not a site of VZV latency.","Wrong - C2 zoster affects the occipital scalp and neck, not the concha with a facial palsy."],"r":"Lecturer pearl"},{"t":"OM","stem":"A 6-year-old boy is brought to the ENT clinic with 2 days of right otalgia and fever (38.9 °C). This morning his mother noticed his mouth pulled across to the left when he smiled. Otoscopy shows a red, bulging right tympanic membrane with no perforation. He cannot wrinkle the right forehead and the right eye closes only incompletely (House-Brackmann IV). There is no mastoid tenderness or post-auricular swelling.\nWhat is the most appropriate management?","o":["Oral amoxicillin, analgesia and review in 72 hours, as most palsies settle with the otitis","Oral prednisolone and valaciclovir within 72 hours, managed along Bell's palsy lines","IV antibiotics and systemic steroids plus myringotomy with grommet, with eye protection","Urgent cortical mastoidectomy with decompression of the mastoid segment of the nerve","HRCT now, then ENoG on day 3 with decompression only if degeneration exceeds 90%"],"a":2,"e":"Facial palsy in **acute otitis media** usually arises where the nerve is exposed through a dehiscent tympanic segment, so the nerve sits in an inflamed, pus-filled middle ear. Treatment is **drainage (myringotomy ± grommet, pus for culture) plus IV antibiotics and steroids**, with eye care; prognosis is good. Mastoidectomy is reserved for coexisting mastoiditis, and an obvious ear cause means this is not Bell's palsy.","w":["Wrong - oral antibiotics alone leave the pus under pressure against the nerve; a palsy is a complication that needs drainage and IV treatment.","Wrong - this
